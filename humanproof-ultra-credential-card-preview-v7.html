<title>NexusNova HumanProof — Ultra Credential Preview v7</title>
<style>
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#f8fffb}
#preview{width:100%;height:100%;border:0;display:block;opacity:0;transition:opacity .12s linear}
</style>
</head>
<body>
<iframe id="preview" title="HumanProof credential preview v7" src="humanproof-ultra-credential-card-preview-v6.html?v=92781c5"></iframe>
<script>
const frame=document.getElementById('preview');
frame.addEventListener('load',()=>{
  const d=frame.contentDocument;
  if(!d)return;
  const s=d.createElement('style');
  s.textContent=`
    /* v7: exact visual-slot swap only — QR takes former medallion slot, medallion takes former QR slot */
    .qrzone{
      top:18.5%!important;
      bottom:auto!important;
      right:5.8%!important;
      width:29%!important;
      z-index:7!important;
    }
    .medallion{
      top:auto!important;
      bottom:7.2%!important;
      right:5.1%!important;
      width:18%!important;
      z-index:6!important;
    }
    .slogan{right:25%!important;bottom:8.5%!important}
    @media(max-width:560px){
      .qrzone{top:18.5%!important;bottom:auto!important;right:5.5%!important;width:29.5%!important}
      .medallion{top:auto!important;bottom:7.2%!important;right:4.8%!important;width:18.5%!important}
    }
  `;
  d.head.appendChild(s);
  d.title='NexusNova HumanProof — Ultra Credential Preview v7';
  frame.style.opacity='1';
});
</script>
</body>
