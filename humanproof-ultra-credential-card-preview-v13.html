<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>NexusNova HumanProof — Flagship Credential Preview v13</title>
<style>
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#f8fffb}
#preview{width:100%;height:100%;border:0;display:block;opacity:0;transition:opacity .12s linear}
</style>
</head>
<body>
<iframe id="preview" title="HumanProof credential preview v13" src="humanproof-ultra-credential-card-preview-v12.html?v=5c9d5e2"></iframe>
<script>
const frame=document.getElementById('preview');
function reachCardDocument(){
  const d12=frame.contentDocument;
  if(!d12)return null;
  const f11=d12.getElementById('preview');
  if(!f11)return null;
  const d11=f11.contentDocument;
  if(!d11)return null;
  const f6=d11.getElementById('preview');
  if(!f6)return null;
  return f6.contentDocument || null;
}
function applyCircularSealText(){
  const d=reachCardDocument();
  if(!d)return false;
  const med=d.querySelector('.medallion');
  if(!med)return false;
  const old=med.querySelector('.ringtext');
  if(old)old.style.display='none';
  if(med.querySelector('.hp-circular-seal-text')){frame.style.opacity='1';return true;}

  const ns='http://www.w3.org/2000/svg';
  const svg=d.createElementNS(ns,'svg');
  svg.setAttribute('class','hp-circular-seal-text');
  svg.setAttribute('viewBox','0 0 200 200');
  svg.setAttribute('aria-hidden','true');
  svg.style.cssText='position:absolute;inset:7.5%;width:85%;height:85%;z-index:4;overflow:visible;pointer-events:none;';

  const defs=d.createElementNS(ns,'defs');
  const path=d.createElementNS(ns,'path');
  path.setAttribute('id','hpSealArcV13');
  path.setAttribute('d','M 30 106 A 70 70 0 1 1 170 106 A 70 70 0 1 1 30 106');
  defs.appendChild(path);
  svg.appendChild(defs);

  const text=d.createElementNS(ns,'text');
  text.setAttribute('fill','#075440');
  text.setAttribute('font-family','Inter,Arial,sans-serif');
  text.setAttribute('font-size','11.5');
  text.setAttribute('font-weight','1000');
  text.setAttribute('letter-spacing','2.05');
  text.setAttribute('style','paint-order:stroke;stroke:rgba(255,255,255,.75);stroke-width:.9px;');

  const tp=d.createElementNS(ns,'textPath');
  tp.setAttribute('href','#hpSealArcV13');
  tp.setAttribute('startOffset','8%');
  tp.textContent='HUMANPROOF • VERIFIED';
  text.appendChild(tp);
  svg.appendChild(text);
  med.appendChild(svg);

  const s=d.createElement('style');
  s.textContent=`
    /* v13: ONLY curve HUMANPROOF • VERIFIED around the center tick */
    .medallion .tick{z-index:5!important}
    .medallion .hp-circular-seal-text{filter:drop-shadow(0 1px 0 rgba(255,255,255,.9)) drop-shadow(0 1px 1px rgba(0,74,52,.16))}
    @media(max-width:560px){
      .medallion .hp-circular-seal-text{inset:7%!important;width:86%!important;height:86%!important}
    }
  `;
  d.head.appendChild(s);
  frame.style.opacity='1';
  return true;
}
function boot(){
  let tries=0;
  const timer=setInterval(()=>{
    tries++;
    if(applyCircularSealText()||tries>80){
      clearInterval(timer);
      if(tries>80)frame.style.opacity='1';
    }
  },80);
}
frame.addEventListener('load',boot,{once:true});
</script>
</body>
</html>
