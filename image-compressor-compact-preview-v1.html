    sec.innerHTML=`<div class="container article">
      <h2>Compress images without guessing what changes</h2>
      <p>This tool decodes a JPG, PNG or WebP in your browser, redraws it at the dimensions you choose, then exports a new JPEG or WebP file at the selected quality. Lower dimensions usually reduce file size more efficiently than extreme quality reduction when the original image is much larger than the final display size.</p>
      <div class="mini-grid">
        <div class="mini"><b>How to use it</b><ol><li>Choose the original image.</li><li>Set width and height, or keep the original dimensions.</li><li>Keep aspect ratio enabled unless you intentionally want to change the image shape.</li><li>Select JPEG or WebP and choose a quality level.</li><li>Run compression, compare the preview, then download only if the result still looks acceptable.</li></ol></div>
        <div class="mini"><b>Worked example</b><p>A 4000 px-wide phone photo used in a 1200 px website card usually benefits more from resizing near the real display width before reducing quality. Compare the final file at normal viewing size rather than judging only from an extreme zoom.</p></div>
      </div>
      <h3>Compression vs resizing</h3>
      <p>Compression changes how image data is stored; resizing changes the pixel dimensions. They solve different problems. Screenshots, text and line art need closer inspection because blurred edges and compression artifacts are easier to notice than in many photographs.</p>
      <h3>Privacy and limitations</h3>
      <ul><li>The selected file is processed locally in the browser by this tool; it does not need to be uploaded to a NexusNova server.</li><li>Keep the original as a master copy because repeated lossy exports can compound quality loss.</li><li>Check transparency, text readability, gradients, faces and sharp edges after export.</li><li>Some metadata or colour information can change during browser export depending on the source and format.</li><li>For archival, legal, medical or other high-stakes image workflows, preserve the original and verify the required format separately.</li></ul>
