<body>
<iframe id="preview" title="HumanProof credential preview v15" src="humanproof-ultra-credential-card-preview-v14.html?v=b1d6d03"></iframe>
<script>
const frame=document.getElementById('preview');
function deepestCardDoc(doc){
  let d=doc;
  for(let i=0;i<10;i++){
    if(!d)return null;
    if(d.querySelector&&d.querySelector('.card')&&d.querySelector('.medallion'))return d;
    const f=d.getElementById&&d.getElementById('preview');
    if(!f||!f.contentDocument)return null;
    d=f.contentDocument;
  }
  return null;
}
function applyV15(){
  const d=deepestCardDoc(frame.contentDocument);
  if(!d)return false;
  if(d.getElementById('hpHyper3DV15')){frame.style.opacity='1';return true;}
  const s=d.createElement('style');
  s.id='hpHyper3DV15';
  s.textContent=`
    /* v15: preserve approved composition; strengthen only hyper-realistic 3D material cues */
    .stack{
      transform-style:preserve-3d!important;
      filter:drop-shadow(0 42px 36px rgba(65,47,6,.28)) drop-shadow(0 15px 13px rgba(7,76,57,.12))!important;
    }
    .stack:before{
      transform:translate3d(0,22px,-18px)!important;
      box-shadow:0 45px 62px rgba(85,56,0,.36),inset 0 -4px 8px rgba(47,29,0,.28)!important;
    }
    .stack:after{
      transform:translate3d(0,11px,-9px)!important;
      box-shadow:inset 0 2px 2px rgba(255,255,255,.34),inset 0 -3px 5px rgba(75,46,0,.27)!important;
    }
    .card{
      box-shadow:
        inset 0 5px 0 rgba(255,255,255,.98),
        inset 0 12px 24px rgba(255,255,255,.14),
        inset 0 -14px 0 rgba(82,52,9,.17),
        inset 0 -24px 32px rgba(78,46,0,.08),
        inset 6px 0 0 rgba(255,255,255,.32),
        inset -4px 0 0 rgba(95,58,0,.13),
        0 18px 38px rgba(51,68,59,.20)!important;
      filter:saturate(1.11) contrast(1.045)!important;
    }
    .card:before{
      filter:saturate(1.20) contrast(1.11) drop-shadow(0 1px 0 rgba(255,255,255,.78)) drop-shadow(0 4px 3px rgba(92,59,0,.18))!important;
    }

    .mark{
      transform:translateZ(9px)!important;
      box-shadow:
        inset 3px 3px 0 rgba(255,255,255,.94),
        inset -5px -5px 0 rgba(76,44,0,.31),
        inset 0 9px 12px rgba(255,255,255,.18),
        0 5px 0 #734800,
        0 10px 0 rgba(91,57,0,.42),
        0 15px 18px rgba(73,50,0,.24)!important;
    }

    .title{
      filter:
        drop-shadow(0 1px 0 rgba(255,255,255,.82))
        drop-shadow(0 3px 0 #bd8c11)
        drop-shadow(0 6px 0 #855600)
        drop-shadow(0 9px 0 rgba(92,57,0,.50))
        drop-shadow(0 13px 10px rgba(74,51,0,.24))!important;
    }
    .edition,.scan,.slogan{
      filter:drop-shadow(0 1px 0 rgba(255,255,255,.86)) drop-shadow(0 2px 0 rgba(170,118,8,.52)) drop-shadow(0 4px 3px rgba(83,53,0,.18))!important;
    }

    .qrframe{
      transform:translateZ(12px)!important;
      box-shadow:
        inset 3px 3px 0 rgba(255,255,255,.96),
        inset -5px -5px 0 rgba(71,42,0,.35),
        inset 0 10px 14px rgba(255,255,255,.16),
        0 7px 0 #704700,
        0 12px 0 rgba(95,59,0,.32),
        0 18px 20px rgba(66,51,4,.25)!important;
    }
    .qrframe:before{
      content:"";position:absolute;inset:4%;border-radius:10%;pointer-events:none;z-index:5;
      background:linear-gradient(128deg,rgba(255,255,255,.54) 0 9%,rgba(255,255,255,.08) 10% 31%,transparent 32% 67%,rgba(255,249,202,.18) 68% 75%,transparent 76% 100%);
      box-shadow:inset 0 1px 0 rgba(255,255,255,.55),inset 0 -1px 0 rgba(83,48,0,.16);
      mix-blend-mode:screen;
    }

    .medallion{
      transform:translateY(-50%) translateZ(16px)!important;
      box-shadow:
        inset 0 0 0 5px #fff3aa,
        inset 0 0 0 10px rgba(98,61,0,.32),
        inset 0 12px 20px rgba(255,255,255,.32),
        inset 0 -12px 18px rgba(76,44,0,.11),
        0 9px 0 #714700,
        0 15px 0 rgba(91,56,0,.30),
        0 24px 24px rgba(58,49,11,.28)!important;
      filter:saturate(1.12) contrast(1.05)!important;
    }
    .medallion:after{
      content:"";position:absolute;inset:8.5%;border-radius:50%;pointer-events:none;z-index:1;
      background:linear-gradient(135deg,rgba(255,255,255,.58) 0 14%,rgba(255,255,255,.10) 15% 36%,transparent 37% 68%,rgba(255,244,170,.14) 69% 78%,transparent 79% 100%);
      box-shadow:inset 0 2px 0 rgba(255,255,255,.46),inset 0 -2px 2px rgba(92,54,0,.15);
      mix-blend-mode:screen;
    }
    .medallion .tick{
      z-index:6!important;
      filter:
        drop-shadow(0 1px 0 rgba(255,255,255,.92))
        drop-shadow(0 3px 0 #c49212)
        drop-shadow(0 6px 0 #845400)
        drop-shadow(0 9px 0 rgba(92,56,0,.44))
        drop-shadow(0 13px 8px rgba(78,52,0,.26))!important;
    }
    .medallion .hp-circular-seal-text{z-index:7!important;filter:drop-shadow(0 1px 0 rgba(255,255,255,.95)) drop-shadow(0 2px 0 rgba(177,123,7,.58)) drop-shadow(0 4px 2px rgba(87,55,0,.22))!important}
    .medallion .hp-circular-seal-text text{paint-order:stroke fill;stroke:rgba(100,62,0,.50)!important;stroke-width:.75px!important}

    .badges span{
      box-shadow:inset 0 2px 0 rgba(255,255,255,.94),inset 0 -2px 0 rgba(0,87,62,.08),0 3px 0 rgba(7,101,75,.11),0 7px 11px rgba(55,77,69,.09)!important;
    }
    .action,.meta,.brand,.badges,.slogan{transform:translateZ(5px)}

    @media(max-width:560px){
      .medallion{transform:translateY(-50%) translateZ(12px)!important}
      .qrframe{transform:translateZ(9px)!important}
    }
  `;
  d.head.appendChild(s);
  frame.style.opacity='1';
  return true;
}
function boot(){
  let tries=0;
  const timer=setInterval(()=>{
    tries++;
    if(applyV15()||tries>110){clearInterval(timer);if(tries>110)frame.style.opacity='1';}
  },80);
}
frame.addEventListener('load',boot,{once:true});
</script>
