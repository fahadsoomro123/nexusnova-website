<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>NexusNova HumanProof — 24K Metallic Gold Preview v14</title>
<style>
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#f8fffb}
#preview{width:100%;height:100%;border:0;display:block;opacity:0;transition:opacity .12s linear}
</style>
</head>
<body>
<iframe id="preview" title="HumanProof credential preview v14" src="humanproof-ultra-credential-card-preview-v13.html?v=ee2c824"></iframe>
<script>
const frame=document.getElementById('preview');

function deepestCardDoc(doc){
  let d=doc;
  for(let i=0;i<8;i++){
    if(!d)return null;
    if(d.querySelector && d.querySelector('.card') && d.querySelector('.medallion')) return d;
    const f=d.getElementById && d.getElementById('preview');
    if(!f || !f.contentDocument) return null;
    d=f.contentDocument;
  }
  return null;
}

function apply24K(){
  const d=deepestCardDoc(frame.contentDocument);
  if(!d)return false;
  if(d.getElementById('hp24kMetalV14')){frame.style.opacity='1';return true;}

  const style=d.createElement('style');
  style.id='hp24kMetalV14';
  style.textContent=`
    /* v14: ONLY convert every existing gold area into polished 24K-style metallic gold. Layout stays unchanged. */
    :root{
      --gold:#D4AF37!important;
      --goldHi:#FFF2A8!important;
      --goldPale:#FFF8D6!important;
      --goldDeep:#6B4700!important;
    }

    .stack:before{
      background:linear-gradient(90deg,
        #5c3b00 0%,#9a6a00 8%,#d4af37 18%,#fff1a0 28%,#b98508 39%,
        #684300 48%,#f6d65e 60%,#fff7c9 70%,#c69512 82%,#6a4500 100%)!important;
      box-shadow:0 40px 58px rgba(96,65,0,.34)!important;
    }
    .stack:after{
      background:linear-gradient(90deg,
        #fff7ca 0%,#c99916 11%,#6d4700 23%,#e8c24a 36%,#fff0a0 47%,
        #8f6000 58%,#f7d85f 72%,#fff8d0 84%,#8b5b00 100%)!important;
    }

    .card{border-color:#fff2a2!important}
    .card:before{
      background:linear-gradient(118deg,
        #fffbdc 0%,#e5c74e 8%,#8b5b00 17%,#f7d85c 27%,#fff7c6 36%,
        #b27b05 47%,#6a4300 55%,#e7bd35 65%,#fff4aa 75%,#a56d00 86%,#ffe779 100%) border-box!important;
      filter:saturate(1.16) contrast(1.08)!important;
    }

    .mark{
      color:#fff7c9!important;
      background:linear-gradient(145deg,
        #6a4300 0%,#b77d05 14%,#f0cd50 29%,#fff5b2 43%,#d9ae2a 54%,
        #8a5900 68%,#f6d65e 84%,#fff8cf 100%)!important;
      border-color:#fff2a2!important;
      box-shadow:inset 2px 2px 0 rgba(255,255,255,.88),inset -4px -4px 0 rgba(83,51,0,.30),0 4px 0 #815200,0 9px 13px rgba(104,71,0,.20)!important;
      text-shadow:0 1px 0 #fff5a8,0 3px 0 #8c5c00!important;
    }

    .title{
      color:transparent!important;
      background:linear-gradient(180deg,
        #fffbd8 0%,#ffe77a 10%,#d8ac28 25%,#8b5a00 43%,#f0cb4b 58%,
        #fff4a4 71%,#b77d06 84%,#ffe884 100%)!important;
      -webkit-background-clip:text!important;
      background-clip:text!important;
      -webkit-text-fill-color:transparent!important;
      filter:drop-shadow(0 2px 0 rgba(113,72,0,.65)) drop-shadow(0 5px 5px rgba(93,64,0,.18))!important;
      text-shadow:none!important;
    }
    .title span{
      color:#006d50!important;
      -webkit-text-fill-color:#006d50!important;
      background:none!important;
      filter:none!important;
      text-shadow:0 1px 0 #e8fff6,0 2px 0 #7ce3b8,0 4px 0 #06664f,0 7px 10px rgba(2,79,57,.16)!important;
    }

    .edition{
      color:transparent!important;
      background:linear-gradient(180deg,#fff7be 0%,#e4bb39 28%,#8a5900 54%,#f6d55a 76%,#fff4aa 100%)!important;
      -webkit-background-clip:text!important;background-clip:text!important;-webkit-text-fill-color:transparent!important;
      filter:drop-shadow(0 1px 0 rgba(98,64,0,.24))!important;
    }
    .edition b{color:#006a4b!important;-webkit-text-fill-color:#006a4b!important;background:none!important;filter:none!important}

    .qrframe{
      background:linear-gradient(145deg,
        #684200 0%,#ad7600 12%,#f1ce4f 26%,#fff6b5 39%,#d3a522 52%,
        #805100 65%,#f7d95f 80%,#fff8ca 91%,#9c6800 100%)!important;
      border-color:#fff3a8!important;
      box-shadow:inset 2px 2px 0 rgba(255,255,255,.92),inset -4px -4px 0 rgba(77,46,0,.32),0 6px 0 #795000,0 12px 18px rgba(76,57,0,.22)!important;
      filter:saturate(1.08) contrast(1.08)!important;
    }
    .scan{
      color:transparent!important;
      background:linear-gradient(180deg,#fff6b3 0%,#dfb52f 35%,#815300 62%,#f3cf4d 100%)!important;
      -webkit-background-clip:text!important;background-clip:text!important;-webkit-text-fill-color:transparent!important;
      text-shadow:none!important;
      filter:drop-shadow(0 1px 0 rgba(255,255,255,.55)) drop-shadow(0 1px 1px rgba(104,69,0,.20))!important;
    }

    .medallion{
      border:4px solid transparent!important;
      background:
        conic-gradient(from 15deg,#00a875 0 14%,#8b65ff 14% 29%,#ff6aa6 29% 44%,#ffd854 44% 59%,#00a875 59% 74%,#cab3ff 74% 89%,#ff8db7 89% 100%) padding-box,
        linear-gradient(145deg,#704800 0%,#d1a223 18%,#fff5ad 34%,#a66f00 48%,#f4d04e 63%,#fff9cd 78%,#835400 100%) border-box!important;
      box-shadow:inset 0 0 0 5px #fff2a5,inset 0 0 0 9px rgba(100,64,0,.30),inset 0 10px 18px rgba(255,255,255,.28),0 8px 0 #7c5000,0 16px 22px rgba(73,57,0,.24)!important;
    }
    .medallion .tick{
      color:transparent!important;
      background:linear-gradient(180deg,
        #fffbd9 0%,#ffe77b 13%,#d9ad29 29%,#875700 48%,#efca49 63%,#fff4a9 78%,#b77c05 91%,#ffe77b 100%)!important;
      -webkit-background-clip:text!important;background-clip:text!important;-webkit-text-fill-color:transparent!important;
      text-shadow:none!important;
      filter:drop-shadow(0 2px 0 #8b5a00) drop-shadow(0 5px 3px rgba(88,57,0,.22))!important;
    }

    .slogan{
      color:transparent!important;
      background:linear-gradient(180deg,#fff4ae 0%,#d9ad2a 34%,#7f5100 62%,#e8bf3d 100%)!important;
      -webkit-background-clip:text!important;background-clip:text!important;-webkit-text-fill-color:transparent!important;
      text-shadow:none!important;
      filter:drop-shadow(0 1px 0 rgba(255,255,255,.62))!important;
    }
  `;
  d.head.appendChild(style);

  const seal=d.querySelector('.hp-circular-seal-text');
  if(seal){
    const ns='http://www.w3.org/2000/svg';
    let defs=seal.querySelector('defs');
    if(!defs){defs=d.createElementNS(ns,'defs');seal.insertBefore(defs,seal.firstChild);}
    const grad=d.createElementNS(ns,'linearGradient');
    grad.setAttribute('id','hp24kSealGoldV14');
    grad.setAttribute('x1','0%');grad.setAttribute('y1','0%');grad.setAttribute('x2','100%');grad.setAttribute('y2','100%');
    [
      ['0%','#fff8cf'],['14%','#e8c343'],['30%','#8a5900'],['48%','#f7d75d'],
      ['62%','#fff4a8'],['78%','#a86f00'],['92%','#edc849'],['100%','#fffbdc']
    ].forEach(([o,c])=>{
      const stop=d.createElementNS(ns,'stop');stop.setAttribute('offset',o);stop.setAttribute('stop-color',c);grad.appendChild(stop);
    });
    defs.appendChild(grad);
    const txt=seal.querySelector('text');
    if(txt){
      txt.setAttribute('fill','url(#hp24kSealGoldV14)');
      txt.setAttribute('style','paint-order:stroke;stroke:rgba(96,62,0,.38);stroke-width:.7px;');
    }
  }

  frame.style.opacity='1';
  return true;
}

function boot(){
  let tries=0;
  const timer=setInterval(()=>{
    tries++;
    if(apply24K()||tries>100){
      clearInterval(timer);
      if(tries>100)frame.style.opacity='1';
    }
  },80);
}
frame.addEventListener('load',boot,{once:true});
</script>
</body>
</html>
