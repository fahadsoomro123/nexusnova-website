e-columns:1fr 1fr;gap:12px}.field{display:grid;gap:6px}.field input{padding:13px;border:1px solid var(--nn-line);border-radius:12px;background:var(--nn-input);color:var(--nn-text)}.tips{display:flex;gap:7px;flex-wrap:wrap;margin:12px 0}.tip{padding:10px 13px;border:1px solid var(--nn-line);border-radius:10px;background:var(--nn-surface-2);font-weight:800}.tip.active{background:var(--nn-accent);color:#fff}.btn{grid-column:1/-1;border:0;border-radius:12px;padding:14px;background:var(--nn-accent);color:#fff;font-weight:900}.result{margin-top:16px;padding:16px;border:1px solid var(--nn-line);border-radius:14px;background:var(--nn-surface-2);line-height:1.9;font-weight:700}@media(max-width:600px){.grid{grid-template-columns:1fr}.btn{grid-column:auto}}</style></head><body><header><div class="wrap top"><a class="brand" href="/">NexusNova Tools</a><button class="nn-theme-toggle" type="button" aria-label="Switch theme"><svg class="moon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M20 15.5A8.5 8.5 0 1 1 8.5 4 6.8 6.8 0 0 0 20 15.5Z"/></svg><svg class="sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="4"/><path d="M12 2v2m0 16v2M2 12h2m16 0h2M4.9 4.9l1.4 1.4m11.4 11.4 1.4 1.4m0-14.2-1.4 1.4M6.3 17.7l-1.4 1.4"/></svg></button></div></header><main class="wrap"><section class="panel"><h1>US Restaurant Tip & Bill Splitter</h1><div class="grid"><div class="field"><label>Total bill ($)</label><input aria-label="bill" id="bill" type="number" min="0" step="0.01" value="100"></div><div class="field"><label>State tax (%)</label><input aria-label="tax" id="tax" type="number" min="0" step="0.01" value="8.25"></div><div class="field"><label>Party size</label><input aria-label="party" id="party" type="number" min="1" step="1" value="2"></div><div class="field"><label>Custom tip (%)</label><input aria-label="custom" id="custom" type="number" min="0" step="0.1" value="20"></div><button class="btn" id="calc">Calculate Split</button></div><div class="tips"><button class="tip" data-tip="15">15%</button><button class="tip" data-tip="18">18%</button><button class="tip active" data-tip="20">20%</button><button class="tip" data-tip="custom">Custom</button></div><div class="result" id="out"></div></section></main><footer><div class="wrap">NexusNova Tools - browser utility. Estimates are for planning and should be verified where money or official rules apply.</div></footer><script>let tip=20;document.querySelectorAll('.tip').forEach(b=>b.onclick=()=>{tip=b.dataset.tip==='custom'?+document.getElementById('custom').value||0:+b.dataset.tip;document.querySelectorAll('.tip').forEach(x=>x.classList.remove('active'));b.classList.add('active');calc()});function calc(){const bill=+document.getElementById('bill').value||0,tax=+document.getElementById('tax').value||0,party=Math.max(1,+document.getElementById('party').value||1);const taxAmt=bill*tax/100,tipAmt=(bill+taxAmt)*tip/100,total=bill+taxAmt+tipAmt;document.getElementById('out').innerHTML=`Subtotal: $${bill.toFixed(2)}<br>Tax: $${taxAmt.toFixed(2)}<br>Tip (${tip.toFixed(1)}%): $${tipAmt.toFixed(2)}<br><strong>Total: $${total.toFixed(2)}</strong><br>Per person: $${(total/party).toFixed(2)}`};document.getElementById('calc').onclick=calc;calc();</script></body></html>
