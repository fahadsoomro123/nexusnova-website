</style></head><body><header><div class="wrap top"><a class="brand" href="/">NexusNova Tools</a><nav class="nav"><a href="/tools.html">All Tools</a><button class="nn-theme-toggle" type="button" aria-label="Switch theme"><svg class="moon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M20 15.5A8.5 8.5 0 1 1 8.5 4 6.8 6.8 0 0 0 20 15.5Z"/></svg><svg class="sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="4"/><path d="M12 2v2m0 16v2M2 12h2m16 0h2M4.9 4.9l1.4 1.4m11.4 11.4 1.4 1.4m0-14.2-1.4 1.4M6.3 17.7l-1.4 1.4"/></svg></button></nav></div></header><main class="wrap"><section class="panel"><h1>Instant Quote Card Maker</h1><p>Paste Roman Urdu, Urdu, or English text. Pick a style, generate instantly, then download an HD image for WhatsApp or Instagram.</p><textarea id="text" maxlength="220" placeholder="Write your status or quote..."></textarea><div class="grid"><select id="theme"><option value="gradient">Dark Gradient</option><option value="minimal">Minimal</option><option value="glass">Glassmorphism</option></select><button class="btn" id="make">Generate Quote Card</button></div><canvas id="card" width="1600" height="900"></canvas><button class="btn" id="download" style="width:100%;margin-top:12px">Download HD Image</button></section></main><script>
const c=document.getElementById('card'),x=c.getContext('2d');function wrap(t,max){const words=t.trim().split(/\s+/),lines=[];let line='';for(const w of words){const n=line?line+' '+w:w;if(x.measureText(n).width>max&&line){lines.push(line);line=w}else line=n}if(line)lines.push(line);return lines.slice(0,7)}function draw(){const t=document.getElementById('text').value.trim()||'Your quote goes here';const s=document.getElementById('theme').value;x.clearRect(0,0,c.width,c.height);if(s==='minimal'){x.fillStyle='#f8fafc';x.fillRect(0,0,c.width,c.height)}else if(s==='glass'){x.fillStyle='#18223b';x.fillRect(0,0,c.width,c.height);const g=x.createRadialGradient(300,180,40,1100,700,900);g.addColorStop(0,'#8b5cf6');g.addColorStop(1,'#0f172a');x.fillStyle=g;x.fillRect(0,0,c.width,c.height)}else{const g=x.createLinearGradient(0,0,1600,900);g.addColorStop(0,'#111827');g.addColorStop(.5,'#4c1d95');g.addColorStop(1,'#0f766e');x.fillStyle=g;x.fillRect(0,0,c.width,c.height)}x.fillStyle=s==='minimal'?'#111827':'#fff';x.textAlign='center';x.font='800 72px system-ui';const lines=wrap(t,1250);const start=450-(lines.length-1)*45;lines.forEach((l,i)=>x.fillText(l,800,start+i*90));x.font='700 28px system-ui';x.globalAlpha=.7;x.fillText('NexusNova Tools',800,800);x.globalAlpha=1}document.getElementById('make').onclick=draw;document.getElementById('download').onclick=()=>{draw();const a=document.createElement('a');a.download='nexusnova-quote-card.png';a.href=c.toDataURL('image/png');a.click()};draw();
</script></body></html>
