<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="robots" content="noindex,nofollow,noarchive">
  <meta name="referrer" content="no-referrer">
  <title>Instagram connection | NexusNova</title>
  <style>
    :root{color-scheme:dark}
    *{box-sizing:border-box}
    body{margin:0;min-height:100vh;display:grid;place-items:center;padding:24px;background:#07111f;color:#eef6ff;font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
    .card{width:min(520px,100%);padding:28px;border:1px solid rgba(129,174,255,.25);border-radius:22px;background:rgba(12,26,46,.92);box-shadow:0 24px 70px rgba(0,0,0,.35)}
    .brand{font-size:12px;font-weight:900;letter-spacing:.14em;text-transform:uppercase;color:#9db8ff}
    h1{margin:10px 0 8px;font-size:26px;line-height:1.15}
    p{margin:0;color:#aebfd3;line-height:1.55}
    .status{margin-top:18px;padding:14px 16px;border-radius:14px;background:rgba(255,255,255,.055);font-weight:800;color:#dcecff}
    a{display:inline-flex;margin-top:18px;color:#9fdcff;font-weight:800;text-decoration:none}
  </style>
</head>
<body>
  <main class="card" role="status" aria-live="polite">
    <div class="brand">NexusNova secure connection</div>
    <h1>Finishing Instagram connection…</h1>
    <p>This page only receives the authorization response. NexusNova never places the Instagram app secret in browser code.</p>
    <div class="status" id="status">Checking authorization response…</div>
    <a href="account.html" id="back">Return to account dashboard</a>
  </main>
  <script>
    (() => {
      'use strict';
      const RESULT_KEY = 'nexusnova_instagram_oauth_result_v1';
      const status = document.getElementById('status');
      const params = new URLSearchParams(location.search);
      const code = params.get('code') || '';
      const state = params.get('state') || '';
      const error = params.get('error') || '';
      const errorDescription = params.get('error_description') || '';

      if (error) {
        status.textContent = errorDescription ? `Instagram authorization was not completed: ${errorDescription}` : 'Instagram authorization was not completed.';
      } else if (code) {
        status.textContent = 'Instagram authorization received. Returning to NexusNova…';
      } else {
        status.textContent = 'No Instagram authorization response was received.';
      }

      const payload = {
        type: 'nexusnova-instagram-oauth',
        ok: Boolean(code) && !error,
        code,
        state,
        error,
        errorDescription
      };

      try {
        sessionStorage.setItem(RESULT_KEY, JSON.stringify(payload));
      } catch (_) {}

      if (window.opener && window.opener !== window) {
        try {
          window.opener.postMessage(payload, location.origin);
          if (payload.ok || error) setTimeout(() => window.close(), 350);
          return;
        } catch (_) {}
      }

      if (payload.ok || error) {
        setTimeout(() => {
          location.replace('account.html?instagram_oauth=1');
        }, 250);
      }
    })();
  </script>
</body>
</html>
