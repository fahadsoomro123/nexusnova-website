<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>NexusNova Pakistan Today Widget</title><meta name="robots" content="noindex,follow"><meta name="theme-color" content="#0f172a"><link rel="stylesheet" href="assets/css/site.css"><link rel="stylesheet" href="assets/css/scifi.css" data-nexusnova-scifi><style>*{box-sizing:border-box}body{margin:0;font-family:Inter,system-ui,-apple-system,Segoe UI,sans-serif;background:#f8fafc;color:#0f172a}.w{padding:16px;border:1px solid #dbe6f2;border-radius:18px;background:#fff}.top{display:flex;justify-content:space-between;gap:10px;align-items:center}.brand{font-weight:900;letter-spacing:.03em}.badge{font-size:11px;padding:5px 8px;border-radius:999px;background:#ecfdf5;color:#065f46;font-weight:800}.widget-title{margin:10px 0 0;font-size:18px;line-height:1.2}.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:9px;margin-top:12px}.c{padding:10px;border-radius:12px;background:#f8fafc;border:1px solid #e2e8f0}.c small{display:block;color:#64748b}.c strong{display:block;margin-top:3px;font-size:17px}.foot{display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap;margin-top:10px;font-size:10px;color:#64748b}.foot a{color:inherit}@media(max-width:360px){.grid{grid-template-columns:1fr}}</style></head><body><div class="w"><div class="top"><div class="brand">NEXUSNOVA • PAKISTAN TODAY</div><div class="badge">SOURCE-LABELLED</div></div><h1 class="widget-title">Pakistan Today Snapshot</h1><div id="status" style="margin-top:10px;font-size:12px;color:#64748b">Loading published references…</div><div class="grid" id="grid"></div><div class="foot"><span>Gold is international-derived, not a local Sarafa quote.</span><a href="https://nexusnovatools.com/live.html" target="_blank" rel="noopener">Powered by NexusNova Tools ↗</a></div></div><script>(()=>{const grid=document.querySelector('#grid'),status=document.querySelector('#status'),money=n=>Number(n).toLocaleString(undefined,{maximumFractionDigits:2});Promise.all(['live-currency.json','live-gold.json','live-fuel.json','live-weather.json'].map(f=>fetch('assets/data/'+f,{cache:'no-store'}).then(r=>r.json()))).then(([currency,gold,fuel,weather])=>{const usd=currency.rates.find(r=>r.code==='USD'),karachi=weather.cities.find(c=>c.slug==='karachi')||weather.cities[0];const cards=[['USD / PKR',usd?`PKR ${money(usd.rate)}`:'—'],['24K Gold / tola',gold.international_derived_pkr?`PKR ${money(gold.international_derived_pkr.per_tola_24k)}`:'—'],['Petrol / litre',fuel.prices?.petrol?`PKR ${money(fuel.prices.petrol.pkr_per_litre)}`:'—'],[karachi?`${karachi.name} weather`:'Weather',karachi?`${money(karachi.forecast.temperature_c)}°C • ${karachi.forecast.condition}`:'—']];grid.innerHTML=cards.map(([a,b])=>`<div class="c"><small>${a}</small><strong>${b}</strong></div>`).join('');status.textContent=`References refreshed by their own sources • Currency ${currency.data_date||'—'} • Fuel ${fuel.effective_date||'—'}`}).catch(()=>{status.textContent='Published references are temporarily unavailable.'})})();</script></body></html>
