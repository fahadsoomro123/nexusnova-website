<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>NexusNova HumanProof — Head Only V20</title>
<style>
:root{
  --bg:#06111d;
  --cyan:#55f1ff;
  --blue:#5f8fff;
  --violet:#9b6fff;
  --magenta:#ef63dc;
}
*{box-sizing:border-box}
html,body{
  margin:0; width:100%; min-height:100%;
  background:var(--bg); color:#edf7ff;
  font-family:Inter,system-ui,-apple-system,Segoe UI,sans-serif;
}
body{
  background:
    radial-gradient(circle at 50% 44%,rgba(77,229,255,.08),transparent 24%),
    radial-gradient(circle at 52% 48%,rgba(154,103,255,.07),transparent 33%),
    linear-gradient(180deg,#07111e,#06101b);
}
.page{
  min-height:100vh;
  display:grid;
  place-items:center;
  padding:18px;
}
.card{
  position:relative;
  width:min(620px,96vw);
  height:min(820px,90vh);
  min-height:650px;
  border:1px solid rgba(92,214,255,.17);
  border-radius:30px;
  overflow:hidden;
  background:
    radial-gradient(circle at 50% 46%,rgba(70,226,255,.055),transparent 30%),
    linear-gradient(155deg,rgba(7,22,36,.98),rgba(4,13,23,.99));
  box-shadow:
    0 28px 85px rgba(0,0,0,.36),
    inset 0 1px 0 rgba(255,255,255,.03);
}
.top{
  position:absolute;
  left:28px; right:28px; top:24px;
  display:flex; justify-content:space-between; gap:16px;
  color:#78e9f8; font-size:10px; letter-spacing:.09em;
  z-index:20;
}
.viewer{
  position:absolute;
  left:50%; top:53%;
  transform:translate(-50%,-50%);
  width:min(74%,410px);
  aspect-ratio:.86;
  overflow:hidden;
  border-radius:20px;
  border:1px solid rgba(80,230,255,.30);
  background:
    radial-gradient(circle at 50% 45%,rgba(71,225,255,.07),transparent 48%),
    #03080f;
  box-shadow:
    0 0 35px rgba(57,221,255,.13),
    0 0 58px rgba(145,97,255,.07),
    inset 0 0 34px rgba(64,108,255,.05);
}
canvas{display:block;width:100%;height:100%}
.loading{
  position:absolute; inset:0;
  display:grid; place-items:center;
  z-index:30;
  background:#03080f;
  color:#7ce8f6;
  font-size:10px;
  letter-spacing:.12em;
  text-align:center;
  padding:24px;
}
.loading.hide{display:none}
.scan-band{
  position:absolute; left:0; right:0;
  height:54px; top:-54px;
  z-index:8; pointer-events:none;
  background:linear-gradient(180deg,transparent,rgba(79,239,255,.14),rgba(158,101,255,.075),transparent);
  animation:scanBand 18s ease-in-out infinite;
}
.scan-line{
  position:absolute;
  left:2%; right:2%;
  height:2px; top:4%;
  z-index:9; pointer-events:none;
  background:linear-gradient(90deg,transparent,#59f1ff 16%,#6fa1ff 42%,#be73ff 64%,#59f1ff 84%,transparent);
  box-shadow:0 0 10px rgba(89,241,255,.95),0 0 21px rgba(154,108,255,.45);
  animation:scanLine 18s ease-in-out infinite;
}
.scan-line:after{
  content:"";
  position:absolute;
  left:12%; right:12%; top:-3px;
  height:7px;
  background:inherit;
  filter:blur(6px);
  opacity:.60;
}
.corner{position:absolute;width:25px;height:25px;z-index:10;opacity:.74}
.tl{left:9px;top:9px;border-left:1px solid #5bf1ff;border-top:1px solid #5bf1ff}
.tr{right:9px;top:9px;border-right:1px solid #a474ff;border-top:1px solid #a474ff}
.bl{left:9px;bottom:9px;border-left:1px solid #6ba1ff;border-bottom:1px solid #6ba1ff}
.br{right:9px;bottom:9px;border-right:1px solid #ef67dc;border-bottom:1px solid #ef67dc}
.label{
  position:absolute;
  right:11px; bottom:10px;
  z-index:12;
  color:#79eafa;
  font-size:8px;
  letter-spacing:.16em;
}
.label i{
  display:inline-block;
  width:5px; height:5px;
  border-radius:50%;
  background:#55efc4;
  box-shadow:0 0 8px #55efc4;
  margin-right:6px;
  animation:blink 2.4s ease-in-out infinite;
}
.caption{
  position:absolute;
  left:0; right:0; bottom:24px;
  text-align:center;
  color:#708da2;
  font-size:9px;
  letter-spacing:.18em;
}
@keyframes scanLine{
  0%,7%{top:4%;opacity:.36}
  49%{top:93%;opacity:1}
  51%{top:93%;opacity:1}
  93%,100%{top:4%;opacity:.45}
}
@keyframes scanBand{
  0%,7%{top:-30px;opacity:.18}
  49%{top:85%;opacity:.80}
  51%{top:85%;opacity:.80}
  93%,100%{top:-30px;opacity:.20}
}
@keyframes blink{
  0%,100%{opacity:.35}
  50%{opacity:1}
}
</style>
<style id="nn-v20-scroll-lock">
html,body{
  width:100%!important;
  height:100%!important;
  min-height:0!important;
  margin:0!important;
  overflow:hidden!important;
  overscroll-behavior:none!important;
}
body{position:relative!important}
.page{
  width:100%!important;
  height:100%!important;
  min-height:0!important;
  padding:8px!important;
  overflow:hidden!important;
}
.card{
  width:min(620px,calc(100% - 2px))!important;
  height:calc(100% - 2px)!important;
  min-height:0!important;
  max-height:none!important;
  margin:0 auto!important;
}
</style>
</head>
<body>
<main class="page">
  <section class="card">
    <div class="top">
      <span>HUMANPROOF / VERIFIED ACTION</span>
      <span>3D HEAD TEST</span>
    </div>
    <div class="viewer">
      <canvas id="c"></canvas>
      <div class="loading" id="loading">LOADING HUMAN HEAD…</div>
      <div class="scan-band"></div>
      <div class="scan-line"></div>
      <div class="corner tl"></div>
      <div class="corner tr"></div>
      <div class="corner bl"></div>
      <div class="corner br"></div>
      <div class="label"><i></i>FACE SCAN ACTIVE</div>
    </div>
    <div class="caption">HEAD ONLY // REAL 3D MESH // 360°</div>
  </section>
</main>
<script type="importmap">
{
  "imports":{
    "three":"https://cdn.jsdelivr.net/npm/three@0.180.0/build/three.module.js",
    "three/addons/":"https://cdn.jsdelivr.net/npm/three@0.180.0/examples/jsm/"
  }
}
</script>
<script type="module">
import * as THREE from 'three';
import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';
const canvas = document.getElementById('c');
const loading = document.getElementById('loading');
const renderer = new THREE.WebGLRenderer({canvas,antialias:true,alpha:false,powerPreference:'high-performance'});
renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 2));
renderer.setClearColor(0x03080f, 1);
renderer.outputColorSpace = THREE.SRGBColorSpace;
const scene = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(27, 1, .01, 100);
camera.position.set(0, 0.03, 4.8);
const rig = new THREE.Group();
scene.add(rig);
const MODEL='https://cdn.jsdelivr.net/gh/mrdoob/three.js@master/examples/models/gltf/LeePerrySmith/LeePerrySmith.glb';
function trimGeometry(sourceGeo, cutY){
  const geo = sourceGeo.toNonIndexed();
  const pos = geo.getAttribute('position');
  const out = [];
  for(let i=0;i<pos.count;i+=3){
    const y0=pos.getY(i), y1=pos.getY(i+1), y2=pos.getY(i+2);
    const cy=(y0+y1+y2)/3;
    if(cy < cutY) continue;
    for(let k=0;k<3;k++){out.push(pos.getX(i+k),pos.getY(i+k),pos.getZ(i+k));}
  }
  const g = new THREE.BufferGeometry();
  g.setAttribute('position',new THREE.Float32BufferAttribute(out,3));
  g.computeVertexNormals();g.computeBoundingBox();g.computeBoundingSphere();return g;
}
function makeWireMaterial(){
  return new THREE.ShaderMaterial({
    wireframe:true,transparent:true,depthTest:true,depthWrite:false,side:THREE.FrontSide,
    uniforms:{uTime:{value:0}},
    vertexShader:`varying vec3 vPos; varying vec3 vNormal; void main(){vPos=position;vNormal=normalize(normalMatrix*normal);gl_Position=projectionMatrix*modelViewMatrix*vec4(position,1.0);}`,
    fragmentShader:`uniform float uTime; varying vec3 vPos; varying vec3 vNormal; vec3 cCyan=vec3(0.33,0.95,1.0); vec3 cBlue=vec3(0.37,0.56,1.0); vec3 cViolet=vec3(0.61,0.43,1.0); vec3 cMagenta=vec3(0.94,0.39,0.86); void main(){float px=clamp(vPos.x*0.14+0.50,0.0,1.0);float py=clamp(vPos.y*0.10+0.50,0.0,1.0);vec3 a=mix(cCyan,cBlue,smoothstep(0.0,0.50,px));vec3 b=mix(cViolet,cMagenta,smoothstep(0.50,1.0,px));vec3 col=mix(a,b,smoothstep(0.42,0.78,px));float facing=0.72+0.28*abs(vNormal.z);float pulse=0.94+0.06*sin(uTime*0.55+py*5.0);gl_FragColor=vec4(col*facing*pulse,.94);}`
  });
}
const shaders=[];
new GLTFLoader().load(MODEL,gltf=>{
  const src=gltf.scene.children[0];
  const geo0=src.geometry.clone();
  geo0.computeBoundingBox();
  const box0=geo0.boundingBox;
  const size0=new THREE.Vector3();
  const center0=new THREE.Vector3();
  box0.getSize(size0);box0.getCenter(center0);
  const cutY=box0.min.y+size0.y*0.225;
  const geo=trimGeometry(geo0,cutY);
  geo.computeBoundingBox();
  const box=geo.boundingBox;
  const size=new THREE.Vector3();
  const center=new THREE.Vector3();
  box.getSize(size);box.getCenter(center);
  geo.translate(-center.x,-center.y,-center.z);
  geo.scale(1.045,1.0,0.965);
  const shell=new THREE.Mesh(geo,new THREE.MeshBasicMaterial({color:0x03080f,side:THREE.DoubleSide,depthWrite:true,depthTest:true}));
  rig.add(shell);
  const wireMat=makeWireMaterial();shaders.push(wireMat);
  const wire=new THREE.Mesh(geo,wireMat);wire.scale.setScalar(1.0017);rig.add(wire);
  const glowMat=makeWireMaterial();glowMat.opacity=.16;glowMat.blending=THREE.AdditiveBlending;shaders.push(glowMat);
  const glow=new THREE.Mesh(geo,glowMat);glow.scale.setScalar(1.006);rig.add(glow);
  const trimmedBox=new THREE.Box3().setFromObject(rig);
  const trimmedSize=new THREE.Vector3();trimmedBox.getSize(trimmedSize);
  const maxDim=Math.max(trimmedSize.x,trimmedSize.y);
  rig.scale.setScalar(2.55/maxDim);
  rig.rotation.y=0;
  loading.classList.add('hide');
},undefined,err=>{console.error(err);loading.textContent='3D HEAD LOAD FAILED — INTERNET ON RAKHO';});
function resize(){
  const r=canvas.parentElement.getBoundingClientRect();
  const w=Math.max(1,Math.round(r.width));
  const h=Math.max(1,Math.round(r.height));
  renderer.setSize(w,h,false);camera.aspect=w/h;camera.updateProjectionMatrix();
}
window.addEventListener('resize',resize);resize();
const clock=new THREE.Clock();
function animate(){
  requestAnimationFrame(animate);
  const t=clock.getElapsedTime();
  rig.rotation.y=(t/48)*Math.PI*2;
  rig.position.y=Math.sin(t*0.32)*0.012;
  for(const s of shaders){s.uniforms.uTime.value=t;}
  renderer.render(scene,camera);
}
animate();
</script>
</body>
</html>
