<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>NexusNova HumanProof — Flagship Credential Preview v12</title><meta name="robots" content="noindex, follow">
<style>
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#f8fffb}
#preview{width:100%;height:100%;border:0;display:block;opacity:0;transition:opacity .12s linear}
</style>
</head>
<body>
<iframe id="preview" title="HumanProof credential preview v12" src="humanproof-ultra-credential-card-preview-v11.html?v=259b335"></iframe>
<script>
const frame=document.getElementById('preview');
function applyRingTextShift(){
  const outer=frame.contentDocument;
  if(!outer)return;
  const inner=outer.getElementById('preview');
  if(!inner)return;
  const applyInner=()=>{
    const d=inner.contentDocument;
    if(!d)return;
    const s=d.createElement('style');
    s.textContent=`
      /* v12: ONLY move HUMANPROOF • VERIFIED slightly lower under the tick */
      .medallion .ringtext{bottom:16.5%!important}
      @media(max-width:560px){.medallion .ringtext{bottom:15.5%!important}}
    `;
    d.head.appendChild(s);
    frame.style.opacity='1';
  };
  inner.addEventListener('load',applyInner,{once:true});
  if(inner.contentDocument && inner.contentDocument.readyState==='complete') applyInner();
}
frame.addEventListener('load',applyRingTextShift,{once:true});
</script>
</body>
</html>
