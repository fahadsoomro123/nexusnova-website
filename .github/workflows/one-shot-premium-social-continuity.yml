name: NexusNova One-Time Premium Social Continuity

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/one-shot-premium-social-continuity.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch-continuity:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Add fresh-AI, cached-AI and emergency continuity tiers
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          campaign = Path('.github/scripts/premium_social_campaign.py')
          text = campaign.read_text(encoding='utf-8')

          success_old = '''            print("AI social background generated via", provider, image.size)\n            return image, provider\n'''
          success_new = '''            cache_dir = GENERATED / "ai-social-library"\n            cache_dir.mkdir(parents=True, exist_ok=True)\n            cache_file = cache_dir / f"ai-background-{seed}.jpg"\n            ImageOps.fit(image, (1536, 1920), method=Image.Resampling.LANCZOS).save(\n                cache_file, "JPEG", quality=91, optimize=True, progressive=True\n            )\n            print("AI social background generated via", provider, image.size, "cache:", cache_file)\n            return image, provider\n'''
          if success_old in text:
              text = text.replace(success_old, success_new, 1)
          elif 'ai-social-library' not in text:
              raise SystemExit('Could not locate fresh AI success return')

          fail_old = '''    raise RuntimeError(f"AI-only creative gate: free image generation failed; refusing non-AI fallback ({last_error})")\n'''
          fail_new = '''    cache_dir = GENERATED / "ai-social-library"\n    cached = sorted(cache_dir.glob("*.jpg")) + sorted(cache_dir.glob("*.jpeg")) + sorted(cache_dir.glob("*.png"))\n    if cached:\n        chosen = cached[seed % len(cached)]\n        try:\n            image = Image.open(chosen).convert("RGB")\n            print("Fresh AI unavailable; rotating cached AI background:", chosen)\n            return image, "cached-ai-library"\n        except Exception as exc:\n            print("Cached AI background failed:", exc)\n\n    # Last-resort continuity card. This is deliberately labeled as non-AI in diagnostics.\n    # It prevents the social campaign from stopping during a provider-wide outage before\n    # the AI cache has been populated. Fresh/cached AI remains the normal path.\n    print("All AI image routes unavailable and no AI cache exists; using emergency branded continuity background:", last_error)\n    image = Image.new("RGB", (1536, 1920), (5, 14, 29))\n    draw = ImageDraw.Draw(image)\n    for y in range(1920):\n        t = y / 1919\n        draw.line((0, y, 1536, y), fill=(int(5 + 9*t), int(14 + 22*t), int(29 + 38*t)))\n    for idx, radius in enumerate((620, 470, 330, 220)):\n        cx = 260 + ((seed >> (idx * 5)) % 1020)\n        cy = 280 + ((seed >> (idx * 7)) % 1250)\n        alpha = 26 + idx * 8\n        glow = Image.new("RGBA", image.size, (0, 0, 0, 0))\n        gd = ImageDraw.Draw(glow)\n        gd.ellipse((cx-radius, cy-radius, cx+radius, cy+radius), fill=(45, 181, 255, alpha))\n        image = Image.alpha_composite(image.convert("RGBA"), glow).convert("RGB")\n    return image, "emergency-branded"\n'''
          if fail_old in text:
              text = text.replace(fail_old, fail_new, 1)
          elif 'emergency-branded' not in text:
              raise SystemExit('Could not locate AI failure gate')

          campaign.write_text(text, encoding='utf-8')

          workflow = Path('.github/workflows/premium-social-daily.yml')
          w = workflow.read_text(encoding='utf-8')
          old_gate = '''          if not str(item.get('image_provider','')).startswith('pollinations-'):\n              raise SystemExit('AI-only gate failed: image was not generated by configured AI provider')\n'''
          new_gate = '''          provider=str(item.get('image_provider',''))\n          allowed = provider.startswith('pollinations-') or provider in {'cached-ai-library','emergency-branded'}\n          if not allowed:\n              raise SystemExit(f'Unrecognized social image provider: {provider}')\n'''
          if old_gate in w:
              w = w.replace(old_gate, new_gate, 1)
          elif "cached-ai-library" not in w:
              raise SystemExit('Could not locate workflow image provider gate')
          add_old = '''          git add assets/generated/premium-social-slot-${{ steps.slot.outputs.slot }}.jpg assets/data/premium-social-history.json\n'''
          add_new = '''          git add assets/generated/premium-social-slot-${{ steps.slot.outputs.slot }}.jpg assets/data/premium-social-history.json\n          if [ -d assets/generated/ai-social-library ]; then git add assets/generated/ai-social-library/; fi\n'''
          if add_old in w:
              w = w.replace(add_old, add_new, 1)
          workflow.write_text(w, encoding='utf-8')
          PY

      - name: Verify continuity patch
        shell: bash
        run: |
          python -m py_compile .github/scripts/premium_social_campaign.py
          python -m py_compile .github/scripts/publish_premium_social.py
          grep -q 'cached-ai-library' .github/scripts/premium_social_campaign.py
          grep -q 'emergency-branded' .github/scripts/premium_social_campaign.py
          grep -q 'ai-social-library' .github/workflows/premium-social-daily.yml

      - name: Commit patch and remove one-shot workflow
        shell: bash
        run: |
          git config user.name 'nexusnova-social[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add .github/scripts/premium_social_campaign.py .github/workflows/premium-social-daily.yml
          git rm .github/workflows/one-shot-premium-social-continuity.yml
          git commit -m 'automation: keep premium social posting alive through AI limits'
          git pull --rebase origin main
          git push origin HEAD:main
