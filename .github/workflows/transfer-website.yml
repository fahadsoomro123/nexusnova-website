name: Transfer NexusNova Website

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  transfer:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout target repository
        uses: actions/checkout@v4

      - name: Copy verified website from source branch
        shell: bash
        run: |
          set -euo pipefail
          git clone --depth 1 --branch nexusnova-website-draft-20260821 https://github.com/fahadsoomro123/nexusnova-app.git /tmp/nexusnova-source
          find . -mindepth 1 -maxdepth 1 ! -name .git ! -name .github -exec rm -rf {} +
          cp -a /tmp/nexusnova-source/docs/. .
          python3 - <<'PY'
          from pathlib import Path
          old = 'https://fahadsoomro123.github.io/nexusnova-app'
          new = 'https://fahadsoomro123.github.io/nexusnova-website'
          for path in Path('.').rglob('*'):
              if path.is_file() and '.git' not in path.parts and path.suffix.lower() in {'.html','.xml','.txt','.js','.css','.svg'}:
                  text = path.read_text(encoding='utf-8')
                  if old in text:
                      path.write_text(text.replace(old, new), encoding='utf-8')
          PY

      - name: Verify transferred website
        shell: bash
        run: |
          set -euo pipefail
          test -f index.html
          test -f tools.html
          test -f guides.html
          test -f app.html
          test -f assets/css/site.css
          test -f assets/js/main.js
          test -f assets/js/tools.js
          test -f sitemap.xml
          test -f robots.txt
          count=$(find . -type f ! -path './.git/*' ! -path './.github/*' | wc -l | tr -d ' ')
          test "$count" -eq 20
          ! grep -R --exclude-dir=.git --exclude-dir=.github -n 'github.io/nexusnova-app' .
          grep -q 'github.io/nexusnova-website' sitemap.xml

      - name: Commit website to new repository
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          if git diff --cached --quiet; then
            echo 'No transfer changes required.'
          else
            git commit -m 'website: transfer verified NexusNova site into dedicated repository'
            git push origin HEAD:main
          fi
