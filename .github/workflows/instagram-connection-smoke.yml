name: NexusNova Instagram Connection Smoke Test

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/instagram-connection-smoke.yml'

permissions:
  contents: read

jobs:
  instagram-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      FACEBOOK_PAGE_ID: ${{ vars.FACEBOOK_PAGE_ID }}
      FACEBOOK_PAGE_ACCESS_TOKEN: ${{ secrets.FACEBOOK_PAGE_ACCESS_TOKEN }}
    steps:
      - name: Verify Instagram professional account connection
        run: |
          python - <<'PY'
          import json, os, urllib.parse, urllib.request, urllib.error

          page_id = os.environ.get('FACEBOOK_PAGE_ID','').strip()
          token = os.environ.get('FACEBOOK_PAGE_ACCESS_TOKEN','').strip()
          if not page_id:
              raise SystemExit('FACEBOOK_PAGE_ID is missing')
          if not token:
              raise SystemExit('FACEBOOK_PAGE_ACCESS_TOKEN is missing')

          def get(url, label):
              req = urllib.request.Request(url, headers={'User-Agent':'NexusNovaTrafficAutopilot/1.0'})
              try:
                  with urllib.request.urlopen(req, timeout=20) as r:
                      return json.loads(r.read().decode('utf-8'))
              except urllib.error.HTTPError as exc:
                  raw = exc.read().decode('utf-8', errors='replace')
                  try:
                      body = json.loads(raw)
                  except Exception:
                      body = {'raw': raw[:500]}
                  print(json.dumps({'stage': label, 'http_status': exc.code, 'meta_error': body.get('error', body)}, indent=2))
                  raise

          q = urllib.parse.urlencode({
              'fields': 'id,name,access_token,instagram_business_account',
              'access_token': token,
          })
          page = get(f'https://graph.facebook.com/v26.0/{urllib.parse.quote(page_id)}?{q}', 'facebook_page_lookup')
          if str(page.get('id','')) != page_id:
              raise SystemExit('Meta token resolved a different Facebook Page')
          ig = page.get('instagram_business_account') or {}
          ig_id = str(ig.get('id','')).strip()
          page_token = str(page.get('access_token','')).strip()
          if not ig_id:
              raise SystemExit('No Instagram professional account is linked to this Facebook Page')
          if not page_token:
              raise SystemExit('Meta did not return a Page access token')

          q2 = urllib.parse.urlencode({
              'fields': 'id,username,account_type,name',
              'access_token': page_token,
          })
          profile = get(f'https://graph.facebook.com/v26.0/{urllib.parse.quote(ig_id)}?{q2}', 'instagram_profile_lookup')
          print(json.dumps({
              'ok': True,
              'facebook_page_name': page.get('name'),
              'instagram_id': profile.get('id'),
              'instagram_username': profile.get('username'),
              'instagram_account_type': profile.get('account_type'),
              'instagram_name': profile.get('name'),
          }, indent=2))
          if not profile.get('id') or not profile.get('username'):
              raise SystemExit('Instagram profile lookup failed')
          PY
