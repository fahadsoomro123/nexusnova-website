name: Website Actions Storage Audit

on:
  push:
    branches:
      - cleanup/website-actions-audit-20260829
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Count Actions artifacts without changing anything
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          python3 - <<'PY'
          import json, os, urllib.request
          repo = os.environ['GH_REPO']
          token = os.environ['GH_TOKEN']
          headers = {
              'Authorization': f'Bearer {token}',
              'Accept': 'application/vnd.github+json',
              'X-GitHub-Api-Version': '2022-11-28',
              'User-Agent': 'nexusnova-website-storage-audit'
          }
          artifacts=[]
          page=1
          while True:
              url=f'https://api.github.com/repos/{repo}/actions/artifacts?per_page=100&page={page}'
              req=urllib.request.Request(url,headers=headers)
              with urllib.request.urlopen(req,timeout=30) as r:
                  batch=json.load(r).get('artifacts',[])
              artifacts.extend(batch)
              if len(batch)<100: break
              page+=1
          live=[a for a in artifacts if not a.get('expired')]
          total=sum(int(a.get('size_in_bytes') or 0) for a in live)
          print(f'Total artifacts visible: {len(artifacts)}')
          print(f'Non-expired artifacts: {len(live)}')
          print(f'Non-expired bytes: {total}')
          print(f'Non-expired MiB: {total/1024/1024:.2f}')
          print('AUDIT ONLY: no files, branches, runs, or artifacts were deleted.')
          PY
