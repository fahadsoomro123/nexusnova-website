name: NexusNova LIVE AQI Refresh

on:
  schedule:
    - cron: '17 * * * *'
  push:
    branches: [main]
    paths:
      - '.github/scripts/live_aqi_core.mjs'
      - '.github/scripts/update_live_aqi.mjs'
      - '.github/workflows/update-live-aqi.yml'
  pull_request:
    branches: [main]
    paths:
      - '.github/scripts/live_aqi_core.mjs'
      - '.github/scripts/update_live_aqi.mjs'
      - '.github/workflows/update-live-aqi.yml'
      - 'assets/data/live-aqi.json'
      - 'assets/js/live-aqi.js'
      - 'aqi-live.html'
      - 'tests/live-aqi.test.cjs'
      - 'live.html'
      - 'sitemap-live.xml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: nexusnova-live-aqi-refresh-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    env:
      OPENAQ_API_KEY: ${{ secrets.OPENAQ_API_KEY }}
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4
      - name: Set up Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
      - name: Validate AQI scripts
        run: |
          node --check .github/scripts/live_aqi_core.mjs
          node --check .github/scripts/update_live_aqi.mjs
          node --check assets/js/live-aqi.js
      - name: Run repository tests
        run: npm test
      - name: Run full static SEO and internal-link audit
        run: python3 .github/scripts/site_quality_audit.py
      - name: Require zero severe static findings
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path
          report=json.loads(Path('site-quality-report.json').read_text(encoding='utf-8'))
          severe=report.get('severe',[])
          if severe:
              print('\n'.join(f'- {item}' for item in severe))
              raise SystemExit(f'{len(severe)} severe static finding(s) remain')
          print('Static site map + SEO audit has zero severe findings.')
          PY
      - name: Refresh observed AQI data when key is configured
        if: github.event_name != 'pull_request' && env.OPENAQ_API_KEY != ''
        run: node .github/scripts/update_live_aqi.mjs
      - name: Explain pending source activation
        if: github.event_name != 'pull_request' && env.OPENAQ_API_KEY == ''
        run: echo 'OPENAQ_API_KEY is not configured; keeping the fail-closed pending AQI dataset.'
      - name: Commit refreshed AQI data when changed
        if: github.event_name != 'pull_request' && env.OPENAQ_API_KEY != ''
        shell: bash
        run: |
          if git diff --quiet -- assets/data/live-aqi.json; then
            echo "AQI dataset already matches the latest validated observations."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/data/live-aqi.json
          git commit -m "data: refresh NexusNova LIVE AQI [skip ci]"
          git reset --hard HEAD
          for attempt in 1 2 3 4 5; do
            if git push origin HEAD:main; then
              echo "Published refreshed AQI data on attempt ${attempt}."
              exit 0
            fi
            git fetch origin main
            git rebase origin/main
            sleep $((attempt * 2))
          done
          echo "Unable to publish refreshed AQI data after 5 safe retries."
          exit 1
