name: NexusNova Public Artifact Hygiene Fix Once V2

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/public-artifact-hygiene-fix-once-v2.yml'

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout latest main
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Relocate Pages-deployable internal engineering files
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          import subprocess

          R=Path('.')
          scripts=['adsense_final_remediation.py','adsense_reviewer_audit.py','check_internal_links.py','generate_adsense_remediation_report.py','site_quality_inventory.py']
          reports=['ADSENSE-REMEDIATION-REPORT-2026-09-11.md','NEXUSNOVA-ADSENSE-READINESS-PROOF-MANIFEST-2026-09-11.md','WEB-MASTER-CHECKLIST.md','adsense-reviewer-audit.json']
          (R/'.github/scripts').mkdir(parents=True,exist_ok=True)
          (R/'.github/reports').mkdir(parents=True,exist_ok=True)
          mapping={}
          for name in scripts:
              src=R/name; dst=R/'.github/scripts'/name
              if src.exists():
                  subprocess.run(['git','mv',src.as_posix(),dst.as_posix()],check=True)
              if dst.exists(): mapping[name]=dst.as_posix()
          for name in reports:
              src=R/name; dst=R/'.github/reports'/name
              if src.exists(): subprocess.run(['git','mv',src.as_posix(),dst.as_posix()],check=True)
              if dst.exists(): mapping[name]=dst.as_posix()

          dirs={'cloudflare/':'.github/cloudflare/','nexusnova-dev-ai/':'.github/nexusnova-dev-ai/'}
          for old,new in dirs.items():
              src=R/old.rstrip('/'); dst=R/new.rstrip('/')
              if src.exists():
                  dst.parent.mkdir(parents=True,exist_ok=True)
                  subprocess.run(['git','mv',src.as_posix(),dst.as_posix()],check=True)

          # Update every tracked text reference to relocated paths.
          replacements={**mapping,**dirs}
          exts={'.yml','.yaml','.json','.js','.cjs','.mjs','.py','.md','.txt','.html','.xml','.toml','.css'}
          for rel in subprocess.check_output(['git','ls-files'],text=True).splitlines():
              p=R/rel
              if not p.is_file() or (p.suffix.lower() not in exts and p.name!='package.json'): continue
              try: text=p.read_text(encoding='utf-8')
              except Exception: continue
              out=text
              for old,new in replacements.items(): out=out.replace(old,new)
              if out!=text: p.write_text(out,encoding='utf-8')

          # Preserve repo-root semantics for Python tools that were formerly in root.
          for name in scripts:
              p=R/'.github/scripts'/name
              if not p.exists(): continue
              text=p.read_text(encoding='utf-8').replace('Path(__file__).resolve().parent','Path(__file__).resolve().parents[2]')
              p.write_text(text,encoding='utf-8')

          # Permanent Pages-public-root guard.
          (R/'.github/scripts/public_artifact_guard.py').write_text('''from pathlib import Path\nROOT=Path(__file__).resolve().parents[2]\nissues=[]\nfor p in sorted(ROOT.glob("*.py")):\n    issues.append(f"root Python file is Pages-deployable: {p.name}")\nfor rel in ["ADSENSE-REMEDIATION-REPORT-2026-09-11.md","NEXUSNOVA-ADSENSE-READINESS-PROOF-MANIFEST-2026-09-11.md","WEB-MASTER-CHECKLIST.md","adsense-reviewer-audit.json","OWNER-CONTROL-CENTER.md","adsense_content_remediation_20260911.py","cloudflare","nexusnova-dev-ai"]:\n    if (ROOT/rel).exists(): issues.append(f"internal engineering path is Pages-deployable: {rel}")\nif issues:\n    print("\\n".join("ERROR: "+x for x in issues)); raise SystemExit(len(issues))\nprint("Public artifact hygiene: PASS")\n''',encoding='utf-8')

          # Enforce the hygiene check in the permanent full-site audit.
          wf=R/'.github/workflows/site-quality-audit.yml'
          text=wf.read_text(encoding='utf-8')
          marker='      - name: Scan full site map, SEO and internal links\n        run: python .github/scripts/site_quality_audit.py\n'
          if 'Guard public Pages artifact hygiene' not in text:
              if marker not in text: raise SystemExit('site-quality-audit marker missing')
              text=text.replace(marker,marker+'\n      - name: Guard public Pages artifact hygiene\n        run: python .github/scripts/public_artifact_guard.py\n',1)
              wf.write_text(text,encoding='utf-8')
          PY

      - name: Validate JavaScript and backend paths
        run: npm run check

      - name: Run all repository tests
        run: npm test

      - name: Guard public artifact root
        run: python .github/scripts/public_artifact_guard.py

      - name: Run AdSense structural audit
        run: python .github/scripts/adsense_reviewer_audit.py

      - name: Run static full-site audit
        run: python .github/scripts/site_quality_audit.py

      - name: Run strict deep-site audit
        run: python .github/scripts/deep_site_audit_strict.py

      - name: Require zero audit findings
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          from pathlib import Path
          p=Path('.github/reports/adsense-reviewer-audit.json')
          if not p.exists(): raise SystemExit('AdSense audit output missing after relocation')
          a=json.loads(p.read_text(encoding='utf-8')).get('summary',{})
          q=json.loads(Path('site-quality-report.json').read_text(encoding='utf-8'))
          vals={'adsense_blockers':int(a.get('blockers',0) or 0),'adsense_warnings':int(a.get('warnings',0) or 0),'site_severe':len(q.get('severe',[])),'site_warnings':len(q.get('warnings',[]))}
          print(vals)
          if any(vals.values()): raise SystemExit('Zero-finding gate failed')
          PY

      - name: Commit verified hygiene changes
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'nexusnova-hygiene[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm -f .github/workflows/public-artifact-hygiene-audit-once.yml .github/workflows/public-artifact-hygiene-fix-once.yml .github/workflows/public-artifact-hygiene-fix-once-v2.yml
          git add -A
          git commit -m 'security: keep internal engineering files out of Pages artifact'
          git pull --rebase origin main
          git push origin main
