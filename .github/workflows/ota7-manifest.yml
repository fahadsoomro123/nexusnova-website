name: OTA7 Manifest
on:
  push:
    branches: [nexusnova-ota-public]
    paths:
      - '.github/workflows/ota7-manifest.yml'
      - 'ota/files/index.html'
      - 'ota/files/src/features/apps/app-screen.js'
      - 'ota/files/src/features/apps/premium-studio-suite.js'
      - 'ota/files/src/features/apps/ai-video-studio-flagship.js'
permissions:
  contents: write
jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: nexusnova-ota-public
          fetch-depth: 0
      - name: Rebuild and verify OTA7
        shell: bash
        run: |
          set -euo pipefail
          git pull --ff-only origin nexusnova-ota-public
          node <<'NODE'
          const fs=require('fs'),crypto=require('crypto');
          const mp='ota/manifest.json',m=JSON.parse(fs.readFileSync(mp,'utf8'));
          if(m.schema!==2) throw new Error('schema');
          if(m.base!=='b8aa3393af20235fb70cf771f7bc7f84b05ebbf3') throw new Error('baseline');
          const changed=['index.html','src/features/apps/app-screen.js','src/features/apps/premium-studio-suite.js','src/features/apps/ai-video-studio-flagship.js'];
          const rows=new Map((m.files||[]).map(x=>[x.path,x]));
          for(const path of changed){
            const p='ota/files/'+path,b=fs.readFileSync(p);
            rows.set(path,{path,sha256:crypto.createHash('sha256').update(b).digest('hex'),size:b.length});
          }
          m.version=process.env.GITHUB_SHA;
          m.ota_badge='OTA7';
          m.ota_badge_status='ACTIVE';
          m.video_release='flagship-v2-no-scroll-mobile-cockpit';
          m.source_commit='67004855df4d538705978daa628d29e3c21229db';
          m.files=[...rows.values()].sort((a,b)=>a.path.localeCompare(b.path));
          let total=0;
          for(const row of m.files){
            const p='ota/files/'+row.path;
            if(!fs.existsSync(p)) throw new Error('missing '+row.path);
            const b=fs.readFileSync(p),h=crypto.createHash('sha256').update(b).digest('hex');
            if(b.length!==row.size||h!==row.sha256) throw new Error('mismatch '+row.path);
            total+=b.length;
          }
          if(total>60*1024*1024) throw new Error('total');
          fs.writeFileSync(mp,JSON.stringify(m));
          console.log(JSON.stringify({version:m.version,files:m.files.length,total},null,2));
          NODE
          git config user.name 'NexusNova OTA Bot'
          git config user.email 'actions@users.noreply.github.com'
          git add ota/manifest.json
          git diff --cached --check
          git commit -m "ota(video): publish flagship V2 OTA7" || true
          git push origin HEAD:nexusnova-ota-public
