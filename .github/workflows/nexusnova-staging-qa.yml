name: NexusNova Staging QA

on:
  push:
    branches: [nexusnova-clean-redesign]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout staging branch
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 1

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'

      - name: Static site quality audit
        id: static
        continue-on-error: true
        run: python .github/scripts/site_quality_audit.py

      - name: Deep site audit
        id: deep
        continue-on-error: true
        run: python .github/scripts/deep_site_audit.py

      - name: Production readiness audit
        id: readiness
        continue-on-error: true
        run: python .github/scripts/production_readiness_audit.py

      - name: Site-wide visual defect audit
        id: visual
        continue-on-error: true
        run: python .github/scripts/staging_visual_defect_audit.py

      - name: Build audit summary
        if: always()
        shell: bash
        run: |
          {
            echo "# NexusNova staging QA"
            echo
            echo "- Static site audit: ${{ steps.static.outcome }}"
            echo "- Deep site audit: ${{ steps.deep.outcome }}"
            echo "- Production readiness: ${{ steps.readiness.outcome }}"
            echo "- Visual defect audit: ${{ steps.visual.outcome }}"
            echo
            echo "## Reports"
            for f in site-quality-report.txt deep-site-audit.txt quality-artifacts/browser-quality-report.json; do
              if [ -f "$f" ]; then
                echo
                echo "### $f"
                head -n 250 "$f"
              fi
            done
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload QA artifacts
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: nexusnova-staging-qa
          path: |
            site-quality-report.txt
            site-quality-report.json
            deep-site-audit.txt
            deep-site-audit.json
            quality-artifacts/**
            staging-visual-defect-audit.txt
            staging-visual-defect-audit.json
            /tmp/nexusnova-http.log
          if-no-files-found: warn
          retention-days: 14

      - name: Enforce visual QA
        if: always()
        shell: bash
        run: |
          test "${{ steps.visual.outcome }}" = "success"
