name: NexusNova Facebook Token Probe

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/facebook-token-probe.yml'

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      FACEBOOK_PAGE_ID: ${{ vars.FACEBOOK_PAGE_ID }}
      FACEBOOK_PAGE_ACCESS_TOKEN: ${{ secrets.FACEBOOK_PAGE_ACCESS_TOKEN }}
    steps:
      - name: Check whether configured token yields Page access token
        run: |
          python - <<'PY'
          import json, os, urllib.parse, urllib.request
          page_id=os.environ.get('FACEBOOK_PAGE_ID','').strip()
          token=os.environ.get('FACEBOOK_PAGE_ACCESS_TOKEN','').strip()
          if not page_id or not token:
              raise SystemExit('Facebook config missing')
          qs=urllib.parse.urlencode({'fields':'id,name,access_token','access_token':token})
          url=f'https://graph.facebook.com/v26.0/{urllib.parse.quote(page_id)}?{qs}'
          req=urllib.request.Request(url, headers={'User-Agent':'NexusNovaTrafficAutopilot/1.0'})
          with urllib.request.urlopen(req, timeout=25) as r:
              data=json.loads(r.read().decode())
          print(json.dumps({'http_status':r.status,'page_id_matches':str(data.get('id'))==page_id,'page_name':data.get('name'),'page_access_token_returned':bool(data.get('access_token'))}, indent=2))
          PY
