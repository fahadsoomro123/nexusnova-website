name: Telegram Mini App Check

on:
  pull_request:
    paths:
      - 'account.html'
      - 'assets/js/telegram-webapp.js'
      - 'assets/js/telegram-account-api.js'
      - 'assets/js/telegram-avatar-refresh.js'
      - 'assets/js/register.js'
      - 'assets/js/account-dashboard.js'
      - 'assets/js/instagram-auth-ui.js'
      - 'cloudflare/telegram-bot/worker.js'
      - 'cloudflare/telegram-bot/worker-entry.js'
      - 'cloudflare/telegram-bot/worker-instagram-entry.js'
      - 'cloudflare/telegram-bot/instagram-account.js'
      - 'cloudflare/telegram-bot/wrangler.jsonc'
      - 'tests/**'
      - 'package.json'
      - '.github/workflows/telegram-mini-app.yml'
  push:
    branches: [main]
    paths:
      - 'account.html'
      - 'assets/js/telegram-webapp.js'
      - 'assets/js/telegram-account-api.js'
      - 'assets/js/telegram-avatar-refresh.js'
      - 'assets/js/register.js'
      - 'assets/js/account-dashboard.js'
      - 'assets/js/instagram-auth-ui.js'
      - 'cloudflare/telegram-bot/**'
      - 'tests/**'
      - 'package.json'
      - '.github/workflows/telegram-mini-app.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: npm test
      - run: npm run check
      - name: Repair and verify production Telegram webhook
        if: github.event_name == 'push'
        shell: bash
        run: |
          set -euo pipefail
          base='https://nexusnova-telegram-bot.fahadsoomro123.workers.dev'
          sleep 20
          for attempt in 1 2 3 4 5 6; do
            if body=$(curl --fail --silent --show-error --max-time 20 "$base/setup"); then
              echo "$body" | python -c 'import json,sys; d=json.load(sys.stdin); assert d.get("ok") is True; w=d.get("webhookInfo",{}).get("result",{}); assert w.get("url","").endswith("/webhook"); print("Webhook configured; pending_update_count=", w.get("pending_update_count",0), "last_error=", w.get("last_error_message","none"))'
              curl --fail --silent --show-error --max-time 20 "$base/status" | python -c 'import json,sys; d=json.load(sys.stdin); assert d.get("ok") is True; w=d.get("webhookInfo",{}).get("result",{}); assert w.get("url","").endswith("/webhook"); print("Worker healthy; pending_update_count=", w.get("pending_update_count",0), "last_error=", w.get("last_error_message","none"))'
              exit 0
            fi
            sleep 10
          done
          echo 'Telegram webhook repair failed after retries.' >&2
          exit 1
      - name: Verify production Instagram route
        if: github.event_name == 'push'
        shell: bash
        run: |
          set -euo pipefail
          base='https://nexusnova-telegram-bot.fahadsoomro123.workers.dev'
          body_file="$(mktemp)"
          code="$(curl --silent --show-error --max-time 20 \
            -H 'Origin: https://nexusnovatools.com' \
            -H 'Accept: application/json' \
            -o "$body_file" -w '%{http_code}' \
            "$base/api/instagram/status")"
          test "$code" = '401'
          python -c "import json,sys; d=json.load(open(sys.argv[1],encoding='utf-8')); assert d.get('ok') is False; assert d.get('code') == 'unauthenticated'" "$body_file"
          echo 'Instagram API route is live and enforcing NexusNova authentication.'
