name: Telegram Mini App Check

on:
  pull_request:
    paths:
      - 'assets/js/telegram-webapp.js'
      - 'assets/js/register.js'
      - 'assets/js/account-dashboard.js'
      - 'cloudflare/telegram-bot/worker.js'
      - 'tests/**'
      - 'package.json'
      - '.github/workflows/telegram-mini-app.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: npm test
      - run: npm run check
