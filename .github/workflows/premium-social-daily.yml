name: NexusNova Premium Social 5x Daily

on:
  schedule:
    # Pakistan time (UTC+5): 08:30, 11:30, 14:30, 17:30, 20:30
    - cron: '30 3 * * *'
    - cron: '30 6 * * *'
    - cron: '30 9 * * *'
    - cron: '30 12 * * *'
    - cron: '30 15 * * *'
  workflow_dispatch:
    inputs:
      slot:
        description: 'Campaign slot 1-5 (blank = infer from UTC hour)'
        required: false
        type: string

permissions:
  contents: write

concurrency:
  group: nexusnova-premium-social
  cancel-in-progress: false

jobs:
  create-and-publish:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    env:
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      GEMINI_MODEL: ${{ vars.GEMINI_MODEL }}
      BUFFER_API_KEY: ${{ secrets.BUFFER_API_KEY }}
      BUFFER_X_CHANNEL_ID: '6a987ad2065799be4676b541'
      FACEBOOK_PAGE_ID: ${{ vars.FACEBOOK_PAGE_ID }}
      FACEBOOK_PAGE_ACCESS_TOKEN: ${{ secrets.FACEBOOK_PAGE_ACCESS_TOKEN }}
      POLLINATIONS_API_KEY: ${{ secrets.POLLINATIONS_API_KEY }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install image dependency
        run: python -m pip install --disable-pip-version-check pillow

      - name: Resolve five-a-day slot
        id: slot
        shell: bash
        env:
          MANUAL_SLOT: ${{ github.event.inputs.slot }}
        run: |
          python - <<'PY' >> "$GITHUB_OUTPUT"
          import datetime, os
          raw=(os.getenv('MANUAL_SLOT') or '').strip()
          if raw:
              try: slot=max(1,min(5,int(raw)))
              except Exception: slot=1
          else:
              hour=datetime.datetime.now(datetime.timezone.utc).hour
              slot={3:1,6:2,9:3,12:4,15:5}.get(hour,1)
          print(f'slot={slot}')
          PY

      - name: Compile premium social code
        run: |
          python -m py_compile .github/scripts/ai_provider.py
          python -m py_compile .github/scripts/buffer_publish.py
          python -m py_compile .github/scripts/distribute_update.py
          python -m py_compile .github/scripts/premium_social_campaign.py
          python -m py_compile .github/scripts/publish_premium_social.py

      - name: Generate trend-aware copy and AI-only creative
        env:
          SOCIAL_SLOT: ${{ steps.slot.outputs.slot }}
        run: python .github/scripts/premium_social_campaign.py

      - name: Quality gate
        shell: bash
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          from PIL import Image
          item=json.loads(Path('premium-social-publish.json').read_text(encoding='utf-8'))
          slot=int(item.get('slot',0))
          if slot not in range(1,6): raise SystemExit('invalid slot')
          if not str(item.get('image_provider','')).startswith('pollinations-'):
              raise SystemExit('AI-only gate failed: image was not generated by configured AI provider')
          if len(item.get('hashtags') or []) < 3: raise SystemExit('need at least 3 hashtags')
          if len(str((item.get('platform_copy') or {}).get('x',''))) > 190: raise SystemExit('X copy too long')
          image=Path(f'assets/generated/premium-social-slot-{slot}.jpg')
          with Image.open(image) as im:
              if im.size != (1080,1350): raise SystemExit(f'wrong social image size: {im.size}')
          print('Premium social quality gate passed:', item['campaign'], item['image_provider'])
          PY

      - name: Publish AI creative to website
        shell: bash
        run: |
          git config user.name 'nexusnova-social[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add assets/generated/premium-social-slot-${{ steps.slot.outputs.slot }}.jpg assets/data/premium-social-history.json
          if [ -n "$(git status --porcelain)" ]; then
            git commit -m "automation: premium social slot ${{ steps.slot.outputs.slot }} ${GITHUB_RUN_ID}"
            git pull --rebase origin main
            git push origin HEAD:main
          else
            echo 'No generated social asset change to publish.'
          fi

      - name: Publish to X, Facebook and Instagram
        run: python .github/scripts/publish_premium_social.py

      - name: Summary
        if: always()
        shell: bash
        run: |
          echo '## NexusNova Premium Social' >> "$GITHUB_STEP_SUMMARY"
          echo "Slot: ${{ steps.slot.outputs.slot }}" >> "$GITHUB_STEP_SUMMARY"
          if [ -f premium-social-publish.json ]; then
            echo '### Campaign' >> "$GITHUB_STEP_SUMMARY"
            echo '```json' >> "$GITHUB_STEP_SUMMARY"
            cat premium-social-publish.json >> "$GITHUB_STEP_SUMMARY"
            echo '```' >> "$GITHUB_STEP_SUMMARY"
          fi
          if [ -f premium-social-report.json ]; then
            echo '### Distribution' >> "$GITHUB_STEP_SUMMARY"
            echo '```json' >> "$GITHUB_STEP_SUMMARY"
            cat premium-social-report.json >> "$GITHUB_STEP_SUMMARY"
            echo '```' >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Upload private diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: premium-social-${{ github.run_id }}
          path: |
            premium-social-publish.json
            premium-social-report.json
          if-no-files-found: ignore
          retention-days: 14
