name: Verify LIVE Gold Tests Once

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/test-live-gold-once.yml'

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Validate JavaScript
        run: npm run check
      - name: Run repository tests
        run: npm test
