# Verification rerun after AdSense content-depth hardening on 2026-09-04
name: NexusNova Site Quality Audit

on:
  schedule:
    - cron: '45 2 * * *'
  push:
    branches: [main]
    paths:
      - '**/*.html'
      - '**/*.css'
      - '**/*.js'
      - '**/*.xml'
      - '**/*.txt'
      - '.github/scripts/site_quality_audit.py'
      - 'tests/test_site_quality_theme_coverage.py'
      - 'tests/test_browser_quality_guard.py'
      - '.github/scripts/browser_quality_guard.py'
      - '.github/workflows/site-quality-audit.yml'
  pull_request:
    branches: [main]
    paths:
      - '**/*.html'
      - '**/*.css'
      - '**/*.js'
      - '**/*.xml'
      - '**/*.txt'
      - '.github/scripts/site_quality_audit.py'
      - 'tests/test_browser_quality_guard.py'
      - '.github/scripts/browser_quality_guard.py'
      - '.github/workflows/site-quality-audit.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: nexusnova-site-quality-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  full-site-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'

      - name: Test site quality audit regression cases
        run: |
          python tests/test_site_quality_theme_coverage.py
          python tests/test_browser_quality_guard.py

      - name: Scan full site map, SEO and internal links
        run: python .github/scripts/site_quality_audit.py

      - name: Require zero static findings
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          data=json.loads(Path('site-quality-report.json').read_text(encoding='utf-8'))
          severe=data.get('severe',[])
          warnings=data.get('warnings',[])
          if severe or warnings:
              for item in severe:
                  print(f'SEVERE: {item}')
              for item in warnings:
                  print(f'WARNING: {item}')
              raise SystemExit(f'{len(severe)} severe and {len(warnings)} warning static finding(s) remain')
          print('Static site map + SEO audit has zero severe findings and zero warnings.')
          PY

      - name: Install pinned Playwright Python package
        timeout-minutes: 3
        run: python -m pip install --disable-pip-version-check --retries 4 --timeout 30 "playwright==1.64.0"

      - name: Install and smoke-test headless Chromium
        timeout-minutes: 8
        env:
          PLAYWRIGHT_DOWNLOAD_CONNECTION_TIMEOUT: '30000'
        run: |
          set -euo pipefail
          installed=false
          for attempt in 1 2; do
            if python -m playwright install --only-shell chromium; then
              installed=true
              break
            fi
            if [[ "$attempt" -eq 1 ]]; then
              echo "Chromium download failed once; retrying after 5 seconds."
              sleep 5
            fi
          done
          if [[ "$installed" != true ]]; then
            echo "Chromium installation failed after two attempts."
            exit 1
          fi

          smoke_test() {
            python - <<'PY'
          from playwright.sync_api import sync_playwright

          with sync_playwright() as playwright:
              browser = playwright.chromium.launch(headless=True)
              print(f"PASS: Chromium headless shell launched; version={browser.version}")
              browser.close()
          PY
          }

          if smoke_test; then
            exit 0
          fi

          echo "Cached Chromium could not launch with the runner's current libraries; installing OS dependencies and retrying."
          python -m playwright install-deps chromium
          smoke_test

      - name: Disable third-party ad and analytics downloads in local audit copy
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          # Stub the historical static AdSense tag if present in this local QA copy.
          # The production homepage now loads AdSense dynamically from main.js.
          index = Path('index.html')
          html = index.read_text(encoding='utf-8')
          ads_src = 'https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-5070673529890078'
          static_count = html.count(ads_src)
          if static_count > 1:
              raise SystemExit(f'Expected zero or one static AdSense URL in index.html, found {static_count}')
          if static_count == 1:
              html = html.replace(ads_src, 'data:text/javascript,window.__nexusnovaLocalAdSenseStub=true', 1)
              index.write_text(html, encoding='utf-8')

          # Disable the dynamically injected AdSense URL in the local audit copy.
          path = Path('assets/js/main.js')
          source = path.read_text(encoding='utf-8')
          lines = source.splitlines()
          ad_matches = [i for i, line in enumerate(lines) if 'adsenseScript.src=' in line and 'pagead2.googlesyndication.com/pagead/js/adsbygoogle.js' in line]
          if len(ad_matches) != 1:
              raise SystemExit(f'Expected exactly one dynamic AdSense loader source line, found {len(ad_matches)}')
          lines[ad_matches[0]] = "    adsenseScript.src='data:text/javascript,window.__nexusnovaLocalAdSenseStub=true';"
          path.write_text('\n'.join(lines)+'\n', encoding='utf-8')

          # Disable external GA4 only in this local audit copy.
          source = path.read_text(encoding='utf-8')
          lines = source.splitlines()
          matches = [i for i, line in enumerate(lines) if (('analyticsScript.src=' in line or 'script.src=' in line) and 'googletagmanager.com/gtag/js' in line)]
          if len(matches) != 1:
              raise SystemExit(f'Expected exactly one GA4 loader source line, found {len(matches)}')
          lines[matches[0]] = "    analyticsScript.src='data:text/javascript,window.__nexusnovaLocalGa4Stub=true';"
          path.write_text('\n'.join(lines)+'\n', encoding='utf-8')
          print('Local browser QA stubs dynamic AdSense and external GA4 downloads in its copy only; production sources are untouched.')
          PY
      - name: Start local website server
        run: |
          python -m http.server 8000 --bind 127.0.0.1 >/tmp/nexusnova-http.log 2>&1 &
          echo $! > /tmp/nexusnova-http.pid
          sleep 2
          curl --fail --silent http://127.0.0.1:8000/ >/dev/null

      - name: Verify desktop and mobile browser quality
        run: python .github/scripts/browser_quality_guard.py

      - name: Require zero browser findings
        if: always()
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          path=Path('quality-artifacts/browser-quality-report.json')
          if not path.exists():
              raise SystemExit('Browser quality report missing.')
          data=json.loads(path.read_text(encoding='utf-8'))
          severe=data.get('severe',[])
          warnings=data.get('warnings',[])
          if severe or warnings:
              for item in severe:
                  print(f'SEVERE: {item}')
              for item in warnings:
                  print(f'WARNING: {item}')
              raise SystemExit(f'{len(severe)} severe and {len(warnings)} warning browser finding(s) remain')
          print('Browser audit has zero severe findings and zero warnings.')
          PY

      - name: Add reports to job summary
        if: always()
        run: |
          echo '## NexusNova Full Site Map + SEO Audit' >> "$GITHUB_STEP_SUMMARY"
          echo '```text' >> "$GITHUB_STEP_SUMMARY"
          if [ -f site-quality-report.txt ]; then cat site-quality-report.txt >> "$GITHUB_STEP_SUMMARY"; else echo 'Static audit did not produce a report.' >> "$GITHUB_STEP_SUMMARY"; fi
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          if [ -f quality-artifacts/browser-quality-report.json ]; then
            echo '### Browser quality' >> "$GITHUB_STEP_SUMMARY"
            echo '```json' >> "$GITHUB_STEP_SUMMARY"
            cat quality-artifacts/browser-quality-report.json >> "$GITHUB_STEP_SUMMARY"
            echo '```' >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Upload full audit artifacts
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: nexusnova-full-site-audit-${{ github.run_id }}
          path: |
            site-quality-report.txt
            site-quality-report.json
            quality-artifacts/
          if-no-files-found: ignore
          retention-days: 30