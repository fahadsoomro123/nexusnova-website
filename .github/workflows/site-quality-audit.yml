name: NexusNova Site Quality Audit

on:
  schedule:
    - cron: '45 2 * * *'
  push:
    branches: [main]
    paths:
      - '**/*.html'
      - '**/*.css'
      - '**/*.js'
      - '**/*.xml'
      - '**/*.txt'
      - '.github/scripts/site_quality_audit.py'
      - '.github/workflows/site-quality-audit.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: nexusnova-site-quality
  cancel-in-progress: true

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Scan every HTML page
        run: python .github/scripts/site_quality_audit.py

      - name: Add report to job summary
        if: always()
        run: |
          echo '```text' >> "$GITHUB_STEP_SUMMARY"
          cat site-quality-report.txt >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
