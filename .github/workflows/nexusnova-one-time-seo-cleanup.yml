name: NexusNova One-Time SEO Cleanup

on:
  push:
    branches: [main]
  issues:
    types: [opened]
  workflow_dispatch:

permissions:
  contents: write
  issues: write

jobs:
  seo-cleanup:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 1

      - name: Remove all HTML noindex directives
        shell: python
        run: |
          from pathlib import Path
          import re

          pattern = re.compile(
              r'<meta\b(?=[^>]*\bname\s*=\s*["\']robots["\'])'
              r'(?=[^>]*\bcontent\s*=\s*["\'][^"\']*\bnoindex\b[^"\']*["\'])'
              r'[^>]*>\s*',
              re.IGNORECASE,
          )

          changed = 0
          removed = 0
          for path in Path('.').rglob('*.html'):
              if '.git' in path.parts:
                  continue
              original = path.read_text(encoding='utf-8')
              updated, count = pattern.subn('', original)
              if count:
                  path.write_text(updated, encoding='utf-8')
                  changed += 1
                  removed += count

          print(f"HTML files changed: {changed}")
          print(f"robots meta tags removed: {removed}")

      - name: Normalize root robots.txt
        shell: bash
        run: |
          cat > robots.txt <<'EOF'
          User-agent: *
          Allow: /
          Allow: /index.html
          Disallow: /api/
          Disallow: /*?
          Sitemap: https://nexusnovatools.com/sitemap.xml
          EOF

      - name: Update active noindex CI assertions
        shell: python
        run: |
          from pathlib import Path

          replacements = {
              "tests/nova/nova-intelligence.test.cjs": [
                  (
                      "test('Nova production HTML owns only Nova assets and keeps product surface noindex', () => {",
                      "test('Nova production HTML owns only Nova assets and remains crawlable', () => {",
                  ),
                  (
                      '  assert.match(html, /<meta name="robots" content="noindex,nofollow">/i);',
                      '  assert.doesNotMatch(html, /<meta name="robots"[^>]*noindex/i);',
                  ),
              ],
              ".github/workflows/production-smoke.yml": [
                  (
                      "              && grep -Fq '<meta name=\"robots\" content=\"noindex,nofollow\">' <<<\"$intelligence\" \",
                      "              && ! grep -Fq '<meta name=\"robots\" content=\"noindex,nofollow\">' <<<\"$intelligence\" \",
                  ),
              ],
              ".github/workflows/intelligence-browser-quality.yml": [
                  (
                      "                  check(page.locator('meta[name=\"robots\"][content=\"noindex,nofollow\"]').count() == 1, f'{mode}: preview robots guard missing')",
                      "                  check(page.locator('meta[name=\"robots\"][content*=\"noindex\"]').count() == 0, f'{mode}: noindex robots guard should be absent')",
                  ),
              ],
              ".github/workflows/nova-discoverability-quality.yml": [
                  (
                      "                  if robots.replace(' ', '').lower() != 'noindex,nofollow':",
                      "                  if 'noindex' in robots.lower():",
                  ),
                  (
                      "                      failures.append(f'intelligence: robots meta is {robots!r}')",
                      "                      failures.append(f'intelligence: unexpected noindex robots meta {robots!r}')",
                  ),
              ],
          }

          for filename, pairs in replacements.items():
              path = Path(filename)
              text = path.read_text(encoding='utf-8')
              original = text
              for old, new in pairs:
                  if old not in text:
                      raise SystemExit(f"Expected text not found in {filename}: {old}")
                  text = text.replace(old, new, 1)
              if text != original:
                  path.write_text(text, encoding='utf-8')

      - name: Verify before commit
        shell: python
        run: |
          from pathlib import Path
          import re, sys

          meta = re.compile(
              r'<meta\b(?=[^>]*\bname\s*=\s*["\']robots["\'])'
              r'(?=[^>]*\bcontent\s*=\s*["\'][^"\']*\bnoindex\b[^"\']*["\'])'
              r'[^>]*>',
              re.IGNORECASE,
          )
          offenders = []
          total = 0
          for path in Path('.').rglob('*.html'):
              if '.git' in path.parts:
                  continue
              count = len(meta.findall(path.read_text(encoding='utf-8')))
              if count:
                  offenders.append(f"{path}:{count}")
                  total += count

          robots = Path('robots.txt').read_text(encoding='utf-8')
          required = [
              "User-agent: *",
              "Allow: /",
              "Allow: /index.html",
              "Disallow: /api/",
              "Disallow: /*?",
          ]
          blocked = [
              line for line in robots.splitlines()
              if line.strip().lower().startswith("disallow: ")
              and line.strip() not in {"Disallow: /api/", "Disallow: /*?"}
          ]

          print(f"Remaining HTML noindex tags: {total}")
          print(f"Unexpected robots disallow rules: {blocked}")
          if offenders or total or any(line not in robots.splitlines() for line in required) or blocked:
              print("\n".join(offenders))
              sys.exit(1)

      - name: Commit cleanup and remove this one-time workflow
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/nexusnova-one-time-seo-cleanup.yml
          git add -A
          if git diff --cached --quiet; then
            echo "No changes to commit."
            exit 0
          fi
          git commit -m "fix: globally remove HTML noindex and normalize robots"
          git push origin HEAD:main
          if [ "${{ github.event_name }}" = "issues" ]; then
            gh issue close "${{ github.event.issue.number }}" --repo "${GITHUB_REPOSITORY}"
          fi
