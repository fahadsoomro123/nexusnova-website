name: SEO Audit Studio Visual Review Preview

on:
  push:
    branches:
      - preview/seo-audit-studio-approval
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: seo-audit-studio-visual-review
  cancel-in-progress: true

jobs:
  publish-visual-preview:
    name: Publish full-root noindex visual preview
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out review branch
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Validate preview JavaScript and run site regressions
        shell: bash
        run: |
          set -Eeuo pipefail
          node --check assets/js/seo-audit-studio-preview-mock.js
          node --check assets/js/seo-audit-launch.js
          npm test
      - name: Deploy exact branch files to isolated Cloudflare Pages
        shell: bash
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -Ee -o pipefail
          if [[ -z "$CLOUDFLARE_API_TOKEN" || -z "$CLOUDFLARE_ACCOUNT_ID" ]]; then
            echo "::error::Missing repository secrets CLOUDFLARE_API_TOKEN or CLOUDFLARE_ACCOUNT_ID."
            exit 1
          fi
          API="https://api.cloudflare.com/client/v4"
          PROJECT="nexusnova-seo-audit-studio-review"
          BRANCH="review"
          PROJECT_URL="$API/accounts/$CLOUDFLARE_ACCOUNT_ID/pages/projects/$PROJECT"
          project_status="$(curl -sS -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" "$PROJECT_URL")"
          if [[ "$(jq -r '.success // false' <<< "$project_status")" != "true" ]]; then
            body="$(jq -nc --arg name "$PROJECT" '{name:$name,production_branch:"main"}')"
            created="$(curl -sS -X POST -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" -H "Content-Type: application/json" "$API/accounts/$CLOUDFLARE_ACCOUNT_ID/pages/projects" --data "$body")"
            jq -e '.success == true' <<< "$created" >/dev/null || { echo "::error::Could not create isolated Pages project."; jq -r '.errors[]?.message' <<< "$created"; exit 1; }
          fi
          preview_dir=".preview-dist"
          rm -rf "$preview_dir"
          mkdir -p "$preview_dir"
          rsync -a \
            --exclude='.git/' \
            --exclude='.github/' \
            --exclude='functions/' \
            --exclude='.review-backend/' \
            --exclude='.preview-dist/' \
            --exclude='node_modules/' \
            --exclude='tests/' \
            --exclude='test/' \
            --exclude='docs/' \
            --exclude='cloudflare/' \
            --exclude='package.json' \
            --exclude='package-lock.json' \
            --exclude='*.md' \
            --exclude='*.py' \
            --exclude='*.sh' \
            --exclude='*.cjs' \
            --exclude='*.mjs' \
            --exclude='*.log' \
            . "$preview_dir/"
          npx --yes wrangler@4.151.2 pages deploy "$preview_dir" --project-name "$PROJECT" --branch "$BRANCH"
          echo "::group::Verify the deployed raw HTML source endpoint"
          smoke_url='https://review.nexusnova-seo-audit-studio-review.pages.dev/api/page-source?url=https%3A%2F%2Fexample.com%2F'
          smoke_ok=false
          smoke_response=''
          for attempt in 1 2 3 4 5; do
            smoke_response="$(curl -sS --max-time 18 -H 'Referer: https://review.nexusnova-seo-audit-studio-review.pages.dev/seo-audit-studio.html' "$smoke_url" || true)"
            if jq -e '.ok == true and (.html | type == "string") and (.html | test("<html|<!doctype"; "i")) and (.finalUrl | startswith("https://example.com"))' <<< "$smoke_response" >/dev/null 2>&1; then
              smoke_ok=true
              break
            fi
            echo "Raw HTML smoke attempt $attempt did not pass: $(jq -r '.error // "endpoint not ready or response was not HTML"' <<< "$smoke_response" 2>/dev/null || echo 'no JSON response')"
            sleep 3
          done
          if [[ "$smoke_ok" != true ]]; then
            echo "::error::The deployed Pages Function did not return real HTML from example.com."
            jq -c . <<< "$smoke_response" || true
            exit 1
          fi
          echo "Verified: same-origin endpoint returned real HTML from https://example.com/."
          echo "::endgroup::"
          echo "::group::Verify NexusNova website source"
          target_smoke_url='https://review.nexusnova-seo-audit-studio-review.pages.dev/api/page-source?url=https%3A%2F%2Fnexusnovatools.com%2F'
          target_smoke_ok=false
          target_smoke_response=''
          for attempt in 1 2 3 4 5; do
            target_smoke_response="$(curl -sS --max-time 18 -H 'Referer: https://review.nexusnova-seo-audit-studio-review.pages.dev/seo-audit-studio.html' "$target_smoke_url" || true)"
            if jq -e '.ok == true and (.html | type == "string") and (.html | test("<html|<!doctype"; "i")) and (.finalUrl | contains("nexusnovatools.com")) and (.html | test("NexusNova|nexusnova"; "i"))' <<< "$target_smoke_response" >/dev/null 2>&1; then
              target_smoke_ok=true
              break
            fi
            echo "NexusNova source smoke attempt $attempt did not pass: $(jq -r '.error // "target response was not valid NexusNova HTML"' <<< "$target_smoke_response" 2>/dev/null || echo 'no JSON response')"
            sleep 3
          done
          if [[ "$target_smoke_ok" != true ]]; then
            echo "::error::The Pages Function did not return recognizable raw HTML for nexusnovatools.com."
            jq -c . <<< "$target_smoke_response" || true
            exit 1
          fi
          echo "Verified: raw HTML fetched from the real nexusnovatools.com site."
          echo "::endgroup::"
          {
            echo "## NexusNova visual review preview"
            echo
            echo "- **Homepage:** https://review.nexusnova-seo-audit-studio-review.pages.dev/"
            echo "- **SEO Audit Studio UI:** https://review.nexusnova-seo-audit-studio-review.pages.dev/seo-audit-studio.html"
            echo "- **Owner Console UI:** https://review.nexusnova-seo-audit-studio-review.pages.dev/seo-audit-studio-admin.html"
            echo "- CSS, images, scripts and root-relative site assets are served from the real site root."
            echo "- This job publishes static files only; the isolated mock backend is handled by the separate review workflow."
            echo "- Indexing is blocked with the preview branch _headers file."
          } >> "$GITHUB_STEP_SUMMARY"
