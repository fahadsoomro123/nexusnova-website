name: AdSense Reviewer Audit

on:
  push:
    branches: [main]
    paths:
      - 'adsense_reviewer_audit.py'
      - '.github/workflows/adsense-reviewer-audit.yml'
      - '**.html'
      - 'sitemap*.xml'
      - 'robots.txt'
      - 'ads.txt'
      - 'tests/test_adsense_live_audit.py'
      - 'tests/adsense-quarantine-plan.test.cjs'
  pull_request:
    branches: [main]
    paths:
      - 'adsense_reviewer_audit.py'
      - '**.html'
      - 'sitemap*.xml'
      - 'ADSENSE-REMEDIATION-REPORT-2026-09-11.md'
      - '.github/workflows/adsense-reviewer-audit.yml'
      - 'tests/test_adsense_live_audit.py'
      - 'tests/adsense-quarantine-plan.test.cjs'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  reviewer-gate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 2
      - name: Test live audit cache-busting
        run: python tests/test_adsense_live_audit.py
      - name: Test approved AdSense quarantine policy
        run: node --test tests/adsense-quarantine-plan.test.cjs
      - name: Wait for changed static files to match this commit
        if: github.event_name != 'pull_request'
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import hashlib
          import subprocess
          import time
          from concurrent.futures import ThreadPoolExecutor
          from pathlib import Path
          from urllib.error import HTTPError, URLError
          from urllib.parse import quote
          from urllib.request import Request, urlopen

          base = 'https://nexusnovatools.com'
          commit = subprocess.check_output(['git', 'rev-parse', 'HEAD'], text=True).strip()
          changed = subprocess.check_output([
              'git', 'diff', '--name-only', 'HEAD^', 'HEAD', '--',
              '*.html', 'assets/**/*.css', 'assets/**/*.js',
              'assets/**/*.png', 'assets/**/*.webp', 'robots.txt', 'ads.txt', 'sitemap*.xml'
          ], text=True).splitlines()
          paths = [path for path in changed if path and not path.startswith('.github/')]
          if not paths:
              paths = ['index.html']
          expected = {
              path: hashlib.sha256(Path(path).read_bytes()).hexdigest()
              for path in paths
          }

          def check(path, attempt):
              route = '/' if path == 'index.html' else '/' + quote(path, safe='/')
              request = Request(
                  f'{base}{route}?nn_reviewer_deploy={commit}-{attempt}',
                  headers={
                      'Cache-Control': 'no-cache, no-store, max-age=0',
                      'Pragma': 'no-cache',
                      'User-Agent': 'NexusNova-AdSense-Reviewer-Audit/4.0'
                  }
              )
              try:
                  with urlopen(request, timeout=4) as response:
                      body = response.read()
                      status = response.status
                  return path, expected[path], hashlib.sha256(body).hexdigest(), status
              except (HTTPError, URLError, TimeoutError, OSError) as exc:
                  return path, expected[path], type(exc).__name__, None

          with ThreadPoolExecutor(max_workers=min(32, max(1, len(paths)))) as pool:
              for attempt in range(1, 41):
                  results = list(pool.map(lambda path: check(path, attempt), paths))
                  stale = [result for result in results if result[1] != result[2] or result[3] != 200]
                  if not stale:
                      print(f'PAGES DEPLOYMENT READY: {len(paths)} changed static file(s) match commit {commit} on attempt {attempt}.')
                      break
                  for path, wanted, observed, status in stale[:8]:
                      print(f'Waiting for Pages attempt {attempt}/40: {path} expected_sha256={wanted[:12]} actual={observed[:24]} status={status}')
                  if attempt == 40:
                      raise SystemExit(f'PRODUCTION FAIL: {len(stale)} changed static file(s) did not match this commit within the bounded wait.')
                  time.sleep(3)
          PY
      - name: Run repository + live reviewer audit
        if: github.event_name != 'pull_request'
        run: python adsense_reviewer_audit.py --live
      - name: Enforce zero reviewer warnings
        if: github.event_name != 'pull_request'
        shell: bash
        run: |
          python - <<'PY'
          import json
          data=json.load(open('adsense-reviewer-audit.json',encoding='utf-8'))
          warnings=int(data.get('summary',{}).get('warnings',0) or 0)
          if warnings:
              raise SystemExit(f'Strict reviewer gate requires zero warnings; found {warnings}.')
          print('Strict reviewer warning gate: 0 warnings.')
          PY
      - name: Publish audit summary
        if: always() && github.event_name != 'pull_request'
        shell: bash
        run: |
          echo '## AdSense Reviewer Audit' >> "$GITHUB_STEP_SUMMARY"
          if [ -f adsense-reviewer-audit.json ]; then
            python - <<'PY' >> "$GITHUB_STEP_SUMMARY"
          import json
          data=json.load(open('adsense-reviewer-audit.json',encoding='utf-8'))
          s=data.get('summary',{})
          print(f"- Status: **{s.get('status','UNKNOWN')}**")
          print(f"- Blockers: **{s.get('blockers','?')}**")
          print(f"- Warnings: **{s.get('warnings','?')}**")
          local=data.get('local',{})
          print(f"- Unique sitemap URLs: **{local.get('unique_sitemap_urls','?')}**")
          print(f"- Sitemap entries: **{local.get('sitemap_entries','?')}**")
          if local.get('blockers'):
              print('\n### Local blockers')
              for item in local['blockers'][:100]:
                  print(f"- `{json.dumps(item,ensure_ascii=False)}`")
          live=data.get('live',{})
          if live.get('blockers'):
              print('\n### Live blockers')
              for item in live['blockers'][:100]:
                  print(f"- `{json.dumps(item,ensure_ascii=False)}`")
          PY
          else
            echo '- Report was not produced.' >> "$GITHUB_STEP_SUMMARY"
          fi
      - name: Upload full audit evidence
        if: always() && github.event_name != 'pull_request'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: adsense-reviewer-audit-${{ github.run_id }}
          path: adsense-reviewer-audit.json
          if-no-files-found: warn
          retention-days: 30

# Strict zero-warning reviewer gate; latest-main rerun: 2026-09-07T16:07Z
