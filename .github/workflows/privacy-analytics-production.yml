name: Privacy Analytics Production Verification

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/privacy-analytics-production.yml'
      - 'assets/js/main.js'
      - 'assets/js/site-main.js'
      - 'assets/js/tool-analytics.js'
      - 'privacy.html'
      - 'index.html'
      - 'tests/ga4-loader.test.cjs'

permissions:
  contents: read

env:
  GA4_MEASUREMENT_ID: 'G-YLPFKWSS12'
  GA4_QA_VERSION: '20260915-auto-ga4-v1'

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Install browser and GA4 API dependencies
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          python -m pip install --disable-pip-version-check playwright google-auth requests
          python -m playwright install --with-deps chromium

      - name: Run source GA4 contract tests
        run: node --test tests/ga4-loader.test.cjs

      - name: Verify fresh production visitors receive automatic GA4
        env:
          GA4_MEASUREMENT_ID: ${{ env.GA4_MEASUREMENT_ID }}
          GA4_PROPERTY_ID: ${{ vars.GA4_PROPERTY_ID }}
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
          QA_VERSION: ${{ env.GA4_QA_VERSION }}
        run: |
          cat > /tmp/ga4_production_probe.py <<'PY'
          import json
          import os
          import time
          from pathlib import Path
          from urllib.parse import parse_qs, urlparse
          import requests
          from google.oauth2 import service_account
          from google.auth.transport.requests import Request
          from playwright.sync_api import sync_playwright

          URL='https://nexusnovatools.com/'
          MEASUREMENT_ID=os.environ['GA4_MEASUREMENT_ID']
          PROPERTY_ID=os.environ.get('GA4_PROPERTY_ID','').strip()
          REPORT=Path('ga4-production-verification.json')
          viewports=[('390x844',390,844),('412x915',412,915),('1280x800',1280,800)]
          pages=['/','/tools.html','/categories.html']
          results=[]

          def inspect_page(page, path, label, width, height):
              requests_seen=[]; errors=[]
              page.on('request', lambda req: requests_seen.append(req.url))
              page.on('pageerror', lambda err: errors.append(str(err)))
              page.on('console', lambda msg: errors.append('console:'+msg.text) if msg.type=='error' else None)
              page.goto(URL.lstrip('/') + path + '?ga4_qa=' + os.environ['QA_VERSION'] + '&ga4_view=' + label, wait_until='domcontentloaded', timeout=30000)
              page.wait_for_timeout(9000)
              info=page.evaluate('''() => ({
                gtag: typeof window.gtag === 'function',
                gaScript: [...document.scripts].filter(s=>s.src.includes('googletagmanager.com/gtag/js')).map(s=>s.src),
                gaConfigCount: (window.dataLayer||[]).filter(x=>Array.isArray(x) && x[0]==='config').length,
                gaJsCount: (window.dataLayer||[]).filter(x=>Array.isArray(x) && x[0]==='js').length,
                consentBanner: !!document.querySelector('#nexusnova-analytics-consent'),
                allowButton: !!document.querySelector('[data-consent-allow]'),
                consentText: document.body.innerText.includes('Allow detailed analytics'),
                path: location.pathname,
                title: document.title,
                overflow: {sw:document.documentElement.scrollWidth,cw:document.documentElement.clientWidth}
              })''')
              collect=[]
              for url in requests_seen:
                  if 'google-analytics.com/g/collect' not in url: continue
                  q=parse_qs(urlparse(url).query)
                  if q.get('tid',[''])[0]==MEASUREMENT_ID:
                      collect.append({'en':q.get('en',[''])[0],'dl':q.get('dl',[''])[0],'dt':q.get('dt',[''])[0]})
              pageviews=[x for x in collect if x['en']=='page_view']
              row={'viewport':label,'path':path,'page':info,'ga4Collect':collect,'pageViews':pageviews,'errors':errors[:20]}
              row['success']=info['gtag'] and len(info['gaScript'])==1 and info['gaConfigCount']==1 and info['gaJsCount']==1 and not info['consentBanner'] and not info['allowButton'] and not info['consentText'] and len(pageviews)>=1 and info['path']==path and info['overflow']['sw']<=info['overflow']['cw']+6 and not errors
              return row

          with sync_playwright() as p:
              browser=p.chromium.launch(headless=True)
              for vp_label,w,h in viewports:
                  context=browser.new_context(viewport={'width':w,'height':h}, timezone_id='Asia/Karachi')
                  page=context.new_page()
                  for path in pages:
                      row=inspect_page(page,path,vp_label,w,h)
                      results.append(row)
                  context.close()
              browser.close()

          rt={'attempts':0,'success':False,'propertyIdPresent':bool(PROPERTY_ID)}
          if PROPERTY_ID and os.environ.get('GOOGLE_SERVICE_ACCOUNT_JSON'):
              creds=service_account.Credentials.from_service_account_info(json.loads(os.environ['GOOGLE_SERVICE_ACCOUNT_JSON']),scopes=['https://www.googleapis.com/auth/analytics.readonly'])
              creds.refresh(Request())
              endpoint=f'https://analyticsdata.googleapis.com/v1beta/properties/{PROPERTY_ID}:runRealtimeReport'
              payload={'dimensions':[{'name':'eventName'},{'name':'pagePath'}],'metrics':[{'name':'activeUsers'}],'limit':25}
              deadline=time.time()+150
              while time.time()<deadline:
                  rt['attempts']+=1
                  response=requests.post(endpoint,headers={'Authorization':f'Bearer {creds.token}','Content-Type':'application/json'},json=payload,timeout=20)
                  if response.ok:
                      data=response.json();rt['rows']=data.get('rows',[]);rt['propertyIdPresent']=True
                      for r in rt['rows']:
                          dims=[x.get('dimensionValues',[{}])[0].get('value','') for x in [r]] if False else [x.get('value','') for x in r.get('dimensionValues',[])]
                          if len(dims)>=2 and dims[0]=='page_view' and dims[1] in ('','/','/tools.html','/categories.html'):
                              rt['success']=True;break
                  if rt['success']:break
                  time.sleep(10)
              if not rt.get('rows'):rt['rows']=[]

          report={'measurementId':MEASUREMENT_ID,'viewports':[x[0] for x in viewports],'browser':results,'realtime':rt}
          REPORT.write_text(json.dumps(report,indent=2,ensure_ascii=False)+'\n',encoding='utf-8')
          print(REPORT.read_text())
          assert all(x['success'] for x in results), 'Browser GA4 acceptance failed'
          assert rt['success'], 'GA4 Realtime did not observe a page_view in the existing property'
          PY
          python /tmp/ga4_production_probe.py

      - name: Upload real GA4 production evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ga4-production-verification-${{ github.run_id }}
          path: ga4-production-verification.json
          retention-days: 14
