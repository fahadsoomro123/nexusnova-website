name: Privacy Analytics Production Verification

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/privacy-analytics-production.yml'
      - 'assets/js/main.js'
      - 'assets/js/privacy-bridge.js'
      - 'assets/js/tool-analytics.js'
      - 'privacy.html'
      - 'index.html'

permissions:
  contents: read

env:
  PRIVACY_QA_VERSION: '20260915-3'

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Inspect Cloudflare Web Analytics configuration
        env:
          CF_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CF_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        shell: bash
        run: |
          set -euo pipefail
          response="$(curl --fail --silent --show-error \
            "https://api.cloudflare.com/client/v4/accounts/${CF_ACCOUNT_ID}/rum/site_info/list?order_by=host" \
            -H "Authorization: Bearer ${CF_API_TOKEN}" \
            -H 'Content-Type: application/json')"
          printf '%s' "$response" > cloudflare-rum-api.json
          python - <<'PY'
          import json
          data=json.load(open('cloudflare-rum-api.json'))
          if not data.get('success'):
              raise SystemExit('Cloudflare RUM list API failed')
          matches=[]
          for site in data.get('result') or []:
              for rule in site.get('rules') or []:
                  if (rule.get('host') or '').lower()=='nexusnovatools.com' and rule.get('is_paused') is not True:
                      matches.append(site); break
          state={'host':'nexusnovatools.com','configured':bool(matches)}
          if matches:
              s=matches[0]
              state.update({'site_tag_present':bool(s.get('site_tag')),'snippet_present':bool(s.get('snippet')),'auto_install':bool(s.get('auto_install'))})
          json.dump(state,open('cloudflare-rum-status.json','w'),indent=2)
          print(json.dumps(state,indent=2))
          PY

      - name: Install browser driver
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Playwright
        run: |
          python -m pip install --disable-pip-version-check playwright
          python -m playwright install --with-deps chromium

      - name: Verify real production consent behavior
        env:
          QA_VERSION: ${{ env.PRIVACY_QA_VERSION }}
        run: |
          cat > /tmp/privacy_analytics_probe.py <<'PY'
          import json
          from pathlib import Path
          from playwright.sync_api import sync_playwright

          URL='https://nexusnovatools.com/'
          REPORT=Path('privacy-analytics-production.json')
          results={}

          def case(p, width, height, label):
              browser=p.chromium.launch(headless=True)
              context=browser.new_context(viewport={'width':width,'height':height})
              page=context.new_page()
              requests=[]; errors=[]
              page.on('request', lambda req: requests.append(req.url))
              page.on('pageerror', lambda err: errors.append(str(err)))
              page.on('console', lambda msg: errors.append('console:'+msg.text) if msg.type=='error' else None)
              page.goto(URL+f'?privacy_qa={label}', wait_until='domcontentloaded', timeout=30000)
              page.wait_for_timeout(2000)
              before=page.evaluate('''() => ({
                gtag: typeof window.gtag === 'function',
                ga4Script: [...document.scripts].map(s=>s.src).find(s=>s.includes('googletagmanager.com/gtag/js')) || '',
                cfScript: [...document.scripts].map(s=>s.src).find(s=>s.includes('cloudflareinsights.com/beacon')) || '',
                consent: (window.dataLayer||[]).map(x=>Array.from(x||[])).filter(x=>String(x[0]||'')==='consent').slice(0,8),
                cookies: document.cookie,
                choice: localStorage.getItem('nexusnova_analytics_consent_v1') || '',
                bannerVisible: !!document.querySelector('#nexusnova-analytics-consent:not([hidden])'),
                bannerButtons: [...document.querySelectorAll('#nexusnova-analytics-consent button')].map(x=>x.textContent.trim())
              })''')
              denied_ga=[u for u in requests if 'google-analytics.com/g/collect' in u]
              denied_cf=[u for u in requests if 'cloudflareinsights.com/beacon' in u or '/cdn-cgi/rum' in u]
              page.get_by_role('button', name='Keep basic measurement').click()
              page.wait_for_timeout(500)
              afterBasic=page.evaluate("() => ({choice:localStorage.getItem('nexusnova_analytics_consent_v1')||'',cookies:document.cookie})")
              page.get_by_role('button', name='Privacy choices').click()
              page.get_by_role('button', name='Allow detailed analytics').click()
              page.wait_for_timeout(1700)
              afterGrant=page.evaluate('''() => ({
                choice:localStorage.getItem('nexusnova_analytics_consent_v1')||'',
                cookies:document.cookie,
                gaCookies:document.cookie.split(';').map(x=>x.trim().split('=')[0]).filter(x=>x==='_ga'||x.startsWith('_ga_'))
              })''')
              granted_ga=[u for u in requests if 'google-analytics.com/g/collect' in u]
              metrics=page.evaluate('''() => ({sw:document.documentElement.scrollWidth,cw:document.documentElement.clientWidth})''')
              results[label]={
                'viewport':[width,height], 'before':before,
                'deniedGa4CollectRequests':len(denied_ga),
                'deniedCloudflareRumRequests':len(denied_cf),
                'afterBasic':afterBasic,
                'afterGrant':afterGrant,
                'ga4CollectRequestsAfterGrant':len(granted_ga),
                'overflow':metrics, 'errors':errors[:20]
              }
              context.close();browser.close()

          with sync_playwright() as p:
              case(p,390,844,'mobile-390-first')
              case(p,412,915,'mobile-412-first')
              case(p,1280,800,'desktop-1280-first')
              case(p,390,844,'mobile-390-second-fresh')
          REPORT.write_text(json.dumps(results,indent=2,ensure_ascii=False)+'\n',encoding='utf-8')
          print(REPORT.read_text())
          PY
          python /tmp/privacy_analytics_probe.py

      - name: Validate privacy evidence (GA4 consent; RUM reported separately)
        run: |
          python - <<'PY'
          import json
          d=json.load(open('privacy-analytics-production.json'))
          assert set(d)=={'mobile-390-first','mobile-412-first','desktop-1280-first','mobile-390-second-fresh'}
          for label,row in d.items():
            assert row['before']['gtag'] is True, label
            assert row['before']['ga4Script'], label
            assert all(x not in row['before']['cookies'].lower() for x in ('_ga=', '_ga_')), label
            assert row['before']['bannerVisible'] is True, label
            assert row['afterBasic']['choice']=='denied', label
            assert all(x not in row['afterBasic']['cookies'].lower() for x in ('_ga=', '_ga_')), label
            assert row['afterGrant']['choice']=='granted', label
            assert row['ga4CollectRequestsAfterGrant'] >= 1, label
            assert row['overflow']['sw'] <= row['overflow']['cw'] + 6, label
            assert not row['errors'], label
          print('PASS: consent-aware GA4 browser behavior verified across mobile/desktop fresh sessions')
          PY

      - name: Upload production evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: privacy-analytics-production-evidence-${{ github.run_id }}
          path: |
            privacy-analytics-production.json
            cloudflare-rum-status.json
          retention-days: 14
