name: Privacy Analytics Production Verification

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/privacy-analytics-production.yml'
      - 'assets/js/main.js'
      - 'assets/js/analytics.js'
      - 'assets/js/site-main.js'
      - 'assets/js/tool-analytics.js'
      - 'privacy.html'
      - 'index.html'
      - 'tools.html'
      - 'categories.html'
      - 'guides.html'
      - 'whatsapp-link-generator.html'
      - 'tests/ga4-loader.test.cjs'

permissions:
  contents: read

env:
  GA4_MEASUREMENT_ID: 'G-YLPFKWSS12'
  GA4_QA_VERSION: '20261013-anonymous-consent-v1'

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Install browser and GA4 API dependencies
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          python -m pip install --disable-pip-version-check playwright google-auth requests
          python -m playwright install --with-deps chromium

      - name: Run source GA4 contract tests
        run: node --test tests/ga4-loader.test.cjs

      - name: Wait for the matching Pages deployment before live browser checks
        env:
          DEPLOY_SHA: ${{ github.sha }}
        run: |
          python - <<'PY'
          import os
          import time
          import requests

          base = 'https://nexusnovatools.com'
          deploy_sha = os.environ['DEPLOY_SHA']
          pages = [
              ('/', 'assets/js/main.js?v=20261013-anonymous-consent-v1'),
              ('/tools.html', 'assets/js/analytics.js?v=20261013-anonymous-consent-v1'),
              ('/categories.html', 'assets/js/analytics.js?v=20261013-anonymous-consent-v1'),
              ('/guides.html', 'assets/js/analytics.js?v=20261013-anonymous-consent-v1'),
              ('/whatsapp-link-generator.html', 'assets/js/analytics.js?v=20261013-anonymous-consent-v1'),
          ]
          headers = {'Cache-Control': 'no-cache', 'Pragma': 'no-cache'}
          session = requests.Session()
          failures = []
          for attempt in range(1, 13):
              failures = []
              for path, marker in pages:
                  try:
                      response = session.get(
                          base + path,
                          params={'nn_deploy_probe': deploy_sha},
                          headers=headers,
                          timeout=4,
                      )
                      if response.status_code != 200:
                          failures.append(f'{path}: HTTP {response.status_code}')
                      elif marker not in response.text:
                          failures.append(f'{path}: expected bundle marker not deployed yet')
                  except requests.RequestException as exc:
                      failures.append(f'{path}: {type(exc).__name__}')
              try:
                  main_js = session.get(
                      base + '/assets/js/main.js',
                      params={'v': '20261013-anonymous-consent-v1', 'nn_deploy_probe': deploy_sha},
                      headers=headers,
                      timeout=4,
                  )
                  if main_js.status_code != 200 or 'readSavedAnalyticsChoice' not in main_js.text:
                      failures.append('main.js: consent-aware bootstrap is not deployed yet')
                  standalone_js = session.get(
                      base + '/assets/js/analytics.js',
                      params={'nn_deploy_probe': deploy_sha},
                      headers=headers,
                      timeout=4,
                  )
                  if standalone_js.status_code != 200 or "analytics_detail_opt_in" not in standalone_js.text:
                      failures.append('analytics.js: consent-aware standalone loader is not deployed yet')
              except requests.RequestException as exc:
                  failures.append(f'JavaScript assets: {type(exc).__name__}')
              if not failures:
                  print(f'Pages deployment readiness confirmed for commit {deploy_sha} after attempt {attempt}; all 5 page markers and both analytics assets are live.')
                  break
              if attempt % 6 == 0:
                  print(f'Attempt {attempt}/60: waiting for Pages propagation: ' + '; '.join(failures))
              time.sleep(5)
          else:
              raise SystemExit('Matching Pages deployment did not become ready within about 7 minutes: ' + '; '.join(failures))
          PY

      - name: Verify fresh production visitors receive automatic GA4
        env:
          GA4_MEASUREMENT_ID: ${{ env.GA4_MEASUREMENT_ID }}
          GA4_PROPERTY_ID: ${{ vars.GA4_PROPERTY_ID }}
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
          QA_VERSION: ${{ env.GA4_QA_VERSION }}
        run: |
          cat > /tmp/ga4_production_probe.py <<'PY'
          import json
          import os
          import time
          from pathlib import Path
          from urllib.parse import parse_qs, urlparse
          import requests
          from google.oauth2 import service_account
          from google.auth.transport.requests import Request
          from playwright.sync_api import sync_playwright

          BASE_URL='https://nexusnovatools.com'
          MEASUREMENT_ID=os.environ['GA4_MEASUREMENT_ID']
          PROPERTY_ID=os.environ.get('GA4_PROPERTY_ID','').strip()
          REPORT=Path('ga4-production-verification.json')
          viewports=[('390x844',390,844),('412x915',412,915),('1280x800',1280,800)]
          pages=['/','/tools.html','/categories.html','/guides.html','/whatsapp-link-generator.html']
          results=[]

          def inspect_page(page, path, label, width, height):
              requests_seen=[]; errors=[]
              page.on('request', lambda req: requests_seen.append(req.url))
              page.on('pageerror', lambda err: errors.append(str(err)))
              page.on('console', lambda msg: errors.append('console:'+msg.text) if msg.type=='error' else None)
              page.goto(BASE_URL + path + '?ga4_qa=' + os.environ['QA_VERSION'] + '&ga4_view=' + label, wait_until='domcontentloaded', timeout=30000)
              page.wait_for_timeout(9000)
              info=page.evaluate('''() => {
                const args=(window.dataLayer||[]).map(x=>{
                  try {
                    if(Array.isArray(x)) return x;
                    if(x && typeof x.length==='number') return Array.from(x);
                  } catch(_) {}
                  return [];
                });
                const defaults=args.filter(x=>x[0]==='consent'&&x[1]==='default').map(x=>x[2]||{});
                const savedConsent=(()=>{try{return localStorage.getItem('nexusnova_analytics_consent_v1')||''}catch(_){return 'unavailable'}})();
                const visible=el=>{
                  if(!el)return false;
                  const style=getComputedStyle(el);
                  const rect=el.getBoundingClientRect();
                  return !el.hidden&&style.display!=='none'&&style.visibility!=='hidden'&&rect.width>0&&rect.height>0;
                };
                const banner=document.querySelector('#nexusnova-analytics-consent');
                const dialog=document.querySelector('#nexusnova-analytics-consent-dialog');
                const consentPanelVisible=visible(banner)||(!!dialog&&dialog.open&&visible(dialog));
                const allow=document.querySelector('[data-consent-allow]');
                const allowDialog=allow?allow.closest('dialog'):null;
                const allowButtonVisible=!!allow&&(!allowDialog||allowDialog.open)&&!allow.closest('[hidden]')&&visible(allow);
                return {
                  gtag:typeof window.gtag==='function',
                  gaScript:[...document.scripts].filter(s=>s.src.includes('googletagmanager.com/gtag/js')).map(s=>s.src),
                  gaConfigCount:args.filter(x=>x[0]==='config').length,
                  gaJsCount:args.filter(x=>x[0]==='js').length,
                  defaultAnalyticsStorage:defaults.length?defaults[defaults.length-1].analytics_storage:'',
                  savedConsent,
                  privacyChoiceAvailable:!!document.querySelector('.nn-consent-reopen, .nn-standalone-consent-open'),
                  consentPanelVisible,
                  allowButtonVisible,
                  consentTextVisible:consentPanelVisible&&document.body.innerText.includes('Allow detailed analytics'),
                  path:location.pathname,
                  title:document.title,
                  overflow:{sw:document.documentElement.scrollWidth,cw:document.documentElement.clientWidth}
                };
              }''')
              collect=[]
              for url in requests_seen:
                  if 'google-analytics.com/g/collect' not in url: continue
                  q=parse_qs(urlparse(url).query)
                  if q.get('tid',[''])[0]==MEASUREMENT_ID:
                      collect.append({'en':q.get('en',[''])[0],'dl':q.get('dl',[''])[0],'dt':q.get('dt',[''])[0],'gcs':q.get('gcs',[''])[0]})
              pageviews=[x for x in collect if x['en']=='page_view']
              row={'viewport':label,'path':path,'page':info,'ga4Collect':collect,'pageViews':pageviews,'errors':errors[:20]}
              row['success']=info['gtag'] and len(info['gaScript'])==1 and info['gaConfigCount']==1 and info['gaJsCount']==1 and info['defaultAnalyticsStorage']=='denied' and info['savedConsent']=='' and info['privacyChoiceAvailable'] and not info['consentPanelVisible'] and not info['allowButtonVisible'] and not info['consentTextVisible'] and any(x['gcs']=='G100' for x in pageviews) and info['path']==path and info['overflow']['sw']<=info['overflow']['cw']+6 and not errors
              return row

          with sync_playwright() as p:
              browser=p.chromium.launch(headless=True)
              for vp_label,w,h in viewports:
                  context=browser.new_context(viewport={'width':w,'height':h}, timezone_id='Asia/Karachi')
                  page=context.new_page()
                  for path in pages:
                      row=inspect_page(page,path,vp_label,w,h)
                      results.append(row)
                  context.close()

              context=browser.new_context(viewport={'width':1280,'height':800},timezone_id='Asia/Karachi')
              page=context.new_page()
              optin_requests=[];optin_errors=[]
              page.on('request',lambda req:optin_requests.append({'url':req.url,'method':req.method,'post_data':req.post_data or ''}))
              page.on('pageerror',lambda err:optin_errors.append(str(err)))
              page.on('console',lambda msg:optin_errors.append('console:'+msg.text) if msg.type=='error' else None)
              page.goto(BASE_URL+'/tools.html?ga4_qa='+os.environ['QA_VERSION']+'&ga4_view=explicit-opt-in',wait_until='domcontentloaded',timeout=30000)
              page.wait_for_timeout(9000)
              page.locator('.nn-standalone-consent-open').click(timeout=8000)
              page.locator('#nexusnova-analytics-consent-dialog [data-consent-allow]').click(timeout=8000)
              page.wait_for_timeout(8000)
              optin_info=page.evaluate('''() => {
                const args=(window.dataLayer||[]).map(x=>{
                  try { if(Array.isArray(x))return x; if(x&&typeof x.length==='number')return Array.from(x); } catch(_) {}
                  return [];
                });
                const updates=args.filter(x=>x[0]==='consent'&&x[1]==='update').map(x=>x[2]||{});
                const eventNames=args.filter(x=>x[0]==='event').map(x=>String(x[1]||''));
                let savedConsent='';
                try { savedConsent=localStorage.getItem('nexusnova_analytics_consent_v1')||''; } catch(_) {}
                return {
                  path:location.pathname,
                  title:document.title,
                  savedConsent,
                  gtag:typeof window.gtag==='function',
                  gaScriptCount:[...document.scripts].filter(s=>s.src.includes('googletagmanager.com/gtag/js')).length,
                  gaConfigCount:args.filter(x=>x[0]==='config').length,
                  consentUpdateGranted:updates.some(x=>x.analytics_storage==='granted'&&x.ad_storage==='denied'&&x.ad_user_data==='denied'&&x.ad_personalization==='denied'),
                  optInEventCommand:eventNames.includes('analytics_detail_opt_in'),
                  optInEventRequested:window.__nexusnovaOptInEventRequested===true,
                  optInEventCallback:window.__nexusnovaOptInEventCallback===true,
                  eventCommandNames:eventNames.slice(-20)
                };
              }''')
              optin_collect=[]
              def value_at(values,index):
                  if index < len(values): return values[index]
                  return values[-1] if values else ''
              def add_collect_events(q,method,source):
                  if q.get('tid',[''])[0]!=MEASUREMENT_ID: return
                  event_names=q.get('en',[''])
                  for event_index,event_name in enumerate(event_names):
                      optin_collect.append({
                          'en':event_name,
                          'dl':value_at(q.get('dl',[]),event_index),
                          'gcs':value_at(q.get('gcs',[]),event_index),
                          'method':method,
                          'source':source
                      })
              for request_record in optin_requests:
                  url=request_record['url']
                  if 'google-analytics.com/g/collect' not in url: continue
                  query_q=parse_qs(urlparse(url).query)
                  post_data=request_record.get('post_data','')
                  if post_data:
                      body_chunks=[chunk.strip() for chunk in post_data.splitlines() if chunk.strip()]
                      body_qs=[]
                      for chunk in body_chunks:
                          parsed=parse_qs(chunk)
                          if parsed.get('en') or parsed.get('tid'):
                              body_qs.append(parsed)
                      if not body_qs:
                          body_qs=[parse_qs(post_data)]
                      for body_q in body_qs:
                          merged=dict(query_q)
                          merged.update(body_q)
                          add_collect_events(merged,request_record.get('method','POST'),'body')
                  else:
                      add_collect_events(query_q,request_record.get('method','GET'),'query')
              consented_events=[x for x in optin_collect if x['en']=='analytics_detail_opt_in' and x['gcs']=='G101']
              optin_result={'page':optin_info,'ga4Collect':optin_collect,'consentedOptInEvents':consented_events,'errors':optin_errors[:20]}
              optin_result['success']=optin_info['path']=='/tools.html' and optin_info['savedConsent']=='granted' and optin_info['gtag'] and optin_info['gaScriptCount']==1 and optin_info['gaConfigCount']==1 and optin_info['consentUpdateGranted'] and optin_info['optInEventCommand'] and optin_info['optInEventCallback'] and len(consented_events)>=1 and not optin_errors
              context.close()
              browser.close()

          rt={'attempts':0,'success':False,'propertyIdPresent':bool(PROPERTY_ID),'serviceAccountPresent':bool(os.environ.get('GOOGLE_SERVICE_ACCOUNT_JSON')),'expectedEvent':'analytics_detail_opt_in','expectedPageTitle':optin_info['title'],'httpStatusCounts':{},'apiErrors':[]}
          if PROPERTY_ID and os.environ.get('GOOGLE_SERVICE_ACCOUNT_JSON'):
              creds=service_account.Credentials.from_service_account_info(json.loads(os.environ['GOOGLE_SERVICE_ACCOUNT_JSON']),scopes=['https://www.googleapis.com/auth/analytics.readonly'])
              creds.refresh(Request())
              endpoint=f'https://analyticsdata.googleapis.com/v1beta/properties/{PROPERTY_ID}:runRealtimeReport'
              # Filter to this exact event so common event names cannot crowd it out of the report.
              # Explicit opt-in is also checked in the browser network capture and event callback above.
              payload={'dimensions':[{'name':'eventName'}],'metrics':[{'name':'eventCount'}],'dimensionFilter':{'filter':{'fieldName':'eventName','stringFilter':{'matchType':'EXACT','value':'analytics_detail_opt_in'}}},'limit':5}
              deadline=time.time()+150
              while time.time()<deadline:
                  rt['attempts']+=1
                  response=requests.post(endpoint,headers={'Authorization':f'Bearer {creds.token}','Content-Type':'application/json'},json=payload,timeout=20)
                  status_key=str(response.status_code)
                  rt['lastHttpStatus']=response.status_code
                  rt['httpStatusCounts'][status_key]=rt['httpStatusCounts'].get(status_key,0)+1
                  if response.ok:
                      try:
                          data=response.json()
                      except ValueError:
                          rt['apiErrors'].append({'httpStatus':response.status_code,'message':'GA4 Data API returned a non-JSON success response'})
                          time.sleep(10)
                          continue
                      rt['rows']=data.get('rows',[])
                      rt['rowCount']=len(rt['rows'])
                      for r in rt['rows']:
                          dims=[x.get('value','') for x in r.get('dimensionValues',[])]
                          metrics=[x.get('value','') for x in r.get('metricValues',[])]
                          if len(dims)>=1 and dims[0]=='analytics_detail_opt_in':
                              rt['matchedEventCount']=metrics[0] if metrics else ''
                              rt['success']=True;break
                  else:
                      try:
                          error_data=response.json().get('error',{})
                          message=str(error_data.get('message','GA4 Data API request failed'))
                      except ValueError:
                          message='GA4 Data API returned a non-JSON error response'
                      rt['apiErrors'].append({'httpStatus':response.status_code,'message':message[:600]})
                  if rt['success']:break
                  time.sleep(10)
              if not rt.get('rows'):rt['rows']=[]

          report={'measurementId':MEASUREMENT_ID,'viewports':[x[0] for x in viewports],'browser':results,'explicitOptIn':optin_result,'realtime':rt}
          REPORT.write_text(json.dumps(report,indent=2,ensure_ascii=False)+'\n',encoding='utf-8')
          print(REPORT.read_text())
          assert all(x['success'] for x in results), 'Browser GA4 acceptance failed'
          assert optin_result['success'], 'Explicit GA4 opt-in did not produce a consented collect event'
          assert rt['success'], 'GA4 Realtime did not observe explicit opt-in in the existing property'
          PY
          python /tmp/ga4_production_probe.py

      - name: Upload real GA4 production evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: ga4-production-verification-${{ github.run_id }}
          path: ga4-production-verification.json
          retention-days: 14
