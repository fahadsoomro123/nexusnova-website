name: Privacy Analytics Production Verification

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/privacy-analytics-production.yml'
      - 'assets/js/main.js'
      - 'assets/js/analytics.js'
      - 'assets/js/site-main.js'
      - 'assets/js/tool-analytics.js'
      - 'privacy.html'
      - 'index.html'
      - 'tools.html'
      - 'categories.html'
      - 'guides.html'
      - 'whatsapp-link-generator.html'
      - 'tests/ga4-loader.test.cjs'

permissions:
  contents: read

env:
  GA4_MEASUREMENT_ID: 'G-YLPFKWSS12'
  GA4_QA_VERSION: '20261014-basic-pageview-consent-v2'

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Install browser and GA4 API dependencies
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          python -m pip install --disable-pip-version-check playwright google-auth requests
          python -m playwright install --with-deps chromium

      - name: Run source GA4 contract tests
        run: node --test tests/ga4-loader.test.cjs

      - name: Wait for the matching Pages deployment before live browser checks
        env:
          DEPLOY_SHA: ${{ github.sha }}
        run: |
          python - <<'PY'
          import os
          import time
          import requests

          base = 'https://nexusnovatools.com'
          deploy_sha = os.environ['DEPLOY_SHA']
          pages = [
              ('/', 'assets/js/main.js?v=20261014-basic-pageview-consent-v2'),
              ('/tools.html', 'assets/js/analytics.js?v=20261014-basic-pageview-consent-v2'),
              ('/categories.html', 'assets/js/analytics.js?v=20261014-basic-pageview-consent-v2'),
              ('/guides.html', 'assets/js/analytics.js?v=20261014-basic-pageview-consent-v2'),
              ('/whatsapp-link-generator.html', 'assets/js/analytics.js?v=20261014-basic-pageview-consent-v2'),
          ]
          headers = {'Cache-Control': 'no-cache', 'Pragma': 'no-cache'}
          session = requests.Session()
          failures = []
          for attempt in range(1, 13):
              failures = []
              for path, marker in pages:
                  try:
                      response = session.get(
                          base + path,
                          params={'nn_deploy_probe': deploy_sha},
                          headers=headers,
                          timeout=4,
                      )
                      if response.status_code != 200:
                          failures.append(f'{path}: HTTP {response.status_code}')
                      elif marker not in response.text:
                          failures.append(f'{path}: expected bundle marker not deployed yet')
                  except requests.RequestException as exc:
                      failures.append(f'{path}: {type(exc).__name__}')
              try:
                  main_js = session.get(
                      base + '/assets/js/main.js',
                      params={'v': '20261014-basic-pageview-consent-v2', 'nn_deploy_probe': deploy_sha},
                      headers=headers,
                      timeout=4,
                  )
                  if main_js.status_code != 200 or 'readSavedAnalyticsChoice' not in main_js.text:
                      failures.append('main.js: consent-aware bootstrap is not deployed yet')
                  standalone_js = session.get(
                      base + '/assets/js/analytics.js',
                      params={'nn_deploy_probe': deploy_sha},
                      headers=headers,
                      timeout=4,
                  )
                  if standalone_js.status_code != 200 or "analytics_detail_opt_in" not in standalone_js.text:
                      failures.append('analytics.js: consent-aware standalone loader is not deployed yet')
              except requests.RequestException as exc:
                  failures.append(f'JavaScript assets: {type(exc).__name__}')
              if not failures:
                  print(f'Pages deployment readiness confirmed for commit {deploy_sha} after attempt {attempt}; all 5 page markers and both analytics assets are live.')
                  break
              if attempt % 6 == 0:
                  print(f'Attempt {attempt}/60: waiting for Pages propagation: ' + '; '.join(failures))
              time.sleep(5)
          else:
              raise SystemExit('Matching Pages deployment did not become ready within about 7 minutes: ' + '; '.join(failures))
          PY

      - name: Verify fresh production visitors receive automatic GA4
        env:
          GA4_MEASUREMENT_ID: ${{ env.GA4_MEASUREMENT_ID }}
          GA4_PROPERTY_ID: ${{ vars.GA4_PROPERTY_ID }}
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
          QA_VERSION: ${{ env.GA4_QA_VERSION }}
        run: |
          cat > /tmp/ga4_production_probe.py <<'PY'
          import json
          import os
          import time
          from pathlib import Path
          from urllib.parse import parse_qs, urlparse
          import requests
          from google.oauth2 import service_account
          from google.auth.transport.requests import Request
          from playwright.sync_api import sync_playwright

          BASE_URL='https://nexusnovatools.com'
          MEASUREMENT_ID=os.environ['GA4_MEASUREMENT_ID']
          PROPERTY_ID=os.environ.get('GA4_PROPERTY_ID','').strip()
          REPORT=Path('ga4-production-verification.json')
          viewports=[('390x844',390,844),('412x915',412,915),('1280x800',1280,800)]
          pages=['/','/tools.html','/categories.html','/guides.html','/whatsapp-link-generator.html']
          results=[]

          def is_report_only_csp_notice(message):
              normalized=message.lower()
              return (
                  'violates the following report-only content security policy directive' in normalized
                  and 'no further action has been taken' in normalized
              )

          def record_console_message(message, errors, report_only_csp_notices):
              if message.type!='error':
                  return
              if is_report_only_csp_notice(message.text):
                  report_only_csp_notices.append(message.text[:600])
              else:
                  errors.append('console:'+message.text)

          def inspect_page(page, path, label, width, height):
              requests_seen=[]; errors=[]; report_only_csp_notices=[]
              page.on('request', lambda req: requests_seen.append(req.url))
              page.on('pageerror', lambda err: errors.append(str(err)))
              page.on('console', lambda msg: record_console_message(msg, errors, report_only_csp_notices))
              page.goto(BASE_URL + path + '?ga4_qa=' + os.environ['QA_VERSION'] + '&ga4_view=' + label, wait_until='domcontentloaded', timeout=30000)
              page.wait_for_timeout(9000)
              info=page.evaluate('''() => {
                const args=(window.dataLayer||[]).map(x=>{
                  try {
                    if(Array.isArray(x)) return x;
                    if(x && typeof x.length==='number') return Array.from(x);
                  } catch(_) {}
                  return [];
                });
                const defaults=args.filter(x=>x[0]==='consent'&&x[1]==='default').map(x=>x[2]||{});
                const savedConsent=(()=>{try{return localStorage.getItem('nexusnova_analytics_consent_v2')||''}catch(_){return 'unavailable'}})();
                const visible=el=>{
                  if(!el)return false;
                  const style=getComputedStyle(el);
                  const rect=el.getBoundingClientRect();
                  return !el.hidden&&style.display!=='none'&&style.visibility!=='hidden'&&rect.width>0&&rect.height>0;
                };
                const banner=document.querySelector('#nexusnova-analytics-consent, #nexusnova-analytics-consent-banner');
                const dialog=document.querySelector('#nexusnova-analytics-consent-dialog');
                const consentPanelVisible=visible(banner)||(!!dialog&&dialog.open&&visible(dialog));
                const allow=document.querySelector('[data-consent-allow]');
                const allowDialog=allow?allow.closest('dialog'):null;
                const allowButtonVisible=!!allow&&(!allowDialog||allowDialog.open)&&!allow.closest('[hidden]')&&visible(allow);
                return {
                  gtag:typeof window.gtag==='function',
                  gaScript:[...document.scripts].filter(s=>s.src.includes('googletagmanager.com/gtag/js')).map(s=>s.src),
                  gaConfigCount:args.filter(x=>x[0]==='config').length,
                  gaJsCount:args.filter(x=>x[0]==='js').length,
                  defaultAnalyticsStorage:defaults.length?defaults[defaults.length-1].analytics_storage:'',
                  regionSpecificDenied:defaults.some(x=>x.analytics_storage==='denied'&&Array.isArray(x.region)&&x.region.includes('GB')&&x.region.includes('CH')),
                  savedConsent,
                  privacyChoiceAvailable:!!document.querySelector('.nn-consent-reopen, .nn-standalone-consent-open'),
                  consentPanelVisible,
                  allowButtonVisible,
                  consentTextVisible:consentPanelVisible&&document.body.innerText.includes('Allow detailed analytics'),
                  path:location.pathname,
                  title:document.title,
                  overflow:{sw:document.documentElement.scrollWidth,cw:document.documentElement.clientWidth}
                };
              }''')
              collect=[]
              for url in requests_seen:
                  if 'google-analytics.com/g/collect' not in url: continue
                  q=parse_qs(urlparse(url).query)
                  if q.get('tid',[''])[0]==MEASUREMENT_ID:
                      collect.append({'en':q.get('en',[''])[0],'dl':q.get('dl',[''])[0],'dt':q.get('dt',[''])[0],'gcs':q.get('gcs',[''])[0]})
              pageviews=[x for x in collect if x['en']=='page_view']
              row={'viewport':label,'path':path,'page':info,'ga4Collect':collect,'pageViews':pageviews,'errors':errors[:20],'reportOnlyCspNotices':report_only_csp_notices[:10]}
              row['success']=info['gtag'] and len(info['gaScript'])==1 and info['gaConfigCount']==1 and info['gaJsCount']==1 and info['defaultAnalyticsStorage']=='granted' and info['regionSpecificDenied'] and info['savedConsent']=='' and info['privacyChoiceAvailable'] and info['consentPanelVisible'] and info['allowButtonVisible'] and info['consentTextVisible'] and any(x['gcs'] in ('G100','G101') for x in pageviews) and info['path']==path and info['overflow']['sw']<=info['overflow']['cw']+6 and not errors
              return row

          with sync_playwright() as p:
              browser=p.chromium.launch(headless=True)
              for vp_label,w,h in viewports:
                  context=browser.new_context(viewport={'width':w,'height':h}, timezone_id='Asia/Karachi')
                  page=context.new_page()
                  for path in pages:
                      row=inspect_page(page,path,vp_label,w,h)
                      results.append(row)
                  context.close()

              context=browser.new_context(viewport={'width':1280,'height':800},timezone_id='Asia/Karachi')
              page=context.new_page()
              optin_requests=[];optin_responses=[];optin_errors=[];optin_report_only_csp_notices=[]
              page.on('request',lambda req:optin_requests.append({'url':req.url,'method':req.method,'post_data':req.post_data or ''}))
              page.on('response',lambda response:optin_responses.append({'url':response.url,'method':response.request.method,'post_data':response.request.post_data or '','httpStatus':response.status}) if 'google-analytics.com/g/collect' in response.url else None)
              page.on('pageerror',lambda err:optin_errors.append(str(err)))
              page.on('console',lambda msg:record_console_message(msg,optin_errors,optin_report_only_csp_notices))
              page.goto(BASE_URL+'/tools.html?ga4_qa='+os.environ['QA_VERSION']+'&ga4_view=explicit-opt-in',wait_until='domcontentloaded',timeout=30000)
              page.wait_for_timeout(9000)
              page.locator('#nexusnova-analytics-consent-banner [data-consent-allow]').click(timeout=8000)
              page.wait_for_timeout(8000)
              optin_info=page.evaluate('''() => {
                const args=(window.dataLayer||[]).map(x=>{
                  try { if(Array.isArray(x))return x; if(x&&typeof x.length==='number')return Array.from(x); } catch(_) {}
                  return [];
                });
                const updates=args.filter(x=>x[0]==='consent'&&x[1]==='update').map(x=>x[2]||{});
                const eventCommands=args.filter(x=>x[0]==='event').map(x=>String(x[1]||''));
                let savedConsent='';
                try { savedConsent=localStorage.getItem('nexusnova_analytics_consent_v2')||''; } catch(_) {}
                return {
                  path:location.pathname,
                  title:document.title,
                  savedConsent,
                  gtag:typeof window.gtag==='function',
                  gaScriptCount:[...document.scripts].filter(s=>s.src.includes('googletagmanager.com/gtag/js')).length,
                  gaConfigCount:args.filter(x=>x[0]==='config').length,
                  consentUpdateGranted:updates.some(x=>x.analytics_storage==='granted'&&x.ad_storage==='denied'&&x.ad_user_data==='denied'&&x.ad_personalization==='denied'),
                  optInEventCommand:eventCommands.includes('analytics_detail_opt_in'),
                  optInEventRequested:window.__nexusnovaOptInEventRequested===true,
                  optInEventCallback:window.__nexusnovaOptInEventCallback===true,
                  eventCommandNames:eventCommands.slice(-20)
                };
              }''')
              optin_collect=[]
              def value_at(values,index):
                  if index < len(values): return values[index]
                  return values[-1] if values else ''
              def add_collect_events(q,method,source):
                  if q.get('tid',[''])[0]!=MEASUREMENT_ID: return
                  event_names=q.get('en',[''])
                  for event_index,event_name in enumerate(event_names):
                      optin_collect.append({
                          'en':event_name,
                          'dl':value_at(q.get('dl',[]),event_index),
                          'gcs':value_at(q.get('gcs',[]),event_index),
                          'method':method,
                          'source':source
                      })
              for request_record in optin_requests:
                  url=request_record['url']
                  if 'google-analytics.com/g/collect' not in url: continue
                  query_q=parse_qs(urlparse(url).query)
                  post_data=request_record.get('post_data','')
                  if post_data:
                      body_chunks=[chunk.strip() for chunk in post_data.splitlines() if chunk.strip()]
                      body_qs=[]
                      for chunk in body_chunks:
                          parsed=parse_qs(chunk)
                          if parsed.get('en') or parsed.get('tid'): body_qs.append(parsed)
                      if not body_qs: body_qs=[parse_qs(post_data)]
                      for body_q in body_qs:
                          merged=dict(query_q)
                          merged.update(body_q)
                          add_collect_events(merged,request_record.get('method','POST'),'body')
                  else:
                      add_collect_events(query_q,request_record.get('method','GET'),'query')
              consented_events=[x for x in optin_collect if x['en']=='analytics_detail_opt_in' and x['gcs']=='G101']
              optin_response_evidence=[]
              for response_record in optin_responses:
                  url=response_record['url']
                  query_q=parse_qs(urlparse(url).query)
                  post_data=response_record.get('post_data','')
                  body_chunks=[chunk.strip() for chunk in post_data.splitlines() if chunk.strip()]
                  body_qs=[]
                  for chunk in body_chunks:
                      parsed=parse_qs(chunk)
                      if parsed.get('en') or parsed.get('tid'): body_qs.append(parsed)
                  if not body_qs: body_qs=[parse_qs(post_data)] if post_data else [query_q]
                  for body_q in body_qs:
                      merged=dict(query_q)
                      merged.update(body_q)
                      if merged.get('tid',[''])[0]!=MEASUREMENT_ID: continue
                      for event_index,event_name in enumerate(merged.get('en',[''])):
                          optin_response_evidence.append({
                              'en':event_name,
                              'gcs':value_at(merged.get('gcs',[]),event_index),
                              'httpStatus':response_record['httpStatus'],
                              'method':response_record['method']
                          })
              consented_response_events=[x for x in optin_response_evidence if x['en']=='analytics_detail_opt_in' and x['gcs']=='G101' and isinstance(x['httpStatus'],int) and 200<=x['httpStatus']<300]
              optin_result={'page':optin_info,'ga4Collect':optin_collect,'consentedOptInEvents':consented_events,'ga4CollectResponses':optin_response_evidence,'consentedOptInResponses':consented_response_events,'errors':optin_errors[:20],'reportOnlyCspNotices':optin_report_only_csp_notices[:10]}
              optin_result['success']=optin_info['path']=='/tools.html' and optin_info['savedConsent']=='granted' and optin_info['gtag'] and optin_info['gaScriptCount']==1 and optin_info['gaConfigCount']==1 and optin_info['consentUpdateGranted'] and optin_info['optInEventCommand'] and optin_info['optInEventCallback'] and len(consented_events)>=1 and len(consented_response_events)>=1 and not optin_errors
              context.close()
              browser.close()

          expected_page_titles=sorted({row['page']['title'] for row in results if row.get('page',{}).get('title')} | {optin_info['title']})
          rt={'attempts':0,'success':False,'propertyIdPresent':bool(PROPERTY_ID),'serviceAccountPresent':bool(os.environ.get('GOOGLE_SERVICE_ACCOUNT_JSON')),'expectedEvent':'page_view','expectedMetric':'screenPageViews','expectedPageTitle':optin_info['title'],'expectedPageTitles':expected_page_titles,'observedPageTitlesWithViews':[],'httpStatusCounts':{},'apiErrors':[],'fatalApiError':False,'adminDataStreams':[],'adminDataStreamsHttpStatus':None,'adminDataStreamsError':'','historicalReport':{'attempted':False,'httpStatus':None,'rowCount':0,'eventNames':[],'matchedEventCount':None,'apiError':''}}
          if PROPERTY_ID and os.environ.get('GOOGLE_SERVICE_ACCOUNT_JSON'):
              creds=service_account.Credentials.from_service_account_info(json.loads(os.environ['GOOGLE_SERVICE_ACCOUNT_JSON']),scopes=['https://www.googleapis.com/auth/analytics.readonly'])
              creds.refresh(Request())
              auth_headers={'Authorization':f'Bearer {creds.token}','Content-Type':'application/json'}
              admin_endpoint=f'https://analyticsadmin.googleapis.com/v1beta/properties/{PROPERTY_ID}/dataStreams'
              try:
                  admin_response=requests.get(admin_endpoint,headers=auth_headers,params={'pageSize':200},timeout=20)
                  rt['adminDataStreamsHttpStatus']=admin_response.status_code
                  if admin_response.ok:
                      stream_data=admin_response.json()
                      for stream in stream_data.get('dataStreams',[]):
                          web_stream=stream.get('webStreamData',{})
                          stream_measurement_id=web_stream.get('measurementId','')
                          rt['adminDataStreams'].append({
                              'name':stream.get('name',''),
                              'displayName':stream.get('displayName',''),
                              'type':stream.get('type',''),
                              'measurementId':stream_measurement_id,
                              'matchesExpectedMeasurementId':stream_measurement_id==MEASUREMENT_ID
                          })
                  else:
                      rt['adminDataStreamsError']=admin_response.text[:600]
              except (requests.RequestException,ValueError) as exc:
                  rt['adminDataStreamsError']=f'{type(exc).__name__}: {str(exc)[:400]}'
              rt['dataStreamMeasurementMatch']=any(x['matchesExpectedMeasurementId'] for x in rt['adminDataStreams'])
              endpoint=f'https://analyticsdata.googleapis.com/v1beta/properties/{PROPERTY_ID}:runRealtimeReport'
              # GA4 Realtime rejects eventName + unifiedScreenName paired with eventCount.
              # The supported unifiedScreenName + screenPageViews pair verifies views for titles
              # visited by the browser probe; browser network evidence separately checks page_view.
              payload={'dimensions':[{'name':'unifiedScreenName'}],'metrics':[{'name':'screenPageViews'}],'limit':50}
              deadline=time.time()+150
              while time.time()<deadline:
                  rt['attempts']+=1
                  response=requests.post(endpoint,headers=auth_headers,json=payload,timeout=20)
                  status_key=str(response.status_code)
                  rt['lastHttpStatus']=response.status_code
                  rt['httpStatusCounts'][status_key]=rt['httpStatusCounts'].get(status_key,0)+1
                  if response.ok:
                      try:
                          data=response.json()
                      except ValueError:
                          rt['apiErrors'].append({'httpStatus':response.status_code,'message':'GA4 Data API returned a non-JSON success response'})
                          time.sleep(10)
                          continue
                      rt['rows']=data.get('rows',[])
                      rt['rowCount']=len(rt['rows'])
                      for r in rt['rows']:
                          dims=[x.get('value','') for x in r.get('dimensionValues',[])]
                          metrics=[x.get('value','') for x in r.get('metricValues',[])]
                          positive_count=False
                          if metrics:
                              try: positive_count=float(metrics[0])>0
                              except (TypeError,ValueError): positive_count=False
                          if len(dims)>=1:
                              page_title=dims[0]
                              rt['observedPageTitlesWithViews'].append(page_title)
                              if page_title in rt['expectedPageTitles'] and positive_count:
                                  rt['matchedPageViews']=metrics[0]
                                  rt['matchedPageTitle']=page_title
                                  rt['success']=True
                      rt['observedPageTitlesWithViews']=sorted(set(rt['observedPageTitlesWithViews']))
                  else:
                      try:
                          error_data=response.json().get('error',{})
                          message=str(error_data.get('message','GA4 Data API request failed'))
                      except ValueError:
                          message='GA4 Data API returned a non-JSON error response'
                      rt['apiErrors'].append({'httpStatus':response.status_code,'message':message[:600]})
                      if response.status_code not in (429,500,502,503,504):
                          rt['fatalApiError']=True
if rt['success'] or rt['fatalApiError']:break
                  time.sleep(10)
              if not rt.get('rows'):rt['rows']=[]

              if not rt['success']:
                  rt['historicalReport']['attempted']=True
                  report_endpoint=f'https://analyticsdata.googleapis.com/v1beta/properties/{PROPERTY_ID}:runReport'
                  report_payload={
                      'dateRanges':[{'startDate':'7daysAgo','endDate':'today'}],
                      'dimensions':[{'name':'eventName'}],
                      'metrics':[{'name':'eventCount'}],
                      'limit':100
                  }
                  try:
                      history_response=requests.post(report_endpoint,headers=auth_headers,json=report_payload,timeout=25)
                      rt['historicalReport']['httpStatus']=history_response.status_code
                      if history_response.ok:
                          history_data=history_response.json()
                          history_rows=history_data.get('rows',[])
                          rt['historicalReport']['rowCount']=len(history_rows)
                          for row in history_rows:
                              dims=[x.get('value','') for x in row.get('dimensionValues',[])]
                              metrics=[x.get('value','') for x in row.get('metricValues',[])]
                              if dims and dims[0]:
                                  rt['historicalReport']['eventNames'].append(dims[0])
                                  if dims[0]=='analytics_detail_opt_in':
                                      rt['historicalReport']['matchedEventCount']=metrics[0] if metrics else ''
                      else:
                          rt['historicalReport']['apiError']=history_response.text[:600]
                  except (requests.RequestException,ValueError) as exc:
                      rt['historicalReport']['apiError']=f'{type(exc).__name__}: {str(exc)[:400]}'

          report={'measurementId':MEASUREMENT_ID,'viewports':[x[0] for x in viewports],'browser':results,'explicitOptIn':optin_result,'realtime':rt}
          REPORT.write_text(json.dumps(report,indent=2,ensure_ascii=False)+'\n',encoding='utf-8')
          print(REPORT.read_text())
          assert all(x['success'] for x in results), 'Browser GA4 acceptance failed'
          assert optin_result['success'], 'Explicit GA4 opt-in did not produce a consented collect event'
          assert rt['success'], 'GA4 Realtime did not observe a page_view for a tested NexusNova page'
          PY
          python /tmp/ga4_production_probe.py

      - name: Upload real GA4 production evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: ga4-production-verification-${{ github.run_id }}
          path: ga4-production-verification.json
          retention-days: 14
