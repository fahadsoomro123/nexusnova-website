name: NexusNova Final Zero SEO Findings 20260904

on:
  push:
    branches:
      - seo/final-zero-findings-20260904
    paths:
      - '.github/workflows/seo-final-zero-findings-20260904.yml'

permissions:
  contents: write

jobs:
  close-findings:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Close remaining low SEO findings
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          def update(path, *, title=None, desc=None, section=None):
              p=Path(path)
              t=p.read_text(encoding='utf-8')
              if title:
                  import re
                  t=re.sub(r'<title>.*?</title>', f'<title>{title}</title>', t, count=1, flags=re.I|re.S)
              if desc:
                  import re, html
                  safe=html.escape(desc, quote=True)
                  t=re.sub(r'(<meta\s+name=["\']description["\'][^>]*content=["\'])([^"\']*)(["\'][^>]*>)', lambda m:m.group(1)+safe+m.group(3), t, count=1, flags=re.I)
                  t=re.sub(r'(<meta\s+name=["\']twitter:description["\'][^>]*content=["\'])([^"\']*)(["\'][^>]*>)', lambda m:m.group(1)+safe+m.group(3), t, count=1, flags=re.I)
              if section and 'data-final-seo-depth' not in t:
                  if '</main>' not in t:
                      raise SystemExit(f'missing main close: {path}')
                  t=t.replace('</main>', section+'</main>', 1)
              p.write_text(t, encoding='utf-8')

          update('labs.html', title='NexusNova Labs — Experimental Browser Tools')

          update('pulse.html',
              desc='See USD/PKR, international-derived gold, Pakistan fuel, selectable weather and recent USGS earthquake activity with source-specific timestamps.',
              section='''<section class="section" data-final-seo-depth><div class="container article"><h2>How to read a Pulse snapshot</h2><p>Pulse puts several reference signals on one screen, but the cards do not share one universal update clock. Read the source date or forecast time shown on each card before comparing values. A daily currency reference, a fuel price with an effective date, a weather forecast and a recent-earthquake feed can all be current within their own schedules while carrying different timestamps.</p><h2>Use the detailed pages when context matters</h2><p>The compact view is designed for a quick check, not for explaining why a market, forecast or event changed. Open the linked Currency, Gold, Fuel, Weather or Earthquake page when you need the source method, units, freshness notes or limitations. For financial, travel or safety-sensitive decisions, confirm the underlying official or primary source as well rather than treating a dashboard snapshot as a guarantee.</p></div></section>''')

          update('magic-drop.html', section='''<section class="section" data-final-seo-depth><div class="container article"><h2>A simple file-first workflow</h2><p>Magic Drop is useful when you know the file you have but not which utility to open. Select one supported file, review the detected type and size, then choose a suggested NexusNova tool for the next step. For images, the optional WebP export creates a separate copy, so keep the original until you have checked the new file visually and confirmed that its dimensions suit the destination.</p><h2>Privacy and browser limits</h2><p>The initial detection and supported image conversion happen in the browser. Very large files can still hit device memory limits, especially on older phones. PDF and text files are routed to matching tools rather than silently processed in a hidden chain, which keeps the next action visible and easier to verify.</p></div></section>''')

          update('xray.html', section='''<section class="section" data-final-seo-depth><div class="container article"><h2>Read the hostname from right to left</h2><p>When a link looks suspicious, focus on the actual hostname before the first slash. Extra words at the left can be subdomains, while the registered domain near the end is usually the important identity clue. X-Ray highlights structural patterns so that a long or encoded URL is easier to inspect, but it cannot confirm who controls a website.</p><h2>Pair structure checks with an official route</h2><p>If a link asks for a password, payment or recovery code, do not rely on a clean structure score alone. Open the service from a bookmark, trusted app or manually typed official address and compare the destination. This reduces the chance that a convincing phishing page with HTTPS and a normal-looking domain slips past a structure-only check.</p></div></section>''')

          update('widgets.html',
              desc='Embed a free NexusNova Pakistan Today widget with source-labelled USD/PKR, international-derived gold, fuel references and weather context.',
              section='''<section class="section" data-final-seo-depth><div class="container article"><h2>Embed the widget without breaking the host page</h2><p>The supplied iframe uses a responsive width and a fixed starting height, so place it inside a container that has enough horizontal space on phones and desktops. Keep the title attribute for accessibility and leave lazy loading enabled when the widget appears below the first screen. If your site applies a strict Content Security Policy, allow the NexusNova frame origin before publishing.</p><h2>Freshness stays with the source data</h2><p>Embedding the widget does not turn reference values into a real-time market feed. The frame displays the same published NexusNova datasets and source context used by the related LIVE pages. Visitors can follow the visible NexusNova attribution when they need fuller methodology, timestamps or limitations.</p><h2>When an embed is a good fit</h2><p>A compact widget works best as supporting information inside a relevant article, community page or dashboard. It should not be presented as an official government, exchange or financial feed. Keep enough surrounding context on the host page to explain why the snapshot is useful, and avoid covering the attribution or source labels with overlays.</p></div></section>''')
          PY

      - name: Run zero-finding static audit
        run: |
          python .github/scripts/site_quality_audit.py
          python - <<'PY'
          import json
          from pathlib import Path
          d=json.loads(Path('site-quality-report.json').read_text(encoding='utf-8'))
          if d.get('severe') or d.get('warnings'):
              print(Path('site-quality-report.txt').read_text(encoding='utf-8'))
              raise SystemExit('static findings remain')
          print('Static audit: zero severe, zero warnings')
          PY

      - name: Run deep and readiness audits
        run: |
          python .github/scripts/deep_site_audit.py
          python .github/scripts/adsense_readiness_audit.py
          python .github/scripts/production_readiness_audit.py

      - name: Commit final pages and remove helper
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'nexusnova-seo[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add labs.html pulse.html magic-drop.html xray.html widgets.html
          git rm .github/workflows/seo-final-zero-findings-20260904.yml
          git commit -m 'seo: close remaining live audit findings'
          git pull --rebase origin seo/final-zero-findings-20260904
          git push origin HEAD:seo/final-zero-findings-20260904
