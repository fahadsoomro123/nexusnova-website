name: OTA Video Direct Route Manifest

on:
  push:
    branches: [nexusnova-ota-public]
    paths:
      - '.github/workflows/ota-video-direct-route-manifest.yml'
      - 'ota/files/src/features/apps/app-screen.js'

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: nexusnova-ota-public
          fetch-depth: 0
      - name: Publish cumulative OTA5 manifest
        shell: bash
        run: |
          set -euo pipefail
          git pull --ff-only origin nexusnova-ota-public
          node <<'NODE'
          const fs=require('fs'),crypto=require('crypto');
          const mp='ota/manifest.json';
          const m=JSON.parse(fs.readFileSync(mp,'utf8'));
          if(m.schema!==2) throw new Error('Unexpected manifest schema');
          if(m.base!=='b8aa3393af20235fb70cf771f7bc7f84b05ebbf3') throw new Error('Installed 1.0.41 baseline mismatch');
          const path='src/features/apps/app-screen.js';
          const b=fs.readFileSync('ota/files/'+path);
          const rows=new Map((m.files||[]).map(x=>[x.path,x]));
          rows.set(path,{path,sha256:crypto.createHash('sha256').update(b).digest('hex'),size:b.length});
          for(const required of ['index.html','src/features/apps/premium-studio-suite.js','src/features/apps/ai-video-studio-flagship.js',path]){
            if(!rows.has(required)) throw new Error('Required OTA row missing: '+required);
            if(!fs.existsSync('ota/files/'+required)) throw new Error('Required OTA payload missing: '+required);
          }
          m.version=process.env.GITHUB_SHA;
          m.ota_badge='OTA5';
          m.ota_badge_status='ACTIVE';
          m.video_hotfix='direct-app-screen-route';
          m.source_commit='e6d9f3996fa5d0424dfd25c9f163b58cd8628bd1';
          m.files=[...rows.values()].sort((a,b)=>a.path.localeCompare(b.path));
          let total=0;
          for(const row of m.files){
            const p='ota/files/'+row.path,b=fs.readFileSync(p),h=crypto.createHash('sha256').update(b).digest('hex');
            if(b.length!==row.size||h!==row.sha256) throw new Error('OTA hash/size mismatch '+row.path+' actual='+b.length+' declared='+row.size);
            total+=b.length;
          }
          if(total>60*1024*1024) throw new Error('OTA too large');
          fs.writeFileSync(mp,JSON.stringify(m));
          console.log(JSON.stringify({version:m.version,files:m.files.length,total},null,2));
          NODE
          git config user.name 'NexusNova OTA Bot'
          git config user.email 'actions@users.noreply.github.com'
          git add ota/manifest.json
          git diff --cached --check
          git commit -m "ota(video): publish OTA5 direct route" || true
          git push origin HEAD:nexusnova-ota-public
