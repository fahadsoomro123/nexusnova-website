name: NexusNova Clean Site Audit Hotfix

on:
  push:
    branches: [clean-site-audit-hotfix-20260903]
    paths:
      - '.github/workflows/clean-site-hotfix-20260903.yml'

permissions:
  contents: write

jobs:
  hotfix:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          ref: clean-site-audit-hotfix-20260903
          fetch-depth: 0
      - name: Fix audit finding and title warnings
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          def edit(path, old, new):
              p=Path(path)
              text=p.read_text(encoding='utf-8')
              if old not in text:
                  raise SystemExit(f'Missing expected text in {path}')
              p.write_text(text.replace(old,new,1),encoding='utf-8')

          edit(
            'jpg-to-pdf.html',
            '<div class="notice"><strong>Need PNG or WebP?</strong> This converter intentionally accepts JPEG input only. Convert PNG with <a href="png-to-jpg.html">PNG to JPG</a> or use the <a href="image-converter.html">Image Converter</a> first, then create the PDF.</div>',
            '<div class="notice"><strong>Need PNG or WebP?</strong> This converter intentionally accepts JPEG input only. Convert PNG with <a href="png-to-jpg.html">PNG to JPG</a> first. For WebP, export or convert the image to JPEG with a trusted image editor, then return here. NexusNova does not link to a converter page that it does not actually provide.</div>'
          )
          edit(
            'image-to-text-ocr.html',
            '<title>English Image to Text OCR Online — Extract Text from Photos | NexusNova</title>',
            '<title>English Image to Text OCR | NexusNova Tools</title>'
          )
          edit(
            'invoice-maker.html',
            '<title>Simple Invoice Generator — Create & Print an Invoice Online | NexusNova</title>',
            '<title>Simple Invoice Generator | NexusNova Tools</title>'
          )
          Path('.github/workflows/clean-site-hotfix-20260903.yml').unlink(missing_ok=True)
          PY
      - name: Validate links and syntax
        shell: bash
        run: |
          python3 .github/scripts/site_quality_audit.py
          python3 - <<'PY'
          import json
          from pathlib import Path
          data=json.loads(Path('site-quality-report.json').read_text(encoding='utf-8'))
          severe=data.get('severe',[])
          warnings=data.get('warnings',[])
          print('Severe:', severe)
          print('Warnings:', warnings)
          if severe or warnings:
              raise SystemExit('Clean-site hotfix still has static audit findings')
          PY
          git diff --check
      - name: Commit hotfix branch
        shell: bash
        run: |
          git config user.name 'nexusnova-cleanup[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'fix: clear remaining site-quality findings [skip ci]'
          git push origin HEAD:clean-site-audit-hotfix-20260903
