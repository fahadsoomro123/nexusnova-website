name: AI Photo OTA 3 Finalize

on:
  push:
    branches: [nexusnova-ota-public]
    paths:
      - '.github/workflows/ai-photo-ota-3-finalize.yml'

permissions:
  contents: write

jobs:
  activate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out OTA branch
        uses: actions/checkout@v4
        with:
          ref: nexusnova-ota-public
          fetch-depth: 0

      - name: Build cumulative verified manifest
        shell: bash
        env:
          AI_SOURCE: b14335aba976d338f381919f507070731347a62d
          OTA_BASE: 8d1aaaee6f28b974a8c8b3ff213beb1318ec7405
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import hashlib, json, os
          from pathlib import Path

          manifest_path=Path('ota/manifest.json')
          manifest=json.loads(manifest_path.read_text(encoding='utf-8'))
          source=os.environ['AI_SOURCE']
          base=os.environ['OTA_BASE']
          assert manifest.get('schema') == 2
          assert manifest.get('base') == base
          assert manifest.get('travel_revision') == 3

          old={row['path']:dict(row) for row in manifest.get('files',[])}
          travel_paths=[p for p in old if p.startswith('assets/travel/') or p.startswith('src/features/apps/travel-') or p=='index.html']
          travel_before={p:old[p] for p in travel_paths}

          ai_paths=[
            'src/features/apps/ai-photo-studio-review.js',
            'src/features/apps/ai-photo-slider-focus-global-v25.js',
            'src/features/apps/ai-photo-mobile-workspace-clean-v1.js',
            'src/features/apps/ai-photo-template-photo-hydrator-v1.js',
            'src/features/apps/ai-photo-studio-ai.js',
            'src/features/apps/ai-photo-puter-generator.js',
          ]
          for rel in ai_paths:
            file_path=Path('ota/files')/rel
            data=file_path.read_bytes()
            old[rel]={'path':rel,'sha256':hashlib.sha256(data).hexdigest(),'size':len(data)}

          review=(Path('ota/files')/ai_paths[0]).read_text(encoding='utf-8')
          assert "badge.textContent='3'" in review
          assert "OTA 3 active" in review
          studio=(Path('ota/files')/'src/features/apps/ai-photo-studio-ai.js').read_text(encoding='utf-8')
          assert studio.count('puter.ai.txt2img') == 1

          manifest['version']=source
          manifest['proof_number']='3'
          manifest['ai_photo_source']=source
          manifest['files']=sorted(old.values(),key=lambda row:row['path'])

          for path,row in travel_before.items():
            current=next(x for x in manifest['files'] if x['path']==path)
            assert current == row, f'Travel entry changed: {path}'

          total=0
          for row in manifest['files']:
            data=(Path('ota/files')/row['path']).read_bytes()
            assert len(data)==row['size'], row['path']
            assert hashlib.sha256(data).hexdigest()==row['sha256'], row['path']
            total+=len(data)
          assert len(manifest['files']) < 2000
          assert total < 60*1024*1024
          manifest_path.write_text(json.dumps(manifest,separators=(',',':')),encoding='utf-8')
          print(f"PASS: manifest {manifest['version']} with {len(manifest['files'])} files / {total} bytes; Travel preserved; AI proof 3 ready")
          PY

      - name: Activate OTA 3 atomically
        shell: bash
        env:
          AI_SOURCE: b14335aba976d338f381919f507070731347a62d
        run: |
          set -euo pipefail
          git config user.name 'NexusNova OTA Bot'
          git config user.email 'actions@users.noreply.github.com'
          git add ota/manifest.json
          git rm .github/workflows/ai-photo-ota-3-finalize.yml
          git diff --cached --check
          git commit -m "release: activate AI Photo OTA 3 ${AI_SOURCE}"
          git push origin HEAD:nexusnova-ota-public
