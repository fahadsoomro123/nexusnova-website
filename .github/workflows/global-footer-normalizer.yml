name: NexusNova Global Footer Normalizer

on:
  push:
    branches: [nexusnova-clean-redesign]
    paths:
      - '**/*.html'
      - '.github/scripts/global_footer_normalizer.py'
      - '.github/workflows/global-footer-normalizer.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  normalize:
    if: ${{ !contains(github.event.head_commit.message, 'fix: normalize every footer') }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout staging
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: nexusnova-clean-redesign
          fetch-depth: 1

      - name: Run global footer normalization
        run: python .github/scripts/global_footer_normalizer.py

      - name: Commit normalized footers
        run: |
          git config user.name "NexusNova Footer Bot"
          git config user.email "41898282+nexusnova-footer-bot@users.noreply.github.com"
          git add -- '*.html'
          if git diff --cached --quiet; then
            echo "No footer changes required."
            exit 0
          fi
          git commit -m "fix: normalize every footer"
          git push origin HEAD:nexusnova-clean-redesign

      - name: Upload audit report
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: nexusnova-global-footer-audit
          path: quality-artifacts/global-footer-normalizer-report.txt
          if-no-files-found: warn
          retention-days: 14