name: OTA Public Manifest

# Public OTA manifests are published atomically by the nexusnova-app
# NexusNova OTA Web Release workflow. Keep this workflow manual-only so it
# cannot rewrite a verified app manifest after a public OTA publish.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  info:
    runs-on: ubuntu-latest
    steps:
      - name: OTA manifest ownership
        run: echo "Public OTA manifest is owned by the nexusnova-app release workflow."
