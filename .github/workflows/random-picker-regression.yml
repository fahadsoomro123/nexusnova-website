name: Random Picker Regression Tests

on:
  push:
    branches:
      - main
      - enhance/random-picker-multi-draw-20261014
    paths:
      - 'random-picker.html'
      - 'assets/js/random-picker.js'
      - 'tests/random-picker.test.cjs'
      - '.github/workflows/random-picker-regression.yml'
  pull_request:
    branches: [main]
    paths:
      - 'random-picker.html'
      - 'assets/js/random-picker.js'
      - 'tests/random-picker.test.cjs'
      - '.github/workflows/random-picker-regression.yml'

permissions:
  contents: read

concurrency:
  group: random-picker-regression-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  random-picker-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
      - name: Run Random Picker behavior and markup tests
        run: node --test tests/random-picker.test.cjs
