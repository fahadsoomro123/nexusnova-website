name: NexusNova One-Time Buffer-Only X Wiring

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/one-shot-buffer-env.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  wire-buffer-only:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Route social workflows through Buffer and remove paid X credentials
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          files = [
              Path('.github/workflows/traffic-autopilot.yml'),
              Path('.github/workflows/new-tool-social-launch.yml'),
          ]
          x_names = {
              'X_API_KEY', 'X_API_KEY_SECRET', 'X_ACCESS_TOKEN', 'X_ACCESS_TOKEN_SECRET'
          }
          for path in files:
              text = path.read_text(encoding='utf-8')
              lines = []
              for line in text.splitlines():
                  stripped = line.strip()
                  if any(stripped.startswith(name + ':') for name in x_names):
                      continue
                  lines.append(line)
              text = '\n'.join(lines) + '\n'

              if 'BUFFER_API_KEY:' not in text:
                  marker = '      TELEGRAM_CHANNEL_ID: ${{ vars.TELEGRAM_CHANNEL_ID }}\n'
                  insert = (
                      marker
                      + '      BUFFER_API_KEY: ${{ secrets.BUFFER_API_KEY }}\n'
                      + "      BUFFER_X_CHANNEL_ID: '6a987ad2065799be4676b541'\n"
                  )
                  if marker not in text:
                      raise SystemExit(f'{path}: Telegram env marker missing')
                  text = text.replace(marker, insert, 1)

              path.write_text(text, encoding='utf-8')
              print('Buffer-only X wiring:', path)
          PY

      - name: Verify paid X path is unavailable to social workflows
        shell: bash
        run: |
          python -m py_compile .github/scripts/buffer_publish.py
          python -m py_compile .github/scripts/distribute_social_growth.py
          for file in .github/workflows/traffic-autopilot.yml .github/workflows/new-tool-social-launch.yml; do
            grep -q 'BUFFER_API_KEY' "$file"
            grep -q 'BUFFER_X_CHANNEL_ID' "$file"
            if grep -Eq 'X_API_KEY|X_API_KEY_SECRET|X_ACCESS_TOKEN|X_ACCESS_TOKEN_SECRET' "$file"; then
              echo "Paid X credential still present in $file"
              exit 1
            fi
          done

      - name: Commit wiring and remove this one-shot workflow
        shell: bash
        run: |
          git config user.name 'nexusnova-buffer[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add .github/workflows/traffic-autopilot.yml .github/workflows/new-tool-social-launch.yml
          git rm .github/workflows/one-shot-buffer-env.yml
          git commit -m 'automation: make Buffer the only X publishing credential path'
          git pull --rebase origin main
          git push origin HEAD:main
