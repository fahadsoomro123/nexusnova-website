name: NexusNova Strict Manual Value Audit

on:
  push:
    branches: [main]
    paths:
      - '.github/scripts/manual_value_audit.py'
      - '.github/workflows/manual-value-audit.yml'
      - '**.html'
      - 'sitemap*.xml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Run strict value audit
        run: python .github/scripts/manual_value_audit.py
      - name: Publish summary
        shell: bash
        run: |
          cat manual-value-audit.md >> "$GITHUB_STEP_SUMMARY"
      - name: Upload evidence
        uses: actions/upload-artifact@v4
        with:
          name: manual-value-audit-${{ github.run_id }}
          path: |
            manual-value-audit.json
            manual-value-audit.md
          retention-days: 30
