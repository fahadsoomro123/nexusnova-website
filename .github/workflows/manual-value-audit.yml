name: NexusNova Strict Manual Value Audit

on:
  push:
    branches: [main]
    paths:
      - '.github/scripts/manual_value_audit.py'
      - '.github/workflows/manual-value-audit.yml'
      - '**.html'
      - 'sitemap*.xml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Run strict value audit
        run: python .github/scripts/manual_value_audit.py
      - name: Publish summary
        shell: bash
        run: |
          cat manual-value-audit.md >> "$GITHUB_STEP_SUMMARY"
      - name: Build reviewer source snapshot
        shell: bash
        run: |
          mkdir -p reviewer-source/articles reviewer-source/guides reviewer-source/tech reviewer-source/assets/js reviewer-source/assets/css
          cp -f -- *.html reviewer-source/ 2>/dev/null || true
          cp -f -- articles/*.html reviewer-source/articles/ 2>/dev/null || true
          cp -f -- guides/*.html reviewer-source/guides/ 2>/dev/null || true
          cp -f -- tech/*.html reviewer-source/tech/ 2>/dev/null || true
          cp -f -- assets/js/*.js reviewer-source/assets/js/ 2>/dev/null || true
          cp -f -- assets/css/*.css reviewer-source/assets/css/ 2>/dev/null || true
          cp -f -- sitemap*.xml robots.txt ads.txt reviewer-source/ 2>/dev/null || true
      - name: Upload evidence
        uses: actions/upload-artifact@v4
        with:
          name: manual-value-audit-${{ github.run_id }}
          path: |
            manual-value-audit.json
            manual-value-audit.md
            reviewer-source/
          retention-days: 30
