name: NexusNova One-Shot High-Intent Social Fix

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/one-shot-high-intent-social.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fix-and-push:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TELEGRAM_CHANNEL_ID: ${{ vars.TELEGRAM_CHANNEL_ID }}
      BUFFER_API_KEY: ${{ secrets.BUFFER_API_KEY }}
      BUFFER_X_CHANNEL_ID: '6a987ad2065799be4676b541'
      FACEBOOK_PAGE_ID: ${{ vars.FACEBOOK_PAGE_ID }}
      FACEBOOK_PAGE_ACCESS_TOKEN: ${{ secrets.FACEBOOK_PAGE_ACCESS_TOKEN }}
      SOCIAL_WEBHOOK_URL: ${{ secrets.SOCIAL_WEBHOOK_URL }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install social dependencies
        run: python -m pip install --disable-pip-version-check pillow requests

      - name: Harden Social Growth candidate selection
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          path = Path('.github/scripts/social_growth_engine.py')
          text = path.read_text(encoding='utf-8')

          if 'GENERIC_SOCIAL_PATHS' not in text:
              text = text.replace(
                  'FORMATS = ["quick_tip", "problem_solution", "tool_demo", "bookmark_worthy"]\n',
                  'FORMATS = ["quick_tip", "problem_solution", "tool_demo", "bookmark_worthy"]\n'
                  'GENERIC_SOCIAL_PATHS = {"/articles.html", "/tools.html", "/popular-tools.html", "/categories.html"}\n',
                  1,
              )

          old = '    path = parts.path or "/"\n    return urlunsplit(("https", "nexusnovatools.com", path, "", ""))\n'
          new = '    path = parts.path or "/"\n    if path == "/index.html":\n        path = "/"\n    return urlunsplit(("https", "nexusnovatools.com", path, "", ""))\n'
          if old in text:
              text = text.replace(old, new, 1)

          marker = '\n\ndef add_candidate(pool: dict[str, dict], url: str, title: str, summary: str, source: str, score: float, reason: str) -> None:\n'
          if 'def is_dedicated_tool_url' not in text:
              helper = '''\n\ndef is_dedicated_tool_url(url: str) -> bool:\n    path = urlsplit(url).path or "/"\n    if path in GENERIC_SOCIAL_PATHS or path == "/":\n        return False\n    rel = path.lstrip("/")\n    if not rel.endswith(".html"):\n        return False\n    target = ROOT / rel\n    if not target.exists() or not target.is_file():\n        return False\n    try:\n        page = target.read_text(encoding="utf-8", errors="ignore")\n    except Exception:\n        return False\n    return "WebApplication" in page and "tool-card" in page\n'''
              if marker not in text:
                  raise SystemExit('add_candidate marker missing')
              text = text.replace(marker, helper + marker, 1)

          old = '    if any(part in urlsplit(url).path.lower() for part in EXCLUDED_PATH_PARTS):\n        return\n    row = pool.get(url)\n'
          new = '    candidate_path = urlsplit(url).path or "/"\n    if any(part in candidate_path.lower() for part in EXCLUDED_PATH_PARTS):\n        return\n    if candidate_path in GENERIC_SOCIAL_PATHS:\n        return\n    if is_dedicated_tool_url(url):\n        score = float(score) + 18\n        reason = f"{reason}; dedicated interactive tool bonus"\n    row = pool.get(url)\n'
          if old in text:
              text = text.replace(old, new, 1)

          old = '        score = 18 + min(26, sessions * 1.2) + min(14, engagement * 14)\n        add_candidate(\n            pool,\n            path,\n            "",\n            "",\n            "ga4_engagement",\n            score,\n            f"GA4 landing-page signal: {round(sessions, 1)} sessions / {round(engaged, 1)} engaged",\n        )\n'
          new = '        score = 18 + min(26, sessions * 1.2) + min(14, engagement * 14)\n        signal_reason = f"GA4 landing-page signal: {round(sessions, 1)} sessions / {round(engaged, 1)} engaged"\n        if engaged <= 0:\n            penalty = 70 if sessions >= 2 else 35\n            score -= penalty\n            signal_reason += f"; zero-engagement penalty -{penalty}"\n        add_candidate(\n            pool,\n            path,\n            "",\n            "",\n            "ga4_engagement",\n            score,\n            signal_reason,\n        )\n'
          if old in text:
              text = text.replace(old, new, 1)

          path.write_text(text, encoding='utf-8')
          PY

          python -m py_compile .github/scripts/social_growth_engine.py
          grep -q 'GENERIC_SOCIAL_PATHS' .github/scripts/social_growth_engine.py
          grep -q 'zero-engagement penalty' .github/scripts/social_growth_engine.py
          grep -q 'dedicated interactive tool bonus' .github/scripts/social_growth_engine.py

      - name: Commit autopilot selection fix
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'nexusnova-social[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add .github/scripts/social_growth_engine.py
          git commit -m 'fix: prioritize high-intent social landing pages'
          git pull --rebase origin main
          git push origin HEAD:main

      - name: Build targeted Steam Playtime traffic campaign
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json, sys
          from datetime import datetime, timezone
          from pathlib import Path

          sys.path.insert(0, str(Path('.github/scripts').resolve()))
          import social_growth_engine as s

          url = 'https://nexusnovatools.com/steam-playtime-calculator.html'
          meta = s.local_html_metadata(url)
          if not meta:
              raise SystemExit('Steam Playtime Calculator metadata unavailable')
          title, summary = meta
          item = {
              'url': url,
              'title': title,
              'summary': summary or 'Estimate Steam playtime, daily averages and yearly gaming time in your browser.',
          }
          fmt = 'problem_solution'
          copy = s.build_copy(item, fmt)
          campaign = 'social_growth_boost_20260904_steam_playtime'
          s.render_card(s.FEED_IMAGE, 1080, 1350, item, copy)
          s.render_card(s.VERTICAL_IMAGE, 1080, 1920, item, copy)
          payload = {
              'kind': 'social_growth',
              'title': title,
              'summary': item['summary'],
              'url': url,
              'hook': copy['hook'],
              'cta': copy['cta'],
              'format': fmt,
              'campaign': campaign,
              'utm_content': 'targeted_boost',
              'hashtags': copy['hashtags'],
              'platform_copy': copy['platform_copy'],
              'instagram_image': f'{s.SITE}/assets/generated/social-growth-feed.jpg',
              'vertical_image': f'{s.SITE}/assets/generated/social-growth-vertical.jpg',
              'selection_score': 999,
              'selection_reasons': ['manual approved high-intent traffic push'],
              'generated_at': datetime.now(timezone.utc).isoformat().replace('+00:00', 'Z'),
          }
          Path('social-growth-publish.json').write_text(json.dumps(payload, indent=2, ensure_ascii=False) + '\n', encoding='utf-8')
          print(json.dumps({'campaign': campaign, 'url': url, 'title': title}, indent=2))
          PY

      - name: Publish targeted HD social creatives
        shell: bash
        run: |
          set -euo pipefail
          git add assets/generated/social-growth-feed.jpg assets/generated/social-growth-vertical.jpg
          if ! git diff --cached --quiet; then
            git commit -m 'social: targeted Steam Playtime campaign creative'
            git pull --rebase origin main
            git push origin HEAD:main
          fi

      - name: Distribute targeted campaign now
        shell: bash
        run: |
          set -euo pipefail
          python .github/scripts/distribute_social_growth.py
          python - <<'PY'
          import json
          r=json.load(open('social-distribution-report.json', encoding='utf-8'))
          print(json.dumps(r, indent=2))
          if int(r.get('successful_destinations', 0)) < 3:
              raise SystemExit('Targeted social push reached fewer than 3 destinations')
          PY

      - name: Record successful targeted campaign
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          from datetime import datetime, timezone
          from pathlib import Path
          report=json.load(open('social-distribution-report.json', encoding='utf-8'))
          payload=json.load(open('social-growth-publish.json', encoding='utf-8'))
          p=Path('assets/data/social-growth-history.json')
          doc={'version':2,'posts':[]}
          if p.exists():
              try: doc=json.loads(p.read_text(encoding='utf-8'))
              except Exception: pass
          posts=doc.get('posts') if isinstance(doc,dict) else []
          if not isinstance(posts,list): posts=[]
          posts.append({
              'generated_at': datetime.now(timezone.utc).isoformat().replace('+00:00','Z'),
              'campaign': payload['campaign'],
              'url': payload['url'],
              'title': payload['title'],
              'format': payload['format'],
              'source': 'approved_targeted_boost',
              'selection_score': 999,
              'successful_destinations': report.get('successful_destinations',0),
          })
          p.write_text(json.dumps({'version':2,'posts':posts[-120:]}, indent=2, ensure_ascii=False)+'\n', encoding='utf-8')
          PY
          git add assets/data/social-growth-history.json
          if ! git diff --cached --quiet; then
            git commit -m 'social: record targeted traffic push'
            git pull --rebase origin main
            git push origin HEAD:main
          fi

      - name: Publish summary
        if: always()
        run: |
          echo '## High-Intent Social Fix + Traffic Push' >> "$GITHUB_STEP_SUMMARY"
          if [ -f social-distribution-report.json ]; then
            echo '```json' >> "$GITHUB_STEP_SUMMARY"
            cat social-distribution-report.json >> "$GITHUB_STEP_SUMMARY"
            echo '```' >> "$GITHUB_STEP_SUMMARY"
          fi
