name: Universe Atlas Smoke Check

on:
  push:
    paths:
      - "universe-atlas.html"
      - ".github/workflows/universe-atlas-smoke.yml"
  pull_request:
    paths:
      - "universe-atlas.html"
      - ".github/workflows/universe-atlas-smoke.yml"

jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Extract and syntax-check page scripts
        run: |
          node - <<'NODE'
          const fs = require('fs');
          const html = fs.readFileSync('universe-atlas.html','utf8');
                    if (!html.includes('gea.esac.esa.int/tap-server/tap/sync')) throw new Error('Gaia TAP hook missing');
          if (!html.includes('exoplanetarchive.ipac.caltech.edu/TAP/sync')) throw new Error('NASA Exoplanet TAP hook missing');
          const scripts = [];
          let cursor = 0;
          while (true) {
            const open = html.indexOf('<script', cursor);
            if (open < 0) break;
            const closeOpen = html.indexOf('>', open);
            const closeScript = html.indexOf('</script>', closeOpen + 1);
            if (closeOpen < 0 || closeScript < 0) break;
            const body = html.slice(closeOpen + 1, closeScript);
            if (body.trim()) scripts.push(body);
            cursor = closeScript + 9;
          }
          fs.writeFileSync('/tmp/universe-atlas-embedded.js', scripts.join('\n\n'));
          console.log('Embedded script blocks:', scripts.length);
          NODE
          node --check /tmp/universe-atlas-embedded.js
      - name: Required UI/data markers
        run: |
          grep -q 'id="gaia"' universe-atlas.html
          grep -q 'id="exo"' universe-atlas.html
          grep -q "SOLAR SYSTEM" universe-atlas.html
