name: NexusNova Live Production Audit

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/live-production-audit.yml'
      - '.github/workflows/production-smoke.yml'
      - 'index.html'
      - 'assets/js/main.js'
      - 'robots.txt'
      - 'robots.txt'
  push:
    branches: [main]
    paths:
      - '.github/workflows/live-production-audit.yml'
      - '.github/workflows/production-smoke.yml'
      - 'index.html'
      - 'assets/js/main.js'
  schedule:
    - cron: '20 3 * * 1'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  live-evidence:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Audit live canonical, index consolidation and host headers
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          import re
          import socket
          import time
          import urllib.error
          import urllib.request
          from pathlib import Path

          HOME='https://nexusnovatools.com/'
          INDEX='https://nexusnovatools.com/index.html'
          UA='NexusNovaProductionAudit/1.2'

          def request(url, attempts=4):
              req=urllib.request.Request(url, headers={
                  'User-Agent': UA,
                  'Cache-Control': 'no-cache, no-store, max-age=0',
                  'Accept': 'text/html,*/*;q=0.8',
              })
              for attempt in range(attempts):
                  try:
                      with urllib.request.urlopen(req, timeout=25) as resp:
                          return {
                              'status': resp.status,
                              'url': resp.geturl(),
                              'headers': {k.lower(): v for k,v in resp.headers.items()},
                              'body': resp.read().decode('utf-8','replace'),
                          }
                  except urllib.error.HTTPError as exc:
                      return {
                          'status': exc.code,
                          'url': exc.geturl(),
                          'headers': {k.lower(): v for k,v in exc.headers.items()},
                          'body': exc.read().decode('utf-8','replace'),
                      }
                  except (urllib.error.URLError, TimeoutError, socket.gaierror) as exc:
                      reason=getattr(exc,'reason',exc)
                      if attempt + 1 < attempts:
                          delay=min(2 ** (attempt + 1), 12)
                          print(f'Host request failed ({type(reason).__name__}); retry {attempt+1}/{attempts-1} in {delay}s.')
                          time.sleep(delay)
                          continue
                      return {
                          'status': 0, 'url': url, 'headers': {}, 'body': '',
                          'network_error': f'{type(reason).__name__}: {str(reason)[:180]}',
                      }

          home=request(HOME)
          index=request(INDEX)
          canonical=re.search(r'<link\s+rel=["\']canonical["\']\s+href=["\']([^"\']+)', home['body'], re.I)
          canonical_value=canonical.group(1).strip() if canonical else ''
          index_canonical=re.search(r'<link\s+rel=["\']canonical["\']\s+href=["\']([^"\']+)', index['body'], re.I)
          index_canonical_value=index_canonical.group(1).strip() if index_canonical else ''
          client_redirect_marker='data-index-canonical-redirect' in index['body']

          headers=home['headers']
          security={
              'strict-transport-security': headers.get('strict-transport-security',''),
              'content-security-policy': headers.get('content-security-policy',''),
              'x-content-type-options': headers.get('x-content-type-options',''),
              'referrer-policy': headers.get('referrer-policy',''),
              'permissions-policy': headers.get('permissions-policy',''),
              'x-frame-options': headers.get('x-frame-options',''),
          }

          required={
              'https_home_200': home['status'] == 200,
              'home_canonical_root': canonical_value == HOME,
              'index_resolves_successfully': 200 <= index['status'] < 400,
              'index_canonical_root': index_canonical_value == HOME,
          }
          host_advisories={
              'index_http_redirect_to_root': index['url'] == HOME,
              'index_client_redirect_present': client_redirect_marker,
              'hsts_present': bool(security['strict-transport-security']),
              'csp_present': bool(security['content-security-policy']),
              'x_content_type_options_present': bool(security['x-content-type-options']),
              'referrer_policy_present': bool(security['referrer-policy']),
              'permissions_policy_present': bool(security['permissions-policy']),
              'frame_protection_present': bool(security['x-frame-options']) or 'frame-ancestors' in security['content-security-policy'].lower(),
          }

          report={
              'home': {'status':home['status'],'effective_url':home['url'],'canonical':canonical_value},
              'index_html': {
                  'status':index['status'],
                  'effective_url':index['url'],
                  'canonical':index_canonical_value,
                  'client_redirect_marker':client_redirect_marker,
              },
              'network_errors': {
                  'home': home.get('network_error'),
                  'index_html': index.get('network_error'),
              },
              'security_headers': security,
              'required_checks': required,
              'host_advisories': host_advisories,
              'hosting_context': 'Public site is served through GitHub Pages with a custom domain. Repository HTML cannot create HSTS or a true server-side /index.html -> / redirect; those require an edge/proxy or different host configuration.',
              'notes': [
                  'Network errors are retried with a bounded delay; unresolved errors remain failures.',
                  'Missing host-managed headers are reported as advisories, not disguised as application-code failures.',
                  'CSP/X-Frame-Options are not globally required because widget-pakistan-today.html is intentionally embeddable.',
                  'The canonical root remains a required SEO signal. A client-side /index.html consolidation marker is also reported when deployed.',
              ],
          }
          Path('live-production-audit.json').write_text(json.dumps(report,indent=2)+'\n',encoding='utf-8')
          print(json.dumps(report,indent=2))
          failed=[k for k,v in required.items() if not v]
          if failed:
              raise SystemExit('Live production required check(s) failed: '+', '.join(failed))
          PY

      - name: Install Google auth for PageSpeed API fallback
        if: always()
        shell: bash
        run: python -m pip install --disable-pip-version-check --quiet google-auth

      - name: Query PageSpeed for field and lab evidence
        if: always()
        shell: bash
        env:
          PAGESPEED_API_KEY: ${{ secrets.PAGESPEED_API_KEY }}
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
        run: |
          python - <<'PY'
          import json
          import os
          import time
          import urllib.error
          import urllib.parse
          import urllib.request
          from pathlib import Path
          from google.auth.transport.requests import Request
          from google.oauth2 import service_account

          target='https://nexusnovatools.com/'
          out={'target':target,'source':'Google PageSpeed Insights API v5','strategies':{}}
          api_key=os.environ.get('PAGESPEED_API_KEY','').strip()
          auth_headers={}
          auth_mode='project-key' if api_key else 'not-configured'

          try:
              if not api_key:
                  raw=os.environ.get('GOOGLE_SERVICE_ACCOUNT_JSON','').strip()
                  if not raw:
                      raise RuntimeError('No PageSpeed API key or Google service-account JSON is configured in Actions secrets.')
                  account=json.loads(raw)
                  credentials=service_account.Credentials.from_service_account_info(account,scopes=['openid'])
                  credentials.refresh(Request())
                  if not credentials.token:
                      raise RuntimeError('Google OAuth token exchange returned no access token.')
                  auth_headers={'Authorization':'Bearer '+credentials.token}
                  auth_mode='service-account-oauth'
              out['auth_mode']=auth_mode
          except Exception as exc:
              out['auth_mode']='unavailable'
              out['credential_error']=f'{type(exc).__name__}: {str(exc)[:180]}'
              for strategy in ('mobile','desktop'):
                  out['strategies'][strategy]={
                      'available':False,
                      'error':'PageSpeed authentication could not be initialized.',
                      'field_source':'unavailable',
                  }

          if out['auth_mode'] != 'unavailable':
              for strategy in ('mobile','desktop'):
                  params=[
                      ('url',target),
                      ('strategy',strategy),
                      ('category','performance'),
                      ('category','seo'),
                  ]
                  if api_key:
                      params.append(('key',api_key))
                  url='https://www.googleapis.com/pagespeedonline/v5/runPagespeed?'+urllib.parse.urlencode(params)
                  for attempt in range(3):
                      try:
                          req=urllib.request.Request(url,headers={'User-Agent':'NexusNovaProductionAudit/1.2','Accept':'application/json',**auth_headers})
                          with urllib.request.urlopen(req,timeout=90) as resp:
                              data=json.loads(resp.read().decode('utf-8'))
                          field=data.get('loadingExperience') or {}
                          origin=data.get('originLoadingExperience') or {}
                          field_source='url' if field.get('metrics') else ('origin' if origin.get('metrics') else 'none')
                          selected=field if field.get('metrics') else origin
                          metrics=selected.get('metrics') or {}
                          def pct(key):
                              item=metrics.get(key) or {}
                              return item.get('percentile')
                          lighthouse=data.get('lighthouseResult') or {}
                          audits=lighthouse.get('audits') or {}
                          categories=lighthouse.get('categories') or {}
                          score=(categories.get('performance') or {}).get('score')
                          out['strategies'][strategy]={
                              'available':True,
                              'field_source':field_source,
                              'field_overall_category':selected.get('overall_category'),
                              'field_lcp_ms':pct('LARGEST_CONTENTFUL_PAINT_MS'),
                              'field_inp_ms':pct('INTERACTION_TO_NEXT_PAINT'),
                              'field_cls':(pct('CUMULATIVE_LAYOUT_SHIFT_SCORE')/100 if isinstance(pct('CUMULATIVE_LAYOUT_SHIFT_SCORE'),(int,float)) else None),
                              'lab_performance_score':round(score*100) if isinstance(score,(int,float)) else None,
                              'lab_lcp_ms':(audits.get('largest-contentful-paint') or {}).get('numericValue'),
                              'lab_cls':(audits.get('cumulative-layout-shift') or {}).get('numericValue'),
                              'lab_tbt_ms':(audits.get('total-blocking-time') or {}).get('numericValue'),
                          }
                          break
                      except urllib.error.HTTPError as exc:
                          if exc.code == 429 and attempt < 2:
                              delay=30 * (2 ** attempt)
                              print(f'PageSpeed {strategy} rate-limited (HTTP 429); retrying after {delay}s, attempt {attempt+2}/3.')
                              time.sleep(delay)
                              continue
                          detail=''
                          try:
                              body=json.loads(exc.read().decode('utf-8','replace'))
                              detail=str((body.get('error') or {}).get('message',''))[:160]
                          except Exception:
                              detail=''
                          out['strategies'][strategy]={
                              'available':False,
                              'error':f'HTTPError: HTTP {exc.code}' + (': '+detail if detail else ''),
                              'field_source':'unavailable',
                          }
                          break
                      except (urllib.error.URLError, TimeoutError) as exc:
                          if attempt < 2:
                              delay=min(3 * (2 ** attempt),12)
                              print(f'PageSpeed {strategy} network failure; retrying in {delay}s, attempt {attempt+2}/3.')
                              time.sleep(delay)
                              continue
                          reason=getattr(exc,'reason',exc)
                          out['strategies'][strategy]={
                              'available':False,
                              'error':f'{type(reason).__name__}: {str(reason)[:160]}',
                              'field_source':'unavailable',
                          }
                          break
                      except Exception as exc:
                          out['strategies'][strategy]={
                              'available':False,
                              'error':f'{type(exc).__name__}: {str(exc)[:160]}',
                              'field_source':'unavailable',
                          }
                          break

          Path('pagespeed-evidence.json').write_text(json.dumps(out,indent=2)+'\n',encoding='utf-8')
          print(json.dumps(out,indent=2))
          required_metrics=('lab_performance_score','lab_lcp_ms','lab_cls','lab_tbt_ms')
          failed=[
              strategy for strategy,result in out['strategies'].items()
              if not result.get('available') or any(result.get(field) is None for field in required_metrics)
          ]
          if failed:
              raise SystemExit('PageSpeed live lab evidence incomplete for: '+', '.join(failed))
          PY

      - name: Publish evidence summary
        if: always()
        shell: bash
        run: |
          echo '## NexusNova Live Production Evidence' >> "$GITHUB_STEP_SUMMARY"
          echo '### Canonical + hosting/security evidence' >> "$GITHUB_STEP_SUMMARY"
          echo '```json' >> "$GITHUB_STEP_SUMMARY"
          cat live-production-audit.json 2>/dev/null || echo '{"status":"not produced"}'
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          echo '### PageSpeed / CrUX evidence' >> "$GITHUB_STEP_SUMMARY"
          echo '```json' >> "$GITHUB_STEP_SUMMARY"
          cat pagespeed-evidence.json 2>/dev/null || echo '{"status":"not produced"}'
          echo '```' >> "$GITHUB_STEP_SUMMARY"

      - name: Upload live evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: nexusnova-live-production-audit-${{ github.run_id }}
          path: |
            live-production-audit.json
            pagespeed-evidence.json
          if-no-files-found: warn
          retention-days: 30
