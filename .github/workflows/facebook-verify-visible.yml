name: NexusNova Facebook Verify Visible

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/facebook-verify-visible.yml'

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      FACEBOOK_PAGE_ID: ${{ vars.FACEBOOK_PAGE_ID }}
      FACEBOOK_PAGE_ACCESS_TOKEN: ${{ secrets.FACEBOOK_PAGE_ACCESS_TOKEN }}
    steps:
      - name: Verify latest visible Page posts
        run: |
          python - <<'PY'
          import json, os, urllib.parse, urllib.request
          page_id=os.environ['FACEBOOK_PAGE_ID'].strip()
          token=os.environ['FACEBOOK_PAGE_ACCESS_TOKEN'].strip()
          q=urllib.parse.urlencode({'fields':'id,name,access_token','access_token':token})
          with urllib.request.urlopen(f'https://graph.facebook.com/v26.0/{page_id}?{q}', timeout=25) as r:
              page=json.loads(r.read().decode())
          page_token=page.get('access_token','')
          q=urllib.parse.urlencode({'fields':'id,message,created_time,permalink_url','limit':'10','access_token':page_token})
          with urllib.request.urlopen(f'https://graph.facebook.com/v26.0/{page_id}/feed?{q}', timeout=25) as r:
              data=json.loads(r.read().decode())
          posts=data.get('data',[])
          print(json.dumps({'count':len(posts),'posts':[{'id':p.get('id'),'message':p.get('message','')[:180],'created_time':p.get('created_time'),'permalink_url':p.get('permalink_url')} for p in posts]}, indent=2))
          PY
