name: NexusNova Traffic Autopilot Validation

on:
  pull_request:
    branches: [main]
    paths:
      - '.gitignore'
      - '.github/scripts/ai_provider.py'
      - '.github/scripts/traffic_autopilot.py'
      - '.github/scripts/traffic_autopilot_runner.py'
      - '.github/scripts/build_articles_feed.py'
      - '.github/scripts/traffic_diagnosis.py'
      - '.github/scripts/search_growth_autopilot.py'
      - '.github/scripts/adsense_readiness_audit.py'
      - '.github/scripts/prepare_daily_social.py'
      - '.github/scripts/site_quality_audit.py'
      - '.github/scripts/submit_indexnow.py'
      - '.github/scripts/distribute_update.py'
      - '.github/scripts/prepare_instagram_media.py'
      - '.github/workflows/traffic-autopilot.yml'
      - '.github/workflows/traffic-autopilot-validate.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Compile automation scripts
        run: |
          python -m py_compile .github/scripts/ai_provider.py
          python -m py_compile .github/scripts/traffic_autopilot.py
          python -m py_compile .github/scripts/traffic_autopilot_runner.py
          python -m py_compile .github/scripts/build_articles_feed.py
          python -m py_compile .github/scripts/traffic_diagnosis.py
          python -m py_compile .github/scripts/search_growth_autopilot.py
          python -m py_compile .github/scripts/adsense_readiness_audit.py
          python -m py_compile .github/scripts/prepare_daily_social.py
          python -m py_compile .github/scripts/site_quality_audit.py
          python -m py_compile .github/scripts/submit_indexnow.py
          python -m py_compile .github/scripts/prepare_instagram_media.py
          python -m py_compile .github/scripts/distribute_update.py

      - name: Search-growth credential-free smoke test
        env:
          GOOGLE_SERVICE_ACCOUNT_JSON: ''
          NEXUSNOVA_AUTO_OPTIMIZE: '0'
        run: |
          python .github/scripts/search_growth_autopilot.py
          python - <<'PY'
          import json
          from pathlib import Path
          data=json.loads(Path('search-growth-opportunities.json').read_text())
          assert data.get('error') == 'GOOGLE_SERVICE_ACCOUNT_JSON not configured'
          assert not Path('search-growth-changed-files.txt').exists()
          print('Credential-free smoke test passed.')
          PY

      - name: Full public-site quality audit
        run: python .github/scripts/site_quality_audit.py

      - name: Enforce zero static findings
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          data=json.loads(Path('site-quality-report.json').read_text(encoding='utf-8'))
          severe=data.get('severe',[])
          warnings=data.get('warnings',[])
          print(f'Severe findings: {len(severe)}')
          print(f'Warnings: {len(warnings)}')
          if severe or warnings:
              raise SystemExit('Validation failed: public-site findings detected.')
          PY

      - name: Prove editorial quarantine is safe before merge
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          import subprocess
          import sys
          from pathlib import Path

          scripts = Path('.github/scripts').resolve()
          sys.path.insert(0, str(scripts))
          import traffic_autopilot as core
          import traffic_autopilot_runner as runner

          history = core.load_json(core.HISTORY_PATH, {'version': 1, 'articles': [], 'seo_refresh': {}})
          total = len(history.get('articles', []))
          assert total > 0, 'Expected existing autopilot article history for quarantine smoke test.'

          reviewed_history, report = runner.apply_editorial_review_state(history)
          assert report.get('errors') == [], report.get('errors')
          assert report.get('reviewed_articles') == 0
          assert report.get('unreviewed_articles') == total
          assert len(reviewed_history.get('articles', [])) == 0

          core.update_discovery(reviewed_history)
          subprocess.run(['python', '.github/scripts/build_articles_feed.py'], check=True)

          quarantined_urls = {str(row.get('url', '')) for row in history.get('articles', []) if row.get('url')}
          public_feed = json.loads(Path('articles.json').read_text(encoding='utf-8'))
          public_urls = {str(item.get('url', '')) for item in public_feed.get('items', [])}
          leaked = sorted(quarantined_urls & public_urls)
          assert not leaked, f'Quarantined articles leaked into articles.json: {leaked}'

          sitemap = Path('sitemap-autopilot.xml').read_text(encoding='utf-8', errors='replace')
          leaked_sitemap = sorted(url for url in quarantined_urls if url in sitemap)
          assert not leaked_sitemap, f'Quarantined articles leaked into sitemap-autopilot.xml: {leaked_sitemap}'

          for row in history.get('articles', []):
              page = Path(str(row.get('path', '')))
              text = page.read_text(encoding='utf-8', errors='replace').lower()
              assert 'name="robots" content="noindex' in text, f'{page}: noindex quarantine missing'

          print(f'Editorial quarantine smoke test passed for {total} unreviewed autopilot article(s).')
          PY

          python .github/scripts/site_quality_audit.py
          python - <<'PY'
          import json
          from pathlib import Path
          data=json.loads(Path('site-quality-report.json').read_text(encoding='utf-8'))
          severe=data.get('severe',[])
          warnings=data.get('warnings',[])
          print(f'Quarantined snapshot severe findings: {len(severe)}')
          print(f'Quarantined snapshot warnings: {len(warnings)}')
          if severe or warnings:
              for item in severe:
                  print(f'SEVERE: {item}')
              for item in warnings:
                  print(f'WARNING: {item}')
              raise SystemExit('Editorial quarantine snapshot failed site-quality validation.')
          PY

          git reset --hard HEAD

      - name: Prove generated audit output cannot dirty tracked worktree
        shell: bash
        run: |
          set -euo pipefail
          tracked_dirty="$(git status --porcelain --untracked-files=no)"
          if [ -n "$tracked_dirty" ]; then
            echo 'Tracked worktree became dirty after audit:' >&2
            echo "$tracked_dirty" >&2
            exit 1
          fi
          for generated in site-quality-report.json site-quality-report.txt deep-site-audit.json deep-site-audit.txt; do
            if git ls-files --error-unmatch "$generated" >/dev/null 2>&1; then
              echo "Generated audit file is still tracked: $generated" >&2
              exit 1
            fi
          done
          echo 'Generated audit reports are untracked/ignored and rebase-safe.'
