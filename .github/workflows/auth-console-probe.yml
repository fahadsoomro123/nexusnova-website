name: NexusNova Auth Console Probe

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/auth-console-probe.yml'
      - '.github/scripts/auth_console_probe.py'
      - 'register.html'
      - 'account.html'
      - 'assets/js/register.js'
      - 'assets/js/account-dashboard.js'
      - 'assets/js/auth-turnstile-v1.js'
      - 'assets/js/account-shell.js'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - name: Install Playwright
        run: |
          python -m pip install --upgrade pip
          pip install playwright
          python -m playwright install --with-deps chromium
      - name: Start local site
        run: |
          python -m http.server 8000 --bind 127.0.0.1 > /tmp/nexusnova-auth-probe-http.log 2>&1 &
          echo $! > /tmp/nexusnova-auth-probe-http.pid
          sleep 2
      - name: Probe auth console
        run: python .github/scripts/auth_console_probe.py
      - name: Upload probe artifact
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: nexusnova-auth-console-probe-${{ github.run_id }}
          path: quality-artifacts/auth-console-probe.json
          if-no-files-found: error
          retention-days: 14
