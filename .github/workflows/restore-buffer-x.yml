name: NexusNova Restore Buffer X

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/restore-buffer-x.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  restore-and-post:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      BUFFER_API_KEY: ${{ secrets.BUFFER_API_KEY }}
      BUFFER_X_CHANNEL_ID: '6a987ad2065799be4676b541'
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Verify Buffer credentials are available
        shell: bash
        run: |
          set -euo pipefail
          test -n "$BUFFER_API_KEY" || { echo 'BUFFER_API_KEY is missing'; exit 1; }
          test -n "$BUFFER_X_CHANNEL_ID" || { echo 'BUFFER_X_CHANNEL_ID is missing'; exit 1; }
          echo 'Buffer credentials are available to the workflow.'

      - name: Restore Buffer-only X environment in social workflows
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          targets = [
              Path('.github/workflows/traffic-autopilot.yml'),
              Path('.github/workflows/new-tool-social-launch.yml'),
          ]
          x_names = {
              'X_API_KEY',
              'X_API_KEY_SECRET',
              'X_ACCESS_TOKEN',
              'X_ACCESS_TOKEN_SECRET',
          }
          dollar = '$'

          for path in targets:
              text = path.read_text(encoding='utf-8')
              out = []
              inserted = False
              for line in text.splitlines():
                  stripped = line.strip()
                  if any(stripped.startswith(name + ':') for name in x_names):
                      continue
                  if stripped.startswith('BUFFER_API_KEY:') or stripped.startswith('BUFFER_X_CHANNEL_ID:'):
                      continue
                  out.append(line)
                  if stripped.startswith('TELEGRAM_CHANNEL_ID:'):
                      indent = line[:len(line) - len(line.lstrip())]
                      out.append(indent + 'BUFFER_API_KEY: ' + dollar + '{{ secrets.BUFFER_API_KEY }}')
                      out.append(indent + "BUFFER_X_CHANNEL_ID: '6a987ad2065799be4676b541'")
                      inserted = True
              if not inserted:
                  raise SystemExit(f'{path}: TELEGRAM_CHANNEL_ID line not found')
              path.write_text('\n'.join(out) + '\n', encoding='utf-8')
              print('Restored Buffer-only X routing:', path)
          PY

      - name: Verify paid direct X credentials are absent
        shell: bash
        run: |
          set -euo pipefail
          for file in .github/workflows/traffic-autopilot.yml .github/workflows/new-tool-social-launch.yml; do
            grep -q 'BUFFER_API_KEY:' "$file"
            grep -q 'BUFFER_X_CHANNEL_ID:' "$file"
            if grep -Eq '^[[:space:]]*(X_API_KEY|X_API_KEY_SECRET|X_ACCESS_TOKEN|X_ACCESS_TOKEN_SECRET):' "$file"; then
              echo "Direct X credentials still present in $file"
              exit 1
            fi
          done
          python -m py_compile .github/scripts/buffer_publish.py
          python -m py_compile .github/scripts/distribute_social_growth.py
          echo 'Buffer-only X routing verification passed.'

      - name: Commit restored workflow wiring
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'nexusnova-buffer[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add .github/workflows/traffic-autopilot.yml .github/workflows/new-tool-social-launch.yml
          if git diff --cached --quiet; then
            echo 'Buffer wiring already correct; nothing to commit.'
          else
            git commit -m 'fix: restore Buffer-only X publishing'
            git pull --rebase origin main
            git push origin HEAD:main
          fi

      - name: Publish immediate X smoke post through Buffer
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          import sys
          from pathlib import Path

          sys.path.insert(0, str(Path('.github/scripts').resolve()))
          from buffer_publish import post_buffer_x_now

          result = post_buffer_x_now(
              '🎮 Steam Playtime Calculator: estimate total hours, daily average and yearly gaming time in your browser.',
              'https://nexusnovatools.com/steam-playtime-calculator.html?utm_source=x&utm_medium=social&utm_campaign=buffer_restore_20260904',
              ['Steam', 'Gaming', 'NexusNova'],
              ai_assisted=False,
          )
          if not result.get('posted'):
              raise SystemExit('Buffer did not confirm the X post.')
          post = result.get('response') or {}
          print(json.dumps({
              'posted': True,
              'provider': result.get('provider'),
              'post_id': post.get('id'),
              'status': post.get('status'),
              'dueAt': post.get('dueAt'),
          }, indent=2))
          PY
