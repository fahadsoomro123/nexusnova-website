name: NexusNova Restore Buffer X

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/restore-buffer-x.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify-and-post:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    env:
      BUFFER_API_KEY: ${{ secrets.BUFFER_API_KEY }}
      BUFFER_X_CHANNEL_ID: '6a987ad2065799be4676b541'
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Verify Buffer-only X routing is persisted
        shell: bash
        run: |
          set -euo pipefail
          test -n "$BUFFER_API_KEY" || { echo 'BUFFER_API_KEY is missing'; exit 1; }
          test -n "$BUFFER_X_CHANNEL_ID" || { echo 'BUFFER_X_CHANNEL_ID is missing'; exit 1; }
          for file in .github/workflows/traffic-autopilot.yml .github/workflows/new-tool-social-launch.yml; do
            grep -q 'BUFFER_API_KEY:' "$file"
            grep -q 'BUFFER_X_CHANNEL_ID:' "$file"
            if grep -Eq '^[[:space:]]*(X_API_KEY|X_API_KEY_SECRET|X_ACCESS_TOKEN|X_ACCESS_TOKEN_SECRET):' "$file"; then
              echo "Direct X credentials still present in $file"
              exit 1
            fi
          done
          python -m py_compile .github/scripts/buffer_publish.py
          python -m py_compile .github/scripts/distribute_social_growth.py
          echo 'Persisted Buffer-only X routing verified.'

      - name: Publish immediate X post through Buffer
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          import sys
          from pathlib import Path

          sys.path.insert(0, str(Path('.github/scripts').resolve()))
          from buffer_publish import post_buffer_x_now

          result = post_buffer_x_now(
              '🎮 Steam Playtime Calculator: estimate total hours, daily average and yearly gaming time in your browser.',
              'https://nexusnovatools.com/steam-playtime-calculator.html?utm_source=x&utm_medium=social&utm_campaign=buffer_restore_20260904',
              ['Steam', 'Gaming', 'NexusNova'],
              ai_assisted=False,
          )
          if not result.get('posted'):
              raise SystemExit('Buffer did not confirm the X post.')
          post = result.get('response') or {}
          print(json.dumps({
              'posted': True,
              'provider': result.get('provider'),
              'post_id': post.get('id'),
              'status': post.get('status'),
              'dueAt': post.get('dueAt'),
          }, indent=2))
          PY
