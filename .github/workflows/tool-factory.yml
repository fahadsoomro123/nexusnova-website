name: NexusNova Safe Tool Factory

on:
  workflow_dispatch:
    inputs:
      tool_idea:
        description: 'Describe the tool in plain language (example: calculate percentage change between two values)'
        required: true
        type: string
  push:
    branches: [main]
    paths:
      - '.github/scripts/tool_factory.py'
      - '.github/scripts/ai_provider.py'
      - '.github/workflows/tool-factory.yml'

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: nexusnova-safe-tool-factory
  cancel-in-progress: false

jobs:
  self-test:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Compile factory
        run: python -m py_compile .github/scripts/tool_factory.py .github/scripts/ai_provider.py
      - name: Run deterministic factory self-test
        run: python .github/scripts/tool_factory.py --self-test
      - name: Live AI provider fallback smoke test
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_MODEL: ${{ vars.GEMINI_MODEL }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          OPENAI_MODEL: ${{ vars.OPENAI_MODEL }}
        run: |
          python - <<'PY'
          import json,sys
          sys.path.insert(0,'.github/scripts')
          from ai_provider import ai_json,status
          data=ai_json('Return one JSON object only with exactly these fields: {"ok":true,"purpose":"nexusnova-tool-factory-smoke"}.')
          safe=status()
          print('Provider smoke status:',json.dumps(safe,ensure_ascii=False))
          if not isinstance(data,dict) or data.get('ok') is not True:
              raise SystemExit('Live AI provider fallback smoke test failed.')
          print('Live AI provider fallback smoke test PASS')
          PY

  build-draft-pr:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      TOOL_IDEA: ${{ inputs.tool_idea }}
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      GEMINI_MODEL: ${{ vars.GEMINI_MODEL }}
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      OPENAI_MODEL: ${{ vars.OPENAI_MODEL }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Compile factory
        run: python -m py_compile .github/scripts/tool_factory.py .github/scripts/ai_provider.py

      - name: Generate safe draft and run calculation tests
        id: generate
        run: |
          python .github/scripts/tool_factory.py
          python - <<'PY' >> "$GITHUB_OUTPUT"
          import json
          d=json.load(open('tool-factory-output.json',encoding='utf-8'))
          for key in ('name','slug','file','tests'):
              print(f'{key}={d[key]}')
          PY

      - name: Full public-site quality audit with generated draft
        run: |
          python .github/scripts/site_quality_audit.py
          grep -q 'Severe findings: 0' site-quality-report.txt

      - name: Build phone review preview bundle
        run: |
          mkdir -p tool-preview/assets/css tool-preview/assets/js
          cp "${{ steps.generate.outputs.file }}" tool-preview/index.html
          cp assets/css/site.css tool-preview/assets/css/site.css
          cp assets/js/main.js tool-preview/assets/js/main.js
          cp assets/favicon.svg tool-preview/assets/favicon.svg
          python - <<'PY'
          import json
          from pathlib import Path
          d=json.load(open('tool-factory-output.json',encoding='utf-8'))
          Path('tool-preview/REVIEW.txt').write_text(
              'NexusNova Tool Draft Review\n'
              f"Tool: {d['name']}\n"
              f"Calculation tests passed: {d['tests']}\n"
              'Open index.html in your phone browser after extracting this ZIP.\n'
              'This is an offline review copy only. Merging the PR is what publishes the real tool.\n',
              encoding='utf-8'
          )
          PY

      - name: Create isolated branch
        run: |
          BRANCH="tool-factory/${{ steps.generate.outputs.slug }}-${GITHUB_RUN_ID}"
          echo "BRANCH=$BRANCH" >> "$GITHUB_ENV"
          git config user.name 'nexusnova-tool-factory[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git checkout -b "$BRANCH"
          git add -- "${{ steps.generate.outputs.file }}"
          git commit -m "tool: draft ${{ steps.generate.outputs.name }}"
          git push origin "$BRANCH"

      - name: Open review PR (never auto-merge)
        id: pr
        continue-on-error: true
        run: |
          gh pr create \
            --base main \
            --head "$BRANCH" \
            --title "Tool Factory: ${{ steps.generate.outputs.name }}" \
            --body-file tool-factory-pr-body.md | tee pr-url.txt

      - name: Publish owner summary
        if: always()
        run: |
          echo '## NexusNova Safe Tool Factory' >> "$GITHUB_STEP_SUMMARY"
          if [ -f tool-factory-output.json ]; then
            python - <<'PY' >> "$GITHUB_STEP_SUMMARY"
          import json
          d=json.load(open('tool-factory-output.json',encoding='utf-8'))
          print(f"**Tool:** {d['name']}")
          print(f"\n**Draft file:** `{d['file']}`")
          print(f"\n**Calculation tests passed:** {d['tests']}")
          print(f"\n**AI provider:** {d.get('ai',{}).get('provider') or 'unavailable'}")
          print('\n**Auto-merge:** OFF — manual review is required.')
          print('\n**Phone preview:** download the `nexusnova-tool-preview-...` artifact, extract it, then open `index.html`.')
          PY
          fi
          if [ -s pr-url.txt ]; then
            echo '' >> "$GITHUB_STEP_SUMMARY"
            echo "**Review PR:** $(cat pr-url.txt)" >> "$GITHUB_STEP_SUMMARY"
          else
            echo '' >> "$GITHUB_STEP_SUMMARY"
            echo "PR creation was not available automatically. The safe draft branch is: \`$BRANCH\`." >> "$GITHUB_STEP_SUMMARY"
          fi
          echo '' >> "$GITHUB_STEP_SUMMARY"
          echo 'Do not merge if any check is red or the calculation does not match your expected examples.' >> "$GITHUB_STEP_SUMMARY"

      - name: Upload phone review preview
        if: success() || steps.pr.outcome == 'failure'
        uses: actions/upload-artifact@v4
        with:
          name: nexusnova-tool-preview-${{ github.run_id }}
          path: tool-preview/
          if-no-files-found: error
          retention-days: 14

      - name: Upload factory diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nexusnova-tool-factory-${{ github.run_id }}
          path: |
            tool-factory-output.json
            tool-factory-pr-body.md
            site-quality-report.txt
            pr-url.txt
          if-no-files-found: ignore
          retention-days: 14
