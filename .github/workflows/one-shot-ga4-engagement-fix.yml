name: One-shot GA4 Engagement Timing Fix

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/one-shot-ga4-engagement-fix.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Restore prompt production GA4 loading
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path('assets/js/main.js')
          text = path.read_text(encoding='utf-8')
          old = """  ['pointerdown','keydown','touchstart'].forEach(type=>window.addEventListener(type,load,{once:true,passive:true}));
  window.addEventListener('scroll',load,{once:true,passive:true});
  const schedule=()=>setTimeout(load,8000);
  if(document.readyState==='complete')schedule();
  else window.addEventListener('load',schedule,{once:true});
"""
          new = """  load();
"""
          if old not in text:
              raise SystemExit('Expected delayed GA4 loader block not found; refusing unsafe patch.')
          text = text.replace(old, new, 1)
          path.write_text(text, encoding='utf-8')
          print('Production GA4 loader restored to immediate async loading.')
          PY

      - name: Add GA4 regression test
        shell: bash
        run: |
          cat > tests/ga4-loader.test.cjs <<'EOF'
          const test = require('node:test');
          const assert = require('node:assert/strict');
          const fs = require('node:fs');

          test('GA4 production loader does not wait eight seconds', () => {
            const text = fs.readFileSync('assets/js/main.js', 'utf8');
            assert.match(text, /const measurementId='G-YLPFKWSS12';/);
            assert.doesNotMatch(text, /setTimeout\(load,8000\)/);
            assert.match(text, /\n  load\(\);\n\}\)\(\);/);
          });
          EOF

      - name: Verify JavaScript and regression test
        run: |
          node --check assets/js/main.js
          node --test tests/ga4-loader.test.cjs

      - name: Commit fix and remove one-shot workflow
        shell: bash
        run: |
          git config user.name 'nexusnova-fix[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          rm .github/workflows/one-shot-ga4-engagement-fix.yml
          git add assets/js/main.js tests/ga4-loader.test.cjs .github/workflows/one-shot-ga4-engagement-fix.yml
          if git diff --cached --quiet; then
            echo 'No changes to commit.'
            exit 0
          fi
          git commit -m 'analytics: restore prompt GA4 engagement tracking'
          git pull --rebase origin main
          git push origin HEAD:main
