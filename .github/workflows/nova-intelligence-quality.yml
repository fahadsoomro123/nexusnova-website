name: Nova Intelligence Production Quality

# Production verification intentionally runs the real public page and Worker; no mocked provider is used here.

on:
  pull_request:
    branches: [main]
    paths:
      - 'nova-intelligence.html'
      - 'assets/js/nova-intelligence.js'
      - 'cloudflare/telegram-bot/nova-*.js'
      - 'cloudflare/telegram-bot/worker-instagram-entry.js'
      - 'cloudflare/telegram-bot/wrangler.jsonc'
      - 'tests/nova-intelligence.test.cjs'
      - '.github/workflows/nova-intelligence-quality.yml'
  push:
    branches: [main]
    paths:
      - 'nova-intelligence.html'
      - 'assets/js/nova-intelligence.js'
      - 'cloudflare/telegram-bot/nova-*.js'
      - 'cloudflare/telegram-bot/worker-instagram-entry.js'
      - 'cloudflare/telegram-bot/wrangler.jsonc'
      - 'tests/nova-intelligence.test.cjs'
      - '.github/workflows/nova-intelligence-quality.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  source-quality:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Repository tests
        run: npm test
      - name: Worker syntax
        run: |
          node --check cloudflare/telegram-bot/worker-instagram-entry.js
          node --check cloudflare/telegram-bot/nova-provider.js
          node --check cloudflare/telegram-bot/nova-tools.js
          node --check cloudflare/telegram-bot/nova-runtime.js
          node --check assets/js/nova-intelligence.js
      - name: Browser QA
        run: |
          python -m pip install --disable-pip-version-check playwright
          python -m playwright install --with-deps chromium
          python -m http.server 8000 --bind 127.0.0.1 >/tmp/nova-http.log 2>&1 &
          python - <<'PY'
          from playwright.sync_api import sync_playwright
          api='https://nexusnova-telegram-bot.fahadsoomro123.workers.dev/api/nova'
          widths=[360,375,390,412,430,768,1024,1280,1440]
          failures=[]
          with sync_playwright() as p:
            browser=p.chromium.launch(headless=True)
            for width in widths:
              page=browser.new_page(viewport={'width':width,'height':900})
              errors=[]
              page.on('console', lambda msg: errors.append(msg.text) if msg.type=='error' else None)
              def route_handler(route):
                route.fulfill(status=200,content_type='application/json',body='{"mode":"answer","answer":"Nova test response: arbitrary natural language was accepted.","requestId":"test","provider":"test"}')
              page.route(api, route_handler)
              try:
                page.goto('http://127.0.0.1:8000/nova-intelligence.html',wait_until='domcontentloaded',timeout=30000)
                page.wait_for_timeout(200)
                if page.locator('#niPrompt').count()!=1: failures.append(f'prompt@{width}: missing')
                prompt=page.locator('#niPrompt'); prompt.fill('Explain a difficult concept in simple words with an example.')
                page.locator('#niBuild').click(); page.wait_for_timeout(250)
                text=page.locator('#niResult').inner_text()
                if 'Nova test response' not in text: failures.append(f'flow@{width}: contract response not rendered')
                metrics=page.evaluate('() => ({sw:document.documentElement.scrollWidth,cw:document.documentElement.clientWidth})')
                if metrics['sw']>metrics['cw']+6: failures.append(f'overflow@{width}: {metrics}')
                if errors: failures.append(f'console@{width}: {errors}')
                if 'too broad for this preview router' in page.content().lower(): failures.append(f'legacy-preview-copy@{width}')
              except Exception as exc: failures.append(f'browser@{width}: {exc}')
              finally: page.close()
            browser.close()
          if failures:
            print('\n'.join(failures)); raise SystemExit(1)
          print('PASS: Nova source/browser QA across 9 responsive widths with arbitrary natural-language flow.')
          PY

  deploy-worker:
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Deploy production Worker from repository source
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: cloudflare/telegram-bot
          command: deploy

  production-quality:
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    needs: deploy-worker
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Production transport diagnostics
        run: |
          python - <<'PY'
          import json
          import urllib.request
          import urllib.error

          base='https://nexusnova-telegram-bot.fahadsoomro123.workers.dev'
          origin='https://nexusnovatools.com'
          def probe(method, path, body=None):
            data=None if body is None else json.dumps(body).encode()
            req=urllib.request.Request(base+path, method=method, data=data, headers={
              'Origin': origin,
              'Accept': 'application/json',
              'Content-Type': 'application/json',
              'User-Agent': 'Mozilla/5.0 (compatible; NexusNova-Production-QA/1.0)',
              'Access-Control-Request-Method': 'POST' if method == 'OPTIONS' else '',
              'Access-Control-Request-Headers': 'content-type' if method == 'OPTIONS' else ''
            })
            try:
              with urllib.request.urlopen(req, timeout=30) as r:
                text=r.read().decode('utf-8','replace')
                print(method, path, 'HTTP', r.status)
                print('BODY=', text[:6000])
            except urllib.error.HTTPError as e:
              text=e.read().decode('utf-8','replace')
              print(method, path, 'HTTP', e.code)
              print('BODY=', text[:6000])
          print('=== SAFE PRODUCTION TRANSPORT DIAGNOSTICS ===')
          probe('GET','/api/nova/status')
          probe('OPTIONS','/api/nova')
          probe('POST','/api/nova',{'message':'Explain compound interest in one friendly sentence.','focus':'general'})
          PY
      - name: Real production browser — exact Nova prompt
        run: |
          python -m pip install --disable-pip-version-check playwright
          python -m playwright install --with-deps chromium
          python - <<'PY'
          from playwright.sync_api import sync_playwright
          failures=[]
          base='https://nexusnova-telegram-bot.fahadsoomro123.workers.dev'
          exact_prompt='What is the capital of Pakistan, and explain in one sentence why it is important?'
          with sync_playwright() as p:
            browser=p.chromium.launch(headless=True)
            page=browser.new_page(viewport={'width':390,'height':844}, user_agent='Mozilla/5.0 (Linux; Android 11; Mobile) AppleWebKit/537.36 Chrome/151.0.0.0 Mobile Safari/537.36')
            api_response=None
            try:
              page.goto('https://nexusnovatools.com/nova-intelligence.html?qa=${GITHUB_SHA}',wait_until='domcontentloaded',timeout=30000)
              page.wait_for_timeout(500)
              print('PAGE_URL=', page.url)
              print('PAGE_ORIGIN=', page.evaluate('() => location.origin'))
              print('NOVA_CLIENT_BUILD=', page.evaluate('() => document.documentElement.dataset.novaClientBuild || "missing"'))
              script_src=page.locator('script[src*="nova-intelligence.js"]').get_attribute('src') or ''
              print('NOVA_SCRIPT_SRC=', script_src)
              if 'nova-intelligence.js?v=20260914-v6' not in script_src:
                failures.append('live page is not serving the cache-busted v6 Nova client')

              page.locator('#niPrompt').fill(exact_prompt)
              with page.expect_response(lambda r: r.url == base + '/api/nova' and r.request.method == 'POST', timeout=45000) as api_event:
                page.locator('#niBuild').click(force=True)
              api_response=api_event.value
              api_body=api_response.json()
              print('BROWSER_NOVA_API=', {'status':api_response.status,'body':api_body})
              if api_response.status != 200: failures.append(f'UI API HTTP={api_response.status}')
              if api_body.get('mode') != 'answer': failures.append(f'UI API mode={api_body.get("mode")}')
              if api_body.get('provider') != 'gemini': failures.append(f'UI API provider={api_body.get("provider")}')
              if not str(api_body.get('answer','')).strip(): failures.append('UI API returned empty answer')

              page.wait_for_function("""() => {
                const s=document.querySelector('#niState')?.textContent?.trim() || '';
                const t=document.querySelector('#niResult')?.innerText?.trim() || '';
                return s && s !== 'READY' && s !== 'THINKING…' && !t.includes('Ready for your request');
              }""", timeout=45000)
              text=page.locator('#niResult').inner_text().strip()
              state=page.locator('#niState').inner_text().strip()
              print('UI_STATE=', state)
              print('UI_RESULT=', text[:6000])
              answer=str(api_body.get('answer','')).strip()
              if not answer: failures.append('empty real Gemini answer')
              if answer not in text: failures.append('real API answer was not rendered verbatim in Nova response panel')
              if 'Nova could not complete that request right now' in text: failures.append('old live fallback text still rendered')
              if 'Nova connection unavailable' in text: failures.append('connection fallback rendered')
              if 'No unverified result was shown' in text: failures.append('old fallback recovery copy still rendered')
              if state == 'READY': failures.append('Nova state remained READY')
            except Exception as exc:
              failures.append(f'production browser verification: {exc}')
            finally:
              page.close()
              browser.close()
          if failures:
            print('\n'.join(failures)); raise SystemExit(1)
          print('PASS: exact production browser prompt reached the real Worker, returned a Gemini answer, and that same answer was visibly rendered in #niResult on the live page.')
          PY