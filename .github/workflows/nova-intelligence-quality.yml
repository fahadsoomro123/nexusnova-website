name: Nova Intelligence Production Quality

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  source-quality:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Repository tests
        run: npm test
      - name: Nova client syntax
        run: node --check assets/nova/nova-ui.js
      - name: Worker syntax
        run: |
          node --check cloudflare/telegram-bot/worker-instagram-entry.js
          node --check cloudflare/telegram-bot/nova/nova-provider.js
          node --check cloudflare/telegram-bot/nova/nova-tools.js
          node --check cloudflare/telegram-bot/nova/nova-runtime.js
          node --check cloudflare/telegram-bot/nova/nova-abuse.js

  deploy-worker:
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Deploy production Worker
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: cloudflare/telegram-bot
          command: deploy

  production-quality:
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    needs: deploy-worker
    runs-on: ubuntu-latest
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install browser driver
        run: |
          python -m pip install --disable-pip-version-check playwright
          python -m playwright install --with-deps chromium
      - name: Real production reliability battery
        env:
          GITHUB_SHA: ${{ github.sha }}
        run: python .github/scripts/nova_reliability_battery.py
      - name: Upload reliability evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nova-production-reliability-evidence
          path: |
            nova-reliability-results.json
            nova-reliability-summary.json
            nova-evidence/*.png
          retention-days: 14
