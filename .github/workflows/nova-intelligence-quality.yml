name: Nova Intelligence Production Quality

on:
  push:
    branches: [main]
    paths:
      - 'nova-intelligence.html'
      - 'assets/js/nova-intelligence.js'
      - 'cloudflare/telegram-bot/nova-*.js'
      - 'cloudflare/telegram-bot/worker-instagram-entry.js'
      - 'cloudflare/telegram-bot/wrangler.jsonc'
      - 'tests/nova-intelligence.test.cjs'
      - '.github/workflows/nova-intelligence-quality.yml'
  pull_request:
    branches: [main]
    paths:
      - 'nova-intelligence.html'
      - 'assets/js/nova-intelligence.js'
      - 'cloudflare/telegram-bot/nova-*.js'
      - 'cloudflare/telegram-bot/worker-instagram-entry.js'
      - 'cloudflare/telegram-bot/wrangler.jsonc'
      - 'tests/nova-intelligence.test.cjs'
      - '.github/workflows/nova-intelligence-quality.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  source-quality:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Repository tests
        run: npm test
      - name: Worker syntax
        run: |
          node --check cloudflare/telegram-bot/worker-instagram-entry.js
          node --check cloudflare/telegram-bot/nova-provider.js
          node --check cloudflare/telegram-bot/nova-tools.js
          node --check cloudflare/telegram-bot/nova-runtime.js
          node --check assets/js/nova-intelligence.js

  deploy-worker:
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Deploy production Worker from repository source
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: cloudflare/telegram-bot
          command: deploy

  production-quality:
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    needs: deploy-worker
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - name: Production transport diagnostics
        run: |
          python - <<'PY'
          import json
          import urllib.request
          import urllib.error

          base='https://nexusnova-telegram-bot.fahadsoomro123.workers.dev'
          origin='https://nexusnovatools.com'
          def probe(method, path, body=None):
            data=None if body is None else json.dumps(body).encode()
            headers={'Origin': origin,'Accept':'application/json','Content-Type':'application/json','User-Agent':'Mozilla/5.0 (compatible; NexusNova-Production-QA/1.0)'}
            if method == 'OPTIONS': headers.update({'Access-Control-Request-Method':'POST','Access-Control-Request-Headers':'content-type'})
            req=urllib.request.Request(base+path, method=method, data=data, headers=headers)
            try:
              with urllib.request.urlopen(req, timeout=30) as r:
                text=r.read().decode('utf-8','replace')
                print(method, path, 'HTTP', r.status)
                print('BODY=', text[:8000])
            except urllib.error.HTTPError as e:
              text=e.read().decode('utf-8','replace')
              print(method, path, 'HTTP', e.code)
              print('BODY=', text[:8000])
          print('=== REAL PRODUCTION TRANSPORT ===')
          probe('GET','/api/nova/status')
          probe('OPTIONS','/api/nova')
          probe('POST','/api/nova',{'message':'Explain compound interest in one friendly sentence.','focus':'general'})
          PY
      - name: Real production browsers — exact Nova prompt, mobile and desktop
        run: |
          python -m pip install --disable-pip-version-check playwright
          python -m playwright install --with-deps chromium
          python - <<'PY'
          from playwright.sync_api import sync_playwright
          import re
          failures=[]
          base='https://nexusnova-telegram-bot.fahadsoomro123.workers.dev'
          exact_prompt='What is the capital of Pakistan, and explain in one sentence why it is important?'
          contexts=[
            ('mobile', {'width':390,'height':844}, 'Mozilla/5.0 (Linux; Android 11; Mobile) AppleWebKit/537.36 Chrome/151.0.0.0 Mobile Safari/537.36'),
            ('desktop', {'width':1440,'height':1000}, None),
          ]
          with sync_playwright() as p:
            browser=p.chromium.launch(headless=True)
            for label, viewport, user_agent in contexts:
              context_kwargs={'viewport':viewport}
              if user_agent: context_kwargs['user_agent']=user_agent
              context=browser.new_context(**context_kwargs)
              page=context.new_page()
              try:
                page.goto('https://nexusnovatools.com/nova-intelligence.html?qa=${GITHUB_SHA}',wait_until='domcontentloaded',timeout=30000)
                page.wait_for_timeout(500)
                build=page.evaluate('() => document.documentElement.dataset.novaClientBuild || "missing"')
                script_src=page.locator('script[src*="nova-intelligence.js"]').get_attribute('src') or ''
                print(label.upper(),'CLIENT_BUILD=',build)
                print(label.upper(),'SCRIPT_SRC=',script_src)
                if build != '20260914-ui-contract-v7': failures.append(f'{label}: wrong client build {build}')
                if 'nova-intelligence.js?v=20260914-v7' not in script_src: failures.append(f'{label}: missing v7 cache-buster')

                page.locator('#niPrompt').fill(exact_prompt)
                with page.expect_response(lambda r: r.url == base + '/api/nova' and r.request.method == 'POST', timeout=45000) as event:
                  page.locator('#niBuild').click(force=True)
                api=event.value
                body=api.json()
                answer=str(body.get('answer','')).strip()
                text=page.locator('#niResult').inner_text().strip()
                state=page.locator('#niState').inner_text().strip()
                print(label.upper(),'API_STATUS=',api.status)
                print(label.upper(),'API_SHAPE=',{'requestId':body.get('requestId'),'mode':body.get('mode'),'provider':body.get('provider'),'answerChars':len(answer),'answerPrefix':answer[:800]})
                print(label.upper(),'UI_STATE=',state)
                print(label.upper(),'UI_RESULT=',text[:8000])
                if api.status != 200: failures.append(f'{label}: HTTP {api.status}')
                if body.get('mode') != 'answer': failures.append(f'{label}: mode={body.get("mode")}')
                if body.get('provider') != 'gemini': failures.append(f'{label}: provider={body.get("provider")}')
                if len(answer) < 80: failures.append(f'{label}: answer suspiciously short ({len(answer)})')
                if re.fullmatch(r'[\d\s,.%+\-*/()×÷]+', answer): failures.append(f'{label}: numeric-only answer')
                if answer not in text: failures.append(f'{label}: API answer not rendered verbatim')
                if 'Nova connection unavailable' in text or 'No fake answer was generated' in text: failures.append(f'{label}: fallback UI rendered')
                if state in ('READY','THINKING…'): failures.append(f'{label}: UI did not finish')
                if label == 'mobile':
                  metrics=page.evaluate('() => ({sw:document.documentElement.scrollWidth,cw:document.documentElement.clientWidth,sh:document.documentElement.scrollHeight,ch:document.documentElement.clientHeight})')
                  print('MOBILE_LAYOUT=',metrics)
                  if metrics['sw'] > metrics['cw'] + 6: failures.append(f'mobile: horizontal overflow {metrics}')
                page.wait_for_timeout(300)
              except Exception as exc:
                failures.append(f'{label}: {exc}')
              finally:
                context.close()
            browser.close()
          if failures:
            print('FAILURES=')
            print('\n'.join(failures))
            raise SystemExit(1)
          print('PASS: real Gemini response was returned and visibly rendered on both mobile and desktop production browsers.')
          PY