name: Nova Intelligence Production Quality

on:
  pull_request:
    branches: [main]
    paths:
      - 'nova-intelligence.html'
      - 'assets/js/nova-intelligence.js'
      - 'cloudflare/telegram-bot/nova-*.js'
      - 'cloudflare/telegram-bot/worker-instagram-entry.js'
      - 'cloudflare/telegram-bot/wrangler.jsonc'
      - 'tests/nova-intelligence.test.cjs'
      - '.github/workflows/nova-intelligence-quality.yml'
  push:
    branches: [main]
    paths:
      - 'nova-intelligence.html'
      - 'assets/js/nova-intelligence.js'
      - 'cloudflare/telegram-bot/nova-*.js'
      - 'cloudflare/telegram-bot/worker-instagram-entry.js'
      - 'cloudflare/telegram-bot/wrangler.jsonc'
      - 'tests/nova-intelligence.test.cjs'
      - '.github/workflows/nova-intelligence-quality.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  source-quality:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Repository tests
        run: npm test
      - name: Worker syntax
        run: |
          node --check cloudflare/telegram-bot/worker-instagram-entry.js
          node --check cloudflare/telegram-bot/nova-provider.js
          node --check cloudflare/telegram-bot/nova-tools.js
          node --check cloudflare/telegram-bot/nova-runtime.js
          node --check assets/js/nova-intelligence.js
      - name: Browser QA
        run: |
          python -m pip install --disable-pip-version-check playwright
          python -m playwright install --with-deps chromium
          python -m http.server 8000 --bind 127.0.0.1 >/tmp/nova-http.log 2>&1 &
          python - <<'PY'
          from playwright.sync_api import sync_playwright
          api='https://nexusnova-telegram-bot.fahadsoomro123.workers.dev/api/nova'
          widths=[360,375,390,412,430,768,1024,1280,1440]
          failures=[]
          with sync_playwright() as p:
            browser=p.chromium.launch(headless=True)
            for width in widths:
              page=browser.new_page(viewport={'width':width,'height':900})
              errors=[]
              page.on('console', lambda msg: errors.append(msg.text) if msg.type=='error' else None)
              def route_handler(route):
                route.fulfill(status=200,content_type='application/json',body='{"ok":true,"mode":"answer","answer":"Nova test response: arbitrary natural language was accepted.","requestId":"test","provider":"test"}')
              page.route(api, route_handler)
              try:
                page.goto('http://127.0.0.1:8000/nova-intelligence.html',wait_until='domcontentloaded',timeout=30000)
                page.wait_for_timeout(200)
                if page.locator('#niPrompt').count()!=1: failures.append(f'prompt@{width}: missing')
                prompt=page.locator('#niPrompt'); prompt.fill('Explain a difficult concept in simple words with an example.')
                page.locator('#niBuild').click(); page.wait_for_timeout(250)
                text=page.locator('#niResult').inner_text()
                if 'Nova test response' not in text: failures.append(f'flow@{width}: mocked response not rendered')
                metrics=page.evaluate('() => ({sw:document.documentElement.scrollWidth,cw:document.documentElement.clientWidth})')
                if metrics['sw']>metrics['cw']+6: failures.append(f'overflow@{width}: {metrics}')
                if errors: failures.append(f'console@{width}: {errors}')
                if 'too broad for this preview router' in page.content().lower(): failures.append(f'legacy-preview-copy@{width}')
              except Exception as exc: failures.append(f'browser@{width}: {exc}')
              finally: page.close()
            browser.close()
          if failures:
            print('\n'.join(failures)); raise SystemExit(1)
          print('PASS: Nova source/browser QA across 9 responsive widths with arbitrary natural-language flow.')
          PY

  deploy-worker:
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Deploy production Worker from repository source
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: cloudflare/telegram-bot
          command: deploy

  production-quality:
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    needs: deploy-worker
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Production transport diagnostics
        run: |
          python - <<'PY'
          import json
          import urllib.request
          import urllib.error

          base='https://nexusnova-telegram-bot.fahadsoomro123.workers.dev'
          origin='https://nexusnovatools.com'
          def probe(method, path, body=None):
            data=None if body is None else json.dumps(body).encode()
            req=urllib.request.Request(base+path, method=method, data=data, headers={
              'Origin': origin,
              'Accept': 'application/json',
              'Content-Type': 'application/json',
              'Access-Control-Request-Method': 'POST' if method == 'OPTIONS' else '',
              'Access-Control-Request-Headers': 'content-type' if method == 'OPTIONS' else ''
            })
            try:
              with urllib.request.urlopen(req, timeout=30) as r:
                text=r.read().decode('utf-8','replace')
                print(method, path, 'HTTP', r.status)
                print('ACAO=', r.headers.get('Access-Control-Allow-Origin'))
                print('ACAM=', r.headers.get('Access-Control-Allow-Methods'))
                print('ACAH=', r.headers.get('Access-Control-Allow-Headers'))
                print('BODY=', text[:6000])
            except urllib.error.HTTPError as e:
              text=e.read().decode('utf-8','replace')
              print(method, path, 'HTTP', e.code)
              print('ACAO=', e.headers.get('Access-Control-Allow-Origin'))
              print('ACAM=', e.headers.get('Access-Control-Allow-Methods'))
              print('ACAH=', e.headers.get('Access-Control-Allow-Headers'))
              print('BODY=', text[:6000])
          print('=== SAFE PRODUCTION TRANSPORT DIAGNOSTICS ===')
          probe('GET','/api/nova/status')
          probe('OPTIONS','/api/nova')
          probe('POST','/api/nova',{'message':'Explain compound interest in one friendly sentence.','focus':'general'})
          PY
      - name: Production API and browser QA
        run: |
          python -m pip install --disable-pip-version-check playwright
          python -m playwright install --with-deps chromium
          python - <<'PY'
          from playwright.sync_api import sync_playwright
          failures=[]
          base='https://nexusnova-telegram-bot.fahadsoomro123.workers.dev'
          def raw_headers(response):
            return {k.lower(): v for k,v in response.all_headers().items()}
          with sync_playwright() as p:
            browser=p.chromium.launch(headless=True)
            page=browser.new_page(viewport={'width':390,'height':844})
            try:
              page.goto('https://nexusnovatools.com/nova-intelligence.html?qa=${GITHUB_SHA}',wait_until='domcontentloaded',timeout=30000)
              page.wait_for_timeout(500)
              print('PAGE_URL=', page.url)
              print('PAGE_ORIGIN=', page.evaluate('() => location.origin'))
              robots=(page.locator('meta[name="robots"]').get_attribute('content') or '').replace(' ','').lower()
              if robots!='noindex,nofollow': failures.append(f'robots={robots}')

              page.locator('#niPrompt').fill('Explain black holes like I am 12.')
              page.locator('#niBuild').click(force=True)
              page.wait_for_function("document.querySelector('#niState')?.textContent !== 'READY'", timeout=25000)
              text=page.locator('#niResult').inner_text()
              print('UI_RESULT=', text[:6000])
              if not text.strip() or 'Ready for your request' in text: failures.append('UI did not render a response')
              if 'Nova could not complete that request right now' in text or 'Nova connection unavailable' in text: failures.append('user-visible technical/dead-end error')
              metrics=page.evaluate('() => ({sw:document.documentElement.scrollWidth,cw:document.documentElement.clientWidth})')
              if metrics['sw']>metrics['cw']+6: failures.append(f'production overflow: {metrics}')

              with page.expect_response(lambda r: r.url == base + '/api/nova/status' and r.request.method == 'GET') as status_event:
                status_body=page.evaluate("""async () => (await fetch(arguments[0] + '/api/nova/status')).json()""", base)
              status_response=status_event.value
              status_headers=raw_headers(status_response)
              print('BROWSER_STATUS=', {'status':status_response.status,'headers':status_headers,'body':status_body})
              if status_response.status!=200: failures.append(f'nova status http={status_response.status}')
              if status_headers.get('access-control-allow-origin')!='https://nexusnovatools.com': failures.append(f'nova status ACAO={status_headers.get("access-control-allow-origin")}')
              if not status_body.get('ok'): failures.append('Nova status endpoint not ok')
              if not status_body.get('aiConfigured'): failures.append('AI provider is not configured in production Worker')
              if not status_body.get('providers',{}).get('gemini'): failures.append('Gemini is not configured in production Worker')

              with page.expect_response(lambda r: r.url == base + '/api/nova' and r.request.method == 'OPTIONS') as options_event:
                options_body=page.evaluate("""async () => { const r=await fetch(arguments[0] + '/api/nova',{method:'OPTIONS',headers:{'Access-Control-Request-Method':'POST','Access-Control-Request-Headers':'content-type'}}); return await r.text(); }""", base)
              options_response=options_event.value
              options_headers=raw_headers(options_response)
              print('BROWSER_OPTIONS=', {'status':options_response.status,'headers':options_headers,'body':options_body})
              if options_response.status!=204: failures.append(f'OPTIONS http={options_response.status}')
              if options_headers.get('access-control-allow-origin')!='https://nexusnovatools.com': failures.append(f'OPTIONS ACAO={options_headers.get("access-control-allow-origin")}')
              if 'POST' not in options_headers.get('access-control-allow-methods',''): failures.append(f'OPTIONS methods={options_headers.get("access-control-allow-methods")}')
              if 'content-type' not in options_headers.get('access-control-allow-headers','').lower(): failures.append(f'OPTIONS headers={options_headers.get("access-control-allow-headers")}')

              with page.expect_response(lambda r: r.url == base + '/api/nova' and r.request.method == 'POST') as post_event:
                result_body=page.evaluate("""async () => { const r=await fetch(arguments[0] + '/api/nova',{method:'POST',headers:{'Content-Type':'application/json','Accept':'application/json'},body:JSON.stringify({message:'Write one friendly sentence explaining compound interest.'})}); return await r.json(); }""", base)
              post_response=post_event.value
              post_headers=raw_headers(post_response)
              print('BROWSER_POST=', {'status':post_response.status,'headers':post_headers,'body':result_body})
              if post_response.status!=200: failures.append(f'nova api http={post_response.status}')
              if post_headers.get('access-control-allow-origin')!='https://nexusnovatools.com': failures.append(f'nova api ACAO={post_headers.get("access-control-allow-origin")}')
              if not result_body.get('ok'): failures.append('nova api returned non-ok')
              if result_body.get('mode')=='limit': failures.append('nova api returned limit mode for arbitrary question')
              if result_body.get('provider')!='gemini': failures.append(f'nova api provider={result_body.get("provider")}')
              if not str(result_body.get('answer','')).strip(): failures.append('nova api returned empty answer')
              if 'Nova could not complete that request right now' in str(result_body.get('answer','')): failures.append('nova api returned known fallback text')
            except Exception as exc: failures.append(f'production verification: {exc}')
            finally:
              page.close()
              browser.close()
          if failures:
            print('\n'.join(failures)); raise SystemExit(1)
          print('PASS: current repository Worker deployed, raw production CORS headers verified, Gemini configured, arbitrary Nova prompt returned a non-limit answer, and production UI rendered a non-error response.')
          PY
