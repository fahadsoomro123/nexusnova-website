name: Travel Live OTA 7

on:
  push:
    branches: [nexusnova-ota-public]
    paths:
      - '.github/workflows/travel-live-ota-7.yml'

permissions:
  contents: write

concurrency:
  group: nexusnova-ota-public-publish
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      APP_SOURCE: a66bd6e057c919e817baa85d7ad75e183994a5a5
      OTA_BASE: 8d1aaaee6f28b974a8c8b3ff213beb1318ec7405
    steps:
      - name: Check out live OTA branch
        uses: actions/checkout@v4
        with:
          ref: nexusnova-ota-public
          fetch-depth: 0

      - name: Fetch exact latest public Travel integration
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p ota/files/src/features/apps
          curl --fail --silent --show-error --location \
            "https://raw.githubusercontent.com/fahadsoomro123/nexusnova-app-public-build/${APP_SOURCE}/fresh-rebuild/src/features/apps/travel-integrations.js" \
            -o ota/files/src/features/apps/travel-integrations.js
          node --check ota/files/src/features/apps/travel-integrations.js
          grep -Fq 'height:30px!important;min-height:30px!important;font-size:18px!important' ota/files/src/features/apps/travel-integrations.js

      - name: Build cumulative OTA 7 manifest
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import hashlib, json, os
          from pathlib import Path

          manifest_path = Path('ota/manifest.json')
          manifest = json.loads(manifest_path.read_text(encoding='utf-8'))
          source = os.environ['APP_SOURCE'].strip().lower()
          base = os.environ['OTA_BASE'].strip().lower()
          assert manifest.get('schema') == 2
          assert manifest.get('base') == base, manifest.get('base')
          assert len(source) == 40 and all(c in '0123456789abcdef' for c in source)

          entries = {row['path']: dict(row) for row in manifest.get('files', [])}
          before = {k: dict(v) for k, v in entries.items()}
          target = 'src/features/apps/travel-integrations.js'
          data = (Path('ota/files') / target).read_bytes()
          entries[target] = {
              'path': target,
              'sha256': hashlib.sha256(data).hexdigest(),
              'size': len(data),
          }

          # OTA 7 is a narrow Travel hotfix. Preserve every other currently-live
          # OTA payload exactly, including Drive History and AI Photo Studio.
          for path, old in before.items():
              if path != target:
                  assert entries[path] == old, f'unrelated OTA entry changed: {path}'

          assert 'src/nova-drive-history-v1.js' in entries, 'Drive History missing'
          assert 'src/nova-vehicle-premium-ui.js' in entries, 'Drive loader missing'
          assert 'index.html' in entries, 'OTA entry point missing'

          manifest['version'] = source
          manifest['proof_number'] = '7'
          manifest['travel_revision'] = max(6, int(manifest.get('travel_revision', 0) or 0))
          manifest['travel_source'] = source
          manifest['files'] = sorted(entries.values(), key=lambda row: row['path'])

          total = 0
          for row in manifest['files']:
              payload = (Path('ota/files') / row['path']).read_bytes()
              assert len(payload) == row['size'], row['path']
              assert hashlib.sha256(payload).hexdigest() == row['sha256'], row['path']
              total += len(payload)
          assert 1 <= len(manifest['files']) < 2000
          assert total < 60 * 1024 * 1024

          manifest_path.write_text(json.dumps(manifest, separators=(',', ':')), encoding='utf-8')
          print(f"PASS: OTA 7 version={source} files={len(manifest['files'])} bytes={total}; Drive + AI preserved")
          PY

      - name: Activate OTA 7 atomically
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'NexusNova OTA Bot'
          git config user.email 'actions@users.noreply.github.com'
          git add ota/manifest.json ota/files/src/features/apps/travel-integrations.js
          git rm .github/workflows/travel-live-ota-7.yml
          git diff --cached --check
          git commit -m "release: activate Travel OTA 7 ${APP_SOURCE}"
          git push origin HEAD:nexusnova-ota-public
