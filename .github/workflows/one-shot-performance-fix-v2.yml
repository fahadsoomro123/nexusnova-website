name: NexusNova One-Time Performance Fix V2

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/one-shot-performance-fix-v2.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Apply root performance and CLS fixes
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          def replace_once(path, old, new):
              p = Path(path)
              text = p.read_text(encoding='utf-8')
              if old not in text:
                  raise SystemExit(f'Expected patch anchor missing in {path}: {old[:100]!r}')
              p.write_text(text.replace(old, new, 1), encoding='utf-8')

          # Public browsers do not need Telegram's ~24 KB SDK. Keep full Mini App
          # behavior by loading it only when Telegram launch signals are present.
          old_tg = '<script src="https://telegram.org/js/telegram-web-app.js?63" defer></script><script src="assets/js/telegram-webapp.js?v=20260826-5" defer></script>'
          new_tg = '''<script>(()=>{const signal=`${location.hash} ${location.search}`;const inTelegram=/tgWebAppData|tgWebAppVersion|tgWebAppPlatform/.test(signal)||!!window.TelegramWebviewProxy||!!window.TelegramWebview;if(!inTelegram)return;const sdk=document.createElement('script');sdk.src='https://telegram.org/js/telegram-web-app.js?63';sdk.async=true;sdk.onload=()=>{const bridge=document.createElement('script');bridge.src='assets/js/telegram-webapp.js?v=20260826-5';bridge.async=false;document.head.appendChild(bridge)};document.head.appendChild(sdk)})();</script>'''
          replace_once('index.html', old_tg, new_tg)

          # On Tools, keep the SEO/discovery section but append it after the actual
          # all-in-one tools. Late insertion after the hero caused the 0.30+ CLS.
          replace_once(
              'assets/js/assistant-core.js',
              "    const hero=document.querySelector('.page-hero');\n    if(hero)hero.after(section);else document.querySelector('main')?.prepend(section);",
              "    document.querySelector('main')?.appendChild(section);"
          )

          # Keep authenticated header state independent from NOVA. For ordinary
          # guest traffic auth-header-state exits immediately without Firebase.
          old_assistant = "  if(!document.querySelector('script[data-nova-assistant]')){const s=document.createElement('script');s.src=`${base}assets/js/assistant.js`;s.defer=true;s.dataset.novaAssistant='';document.body.appendChild(s)}"
          new_assistant = """  if(!document.querySelector('script[data-nexusnova-auth-header]')){const m=document.createElement('script');m.type='module';m.src=`${base}assets/js/auth-header-state.js`;m.dataset.nexusnovaAuthHeader='';document.body.appendChild(m)}
          const loadNovaAssistant=()=>{if(document.querySelector('script[data-nova-assistant]'))return;const s=document.createElement('script');s.src=`${base}assets/js/assistant.js`;s.defer=true;s.dataset.novaAssistant='';document.body.appendChild(s)};
          if(page==='index.html'){['pointerdown','keydown'].forEach(type=>window.addEventListener(type,loadNovaAssistant,{once:true,passive:true}));window.addEventListener('scroll',loadNovaAssistant,{once:true,passive:true})}else loadNovaAssistant();"""
          replace_once('assets/js/main.js', old_assistant, new_assistant)

          # On Home, render only above-the-fold command icons immediately. The
          # large below-fold icon pass starts on first user intent instead.
          old_decorate = "  document.querySelectorAll('.home-tool,.tool-card,.trend-card,.popular-card,.category-card').forEach(decorateCard);\n  document.querySelectorAll('.command-dock a,.node').forEach(el=>{if(el.querySelector(':scope > .nn-tool-symbol'))return;el.insertBefore(symbolFor(el),el.firstChild)});"
          new_decorate = """  const decorateDock=()=>document.querySelectorAll('.command-dock a,.node').forEach(el=>{if(el.querySelector(':scope > .nn-tool-symbol'))return;el.insertBefore(symbolFor(el),el.firstChild)});
          if(page==='index.html'){
            decorateDock();
            let homeDecorated=false;
            const decorateHome=()=>{if(homeDecorated)return;homeDecorated=true;document.querySelectorAll('.home-tool,.trend-card,.popular-card,.category-card').forEach(decorateCard)};
            ['pointerdown','keydown'].forEach(type=>window.addEventListener(type,decorateHome,{once:true,passive:true}));
            window.addEventListener('scroll',decorateHome,{once:true,passive:true});
          }else{
            document.querySelectorAll('.home-tool,.tool-card,.trend-card,.popular-card,.category-card').forEach(decorateCard);
            decorateDock();
          }"""
          replace_once('assets/js/main.js', old_decorate, new_decorate)

          # Build the large homepage datalist only when search is actually used.
          old_list = "    const list=document.createElement('datalist');list.id='nn-site-search-list';searchIndex.forEach(item=>{const o=document.createElement('option');o.value=item[1];list.appendChild(o)});document.body.appendChild(list);homeSearch.setAttribute('list',list.id);"
          new_list = """    const ensureSearchList=()=>{if(document.getElementById('nn-site-search-list'))return;const list=document.createElement('datalist');list.id='nn-site-search-list';searchIndex.forEach(item=>{const o=document.createElement('option');o.value=item[1];list.appendChild(o)});document.body.appendChild(list);homeSearch.setAttribute('list',list.id)};
            homeSearch.addEventListener('focus',ensureSearchList,{once:true});"""
          replace_once('assets/js/main.js', old_list, new_list)

          # The browser quality guard intentionally activates lazy homepage extras
          # before checking that Live Tech Pulse still works.
          replace_once(
              '.github/scripts/browser_quality_guard.py',
              '                    if rel == "index.html":\n                        try:\n                            page.wait_for_selector("[data-live-tech-pulse]", timeout=5000)',
              '                    if rel == "index.html":\n                        page.evaluate("window.scrollBy(0, 1)")\n                        try:\n                            page.wait_for_selector("[data-live-tech-pulse]", timeout=5000)'
          )
          PY

      - name: Syntax and patch checks
        shell: bash
        run: |
          set -euo pipefail
          node --check assets/js/main.js
          node --check assets/js/assistant-core.js
          python3 -m py_compile .github/scripts/browser_quality_guard.py
          git diff --check

      - name: Commit root fix
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'NexusNova CI'
          git config user.email 'actions@users.noreply.github.com'
          git add index.html assets/js/main.js assets/js/assistant-core.js .github/scripts/browser_quality_guard.py
          git commit -m 'perf: lazy-load homepage extras and eliminate tools CLS'
          git push origin HEAD:main
