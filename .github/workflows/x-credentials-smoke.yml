name: NexusNova X Credentials Smoke Test

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/x-credentials-smoke.yml'

permissions:
  contents: read

jobs:
  x-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      X_API_KEY: ${{ secrets.X_API_KEY }}
      X_API_KEY_SECRET: ${{ secrets.X_API_KEY_SECRET }}
      X_ACCESS_TOKEN: ${{ secrets.X_ACCESS_TOKEN }}
      X_ACCESS_TOKEN_SECRET: ${{ secrets.X_ACCESS_TOKEN_SECRET }}
    steps:
      - name: Verify X OAuth 1.0a credentials without posting
        run: |
          python - <<'PY'
          import base64, hashlib, hmac, json, os, secrets, time, urllib.parse, urllib.request, urllib.error

          ck=os.environ.get('X_API_KEY','').strip()
          cs=os.environ.get('X_API_KEY_SECRET','').strip()
          at=os.environ.get('X_ACCESS_TOKEN','').strip()
          ats=os.environ.get('X_ACCESS_TOKEN_SECRET','').strip()
          missing=[n for n,v in [('X_API_KEY',ck),('X_API_KEY_SECRET',cs),('X_ACCESS_TOKEN',at),('X_ACCESS_TOKEN_SECRET',ats)] if not v]
          if missing:
              raise SystemExit('Missing secrets: '+', '.join(missing))

          method='GET'
          base_url='https://api.x.com/1.1/account/verify_credentials.json'
          query={'skip_status':'true','include_entities':'false'}
          oauth={
              'oauth_consumer_key': ck,
              'oauth_nonce': secrets.token_hex(16),
              'oauth_signature_method':'HMAC-SHA1',
              'oauth_timestamp': str(int(time.time())),
              'oauth_token': at,
              'oauth_version':'1.0',
          }
          def enc(v): return urllib.parse.quote(str(v), safe='~-._')
          params={**query, **oauth}
          normalized='&'.join(f'{enc(k)}={enc(v)}' for k,v in sorted(params.items()))
          base_string='&'.join([method, enc(base_url), enc(normalized)])
          signing_key=f'{enc(cs)}&{enc(ats)}'
          sig=base64.b64encode(hmac.new(signing_key.encode(), base_string.encode(), hashlib.sha1).digest()).decode()
          oauth['oauth_signature']=sig
          auth='OAuth '+', '.join(f'{enc(k)}="{enc(v)}"' for k,v in sorted(oauth.items()))
          url=base_url+'?'+urllib.parse.urlencode(query)
          req=urllib.request.Request(url, headers={'Authorization':auth,'User-Agent':'NexusNovaTrafficAutopilot/1.0'})
          try:
              with urllib.request.urlopen(req, timeout=20) as r:
                  data=json.loads(r.read().decode('utf-8'))
                  print(json.dumps({'http_status':r.status,'authenticated':True,'screen_name':data.get('screen_name'),'id_str':data.get('id_str')}, indent=2))
          except urllib.error.HTTPError as e:
              body=e.read().decode('utf-8','replace')
              print(json.dumps({'http_status':e.code,'authenticated':False,'response':body[:1000]}, indent=2))
              raise
          PY
