name: Phase 3 Tools Upgrade

on:
  push:
    branches: [main]
    paths: ['.github/workflows/phase3-tools.yml']

permissions:
  contents: write

jobs:
  upgrade:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Upgrade tools and UX
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import re

          tools = Path('tools.html')
          html = tools.read_text(encoding='utf-8')
          if 'id="vat"' not in html:
              html = html.replace('Use 15 free browser-based tools', 'Use 25 free browser-based tools')
              html = html.replace('numberOfItems\":15', 'numberOfItems\":25')
              html = html.replace('Fast, browser-based utilities with real calculations and no required account.', 'Twenty-five fast, browser-based utilities with real calculations, clear categories and no required account.')
              extra_schema = ','.join([
                '{"@type":"ListItem","position":16,"name":"VAT / Tax Calculator"}',
                '{"@type":"ListItem","position":17,"name":"Simple Interest Calculator"}',
                '{"@type":"ListItem","position":18,"name":"Compound Growth Calculator"}',
                '{"@type":"ListItem","position":19,"name":"Fuel Cost Estimator"}',
                '{"@type":"ListItem","position":20,"name":"Speed Distance Time Calculator"}',
                '{"@type":"ListItem","position":21,"name":"Data Transfer Time Estimator"}',
                '{"@type":"ListItem","position":22,"name":"URL Encoder Decoder"}',
                '{"@type":"ListItem","position":23,"name":"JSON Formatter Validator"}',
                '{"@type":"ListItem","position":24,"name":"UUID Generator"}',
                '{"@type":"ListItem","position":25,"name":"Unix Timestamp Converter"}'
              ])
              html = html.replace('{"@type":"ListItem","position":15,"name":"Random Picker"}]}</script>', '{"@type":"ListItem","position":15,"name":"Random Picker"},' + extra_schema + ']}</script>')

              search = '<div class="search-tools"><input aria-label="Search daily tools" data-tool-search="" placeholder="Search tools…" type="search"/></div>'
              filters = '''<div class="tool-filter-bar" role="group" aria-label="Filter tools by category">
<button class="filter-chip active" type="button" data-tool-filter="all">All 25</button>
<button class="filter-chip" type="button" data-tool-filter="math">Math</button>
<button class="filter-chip" type="button" data-tool-filter="money">Money</button>
<button class="filter-chip" type="button" data-tool-filter="date">Date & Time</button>
<button class="filter-chip" type="button" data-tool-filter="convert">Converters</button>
<button class="filter-chip" type="button" data-tool-filter="text">Text & Dev</button>
<button class="filter-chip" type="button" data-tool-filter="privacy">Privacy</button>
<button class="filter-chip" type="button" data-tool-filter="travel">Travel</button>
</div><p class="tool-count" data-tool-count aria-live="polite">Showing 25 tools</p>'''
              html = html.replace(search, search + filters)

              cats = {
                'calculator':'math','percentage':'math','age':'date','date-difference':'date','converter':'convert',
                'text-counter':'text','password':'privacy','split':'money','quick-note-tool':'privacy','discount':'money',
                'percentage-change':'math','storage-converter':'convert','time-duration':'date','text-case':'text','random-picker':'privacy'
              }
              for ident, cat in cats.items():
                  html = html.replace(f'data-tool-card="" id="{ident}"', f'data-tool-card="" data-category="{cat}" id="{ident}"')

              new_cards = r'''
<article class="tool-card" data-tool-card="" data-category="money" id="vat"><h3>VAT / Tax Calculator</h3><p>Add or remove a configurable tax percentage from an amount.</p><div class="form-row"><div class="field"><label for="vat-amount">Amount</label><input id="vat-amount" inputmode="decimal" min="0" placeholder="e.g. 10000" type="number"/></div><div class="field"><label for="vat-rate">Tax %</label><input id="vat-rate" inputmode="decimal" min="0" placeholder="e.g. 18" type="number"/></div></div><div class="tool-actions"><button class="btn btn-primary" id="vat-add" type="button">Add tax</button><button class="btn" id="vat-remove" type="button">Remove included tax</button></div><div aria-live="polite" class="result" id="vat-result">Enter amount and tax rate.</div></article>
<article class="tool-card" data-tool-card="" data-category="money" id="simple-interest"><h3>Simple Interest Calculator</h3><p>Calculate simple interest and final amount from principal, annual rate and years.</p><div class="field"><label for="si-principal">Principal</label><input id="si-principal" min="0" type="number" placeholder="e.g. 100000"/></div><div class="form-row"><div class="field"><label for="si-rate">Annual rate %</label><input id="si-rate" min="0" type="number" placeholder="e.g. 10"/></div><div class="field"><label for="si-years">Years</label><input id="si-years" min="0" step="0.01" type="number" placeholder="e.g. 2"/></div></div><button class="btn btn-primary" id="si-run" type="button">Calculate</button><div aria-live="polite" class="result" id="si-result">Enter all values.</div></article>
<article class="tool-card" data-tool-card="" data-category="money" id="compound-growth"><h3>Compound Growth Calculator</h3><p>Project repeated percentage growth using a chosen compounding frequency.</p><div class="field"><label for="cg-principal">Starting amount</label><input id="cg-principal" min="0" type="number" placeholder="e.g. 100000"/></div><div class="form-row"><div class="field"><label for="cg-rate">Annual rate %</label><input id="cg-rate" type="number" placeholder="e.g. 8"/></div><div class="field"><label for="cg-years">Years</label><input id="cg-years" min="0" step="0.01" type="number" placeholder="e.g. 5"/></div></div><div class="field"><label for="cg-frequency">Compounds per year</label><select id="cg-frequency"><option value="1">Yearly</option><option value="4">Quarterly</option><option value="12" selected>Monthly</option><option value="365">Daily</option></select></div><button class="btn btn-primary" id="cg-run" type="button">Calculate growth</button><div aria-live="polite" class="result" id="cg-result">Enter all values.</div><p class="mini-note">Mathematical projection only; not financial advice.</p></article>
<article class="tool-card" data-tool-card="" data-category="travel" id="fuel-cost"><h3>Fuel Cost Estimator</h3><p>Estimate trip fuel use and cost from distance, efficiency and fuel price.</p><div class="field"><label for="fuel-distance">Distance (km)</label><input id="fuel-distance" min="0" type="number" placeholder="e.g. 350"/></div><div class="form-row"><div class="field"><label for="fuel-efficiency">Efficiency (km/L)</label><input id="fuel-efficiency" min="0" type="number" placeholder="e.g. 12"/></div><div class="field"><label for="fuel-price">Price per litre</label><input id="fuel-price" min="0" type="number" placeholder="e.g. 280"/></div></div><button class="btn btn-primary" id="fuel-run" type="button">Estimate trip</button><div aria-live="polite" class="result" id="fuel-result">Enter trip details.</div></article>
<article class="tool-card" data-tool-card="" data-category="travel" id="speed-distance-time"><h3>Speed / Distance / Time</h3><p>Solve one value when the other two are known.</p><div class="field"><label for="sdt-mode">Calculate</label><select id="sdt-mode"><option value="speed">Speed</option><option value="distance">Distance</option><option value="time">Time</option></select></div><div class="form-row"><div class="field"><label for="sdt-a" id="sdt-a-label">Distance (km)</label><input id="sdt-a" min="0" type="number"/></div><div class="field"><label for="sdt-b" id="sdt-b-label">Time (hours)</label><input id="sdt-b" min="0" type="number"/></div></div><button class="btn btn-primary" id="sdt-run" type="button">Calculate</button><div aria-live="polite" class="result" id="sdt-result">Enter both known values.</div></article>
<article class="tool-card" data-tool-card="" data-category="convert" id="transfer-time"><h3>Data Transfer Time</h3><p>Estimate how long a file transfer takes at a given Mbps speed.</p><div class="form-row"><div class="field"><label for="transfer-size">File size</label><input id="transfer-size" min="0" type="number" placeholder="e.g. 5"/></div><div class="field"><label for="transfer-unit">Unit</label><select id="transfer-unit"><option>MB</option><option selected>GB</option><option>TB</option></select></div></div><div class="field"><label for="transfer-speed">Speed (Mbps)</label><input id="transfer-speed" min="0" type="number" placeholder="e.g. 50"/></div><button class="btn btn-primary" id="transfer-run" type="button">Estimate time</button><div aria-live="polite" class="result" id="transfer-result">Enter file size and speed.</div></article>
<article class="tool-card" data-tool-card="" data-category="text" id="url-code"><h3>URL Encoder / Decoder</h3><p>Safely encode text for a URL component or decode it back.</p><div class="field"><label for="url-input">Text</label><textarea id="url-input" placeholder="Type or paste text…"></textarea></div><div class="tool-actions"><button class="btn btn-primary" id="url-encode" type="button">Encode</button><button class="btn" id="url-decode" type="button">Decode</button></div><div class="field"><label for="url-output">Result</label><textarea id="url-output" readonly></textarea></div></article>
<article class="tool-card" data-tool-card="" data-category="text" id="json-tool"><h3>JSON Formatter & Validator</h3><p>Validate JSON and format it for easier reading, entirely in your browser.</p><div class="field"><label for="json-input">JSON</label><textarea id="json-input" spellcheck="false" placeholder='{"name":"NexusNova"}'></textarea></div><button class="btn btn-primary" id="json-run" type="button">Validate & format</button><div aria-live="polite" class="result" id="json-result">Paste JSON to check.</div><div class="field"><label for="json-output">Formatted JSON</label><textarea id="json-output" readonly spellcheck="false"></textarea></div></article>
<article class="tool-card" data-tool-card="" data-category="privacy" id="uuid"><h3>UUID Generator</h3><p>Generate random UUID v4 identifiers locally in your browser.</p><div class="tool-actions"><button class="btn btn-primary" id="uuid-run" type="button">Generate UUID</button><button class="btn" id="uuid-copy" type="button">Copy</button></div><div aria-live="polite" class="result" id="uuid-result">Generate an identifier.</div></article>
<article class="tool-card" data-tool-card="" data-category="date" id="timestamp"><h3>Unix Timestamp Converter</h3><p>Convert between Unix seconds and a readable date/time.</p><div class="field"><label for="timestamp-value">Unix timestamp (seconds)</label><input id="timestamp-value" inputmode="numeric" type="number" placeholder="e.g. 1700000000"/></div><div class="tool-actions"><button class="btn btn-primary" id="timestamp-to-date" type="button">Timestamp → Date</button><button class="btn" id="timestamp-now" type="button">Use current time</button></div><div aria-live="polite" class="result" id="timestamp-result">Enter a timestamp.</div><div class="field"><label for="timestamp-date">Date/time</label><input id="timestamp-date" type="datetime-local"/></div><button class="btn" id="date-to-timestamp" type="button">Date → Timestamp</button><div aria-live="polite" class="result" id="date-timestamp-result">Choose a date/time.</div></article>
'''
              marker = '</div><div class="no-results" data-no-results="">No matching tool found.</div>'
              html = html.replace(marker, new_cards + marker)
              tools.write_text(html, encoding='utf-8')

          js = Path('assets/js/tools.js')
          code = js.read_text(encoding='utf-8')
          if "$('vat-add')" not in code:
              add = r'''

  const vatCalculate = (removeIncluded = false) => {
    const amount = number($('vat-amount')?.value);
    const rate = number($('vat-rate')?.value);
    if (!(amount >= 0) || !(rate >= 0)) return $('vat-result').textContent = 'Enter a valid amount and tax rate.';
    if (removeIncluded) {
      const net = amount / (1 + rate / 100);
      const tax = amount - net;
      $('vat-result').textContent = `Net ${fmt(net, 6)} • Tax ${fmt(tax, 6)} • Gross ${fmt(amount, 6)}`;
    } else {
      const tax = amount * rate / 100;
      $('vat-result').textContent = `Net ${fmt(amount, 6)} • Tax ${fmt(tax, 6)} • Gross ${fmt(amount + tax, 6)}`;
    }
  };
  $('vat-add')?.addEventListener('click', () => vatCalculate(false));
  $('vat-remove')?.addEventListener('click', () => vatCalculate(true));

  $('si-run')?.addEventListener('click', () => {
    const p = number($('si-principal').value), r = number($('si-rate').value), y = number($('si-years').value);
    if (!(p >= 0) || !(r >= 0) || !(y >= 0)) return $('si-result').textContent = 'Enter valid non-negative values.';
    const interest = p * r * y / 100;
    $('si-result').textContent = `Interest ${fmt(interest, 6)} • Final amount ${fmt(p + interest, 6)}`;
  });

  $('cg-run')?.addEventListener('click', () => {
    const p = number($('cg-principal').value), r = number($('cg-rate').value), y = number($('cg-years').value), n = Number.parseInt($('cg-frequency').value, 10);
    if (!(p >= 0) || !Number.isFinite(r) || !(y >= 0) || !(n > 0)) return $('cg-result').textContent = 'Enter valid values.';
    const factor = 1 + (r / 100) / n;
    if (factor < 0) return $('cg-result').textContent = 'Rate is too low for the selected compounding frequency.';
    const finalAmount = p * (factor ** (n * y));
    $('cg-result').textContent = `Projected amount ${fmt(finalAmount, 6)} • Change ${fmt(finalAmount - p, 6)}`;
  });

  $('fuel-run')?.addEventListener('click', () => {
    const distance = number($('fuel-distance').value), efficiency = number($('fuel-efficiency').value), price = number($('fuel-price').value);
    if (!(distance >= 0) || !(efficiency > 0) || !(price >= 0)) return $('fuel-result').textContent = 'Enter valid distance, efficiency and fuel price.';
    const litres = distance / efficiency;
    $('fuel-result').textContent = `${fmt(litres, 3)} L estimated • Cost ${fmt(litres * price, 2)}`;
  });

  const updateSdtLabels = () => {
    const mode = $('sdt-mode')?.value;
    if (!$('sdt-a-label') || !$('sdt-b-label')) return;
    const labels = mode === 'speed' ? ['Distance (km)', 'Time (hours)'] : mode === 'distance' ? ['Speed (km/h)', 'Time (hours)'] : ['Distance (km)', 'Speed (km/h)'];
    $('sdt-a-label').textContent = labels[0]; $('sdt-b-label').textContent = labels[1];
  };
  $('sdt-mode')?.addEventListener('change', updateSdtLabels); updateSdtLabels();
  $('sdt-run')?.addEventListener('click', () => {
    const mode = $('sdt-mode').value, a = number($('sdt-a').value), b = number($('sdt-b').value);
    if (!(a >= 0) || !(b > 0)) return $('sdt-result').textContent = 'Enter valid positive known values.';
    if (mode === 'speed') $('sdt-result').textContent = `${fmt(a / b, 4)} km/h`;
    else if (mode === 'distance') $('sdt-result').textContent = `${fmt(a * b, 4)} km`;
    else $('sdt-result').textContent = `${fmt(a / b, 4)} hours`;
  });

  $('transfer-run')?.addEventListener('click', () => {
    const size = number($('transfer-size').value), speed = number($('transfer-speed').value), unit = $('transfer-unit').value;
    if (!(size >= 0) || !(speed > 0)) return $('transfer-result').textContent = 'Enter a valid file size and positive speed.';
    const bytesPerUnit = {MB: 1e6, GB: 1e9, TB: 1e12};
    const seconds = size * bytesPerUnit[unit] * 8 / (speed * 1e6);
    const h = Math.floor(seconds / 3600), m = Math.floor((seconds % 3600) / 60), s = Math.round(seconds % 60);
    $('transfer-result').textContent = `${h}h ${m}m ${s}s estimated at ${fmt(speed, 2)} Mbps`;
  });

  $('url-encode')?.addEventListener('click', () => { $('url-output').value = encodeURIComponent($('url-input').value); });
  $('url-decode')?.addEventListener('click', () => {
    try { $('url-output').value = decodeURIComponent($('url-input').value); }
    catch { $('url-output').value = ''; }
  });

  $('json-run')?.addEventListener('click', () => {
    try {
      const parsed = JSON.parse($('json-input').value);
      $('json-output').value = JSON.stringify(parsed, null, 2);
      $('json-result').textContent = 'Valid JSON.';
    } catch (error) {
      $('json-output').value = '';
      $('json-result').textContent = `Invalid JSON: ${error.message}`;
    }
  });

  $('uuid-run')?.addEventListener('click', () => {
    const id = crypto.randomUUID ? crypto.randomUUID() : ([1e7]+-1e3+-4e3+-8e3+-1e11).replace(/[018]/g, c => (c ^ crypto.getRandomValues(new Uint8Array(1))[0] & 15 >> c / 4).toString(16));
    $('uuid-result').textContent = id;
  });
  $('uuid-copy')?.addEventListener('click', async () => {
    const value = $('uuid-result').textContent.trim();
    if (!value || value.includes('Generate')) return;
    try { await navigator.clipboard.writeText(value); $('uuid-copy').textContent = 'Copied'; setTimeout(() => $('uuid-copy').textContent = 'Copy', 1200); } catch {}
  });

  $('timestamp-to-date')?.addEventListener('click', () => {
    const value = number($('timestamp-value').value);
    if (!Number.isFinite(value)) return $('timestamp-result').textContent = 'Enter a valid timestamp.';
    const d = new Date(value * 1000);
    if (Number.isNaN(d.getTime())) return $('timestamp-result').textContent = 'Timestamp is outside the supported date range.';
    $('timestamp-result').textContent = `${d.toLocaleString()} • UTC ${d.toISOString()}`;
  });
  $('timestamp-now')?.addEventListener('click', () => { $('timestamp-value').value = String(Math.floor(Date.now() / 1000)); $('timestamp-to-date').click(); });
  $('date-to-timestamp')?.addEventListener('click', () => {
    const value = $('timestamp-date').value;
    if (!value) return $('date-timestamp-result').textContent = 'Choose a date/time.';
    const ms = new Date(value).getTime();
    if (!Number.isFinite(ms)) return $('date-timestamp-result').textContent = 'Choose a valid date/time.';
    $('date-timestamp-result').textContent = `${Math.floor(ms / 1000)} Unix seconds`;
  });
'''
              code = code.replace('\n  const clock = $(\'local-clock\');', add + '\n  const clock = $(\'local-clock\');')
              js.write_text(code, encoding='utf-8')

          main = Path('assets/js/main.js')
          main.write_text(r'''(() => {
  const year = document.querySelector('[data-year]');
  if (year) year.textContent = String(new Date().getFullYear());
  const header = document.querySelector('[data-header]');
  const updateHeader = () => header?.classList.toggle('scrolled', window.scrollY > 8);
  updateHeader(); window.addEventListener('scroll', updateHeader, { passive: true });
  const button = document.querySelector('[data-menu-btn]'), nav = document.querySelector('[data-nav]');
  if (button && nav) {
    const closeMenu = () => { nav.classList.remove('open'); button.setAttribute('aria-expanded', 'false'); };
    button.addEventListener('click', () => { const open = nav.classList.toggle('open'); button.setAttribute('aria-expanded', String(open)); });
    nav.addEventListener('click', (event) => { if (event.target.closest('a')) closeMenu(); });
    window.addEventListener('resize', () => { if (window.innerWidth > 720) closeMenu(); });
  }
  const search = document.querySelector('[data-tool-search]');
  const cards = [...document.querySelectorAll('[data-tool-card]')];
  const filters = [...document.querySelectorAll('[data-tool-filter]')];
  const empty = document.querySelector('[data-no-results]');
  const count = document.querySelector('[data-tool-count]');
  let activeCategory = 'all';
  const applyTools = () => {
    const q = search?.value.trim().toLowerCase() || '';
    let shown = 0;
    cards.forEach((card) => {
      const categoryMatch = activeCategory === 'all' || card.dataset.category === activeCategory;
      const textMatch = !q || card.textContent.toLowerCase().includes(q);
      const match = categoryMatch && textMatch;
      card.classList.toggle('hidden', !match); if (match) shown += 1;
    });
    empty?.classList.toggle('show', shown === 0);
    if (count) count.textContent = `Showing ${shown} tool${shown === 1 ? '' : 's'}`;
  };
  search?.addEventListener('input', applyTools);
  filters.forEach((chip) => chip.addEventListener('click', () => {
    activeCategory = chip.dataset.toolFilter || 'all';
    filters.forEach((item) => item.classList.toggle('active', item === chip));
    applyTools();
  }));
  applyTools();
})();
''', encoding='utf-8')

          css = Path('assets/css/site.css')
          style = css.read_text(encoding='utf-8')
          if '.tool-filter-bar{' not in style:
              style += r'''
.tool-filter-bar{display:flex;gap:9px;flex-wrap:wrap;margin:0 0 10px}.filter-chip{min-height:38px;padding:0 14px;border:1px solid var(--line);border-radius:999px;background:var(--surface);color:var(--muted);font-weight:800;font-size:13px}.filter-chip:hover,.filter-chip.active{color:#06121c;border-color:transparent;background:linear-gradient(135deg,var(--accent),var(--accent-2))}.tool-count{margin:0 0 18px;color:var(--muted);font-size:13px;font-weight:750}.tool-card{scroll-margin-top:92px}.tool-card textarea[readonly]{min-height:96px}@media(max-width:720px){.tool-filter-bar{flex-wrap:nowrap;overflow-x:auto;padding-bottom:6px;scrollbar-width:thin}.filter-chip{flex:0 0 auto}.tool-card{padding:20px}.search-tools input{min-height:48px}}
'''
              css.write_text(style, encoding='utf-8')

          index = Path('index.html')
          home = index.read_text(encoding='utf-8')
          home = home.replace('Use 15 practical browser tools', 'Use 25 practical browser tools')
          home = home.replace('NexusNova brings 15 practical browser tools', 'NexusNova brings 25 practical browser tools')
          home = home.replace('One page. Fifteen practical utilities.', 'One page. Twenty-five practical utilities.')
          index.write_text(home, encoding='utf-8')
          PY

          node --check assets/js/main.js
          node --check assets/js/tools.js
          python3 - <<'PY'
          from pathlib import Path
          import re
          html = Path('tools.html').read_text(encoding='utf-8')
          ids = re.findall(r'\bid="([^"]+)"', html)
          dup = sorted({x for x in ids if ids.count(x) > 1})
          assert not dup, f'duplicate ids: {dup}'
          cards = re.findall(r'<article class="tool-card"[^>]*data-tool-card', html)
          assert len(cards) == 25, len(cards)
          for required in ['vat','simple-interest','compound-growth','fuel-cost','speed-distance-time','transfer-time','url-code','json-tool','uuid','timestamp']:
              assert f'id="{required}"' in html, required
          assert 'numberOfItems\":25' in html
          assert 'Twenty-five practical utilities.' in Path('index.html').read_text(encoding='utf-8')
          print('Phase 3 audit PASS: 25 tools, unique IDs, JS syntax valid')
          PY

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add tools.html index.html assets/js/main.js assets/js/tools.js assets/css/site.css
          git commit -m 'website: add Phase 3 daily tools and category UX'
          git push origin HEAD:main
