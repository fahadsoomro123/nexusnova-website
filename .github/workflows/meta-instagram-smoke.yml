name: NexusNova Meta Instagram Smoke Test

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/meta-instagram-smoke.yml'

permissions:
  contents: read

jobs:
  meta-instagram-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      FACEBOOK_PAGE_ACCESS_TOKEN: ${{ secrets.FACEBOOK_PAGE_ACCESS_TOKEN }}
    steps:
      - name: Verify Meta token and discover connected Instagram account
        run: |
          python - <<'PY'
          import json, os, urllib.parse, urllib.request
          token = os.environ.get('FACEBOOK_PAGE_ACCESS_TOKEN','').strip()
          if not token:
              raise SystemExit('FACEBOOK_PAGE_ACCESS_TOKEN is missing')
          query = urllib.parse.urlencode({
              'fields': 'id,name,instagram_business_account{id,username}',
              'access_token': token,
          })
          url = f'https://graph.facebook.com/v26.0/me/accounts?{query}'
          req = urllib.request.Request(url, headers={'User-Agent':'NexusNovaTrafficAutopilot/1.0'})
          with urllib.request.urlopen(req, timeout=20) as r:
              data = json.loads(r.read().decode('utf-8'))
          rows = data.get('data') or []
          safe = []
          for row in rows:
              ig = row.get('instagram_business_account') or {}
              safe.append({
                  'page_id': row.get('id'),
                  'page_name': row.get('name'),
                  'instagram_id': ig.get('id'),
                  'instagram_username': ig.get('username'),
              })
          print(json.dumps({'ok': True, 'accounts': safe}, indent=2))
          if not rows:
              raise SystemExit('No Facebook Page assets returned for this token')
          if not any((row.get('instagram_business_account') or {}).get('id') for row in rows):
              raise SystemExit('No connected Instagram professional account found')
          PY
