name: One-time Revert Over-broad AdSense Link Cleanup

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/adsense-final-link-cleanup.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  revert-cleanup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Revert semantic link-label mismatch commit
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'NexusNova AdSense Cleanup'
          git config user.email 'actions@users.noreply.github.com'
          git revert --no-edit 2fce6dc58c31bf5a1e1dae0c8f8e31ce41769f32
          git commit --amend -m 'revert: preserve truthful contextual navigation labels'
          git push origin HEAD:main
