name: NexusNova One-Time GA4 Engagement Fix V3

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/one-shot-ga4-engagement-fix-v3.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Apply targeted GA4 timing fix
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('assets/js/main.js')
          text=p.read_text(encoding='utf-8')
          start_token="  ['pointerdown','keydown','touchstart'].forEach(type=>window.addEventListener(type,load,{once:true,passive:true}));"
          end_token="  else window.addEventListener('load',schedule,{once:true});"
          start=text.find(start_token)
          end=text.find(end_token,start)
          if start < 0 or end < 0:
              raise SystemExit('Expected delayed GA4 loader anchors missing')
          end += len(end_token)
          text=text[:start]+'  load();\n'+text[end:]
          p.write_text(text,encoding='utf-8')
          PY

      - name: Verify targeted fix
        shell: bash
        run: |
          node --check assets/js/main.js
          python3 - <<'PY'
          from pathlib import Path
          text=Path('assets/js/main.js').read_text(encoding='utf-8')
          if 'setTimeout(load,8000)' in text:
              raise SystemExit('Old 8-second GA4 delay still present')
          if "  load();\n})();" not in text:
              raise SystemExit('Immediate async GA4 load signature missing')
          print('GA4 timing verification passed')
          PY

      - name: Commit targeted fix
        shell: bash
        run: |
          git config user.name 'nexusnova-fix[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add assets/js/main.js
          git commit -m 'analytics: restore prompt GA4 engagement tracking'
          git pull --rebase origin main
          git push origin HEAD:main
