name: AdSense Final Remediation

on:
  push:
    branches: [main]
    paths:
      - 'adsense_final_remediation.py'
      - '.github/workflows/adsense-final-remediation.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  remediate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Sync latest main
        run: git pull --rebase origin main
      - name: Apply targeted remediation
        run: python adsense_final_remediation.py
      - name: Report proposed remediation without publishing
        shell: bash
        run: |
          set -euo pipefail
          echo 'AdSense Final Remediation is audit-only; no changes are committed or pushed.'
          git status --short
          git diff --stat || true
