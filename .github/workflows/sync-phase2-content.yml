name: Sync Phase 2 Article Discovery

on:
  push:
    branches: ["**"]
    paths:
      - "articles/**"
      - ".github/scripts/sync_phase2_content.py"
      - ".github/workflows/sync-phase2-content.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: nexusnova-phase2-content-sync
  cancel-in-progress: true

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "20"
      - name: Synchronize search index, article hub and sitemap
        run: python .github/scripts/sync_phase2_content.py
      - name: Validate generated discovery
        run: |
          python - <<'PY'
          import re
          from pathlib import Path
          core=Path('assets/js/search-core.js').read_text(encoding='utf-8-sig')
          assert len(re.findall(r'type:"article"', core)) >= 35
          assert 'NexusNovaSearchCore.DATASET_SIZE=' in core
          assert Path('sitemap.xml').read_text(encoding='utf-8-sig').count('/articles/') >= 30
          print('PASS: Phase 2 discovery synchronization contract')
          PY
      - name: Run npm check
        run: npm run check
      - name: Run npm test
        run: npm test
      - name: Commit synchronized discovery
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add assets/js/search-core.js articles.html sitemap.xml
          if git diff --cached --quiet; then
            echo 'Discovery already synchronized.'
          else
            git commit -m 'seo: synchronize phase 2 article discovery [skip ci]'
            git push
          fi
