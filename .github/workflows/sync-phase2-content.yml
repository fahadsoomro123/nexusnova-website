name: Sync Phase 2 Article Discovery

on:
  push:
    branches: ["**"]
    paths:
      - "articles/**"
      - ".github/scripts/sync_phase2_content.py"
      - ".github/workflows/sync-phase2-content.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: nexusnova-phase2-content-sync
  cancel-in-progress: true

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
          package-manager-cache: false
      - name: Synchronize search index, article hub and sitemap
        run: python .github/scripts/sync_phase2_content.py
      - name: Validate global layout and sitemap parity
        run: |
          python -m py_compile .github/scripts/sync_phase2_content.py .github/scripts/validate_global_layout.py
          python .github/scripts/validate_global_layout.py
      - name: Run npm check
        run: npm run check
      - name: Run npm test
        run: npm test
      - name: Commit synchronized discovery
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add assets/js/search-core.js articles.html sitemap.xml
          if git diff --cached --quiet; then
            echo 'Discovery already synchronized.'
          else
            git commit -m 'seo: synchronize phase 2 article discovery [skip ci]'
            git push
          fi
