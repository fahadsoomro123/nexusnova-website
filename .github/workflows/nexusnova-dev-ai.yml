name: NexusNova Dev AI Check

on:
  pull_request:
    paths:
      - 'nexusnova-dev-ai/**'
      - '.github/workflows/nexusnova-dev-ai.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  syntax-check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Compile local AI modules
        run: |
          python -m py_compile nexusnova-dev-ai/agent.py
          python -m py_compile nexusnova-dev-ai/mobile_gateway.py
          python -m py_compile nexusnova-dev-ai/power_engine.py
          python -m py_compile nexusnova-dev-ai/mobile_gateway_v6.py
          python -m py_compile nexusnova-dev-ai/mobile_gateway_work_v6.py
          python -m py_compile nexusnova-dev-ai/power_engine_v6.py
          python -m py_compile nexusnova-dev-ai/project_tools_v6.py
          python -m py_compile nexusnova-dev-ai/git_tools_v6.py
          python -m py_compile nexusnova-dev-ai/specialists_v6.py
          python -m py_compile nexusnova-dev-ai/workspaces_v6.py
      - name: Import V2, V6 Ultimate and Work modules
        run: |
          cd nexusnova-dev-ai
          python - <<'PY'
          import agent, mobile_gateway, power_engine
          import mobile_gateway_v6, mobile_gateway_work_v6, power_engine_v6, project_tools_v6, git_tools_v6, specialists_v6, workspaces_v6
          assert power_engine.VERSION == '2.0.0'
          assert mobile_gateway.VERSION == '2.0.0'
          assert power_engine_v6.VERSION == '6.0.0'
          assert power_engine_v6.ULTIMATE is True
          assert mobile_gateway_v6.VERSION == '6.0.0'
          assert mobile_gateway_work_v6.VERSION == '6.1.0-work'
          assert workspaces_v6.VERSION == '6.1.0-work'
          assert project_tools_v6.VERSION == '6.0.0'
          assert git_tools_v6.VERSION == '6.0.0'
          assert specialists_v6.VERSION.endswith('ultimate')
          names={x['function']['name'] for x in mobile_gateway_work_v6.all_specs()}
          for required in ('project_context','scaffold_app','run_build','export_project_zip','git_commit_safe','work_open','work_context','work_task','work_note','work_save_artifact'):
              assert required in names, required
          assert 'git_commit' not in names
          allowed=mobile_gateway_work_v6.mode_tool_names('work')
          for required in ('work_open','work_context','work_task','work_note','work_save_artifact','web_search','write_file','run_build'):
              assert required in allowed, required
          print('NOVA AI V6 Ultimate + Work imports/tool policy OK')
          PY
      - name: Verify V6 routing and specialists
        run: |
          cd nexusnova-dev-ai
          python - <<'PY'
          import power_engine_v6 as p
          import specialists_v6 as s
          assert p.route('simple hello','chat','auto') == 'fast'
          assert p.route('meri nayi app bana do','builder','auto') == 'builder'
          assert p.route('deep website audit fix seo auth and build','power','auto') == 'deep'
          roles=s.select('Android APK login bug fix aur test karo','power','deep')
          assert len(roles) >= 2
          assert 'android' in roles or 'debugger' in roles
          assert len(roles) <= 3
          print('V6 Ultimate router/specialists OK:', roles)
          PY
      - name: Verify Work persistence primitives
        run: |
          cd nexusnova-dev-ai
          python - <<'PY'
          import tempfile
          from pathlib import Path
          import agent, workspaces_v6 as w
          with tempfile.TemporaryDirectory() as td:
              ws=agent.Workspace(td)
              assert w.work_open(ws,'Demo Work','Build a demo')['ok']
              assert w.work_task(ws,'add','Make first screen',name='Demo Work')['ok']
              assert w.work_note(ws,'Use a simple mobile layout',name='Demo Work')['ok']
              assert w.work_save_artifact(ws,'plan.md','# Plan',name='Demo Work')['ok']
              state=w.work_context(ws,'Demo Work')
              assert state['workspace']['objective']=='Build a demo'
              assert len(state['tasks'])==1
              assert state['artifacts'][0]['path']=='artifacts/plan.md'
              print('NOVA Work persistence OK')
          PY
      - name: Verify required files
        run: |
          test -f nexusnova-dev-ai/SYSTEM_PROMPT.md
          test -f nexusnova-dev-ai/NEXUSNOVA_KNOWLEDGE.md
          test -f nexusnova-dev-ai/INSTALL_MODEL.bat
          test -f nexusnova-dev-ai/SETUP_GITHUB.bat
          test -f nexusnova-dev-ai/START_NOVA_AI_V6.bat
          test -f nexusnova-dev-ai/CHECK_HARDWARE_V6.bat
          test -f nexusnova-dev-ai/V6-DESIGN.md
          test -f nexusnova-dev-ai/README_V6.md
          test -f nexusnova-dev-ai/specialists_v6.py
          test -f nexusnova-dev-ai/workspaces_v6.py
          test -f nexusnova-dev-ai/mobile_gateway_work_v6.py
      - name: Package NOVA AI V6 Ultimate Work
        uses: actions/upload-artifact@v4
        with:
          name: NexusNova-Dev-AI-V6-Ultimate-Work
          path: nexusnova-dev-ai/
          if-no-files-found: error
          retention-days: 30
