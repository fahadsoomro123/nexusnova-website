name: NexusNova Dev AI Check

on:
  pull_request:
    paths:
      - 'nexusnova-dev-ai/**'
      - '.github/workflows/nexusnova-dev-ai.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  syntax-check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Compile local AI modules
        run: |
          python -m py_compile nexusnova-dev-ai/agent.py
          python -m py_compile nexusnova-dev-ai/mobile_gateway.py
          python -m py_compile nexusnova-dev-ai/power_engine.py
          python -m py_compile nexusnova-dev-ai/mobile_gateway_v6.py
          python -m py_compile nexusnova-dev-ai/mobile_gateway_work_v6.py
          python -m py_compile nexusnova-dev-ai/power_engine_v6.py
          python -m py_compile nexusnova-dev-ai/project_tools_v6.py
          python -m py_compile nexusnova-dev-ai/git_tools_v6.py
          python -m py_compile nexusnova-dev-ai/specialists_v6.py
          python -m py_compile nexusnova-dev-ai/workspaces_v6.py
          python -m py_compile nexusnova-dev-ai/work_runtime_v6.py
          python -m py_compile nexusnova-dev-ai/work_intelligence_v6.py
          python -m py_compile nexusnova-dev-ai/pro_tools_v7.py
          python -m py_compile nexusnova-dev-ai/mobile_gateway_v7.py
      - name: Import V2, V6 Ultimate, Work MAX and V7 Pro MAX modules
        run: |
          cd nexusnova-dev-ai
          python - <<'PY'
          import agent, mobile_gateway, power_engine
          import mobile_gateway_v6, mobile_gateway_work_v6, power_engine_v6, project_tools_v6, git_tools_v6, specialists_v6
          import workspaces_v6, work_runtime_v6, work_intelligence_v6
          import pro_tools_v7, mobile_gateway_v7
          assert power_engine.VERSION == '2.0.0'
          assert mobile_gateway.VERSION == '2.0.0'
          assert power_engine_v6.VERSION == '6.0.0'
          assert power_engine_v6.ULTIMATE is True
          assert mobile_gateway_v6.VERSION == '6.0.0'
          assert mobile_gateway_work_v6.VERSION == '6.2.0-work-max'
          assert workspaces_v6.VERSION == '6.2.0-work-max'
          assert work_runtime_v6.VERSION == '6.2.0-work-max'
          assert work_intelligence_v6.VERSION == '6.2.0-work-max'
          assert project_tools_v6.VERSION == '6.0.0'
          assert git_tools_v6.VERSION == '6.0.0'
          assert specialists_v6.VERSION.endswith('ultimate')
          assert pro_tools_v7.VERSION == '7.0.0-pro-tools'
          assert mobile_gateway_v7.VERSION == '7.0.0-pro-max'
          names={x['function']['name'] for x in mobile_gateway_v7.all_specs()}
          for required in ('project_context','scaffold_app','run_build','export_project_zip','git_commit_safe','work_open','work_context','work_task','work_note','work_set_instructions','work_save_file','work_read_file','work_save_artifact','deep_research','knowledge_search','analyze_data'):
              assert required in names, required
          assert 'git_commit' not in names
          allowed=mobile_gateway_v7.mode_tool_names('work')
          for required in ('work_open','work_context','work_task','work_note','work_save_artifact','work_save_file','work_read_file','web_search','write_file','run_build','deep_research','knowledge_search','analyze_data'):
              assert required in allowed, required
          assert 'deep_research' in mobile_gateway_v7.mode_tool_names('research')
          assert 'analyze_data' in mobile_gateway_v7.mode_tool_names('research')
          print('NOVA AI V7 Pro MAX imports/tool policy OK')
          PY
      - name: Verify V6 routing and specialists
        run: |
          cd nexusnova-dev-ai
          python - <<'PY'
          import power_engine_v6 as p
          import specialists_v6 as s
          assert p.route('simple hello','chat','auto') == 'fast'
          assert p.route('meri nayi app bana do','builder','auto') == 'builder'
          assert p.route('deep website audit fix seo auth and build','power','auto') == 'deep'
          roles=s.select('Android APK login bug fix aur test karo','power','deep')
          assert len(roles) >= 2
          assert 'android' in roles or 'debugger' in roles
          assert len(roles) <= 3
          print('V6 Ultimate router/specialists OK:', roles)
          PY
      - name: Verify Work MAX persistence primitives
        run: |
          cd nexusnova-dev-ai
          python - <<'PY'
          import tempfile
          import agent, workspaces_v6 as w
          with tempfile.TemporaryDirectory() as td:
              ws=agent.Workspace(td)
              assert w.work_open(ws,'Demo Work','Build a demo')['ok']
              assert w.work_set_instructions(ws,'Keep UI simple and mobile first',name='Demo Work')['ok']
              assert w.work_task(ws,'add','Make first screen',name='Demo Work')['ok']
              assert w.work_note(ws,'Use a simple mobile layout',name='Demo Work')['ok']
              assert w.work_save_file(ws,'requirements.md','# Requirements',name='Demo Work')['ok']
              assert w.work_save_artifact(ws,'plan.md','# Plan',name='Demo Work')['ok']
              assert w.work_read_file(ws,'files/requirements.md',name='Demo Work')['content']=='# Requirements'
              state=w.work_context(ws,'Demo Work')
              assert state['workspace']['objective']=='Build a demo'
              assert 'mobile first' in state['instructions']
              assert len(state['tasks'])==1
              assert state['files'][0]['path']=='files/requirements.md'
              assert state['artifacts'][0]['path']=='artifacts/plan.md'
              print('NOVA Work MAX persistence OK')
          PY
      - name: Verify persistent background job runtime
        run: |
          cd nexusnova-dev-ai
          python - <<'PY'
          import tempfile,time
          from pathlib import Path
          import work_runtime_v6 as r
          def runner(body,progress,cancel):
              progress('testing','dummy runner');return 200,{'ok':True,'reply':'done','work':{'ok':True},'power':{'review_pass':True}}
          with tempfile.TemporaryDirectory() as td:
              rt=r.WorkRuntime(Path(td),runner)
              x=rt.submit({'message':'build demo','work_workspace':'Demo'})
              assert x['ok'];jid=x['job']['id']
              for _ in range(50):
                  row=rt.get(jid)
                  if row['status'] in r.TERMINAL:break
                  time.sleep(.05)
              assert row['status']=='completed',row
              assert row['result']['reply']=='done'
              assert rt.stats()['completed']==1
              print('NOVA Work MAX background runtime OK')
          PY
      - name: Verify V7 local retrieval and data analysis
        run: |
          cd nexusnova-dev-ai
          python - <<'PY'
          import tempfile
          from pathlib import Path
          import agent, pro_tools_v7 as p
          with tempfile.TemporaryDirectory() as td:
              root=Path(td)
              (root/'auth_notes.md').write_text('Telegram Firebase authentication profile linking and token validation',encoding='utf-8')
              (root/'sample.csv').write_text('name,score\nA,10\nB,20\nC,30\n',encoding='utf-8')
              ws=agent.Workspace(td)
              k=p.knowledge_search(ws,'telegram firebase auth linking',8)
              assert k['ok'] and k['results'] and k['results'][0]['path']=='auth_notes.md',k
              d=p.analyze_data(ws,'sample.csv',100)
              assert d['ok'] and d['kind']=='csv',d
              score=[x for x in d['columns'] if x['name']=='score'][0]
              assert score['type']=='number' and score['mean']==20.0,score
              print('V7 retrieval/data tools OK')
          PY
      - name: Verify required files
        run: |
          test -f nexusnova-dev-ai/SYSTEM_PROMPT.md
          test -f nexusnova-dev-ai/NEXUSNOVA_KNOWLEDGE.md
          test -f nexusnova-dev-ai/INSTALL_MODEL.bat
          test -f nexusnova-dev-ai/SETUP_GITHUB.bat
          test -f nexusnova-dev-ai/START_NOVA_AI_V6.bat
          test -f nexusnova-dev-ai/CHECK_HARDWARE_V6.bat
          test -f nexusnova-dev-ai/V6-DESIGN.md
          test -f nexusnova-dev-ai/README_V6.md
          test -f nexusnova-dev-ai/specialists_v6.py
          test -f nexusnova-dev-ai/workspaces_v6.py
          test -f nexusnova-dev-ai/work_runtime_v6.py
          test -f nexusnova-dev-ai/work_intelligence_v6.py
          test -f nexusnova-dev-ai/mobile_gateway_work_v6.py
          test -f nexusnova-dev-ai/pro_tools_v7.py
          test -f nexusnova-dev-ai/mobile_gateway_v7.py
          test -f nexusnova-dev-ai/START_NOVA_AI_V7.bat
          test -f nexusnova-dev-ai/README_V7.md
      - name: Package NOVA AI V6 Ultimate Work MAX
        uses: actions/upload-artifact@v4
        with:
          name: NexusNova-Dev-AI-V6-Ultimate-Work-MAX
          path: nexusnova-dev-ai/
          if-no-files-found: error
          retention-days: 30
      - name: Package NOVA AI V7 Pro MAX
        uses: actions/upload-artifact@v4
        with:
          name: NexusNova-Dev-AI-V7-Pro-MAX
          path: nexusnova-dev-ai/
          if-no-files-found: error
          retention-days: 30
