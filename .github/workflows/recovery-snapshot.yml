name: NexusNova Recovery Snapshot

on:
  schedule:
    - cron: '40 3 * * 0'
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/recovery-snapshot.yml'

permissions:
  contents: read

concurrency:
  group: nexusnova-recovery-snapshot
  cancel-in-progress: true

jobs:
  snapshot:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout full tracked source
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Create recovery manifest
        run: |
          {
            echo "NexusNova Recovery Snapshot"
            echo "Generated UTC: $(date -u +'%Y-%m-%dT%H:%M:%SZ')"
            echo "Repository: ${GITHUB_REPOSITORY}"
            echo "Branch: ${GITHUB_REF_NAME}"
            echo "Commit: ${GITHUB_SHA}"
            echo "Tracked files: $(git ls-files | wc -l)"
            echo
            echo "Critical checksums:"
            for f in CNAME ads.txt app-ads.txt index.html .github/workflows/traffic-autopilot.yml .github/workflows/daily-website-caretaker.yml .github/workflows/tool-factory.yml; do
              if [ -f "$f" ]; then sha256sum "$f"; fi
            done
          } > recovery-manifest.txt

      - name: Package tracked repository source
        run: |
          SHORT_SHA="${GITHUB_SHA:0:12}"
          git archive --format=tar.gz --output="nexusnova-recovery-${SHORT_SHA}.tar.gz" HEAD
          sha256sum "nexusnova-recovery-${SHORT_SHA}.tar.gz" > recovery-archive-sha256.txt
          ls -lh "nexusnova-recovery-${SHORT_SHA}.tar.gz"

      - name: Publish recovery summary
        run: |
          echo '## NexusNova Recovery Snapshot' >> "$GITHUB_STEP_SUMMARY"
          echo "**Commit:** \`${GITHUB_SHA}\`" >> "$GITHUB_STEP_SUMMARY"
          echo '' >> "$GITHUB_STEP_SUMMARY"
          echo 'A restorable tracked-source archive was created. GitHub Actions secrets are intentionally not included.' >> "$GITHUB_STEP_SUMMARY"
          echo '' >> "$GITHUB_STEP_SUMMARY"
          cat recovery-manifest.txt >> "$GITHUB_STEP_SUMMARY"

      - name: Upload recovery artifact
        uses: actions/upload-artifact@v4
        with:
          name: nexusnova-recovery-${{ github.run_id }}
          path: |
            nexusnova-recovery-*.tar.gz
            recovery-manifest.txt
            recovery-archive-sha256.txt
          if-no-files-found: error
          retention-days: 14
