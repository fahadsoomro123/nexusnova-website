          check_contains '/assets/js/search-core.js' 'url:"tools/stock-profit-calculator.html"' 'stock tool included in search'
          check_contains '/assets/js/search-core.js' 'url:"tools/crypto-profit-calculator.html"' 'crypto tool included in search'
          check_contains '/assets/js/related-tools.js' "'/tools/us-federal-tax-bracket-calculator.html': [" 'tax tool has related-tool priority'
          check_contains '/assets/js/related-tools.js' "'/tools/mortgage-payoff-calculator.html': [" 'mortgage tool has related-tool priority'
          check_contains '/assets/js/related-tools.js' "'/tools/loan-payoff-calculator.html': [" 'loan tool has related-tool priority'
          check_contains '/assets/js/related-tools.js' "'/tools/stock-profit-calculator.html': [" 'stock tool has related-tool priority'
          check_contains '/assets/js/related-tools.js' "'/tools/crypto-profit-calculator.html': [" 'crypto tool has related-tool priority'
          check_contains '/ai-prompt-enhancer.html' 'data-tier1-tool="prompt-enhancer"' 'AI prompt enhancer route is the expected tool'
          check_contains '/short-form-video-hook-generator.html' 'data-tier1-tool="video-hooks"' 'short-form script generator route is the expected tool'
          check_contains '/freelance-rate-calculator.html' 'data-tier1-tool="freelance-rate"' 'freelance calculator route is the expected tool'
          check_contains '/crypto-tax-profit-estimator.html' 'data-tier1-tool="crypto-tax"' 'crypto estimator route is the expected tool'
          check_contains '/privacy-policy-terms-generator.html' 'data-tier1-tool="policy-generator"' 'privacy and terms generator route is the expected tool'
          check_contains '/ai-prompt-enhancer.html' 'assets/css/tier1-tools.css?v=20261015-v4' 'new tool links cache-busted shared CSS'
          check_contains '/crypto-tax-profit-estimator.html' 'assets/js/tier1-tools.js?v=20261015-v4' 'new tool links cache-busted shared engine'
          check_contains '/guides/ai-prompt-workflows-2026.html' 'href="https://nexusnovatools.com/guides/ai-prompt-workflows-2026.html"' 'AI prompt guide canonical'
          check_contains '/guides/short-form-hooks-2026.html' 'href="https://nexusnovatools.com/guides/short-form-hooks-2026.html"' 'short-form guide canonical'
          check_contains '/guides/freelance-pricing-remote-work.html' 'href="https://nexusnovatools.com/guides/freelance-pricing-remote-work.html"' 'freelance pricing guide canonical'
          check_contains '/guides/crypto-recordkeeping-us-uk-2026.html' 'href="https://nexusnovatools.com/guides/crypto-recordkeeping-us-uk-2026.html"' 'crypto recordkeeping guide canonical'
          check_contains '/guides/app-privacy-terms-checklist.html' 'href="https://nexusnovatools.com/guides/app-privacy-terms-checklist.html"' 'privacy checklist guide canonical'
          check_contains '/categories.html' 'Browse All 108 Tools Directory' 'categories hub count matches 108'
          check_contains '/tools.html' 'assets/css/site.css?v=20261015-v4' 'tools directory CSS cache-busted'
          check_contains '/guides.html' 'assets/js/search-core.js?v=20261015-v4' 'guides hub search asset cache-busted'
          check_contains '/articles.html' 'assets/js/search-core.js?v=20261015-v4' 'articles hub search asset cache-busted'
          check_contains '/short-form-video-hook-generator.html' 'assets/js/tier1-tools.js?v=20261015-v4' 'hook generator cache-busted engine'
          check_contains '/freelance-rate-calculator.html' 'assets/js/tier1-tools.js?v=20261015-v4' 'freelance calculator cache-busted engine'
          check_contains '/privacy-policy-terms-generator.html' 'assets/js/tier1-tools.js?v=20261015-v4' 'policy generator cache-busted engine'
          # Print direct HTTP headers and assert raw-body content from the live public origin.
          live_home_headers=/tmp/nexusnova-live-home.headers
          live_home_body=/tmp/nexusnova-live-home.body
          live_home_code="$(curl -sS -L -D "$live_home_headers" -o "$live_home_body" -w '%{http_code}' --connect-timeout 3 --max-time 12 -H 'Cache-Control: no-cache, no-store, max-age=0' -H 'Pragma: no-cache' -H 'User-Agent: NexusNovaLiveProof/2.0' "$base/?live-proof=$GITHUB_SHA" || true)"
          echo "LIVE RAW HTTP PROOF homepage status=$live_home_code url=$base/?live-proof=$GITHUB_SHA"
          grep -iE '^(HTTP/|date:|content-type:|cache-control:|etag:|last-modified:|age:|via:|server:|x-cache:|x-served-by:)' "$live_home_headers" | tail -n 24 || true
          if [ "$live_home_code" != '200' ]; then echo 'LIVE RAW HTTP FAIL: homepage did not return HTTP 200.' >&2; exit 1; fi
          grep -F '<title>NexusNova Tools — 108 Free Online Browser Tools & Guides</title>' "$live_home_body" || { echo 'LIVE RAW BODY FAIL: homepage title does not match 108 tools.' >&2; exit 1; }
          grep -F '<meta property="og:title" content="NexusNova Tools — 108 Free Online Browser Tools & Guides">' "$live_home_body" || { echo 'LIVE RAW BODY FAIL: Open Graph title is stale.' >&2; exit 1; }
          grep -F '<meta name="twitter:title" content="NexusNova Tools — 108 Free Online Browser Tools & Guides">' "$live_home_body" || { echo 'LIVE RAW BODY FAIL: Twitter title is stale.' >&2; exit 1; }
          grep -F 'assets/js/search-core.js?v=20261015-v4' "$live_home_body" || { echo 'LIVE RAW BODY FAIL: current search-core asset reference is missing.' >&2; exit 1; }
          echo 'LIVE RAW BODY PASS: homepage title + social titles + v2 search asset are present in the deployed HTTP body.'

          live_tools_headers=/tmp/nexusnova-live-tools.headers
          live_tools_body=/tmp/nexusnova-live-tools.body
          live_tools_code="$(curl -sS -L -D "$live_tools_headers" -o "$live_tools_body" -w '%{http_code}' --connect-timeout 3 --max-time 12 -H 'Cache-Control: no-cache, no-store, max-age=0' -H 'Pragma: no-cache' -H 'User-Agent: NexusNovaLiveProof/2.0' "$base/tools.html?live-proof=$GITHUB_SHA" || true)"
          echo "LIVE RAW HTTP PROOF tools status=$live_tools_code url=$base/tools.html?live-proof=$GITHUB_SHA"
          grep -iE '^(HTTP/|date:|content-type:|cache-control:|etag:|last-modified:|age:|via:|server:|x-cache:|x-served-by:)' "$live_tools_headers" | tail -n 24 || true
          if [ "$live_tools_code" != '200' ]; then echo 'LIVE RAW HTTP FAIL: tools directory did not return HTTP 200.' >&2; exit 1; fi
          grep -F 'id="directory-search-count">108 tools' "$live_tools_body" || { echo 'LIVE RAW BODY FAIL: tools count is not 108.' >&2; exit 1; }
          echo 'LIVE RAW BODY PASS: tools directory count is 108.'

          live_search_url="$base/assets/js/search-core.js?v=20261015-v4"
          curl -fsS -L --connect-timeout 3 --max-time 12 -H 'Cache-Control: no-cache, no-store, max-age=0' -H 'Pragma: no-cache' "$live_search_url" -o /tmp/nexusnova-live-search-core.js || { echo 'LIVE SEARCH FAIL: could not fetch the public v2 search asset.' >&2; exit 1; }
          node - <<'NODE' || { echo 'LIVE SEARCH FAIL: live search runtime assertions failed.' >&2; exit 1; }
          const fs = require('node:fs');
          const vm = require('node:vm');
