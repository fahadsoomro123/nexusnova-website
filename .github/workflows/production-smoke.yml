name: NexusNova Production Smoke

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/production-smoke.yml"
      - ".github/scripts/sitewide_visual_logic_audit.py"
      - "**.html"
      - "assets/**/*.css"
      - "assets/**/*.js"
      - "robots.txt"
      - "ads.txt"
      - "sitemap*.xml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: nexusnova-production-smoke
  cancel-in-progress: true

jobs:
  production-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout exact commit for deployment comparison
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 2

      - name: Set up Node 22
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22"

      - name: Syntax and repository checks
        run: npm run check

      - name: Full repository test suite
        run: npm test

      - name: Wait for changed static files to match this commit
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import hashlib
          import subprocess
          import time
          from concurrent.futures import ThreadPoolExecutor
          from pathlib import Path
          from urllib.error import HTTPError, URLError
          from urllib.parse import quote
          from urllib.request import Request, urlopen

          base = 'https://nexusnovatools.com'
          commit = subprocess.check_output(['git', 'rev-parse', 'HEAD'], text=True).strip()
          paths = subprocess.check_output([
              'git', 'diff', '--name-only', 'HEAD^', 'HEAD', '--',
              '*.html', 'assets/**/*.css', 'assets/**/*.js',
              'assets/**/*.png', 'assets/**/*.webp', 'robots.txt', 'ads.txt', 'sitemap*.xml'
          ], text=True).splitlines()
          paths = [p for p in paths if p and not p.startswith('.github/') and Path(p).is_file()]
          if not paths:
              paths = ['index.html']
          expected = {
              path: hashlib.sha256(Path(path).read_bytes()).hexdigest()
              for path in paths
          }

          def check(path, attempt):
              route = '/' if path == 'index.html' else '/' + quote(path, safe='/')
              url = f'{base}{route}?deploy={commit}-{attempt}'
              request = Request(url, headers={
                  'Cache-Control': 'no-cache, no-store, max-age=0',
                  'Pragma': 'no-cache',
                  'User-Agent': 'NexusNovaProductionSmoke/3.0'
              })
              try:
                  with urlopen(request, timeout=8) as response:
                      body = response.read()
                      status = response.status
                  actual = hashlib.sha256(body).hexdigest()
                  return path, expected[path], actual, status
              except (HTTPError, URLError, TimeoutError, OSError) as exc:
                  return path, expected[path], type(exc).__name__, None

          workers = min(24, max(1, len(paths)))
          with ThreadPoolExecutor(max_workers=workers) as pool:
              for attempt in range(1, 41):
                  results = list(pool.map(lambda path: check(path, attempt), paths))
                  stale = [result for result in results if result[1] != result[2] or result[3] != 200]
                  if not stale:
                      print(f'DEPLOYMENT READY: {len(paths)} changed static file(s) match commit {commit} on attempt {attempt}.')
                      break
                  for path, wanted, observed, status in stale[:8]:
                      print(f'Waiting for deploy attempt {attempt}/40: {path} expected_sha256={wanted[:12]} actual={observed[:24]} status={status}')
                  if attempt == 40:
                      raise SystemExit(f'PRODUCTION FAIL: {len(stale)} changed static file(s) did not match this commit within the bounded wait.')
                  time.sleep(3)
          PY

      - name: Verify production routes and content markers with diagnostics
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import concurrent.futures
          import html.parser
          import os
          import re
          import time
          import urllib.parse
          import urllib.request
          import xml.etree.ElementTree as ET
          from pathlib import Path

          BASE = "https://nexusnovatools.com"
          COMMIT = os.environ.get("GITHUB_SHA", "unknown")
          CORE = Path("assets/js/search-core.js").read_text(encoding="utf-8")
          TOOL_PATTERN = re.compile(r'\{\s*title:"(?:[^"\\]|\\.)*",\s*url:"([^"]+)",\s*type:"tool"')
          tools = [m.group(1).split("#", 1)[0].split("?", 1)[0] for m in TOOL_PATTERN.finditer(CORE)]
          tools = list(dict.fromkeys(tools))
          if len(tools) != 108:
              raise SystemExit(f"SOURCE_TOOL_INDEX_FAIL expected=108 actual={len(tools)}")

          namespace = {"s": "http://www.sitemaps.org/schemas/sitemap/0.9"}
          source_sitemap = ET.parse("sitemap.xml").getroot()
          source_entries = source_sitemap.findall("s:url", namespace)
          article_urls = sorted({
              (entry.find("s:loc", namespace).text or "").strip()
              for entry in source_entries
              if entry.find("s:loc", namespace) is not None
              and (entry.find("s:loc", namespace).text or "").strip().startswith(BASE + "/articles/")
          })
          article_paths = [urllib.parse.urlparse(url).path.lstrip("/") for url in article_urls]
          if len(article_urls) != 100:
              raise SystemExit(f"SOURCE_ARTICLE_SITEMAP_FAIL expected=100 actual={len(article_urls)}")
          missing = [path for path in tools + article_paths if not Path(path).is_file()]
          if missing:
              raise SystemExit("SOURCE_ROUTE_FILE_MISSING: " + ", ".join(missing[:40]))
          print(f"SOURCE_INVENTORY_PASS tools={len(tools)} article_pages={len(article_paths)} sitemap_urls={len(source_entries)}")

          class ArticleHubParser(html.parser.HTMLParser):
              def __init__(self):
                  super().__init__(convert_charrefs=True)
                  self.cards = 0
                  self.count_open = False
                  self.count_parts = []

              def handle_starttag(self, tag, attrs):
                  attrs = dict(attrs)
                  if tag.lower() == "a":
                      classes = attrs.get("class", "").split()
                      href = attrs.get("href", "")
                      if "nn-article-card" in classes and re.fullmatch(r"articles/[^?#]+\.html", href):
                          self.cards += 1
                  if attrs.get("id") == "article-search-count":
                      self.count_open = True

              def handle_data(self, data):
                  if self.count_open:
                      self.count_parts.append(data)

              def handle_endtag(self, tag):
                  if tag.lower() == "span" and self.count_open:
                      self.count_open = False

              @property
              def display_count(self):
                  return " ".join(" ".join(self.count_parts).split())

          def fetch(path, attempt):
              route = "/" + urllib.parse.quote(path.lstrip("/"), safe="/") if path else "/"
              url = f"{BASE}{route}?production_smoke={COMMIT}-{attempt}"
              request = urllib.request.Request(url, headers={
                  "User-Agent": "NexusNovaProductionSmoke/3.0",
                  "Cache-Control": "no-cache, no-store, max-age=0",
                  "Pragma": "no-cache",
                  "Accept-Encoding": "identity",
              })
              with urllib.request.urlopen(request, timeout=8) as response:
                  body = response.read()
                  if response.status != 200:
                      raise RuntimeError(f"{path or '/'}: HTTP {response.status}")
              return body

          def validate_hub():
              body = fetch("articles.html", 1).decode("utf-8-sig", "replace")
              parser = ArticleHubParser()
              parser.feed(body)
              if parser.cards != 100 or parser.display_count != "100 articles":
                  raise RuntimeError(f"articles.html: cards={parser.cards}, display_count={parser.display_count!r}")
              return f"LIVE_ARTICLES_HUB_PASS http=200 cards={parser.cards} count={parser.display_count!r}"

          def validate_sitemap():
              root = ET.fromstring(fetch("sitemap.xml", 1))
              entries = root.findall("s:url", namespace)
              locs = [
                  (entry.find("s:loc", namespace).text or "").strip()
                  for entry in entries
                  if entry.find("s:loc", namespace) is not None
              ]
              lastmods = [entry.find("s:lastmod", namespace) for entry in entries]
              live_articles = {loc for loc in locs if loc.startswith(BASE + "/articles/")}
              if len(entries) < 97 or len(locs) != len(entries):
                  raise RuntimeError(f"sitemap.xml: urls={len(entries)} valid_locs={len(locs)}")
              if len(live_articles) != 100:
                  raise RuntimeError(f"sitemap.xml: expected 100 article URLs, got {len(live_articles)}")
              if any(node is None or not (node.text or "").strip() for node in lastmods):
                  raise RuntimeError("sitemap.xml: missing lastmod on one or more entries")
              if any(not loc.startswith(BASE + "/") for loc in locs):
                  raise RuntimeError("sitemap.xml: non-canonical hostname detected")
              return f"LIVE_SITEMAP_PASS http=200 urls={len(entries)} article_urls={len(live_articles)} lastmod=present"

          special_errors = []
          for name, fn in (("articles.html", validate_hub), ("sitemap.xml", validate_sitemap)):
              for attempt in range(1, 31):
                  try:
                      print(fn() + f" attempt={attempt}")
                      break
                  except Exception as exc:
                      if attempt == 30:
                          special_errors.append(f"{name}: {exc}")
                      else:
                          print(f"Waiting for {name} deploy attempt={attempt}/30: {exc}")
                          time.sleep(3)
          if special_errors:
              raise SystemExit("SPECIAL_LIVE_CHECK_FAIL: " + " | ".join(special_errors))

          routes = list(dict.fromkeys(["", "index.html", *tools, *article_paths]))
          def check(path):
              last = ""
              for attempt in range(1, 4):
                  try:
                      fetch(path, attempt)
                      return path, 200, ""
                  except Exception as exc:
                      last = str(exc)[:200]
                      if attempt < 3:
                          time.sleep(1)
              return path, 0, last

          with concurrent.futures.ThreadPoolExecutor(max_workers=24) as pool:
              results = list(pool.map(check, routes))
          failures = [(path, status, detail) for path, status, detail in results if status != 200]
          print(f"LIVE_ROUTE_MATRIX {'FAIL' if failures else 'PASS'} total={len(results)} passed={len(results)-len(failures)} failed={len(failures)}")
          for path, status, detail in failures[:50]:
              print(f"LIVE_ROUTE_FAIL status={status} path={path} detail={detail}")
          if failures:
              raise SystemExit(1)
          print(f"PRODUCTION_SMOKE_PASS commit={COMMIT} live_routes={len(results)} article_hub=100 sitemap_articles=100")
          PY
