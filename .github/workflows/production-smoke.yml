          check_contains '/sitemap.xml' 'https://nexusnovatools.com/tools/mortgage-payoff-calculator.html' 'mortgage tool included in sitemap'
          check_contains '/sitemap.xml' 'https://nexusnovatools.com/tools/loan-payoff-calculator.html' 'loan tool included in sitemap'
          check_contains '/sitemap.xml' 'https://nexusnovatools.com/tools/stock-profit-calculator.html' 'stock tool included in sitemap'
          check_contains '/sitemap.xml' 'https://nexusnovatools.com/tools/crypto-profit-calculator.html' 'crypto tool included in sitemap'
          check_contains '/assets/js/search-core.js' 'url:"tools/us-federal-tax-bracket-calculator.html"' 'tax tool included in search'
