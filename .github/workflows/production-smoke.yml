# Production verification guard for NexusNova core, HumanProof, Labs and trust/tool pages.
name: NexusNova Production Smoke

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/production-smoke.yml'
      - 'index.html'
      - 'humanproof.html'
      - 'live.html'
      - 'sports-live.html'
      - 'network-tools.html'
      - 'public-ip-checker.html'
      - 'ssl-certificate-checker.html'
      - 'currency-rates.html'
      - 'gold-rates.html'
      - 'fuel-rates.html'
      - 'weather-live.html'
      - 'earthquakes-live.html'
      - 'zakat-calculator-pakistan.html'
      - 'electricity-bill-calculator-pakistan.html'
      - 'salary-tax-calculator-pakistan.html'
      - 'prayer-times-qibla-pakistan.html'
      - 'labs.html'
      - 'pulse.html'
      - 'magic-drop.html'
      - 'xray.html'
      - 'widgets.html'
      - 'widget-pakistan-today.html'
      - 'reaction-time-test.html'
      - 'contact.html'
      - 'privacy.html'
      - 'resume-builder.html'
      - 'image-to-text-ocr.html'
      - 'invoice-maker.html'
      - 'jpg-to-pdf.html'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  production-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 7
    steps:
      - name: Wait for deployed flagship and trust markers
        shell: bash
        run: |
          set -euo pipefail
          base='https://nexusnovatools.com'
          for attempt in $(seq 1 30); do
            home="$(curl -fsSL --connect-timeout 10 --max-time 20 -H 'Cache-Control: no-cache' "$base/?smoke=${GITHUB_SHA}-${attempt}" || true)"
            humanproof="$(curl -fsSL --connect-timeout 10 --max-time 20 -H 'Cache-Control: no-cache' "$base/humanproof.html?smoke=${GITHUB_SHA}-${attempt}" || true)"
            live="$(curl -fsSL --connect-timeout 10 --max-time 20 -H 'Cache-Control: no-cache' "$base/live.html?smoke=${GITHUB_SHA}-${attempt}" || true)"
            labs="$(curl -fsSL --connect-timeout 10 --max-time 20 -H 'Cache-Control: no-cache' "$base/labs.html?smoke=${GITHUB_SHA}-${attempt}" || true)"
            contact="$(curl -fsSL --connect-timeout 10 --max-time 20 -H 'Cache-Control: no-cache' "$base/contact.html?smoke=${GITHUB_SHA}-${attempt}" || true)"
            privacy="$(curl -fsSL --connect-timeout 10 --max-time 20 -H 'Cache-Control: no-cache' "$base/privacy.html?smoke=${GITHUB_SHA}-${attempt}" || true)"
            resume="$(curl -fsSL --connect-timeout 10 --max-time 20 -H 'Cache-Control: no-cache' "$base/resume-builder.html?smoke=${GITHUB_SHA}-${attempt}" || true)"
            ocr="$(curl -fsSL --connect-timeout 10 --max-time 20 -H 'Cache-Control: no-cache' "$base/image-to-text-ocr.html?smoke=${GITHUB_SHA}-${attempt}" || true)"
            invoice="$(curl -fsSL --connect-timeout 10 --max-time 20 -H 'Cache-Control: no-cache' "$base/invoice-maker.html?smoke=${GITHUB_SHA}-${attempt}" || true)"
            jpgpdf="$(curl -fsSL --connect-timeout 10 --max-time 20 -H 'Cache-Control: no-cache' "$base/jpg-to-pdf.html?smoke=${GITHUB_SHA}-${attempt}" || true)"

            if grep -Fq '<link rel="canonical" href="https://nexusnovatools.com/">' <<<"$home" \
              && grep -Fq 'NexusNova HumanProof' <<<"$home" \
              && grep -Fq 'id="trust"' <<<"$home" \
              && grep -Fq 'humanproof.html#live-verification' <<<"$home" \
              && grep -Fq '<link rel="canonical" href="https://nexusnovatools.com/humanproof.html">' <<<"$humanproof" \
              && grep -Fq 'exact-action binding' <<<"$humanproof" \
              && grep -Fq '<link rel="canonical" href="https://nexusnovatools.com/live.html">' <<<"$live" \
              && grep -Fq '<link rel="canonical" href="https://nexusnovatools.com/labs.html">' <<<"$labs" \
              && grep -Fq 'nexusnovatools@gmail.com' <<<"$contact" \
              && grep -Fq '<link rel="canonical" href="https://nexusnovatools.com/privacy.html">' <<<"$privacy" \
              && grep -Fq '<link rel="canonical" href="https://nexusnovatools.com/resume-builder.html">' <<<"$resume" \
              && grep -Fq '<link rel="canonical" href="https://nexusnovatools.com/image-to-text-ocr.html">' <<<"$ocr" \
              && grep -Fq '<link rel="canonical" href="https://nexusnovatools.com/invoice-maker.html">' <<<"$invoice" \
              && grep -Fq '<link rel="canonical" href="https://nexusnovatools.com/jpg-to-pdf.html">' <<<"$jpgpdf"; then
              echo 'Current flagship, HumanProof, trust and tool markers are deployed.'
              exit 0
            fi
            sleep 5
          done
          echo 'Production did not expose the expected current flagship, HumanProof, trust and tool markers.' >&2
          exit 1

      - name: Verify important production routes
        shell: bash
        run: |
          set -euo pipefail
          base='https://nexusnovatools.com'
          routes=(
            '/'
            '/humanproof.html'
            '/live.html'
            '/sports-live.html'
            '/network-tools.html'
            '/public-ip-checker.html'
            '/ssl-certificate-checker.html'
            '/currency-rates.html'
            '/gold-rates.html'
            '/fuel-rates.html'
            '/weather-live.html'
            '/earthquakes-live.html'
            '/zakat-calculator-pakistan.html'
            '/electricity-bill-calculator-pakistan.html'
            '/salary-tax-calculator-pakistan.html'
            '/prayer-times-qibla-pakistan.html'
            '/labs.html'
            '/pulse.html'
            '/magic-drop.html'
            '/xray.html'
            '/widgets.html'
            '/widget-pakistan-today.html'
            '/reaction-time-test.html'
            '/contact.html'
            '/privacy.html'
            '/resume-builder.html'
            '/image-to-text-ocr.html'
            '/invoice-maker.html'
            '/jpg-to-pdf.html'
          )
          for route in "${routes[@]}"; do
            code="$(curl -sS -L -o /dev/null -w '%{http_code}' --connect-timeout 10 --max-time 20 -H 'Cache-Control: no-cache' "$base$route?smoke=${GITHUB_SHA}")"
            echo "$code $route"
            test "$code" = '200'
          done
