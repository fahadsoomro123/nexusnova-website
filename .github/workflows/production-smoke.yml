# Production verification guard for NexusNova core, HumanProof, Intelligence, Labs and trust/tool pages.
# Post-deploy gate: wait for Pages propagation before validating published routes.
name: NexusNova Production Smoke

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/production-smoke.yml'
      - '.github/workflows/privacy-analytics-production.yml'
      - '**.html'
      - 'assets/**/*.css'
      - 'assets/**/*.js'
      - 'assets/**/*.png'
      - 'assets/**/*.webp'
      - 'robots.txt'
      - 'ads.txt'
      - 'sitemap*.xml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  production-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 7
    steps:
      - name: Checkout exact commit for deployment comparison
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 2

      - name: Wait for changed static files to match this commit
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import hashlib
          import subprocess
          import time
          from pathlib import Path
          from concurrent.futures import ThreadPoolExecutor
          from urllib.error import HTTPError, URLError
          from urllib.parse import quote
          from urllib.request import Request, urlopen

          base = 'https://nexusnovatools.com'
          commit = subprocess.check_output(['git', 'rev-parse', 'HEAD'], text=True).strip()
          paths = subprocess.check_output([
              'git', 'diff', '--name-only', 'HEAD^', 'HEAD', '--',
              '*.html', 'assets/**/*.css', 'assets/**/*.js',
              'assets/**/*.png', 'assets/**/*.webp', 'robots.txt', 'ads.txt', 'sitemap*.xml'
          ], text=True).splitlines()
          paths = [p for p in paths if p and not p.startswith('.github/')]
          if not paths:
              paths = ['index.html']
          expected = {
              path: hashlib.sha256(Path(path).read_bytes()).hexdigest()
              for path in paths
          }

          def check(path, attempt):
              route = '/' if path == 'index.html' else '/' + quote(path, safe='/')
              url = f'{base}{route}?deploy={commit}-{attempt}'
              req = Request(url, headers={
                  'Cache-Control': 'no-cache, no-store, max-age=0',
                  'Pragma': 'no-cache',
                  'User-Agent': 'NexusNovaProductionSmoke/2.0'
              })
              try:
                  with urlopen(req, timeout=3) as response:
                      body = response.read()
                  actual = hashlib.sha256(body).hexdigest()
                  return path, expected[path], actual, response.status
              except (HTTPError, URLError, TimeoutError, OSError) as exc:
                  return path, expected[path], type(exc).__name__, None

          workers = min(32, max(1, len(paths)))
          with ThreadPoolExecutor(max_workers=workers) as pool:
              for attempt in range(1, 41):
                  results = list(pool.map(lambda path: check(path, attempt), paths))
                  stale = [r for r in results if r[1] != r[2] or r[3] != 200]
                  if not stale:
                      print(f'DEPLOYMENT READY: {len(paths)} changed static file(s) match commit {commit} on attempt {attempt}.')
                      break
                  for path, wanted, observed, status in stale[:8]:
                      print(f'Waiting for deploy attempt {attempt}/40: {path} expected_sha256={wanted[:12]} actual={observed[:24]} status={status}')
                  if attempt == 40:
                      raise SystemExit(f'PRODUCTION FAIL: {len(stale)} changed static file(s) did not match this commit within the bounded wait.')
                  time.sleep(3)
          PY

      - name: Verify production routes and content markers with diagnostics
        shell: bash
        run: |
          set -uo pipefail
          base='https://nexusnovatools.com'
          route_file() {
            local key
            key="$(printf '%s' "$1" | sed 's/[^A-Za-z0-9]/_/g')"
            printf '/tmp/nexusnova-smoke-%s' "$key"
          }

          route_failures=0
          while IFS= read -r route; do
            [ -n "$route" ] || continue
            body="$(route_file "$route")"
            code="$(curl -sS -L -o "$body" -w '%{http_code}' --connect-timeout 2 --max-time 3 -H 'Cache-Control: no-cache' "$base$route?smoke=$GITHUB_SHA" || true)"
            if [ "$code" = '200' ]; then
              echo "ROUTE PASS $code $route"
            else
              if [ -z "$code" ]; then code='curl-error'; fi
              echo "ROUTE FAIL $code $route" >&2
              route_failures=$((route_failures+1))
            fi
          done <<'ROUTES'
          /
          /humanproof.html
          /live.html
          /sports-live.html
          /network-tools.html
          /public-ip-checker.html
          /ssl-certificate-checker.html
          /currency-rates.html
          /gold-rates.html
          /fuel-rates.html
          /weather-live.html
          /earthquakes-live.html
          /zakat-calculator-pakistan.html
          /electricity-bill-calculator-pakistan.html
          /salary-tax-calculator-pakistan.html
          /prayer-times-qibla-pakistan.html
          /labs.html
          /pulse.html
          /magic-drop.html
          /xray.html
          /widgets.html
          /widget-pakistan-today.html
          /reaction-time-test.html
          /contact.html
          /privacy.html
          /resume-builder.html
          /image-to-text-ocr.html
          /invoice-maker.html
          /jpg-to-pdf.html
          /guides/unit-conversion.html
          /emi-calculator.html
          /bmi-calculator.html
          /tools.html
          /document-workbench.html
          /pdf-tools.html
          /merge-pdf.html
          /split-pdf.html
          /contrast-checker.html
          /text-diff-checker.html
          /csv-json-converter.html
          /ai-prompt-builder.html
          /gaming-sensitivity-converter.html
          /typing-speed-test.html
          /photo-cctv-enhancer.html
          /gaming-settings-notes.html
          /image-resizer.html
          /articles.html
          /articles/google-releases-chrome-152-for-android.html
          /articles/chrome-152-for-android-adds-desktop-security-fixes.html
          /robots.txt
          /ads.txt
          /sitemap.xml
          /sitemap-index.xml
          ROUTES

          content_failures=0
          check_contains() {
            local route="$1" marker="$2" label="$3" file
            file="$(route_file "$route")"
            if [ ! -f "$file" ] || ! grep -Fq -- "$marker" "$file"; then
              echo "CONTENT FAIL [$label] route=$route missing=$marker" >&2
              content_failures=$((content_failures+1))
            else
              echo "CONTENT PASS [$label]"
            fi
          }
          check_absent() {
            local route="$1" marker="$2" label="$3" file
            file="$(route_file "$route")"
            if [ ! -f "$file" ] || grep -Fq -- "$marker" "$file"; then
              echo "CONTENT FAIL [$label] route=$route unexpected-or-missing=$marker" >&2
              content_failures=$((content_failures+1))
            else
              echo "CONTENT PASS [$label]"
            fi
          }

          check_contains '/' '<link rel="canonical" href="https://nexusnovatools.com/">' 'homepage canonical'
          check_contains '/' 'client=ca-pub-5070673529890078' 'homepage AdSense publisher ID'
          check_contains '/ads.txt' 'google.com, pub-5070673529890078, DIRECT, f08c47fec0942fa0' 'ads.txt declares the homepage AdSense publisher'
          check_contains '/' 'NexusNova Tools — 92 Free Browser Tools, Categories, Articles & Guides' 'homepage reflects current 92-tool version'
          check_contains '/' 'document-workbench.html' 'homepage advertises the combined PDF workbench'
          check_contains '/tools.html' 'id="directory-search-count">92 tools' 'directory count matches 92'
          check_contains '/tools.html' 'document-workbench.html' 'directory lists the combined PDF workbench'
          check_absent '/tools.html' 'href="merge-pdf.html"' 'directory no longer lists legacy Merge PDF card'
          check_absent '/tools.html' 'href="split-pdf.html"' 'directory no longer lists legacy Split PDF card'
          check_contains '/document-workbench.html' '<title>PDF Workbench: Merge &amp; Extract Pages | NexusNova Tools</title>' 'workbench has expected title'
          check_contains '/document-workbench.html' 'merge.onclick=async' 'workbench merge action exists'
          check_contains '/document-workbench.html' 'extract.onclick=async' 'workbench extract action exists'
          check_contains '/pdf-tools.html' 'href="document-workbench.html"' 'PDF hub points to combined workbench'
          check_absent '/pdf-tools.html' 'href="merge-pdf.html"' 'PDF hub omits legacy Merge PDF card'
          check_absent '/pdf-tools.html' 'href="split-pdf.html"' 'PDF hub omits legacy Split PDF card'
          check_contains '/merge-pdf.html' '<meta name="robots" content="noindex,follow,max-image-preview:large">' 'legacy Merge PDF is noindex'
          check_contains '/split-pdf.html' '<meta name="robots" content="noindex,follow,max-image-preview:large">' 'legacy Split PDF is noindex'
          check_contains '/merge-pdf.html' 'href="document-workbench.html"' 'legacy Merge PDF routes users to workbench'
          check_contains '/split-pdf.html' 'href="document-workbench.html"' 'legacy Split PDF routes users to workbench'
          check_contains '/sitemap.xml' 'https://nexusnovatools.com/document-workbench.html' 'canonical sitemap includes combined workbench'
          check_absent '/sitemap.xml' 'https://nexusnovatools.com/merge-pdf.html' 'canonical sitemap excludes legacy Merge PDF'
          check_absent '/sitemap.xml' 'https://nexusnovatools.com/split-pdf.html' 'canonical sitemap excludes legacy Split PDF'
          check_contains '/humanproof.html' '<link rel="canonical" href="https://nexusnovatools.com/humanproof.html">' 'HumanProof canonical'
          check_contains '/humanproof.html' 'exact-action binding' 'HumanProof current recovery copy'
          check_contains '/live.html' '<link rel="canonical" href="https://nexusnovatools.com/live.html">' 'Live hub canonical'
          check_contains '/labs.html' '<link rel="canonical" href="https://nexusnovatools.com/labs.html">' 'Labs canonical'
          check_absent '/labs.html' 'Enter Universe Atlas' 'Labs retired placeholder absent'
          check_contains '/contrast-checker.html' '<link rel="canonical" href="https://nexusnovatools.com/contrast-checker.html">' 'contrast checker canonical'
          check_contains '/text-diff-checker.html' '<link rel="canonical" href="https://nexusnovatools.com/text-diff-checker.html">' 'text diff canonical'
          check_contains '/csv-json-converter.html' '<link rel="canonical" href="https://nexusnovatools.com/csv-json-converter.html">' 'CSV JSON converter canonical'
          check_contains '/contact.html' 'nexusnovatools@gmail.com' 'contact address present'
          check_contains '/privacy.html' '<link rel="canonical" href="https://nexusnovatools.com/privacy.html">' 'privacy canonical'
          check_contains '/resume-builder.html' '<link rel="canonical" href="https://nexusnovatools.com/resume-builder.html">' 'resume builder canonical'
          check_contains '/image-to-text-ocr.html' '<link rel="canonical" href="https://nexusnovatools.com/image-to-text-ocr.html">' 'OCR canonical'
          check_contains '/invoice-maker.html' '<link rel="canonical" href="https://nexusnovatools.com/invoice-maker.html">' 'invoice maker canonical'
          check_contains '/jpg-to-pdf.html' '<link rel="canonical" href="https://nexusnovatools.com/jpg-to-pdf.html">' 'JPG to PDF canonical'
          check_contains '/ai-prompt-builder.html' 'Prompt review before you send it' 'AI Prompt Builder review section'
          check_contains '/ai-prompt-builder.html' 'Key Features &amp; Practical Applications' 'AI Prompt Builder practical applications'
          check_contains '/ai-prompt-builder.html' 'AI Prompt Builder FAQ' 'AI Prompt Builder FAQ'
          check_absent '/ai-prompt-builder.html' 'Guide on How to Use the AI Prompt Builder' 'duplicate AI prompt guide removed'
          check_contains '/gaming-sensitivity-converter.html' 'data-flagship-depth' 'sensitivity converter depth marker'
          check_contains '/typing-speed-test.html' 'data-flagship-depth' 'typing test depth marker'
          check_contains '/photo-cctv-enhancer.html' 'data-flagship-depth' 'photo enhancer depth marker'
          check_contains '/reaction-time-test.html' 'data-flagship-depth' 'reaction test depth marker'
          check_contains '/gaming-settings-notes.html' 'data-flagship-depth' 'gaming settings depth marker'
          check_contains '/image-resizer.html' 'data-flagship-depth' 'image resizer depth marker'
          check_contains '/articles.html' '34 articles' 'article hub count'
          check_contains '/articles.html' 'Chrome 152 for Android: Release Timeline and Security Fixes' 'article hub uses unified Chrome release page'
          check_absent '/articles.html' 'chrome-152-for-android-adds-desktop-security-fixes.html' 'article hub omits duplicate Chrome archive'
          check_contains '/articles/google-releases-chrome-152-for-android.html' '152.0.7977.82' 'Chrome Android version detail present'
          check_contains '/articles/google-releases-chrome-152-for-android.html' 'Chrome 152 for Android: Release Timeline and Security Fixes' 'Chrome release article title present'
          check_contains '/articles/chrome-152-for-android-adds-desktop-security-fixes.html' 'content="noindex,follow,max-image-preview:large"' 'duplicate Chrome archive noindex'
          check_contains '/articles/chrome-152-for-android-adds-desktop-security-fixes.html' '<link rel="canonical" href="https://nexusnovatools.com/articles/google-releases-chrome-152-for-android.html">' 'duplicate Chrome archive canonical'
          check_contains '/guides/unit-conversion.html' 'NIST Guide to the SI' 'unit conversion guide includes NIST reference factors'
          check_contains '/guides/unit-conversion.html' 'Updated 14 October 2026' 'unit conversion guide carries its current review date'
          check_contains '/emi-calculator.html' 'Compare offers on total borrowing cost' 'EMI page explains total borrowing cost'
          check_contains '/emi-calculator.html' 'https://www.consumerfinance.gov/ask-cfpb/what-is-amortization-and-how-could-it-affect-my-auto-loan-en-771/' 'EMI page links amortization guidance'
          check_absent '/emi-calculator.html' 'Guide on Structured EMI and Debt Calculation' 'duplicate EMI template block removed'
          check_absent '/emi-calculator.html' 'Frequently Asked Questions — EMI Calculator' 'repeated EMI FAQ block removed'
          check_contains '/bmi-calculator.html' 'age- and sex-specific BMI-for-age percentiles' 'BMI page distinguishes pediatric interpretation'
          check_contains '/bmi-calculator.html' 'https://www.cdc.gov/bmi/child-teen-calculator/' 'BMI page links CDC child and teen guidance'
          check_absent '/bmi-calculator.html' 'Key Features &amp; Practical Applications — BMI Calculator' 'duplicate BMI template block removed'
          check_absent '/bmi-calculator.html' 'Frequently Asked Questions — BMI Calculator' 'repeated BMI FAQ block removed'

          cp "$(route_file '/sitemap.xml')" /tmp/nexusnova-sitemap.xml
          python3 - <<'PY'
          from concurrent.futures import ThreadPoolExecutor, as_completed
          from pathlib import Path
          from urllib.error import HTTPError, URLError
          from urllib.parse import parse_qsl, urlencode, urlsplit, urlunsplit
          from urllib.request import Request, urlopen
          import os
          import xml.etree.ElementTree as ET

          sitemap = ET.parse('/tmp/nexusnova-sitemap.xml').getroot()
          ns = {'sm': 'http://www.sitemaps.org/schemas/sitemap/0.9'}
          urls = [node.text.strip() for node in sitemap.findall('.//sm:loc', ns) if node.text and node.text.strip()]
          if not urls:
              raise SystemExit('SITEMAP FAIL: canonical sitemap returned no URLs.')
          print(f'Checking {len(urls)} canonical sitemap URLs with bounded concurrency.')
          token = os.environ.get('GITHUB_SHA', 'production-smoke')

          def verify(original):
              parts = urlsplit(original)
              if parts.scheme != 'https' or parts.netloc.lower() not in {'nexusnovatools.com', 'www.nexusnovatools.com'}:
                  return original, 'FAIL', 'non-canonical host or scheme'
              query = dict(parse_qsl(parts.query, keep_blank_values=True))
              query['smoke'] = token
              url = urlunsplit((parts.scheme, parts.netloc, parts.path, urlencode(query), parts.fragment))
              request = Request(url, headers={'Cache-Control': 'no-cache', 'User-Agent': 'NexusNovaProductionSmoke/1.0'})
              try:
                  with urlopen(request, timeout=6) as response:
                      code = response.status
              except HTTPError as exc:
                  code = exc.code
              except (URLError, TimeoutError, OSError) as exc:
                  return original, 'FAIL', type(exc).__name__
              return original, 'PASS' if code == 200 else 'FAIL', str(code)

          failures = []
          with ThreadPoolExecutor(max_workers=12) as pool:
              futures = [pool.submit(verify, url) for url in urls]
              for future in as_completed(futures):
                  result = future.result()
                  if result[1] != 'PASS':
                      failures.append(result)
          for url, status, detail in failures[:30]:
              print(f'SITEMAP URL FAIL {detail} {url}')
          if failures:
              raise SystemExit(f'SITEMAP FAIL: {len(failures)} of {len(urls)} URLs failed HTTP 200.')
          print(f'CANONICAL SITEMAP PRODUCTION INTEGRITY PASS: all {len(urls)} advertised URLs returned HTTP 200.')
          PY

          if [ "$route_failures" -gt 0 ] || [ "$content_failures" -gt 0 ]; then
            echo "PRODUCTION FAIL: $route_failures route failures; $content_failures content-marker failures." >&2
            exit 1
          fi
          echo 'LIVE PRODUCTION PASS: fixed routes, content/indexation markers and every canonical sitemap URL verified.'
