# Production verification guard for NexusNova core, Labs and cleaned trust/tool pages.
name: NexusNova Production Smoke

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/production-smoke.yml'
      - 'index.html'
      - 'live.html'
      - 'sports-live.html'
      - 'network-tools.html'
      - 'public-ip-checker.html'
      - 'ssl-certificate-checker.html'
      - 'currency-rates.html'
      - 'gold-rates.html'
      - 'fuel-rates.html'
      - 'weather-live.html'
      - 'earthquakes-live.html'
      - 'zakat-calculator-pakistan.html'
      - 'electricity-bill-calculator-pakistan.html'
      - 'salary-tax-calculator-pakistan.html'
      - 'prayer-times-qibla-pakistan.html'
      - 'labs.html'
      - 'pulse.html'
      - 'magic-drop.html'
      - 'xray.html'
      - 'widgets.html'
      - 'widget-pakistan-today.html'
      - 'reaction-time-test.html'
      - 'contact.html'
      - 'privacy.html'
      - 'resume-builder.html'
      - 'image-to-text-ocr.html'
      - 'invoice-maker.html'
      - 'jpg-to-pdf.html'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  production-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 7
    steps:
      - name: Wait for deployed core, Labs and cleanup markers
        shell: bash
        run: |
          set -euo pipefail
          base='https://nexusnovatools.com'
          for attempt in $(seq 1 30); do
            home="$(curl -fsSL --connect-timeout 10 --max-time 20 -H 'Cache-Control: no-cache' "$base/?smoke=${GITHUB_SHA}-${attempt}" || true)"
            live="$(curl -fsSL --connect-timeout 10 --max-time 20 -H 'Cache-Control: no-cache' "$base/live.html?smoke=${GITHUB_SHA}-${attempt}" || true)"
            labs="$(curl -fsSL --connect-timeout 10 --max-time 20 -H 'Cache-Control: no-cache' "$base/labs.html?smoke=${GITHUB_SHA}-${attempt}" || true)"
            pulse="$(curl -fsSL --connect-timeout 10 --max-time 20 -H 'Cache-Control: no-cache' "$base/pulse.html?smoke=${GITHUB_SHA}-${attempt}" || true)"
            magic="$(curl -fsSL --connect-timeout 10 --max-time 20 -H 'Cache-Control: no-cache' "$base/magic-drop.html?smoke=${GITHUB_SHA}-${attempt}" || true)"
            xray="$(curl -fsSL --connect-timeout 10 --max-time 20 -H 'Cache-Control: no-cache' "$base/xray.html?smoke=${GITHUB_SHA}-${attempt}" || true)"
            widgets="$(curl -fsSL --connect-timeout 10 --max-time 20 -H 'Cache-Control: no-cache' "$base/widgets.html?smoke=${GITHUB_SHA}-${attempt}" || true)"
            reaction="$(curl -fsSL --connect-timeout 10 --max-time 20 -H 'Cache-Control: no-cache' "$base/reaction-time-test.html?smoke=${GITHUB_SHA}-${attempt}" || true)"
            contact="$(curl -fsSL --connect-timeout 10 --max-time 20 -H 'Cache-Control: no-cache' "$base/contact.html?smoke=${GITHUB_SHA}-${attempt}" || true)"
            privacy="$(curl -fsSL --connect-timeout 10 --max-time 20 -H 'Cache-Control: no-cache' "$base/privacy.html?smoke=${GITHUB_SHA}-${attempt}" || true)"
            resume="$(curl -fsSL --connect-timeout 10 --max-time 20 -H 'Cache-Control: no-cache' "$base/resume-builder.html?smoke=${GITHUB_SHA}-${attempt}" || true)"
            ocr="$(curl -fsSL --connect-timeout 10 --max-time 20 -H 'Cache-Control: no-cache' "$base/image-to-text-ocr.html?smoke=${GITHUB_SHA}-${attempt}" || true)"
            invoice="$(curl -fsSL --connect-timeout 10 --max-time 20 -H 'Cache-Control: no-cache' "$base/invoice-maker.html?smoke=${GITHUB_SHA}-${attempt}" || true)"
            jpgpdf="$(curl -fsSL --connect-timeout 10 --max-time 20 -H 'Cache-Control: no-cache' "$base/jpg-to-pdf.html?smoke=${GITHUB_SHA}-${attempt}" || true)"
            if grep -Fq 'href="labs.html">Explore NexusNova Labs</a>' <<<"$home" \
              && grep -Fq 'NEW • NEXUSNOVA LABS' <<<"$home" \
              && grep -Fq 'OpenAQ PM2.5 foundation is pending its server-side source key' <<<"$live" \
              && grep -Fq 'Coinranking market-data foundation is pending its server-side source key' <<<"$live" \
              && grep -Fq 'NEXUSNOVA LABS // NEW IDEAS' <<<"$labs" \
              && grep -Fq 'NEXUSNOVA PULSE // BETA' <<<"$pulse" \
              && grep -Fq 'MAGIC DROP // LOCAL-FIRST BETA' <<<"$magic" \
              && grep -Fq 'NEXUSNOVA X-RAY // BETA' <<<"$xray" \
              && grep -Fq 'FREE EMBED WIDGETS // BETA' <<<"$widgets" \
              && grep -Fq 'NEXUSNOVA CHALLENGE // REACTION' <<<"$reaction" \
              && grep -Fq 'Official support email' <<<"$contact" \
              && grep -Fq 'nexusnovatools@gmail.com' <<<"$contact" \
              && grep -Fq 'Plain-language privacy:' <<<"$privacy" \
              && grep -Fq 'Working browser tool:' <<<"$resume" \
              && grep -Fq 'ENGLISH OCR // IMAGE TO TEXT' <<<"$ocr" \
              && grep -Fq 'Simple Invoice Generator' <<<"$invoice" \
              && grep -Fq 'JPG/JPEG images only' <<<"$jpgpdf" \
              && ! grep -Fq 'image-converter.html' <<<"$jpgpdf"; then
              echo 'Current core, Labs and cleanup markers are deployed.'
              exit 0
            fi
            sleep 5
          done
          echo 'Production did not expose the expected current core, Labs and cleanup markers.' >&2
          exit 1

      - name: Verify important production routes
        shell: bash
        run: |
          set -euo pipefail
          base='https://nexusnovatools.com'
          routes=(
            '/live.html'
            '/sports-live.html'
            '/network-tools.html'
            '/public-ip-checker.html'
            '/ssl-certificate-checker.html'
            '/currency-rates.html'
            '/gold-rates.html'
            '/fuel-rates.html'
            '/weather-live.html'
            '/earthquakes-live.html'
            '/zakat-calculator-pakistan.html'
            '/electricity-bill-calculator-pakistan.html'
            '/salary-tax-calculator-pakistan.html'
            '/prayer-times-qibla-pakistan.html'
            '/labs.html'
            '/pulse.html'
            '/magic-drop.html'
            '/xray.html'
            '/widgets.html'
            '/widget-pakistan-today.html'
            '/reaction-time-test.html'
            '/contact.html'
            '/privacy.html'
            '/resume-builder.html'
            '/image-to-text-ocr.html'
            '/invoice-maker.html'
            '/jpg-to-pdf.html'
          )
          for route in "${routes[@]}"; do
            code="$(curl -sS -L -o /dev/null -w '%{http_code}' --connect-timeout 10 --max-time 20 -H 'Cache-Control: no-cache' "$base$route?smoke=${GITHUB_SHA}")"
            echo "$code $route"
            test "$code" = '200'
          done
