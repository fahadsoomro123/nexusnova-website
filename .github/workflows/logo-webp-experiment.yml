name: Temporary Logo WebP Experiment

on:
  push:
    branches:
      - perf/logo-webp-experiment-20261013

permissions:
  contents: read

jobs:
  convert:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - name: Convert existing logo to lossless WebP for review
        run: |
          python -m pip install --disable-pip-version-check Pillow
          python - <<'PY'
          from pathlib import Path
          from PIL import Image
          src = Path("assets/logo.png")
          out = Path("/tmp/logo.webp")
          with Image.open(src) as im:
              im.load()
              print({
                  "source": str(src),
                  "source_bytes": src.stat().st_size,
                  "dimensions": im.size,
                  "mode": im.mode,
                  "has_alpha": "A" in im.getbands(),
              })
              webp_mode = "RGBA" if "A" in im.getbands() else "RGB"
              im.convert(webp_mode).save(out, "WEBP", lossless=True, method=6, exact=True)
          print({"output": str(out), "output_bytes": out.stat().st_size})
          with Image.open(out) as im:
              print({"webp_dimensions": im.size, "webp_mode": im.mode, "webp_bytes": out.stat().st_size})
          PY
      - name: Upload experiment asset
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: logo-webp-experiment
          path: /tmp/logo.webp
          if-no-files-found: error
          retention-days: 7
