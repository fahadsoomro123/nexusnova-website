name: Temporary Logo WebP Experiment

on:
  push:
    branches:
      - perf/logo-webp-experiment-20261013
    paths:
      - '.github/workflows/logo-webp-experiment.yml'

permissions:
  contents: write

jobs:
  convert:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - name: Compare lossless and high-quality WebP variants
        run: |
          python -m pip install --disable-pip-version-check Pillow
          python - <<'PY'
          from pathlib import Path
          from PIL import Image, ImageChops, ImageStat
          import json, math, shutil
          src = Path("assets/logo.png")
          out = Path("/tmp/logo-variants")
          out.mkdir(parents=True, exist_ok=True)
          shutil.copy2(src, out / "logo-original.png")
          with Image.open(src) as original:
              original.load()
              rgba = original.convert("RGBA")
              header_logo = rgba.resize((520, 173), Image.Resampling.LANCZOS)
              production_candidate = Path("assets/logo.webp")
              header_logo.save(production_candidate, "WEBP", quality=95, method=6, exact=True, alpha_quality=100, subsampling=0)
              print(json.dumps({"production_candidate_bytes": production_candidate.stat().st_size, "production_candidate_dimensions": [520, 173]}))
              print(json.dumps({
                  "source_bytes": src.stat().st_size,
                  "dimensions": original.size,
                  "mode": original.mode,
                  "has_alpha": "A" in original.getbands(),
              }))
              variants = []
              lossless = out / "logo-lossless.webp"
              rgba.save(lossless, "WEBP", lossless=True, method=6, exact=True)
              variants.append(("lossless", lossless))
              for q in (97, 95, 92, 90, 85):
                  target = out / f"logo-q{q}.webp"
                  rgba.save(target, "WEBP", quality=q, method=6, exact=True, alpha_quality=100, subsampling=0)
                  variants.append((f"q{q}", target))
              rows=[]
              preview_w=500
              new_h=max(1, round(rgba.height*preview_w/rgba.width))
              tile_h=new_h+54
              sheet=Image.new("RGB",(preview_w*2,tile_h*3),(245,246,248))
              from PIL import ImageDraw
              draw=ImageDraw.Draw(sheet)
              entries=[("Original",out/"logo-original.png"),("Lossless",lossless),("Q97",out/"logo-q97.webp"),("Q95",out/"logo-q95.webp"),("Q92",out/"logo-q92.webp"),("Q90",out/"logo-q90.webp")]
              for idx,(label,path) in enumerate(entries):
                  with Image.open(path) as im:
                      tile=im.convert("RGBA").resize((preview_w,new_h),Image.Resampling.LANCZOS)
                  bg=Image.new("RGBA",tile.size,(255,255,255,255));bg.alpha_composite(tile)
                  x=(idx%2)*preview_w;y=(idx//2)*tile_h
                  sheet.paste(bg.convert("RGB"),(x,y+34))
                  draw.text((x+12,y+10),f"{label} | {path.stat().st_size:,} bytes",fill=(25,35,50))
                  if label!="Original":
                      with Image.open(src) as srcim:
                          ref=srcim.convert("RGBA")
                      with Image.open(path) as candidate:
                          cand=candidate.convert("RGBA")
                      diff=ImageChops.difference(ref,cand)
                      stat=ImageStat.Stat(diff)
                      rms=sum(v*v for v in stat.rms)/len(stat.rms)
                      rms=math.sqrt(rms)
                      psnr=float("inf") if rms==0 else 20*math.log10(255/rms)
                      rows.append({"variant":label,"bytes":path.stat().st_size,"savings_percent":round((1-path.stat().st_size/src.stat().st_size)*100,2),"mean_channel_error":round(sum(stat.mean)/len(stat.mean),4),"psnr_db":round(psnr,2)})
              sheet.save(out/"logo-comparison.jpg",quality=92)
              print(json.dumps({"variants":rows},indent=2))
          PY
      - name: Commit experiment asset on this isolated branch
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git config user.name 'nexusnova-automation'
          git config user.email 'actions@users.noreply.github.com'
          git add assets/logo.webp
          if git diff --cached --quiet; then
            echo 'The optimized asset is already current.'
          else
            git commit -m 'experiment(perf): add resized WebP wordmark candidate'
            git push origin HEAD:${GITHUB_REF_NAME}
          fi
      - name: Upload review artifacts
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: logo-webp-experiment
          path: |
            /tmp/logo-variants/
            assets/logo.webp
          if-no-files-found: error
          retention-days: 7
