name: NexusNova One-Time GA4 Engagement Fix V2

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/one-shot-ga4-engagement-fix-v2.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Apply GA4 timing fix
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          p = Path('assets/js/main.js')
          text = p.read_text(encoding='utf-8')
          old = """  ['pointerdown','keydown','touchstart'].forEach(type=>window.addEventListener(type,load,{once:true,passive:true}));
  window.addEventListener('scroll',load,{once:true,passive:true});
  const schedule=()=>setTimeout(load,8000);
  if(document.readyState==='complete')schedule();
  else window.addEventListener('load',schedule,{once:true});
"""
          new = """  load();
"""
          if old not in text:
              raise SystemExit('Expected delayed GA4 loader block missing')
          p.write_text(text.replace(old, new, 1), encoding='utf-8')
          PY

          cat > tests/ga4-loader.test.cjs <<'EOF'
          const test = require('node:test');
          const assert = require('node:assert/strict');
          const fs = require('node:fs');
          test('GA4 production runtime loads without the old 8 second delay', () => {
            const text = fs.readFileSync('assets/js/main.js', 'utf8');
            assert.match(text, /const measurementId='G-YLPFKWSS12';/);
            assert.doesNotMatch(text, /setTimeout\(load,8000\)/);
            assert.match(text, /\n  load\(\);\n\}\)\(\);/);
          });
          EOF

      - name: Verify targeted fix
        run: |
          node --check assets/js/main.js
          node --test tests/ga4-loader.test.cjs

      - name: Commit targeted fix
        shell: bash
        run: |
          git config user.name 'nexusnova-fix[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add assets/js/main.js tests/ga4-loader.test.cjs
          git commit -m 'analytics: restore prompt GA4 engagement tracking'
          git pull --rebase origin main
          git push origin HEAD:main
