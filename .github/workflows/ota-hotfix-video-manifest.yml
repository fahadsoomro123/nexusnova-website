name: OTA Video Hotfix Manifest

on:
  push:
    branches: [nexusnova-ota-public]
    paths:
      - '.github/workflows/ota-hotfix-video-manifest.yml'
      - 'ota/files/index.html'
      - 'ota/files/src/features/apps/premium-studio-suite.js'
      - 'ota/files/src/features/apps/ai-video-studio-flagship.js'

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: nexusnova-ota-public
          fetch-depth: 0
      - name: Rebuild cumulative manifest with OTA3 video hotfix
        shell: bash
        run: |
          set -euo pipefail
          git pull --ff-only origin nexusnova-ota-public
          node <<'NODE'
          const fs=require('fs'),crypto=require('crypto');
          const mp='ota/manifest.json';
          const m=JSON.parse(fs.readFileSync(mp,'utf8'));
          if(m.schema!==2) throw new Error('Unexpected schema');
          if(m.base!=='b8aa3393af20235fb70cf771f7bc7f84b05ebbf3') throw new Error('Installed 1.0.41 baseline mismatch');
          const changed=[
            'index.html',
            'src/features/apps/premium-studio-suite.js',
            'src/features/apps/ai-video-studio-flagship.js'
          ];
          const rows=new Map((m.files||[]).map(x=>[x.path,x]));
          for(const path of changed){
            const b=fs.readFileSync('ota/files/'+path);
            rows.set(path,{path,sha256:crypto.createHash('sha256').update(b).digest('hex'),size:b.length});
          }
          m.version=process.env.GITHUB_SHA;
          m.ota_badge='OTA3';
          m.ota_badge_status='ACTIVE';
          m.video_hotfix='renderer-load-isolation';
          m.source_commit='262edbdc305cb53267fe2906b2a3026477e72c3c';
          m.files=[...rows.values()].sort((a,b)=>a.path.localeCompare(b.path));
          for(const row of m.files){
            const p='ota/files/'+row.path;
            if(!fs.existsSync(p)) throw new Error('Missing '+row.path);
            const b=fs.readFileSync(p);
            const h=crypto.createHash('sha256').update(b).digest('hex');
            if(b.length!==row.size||h!==row.sha256) throw new Error('Hash mismatch '+row.path);
          }
          fs.writeFileSync(mp,JSON.stringify(m));
          console.log('Cumulative files verified:',m.files.length);
          NODE
          git config user.name 'NexusNova OTA Bot'
          git config user.email 'actions@users.noreply.github.com'
          git add ota/manifest.json
          git diff --cached --check
          git commit -m "ota(video): publish OTA3 renderer hotfix" || true
          git push origin HEAD:nexusnova-ota-public
