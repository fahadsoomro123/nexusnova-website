name: Publish NexusNova APK Download

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/publish-nexusnova-apk-download.yml'

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Download prepared NexusNova APK artifact
        env:
          APK_ARTIFACT_URL: 'https://sdmntprindiasocentral.oaiusercontent.com/files/00000000-d928-8211-b926-c615d1e93c33/raw?se=2026-08-25T22%3A48%3A21Z&sp=r&sv=2026-02-06&sr=b&scid=b5d1f196-afa7-5545-a8d9-e78e70831c27&skoid=a3d7d4f3-706d-48bc-8860-17488c12cb39&sktid=a48cca56-e6da-484e-a814-9c849652bcb3&skt=2026-08-25T01%3A09%3A26Z&ske=2026-08-26T01%3A09%3A26Z&sks=b&skv=2026-02-06&sig=oU0JX5lqoPmJfCy23DZjh%2B4OIvi89RC1cwAHYaCmW0U%3D'
        run: |
          set -euo pipefail
          curl --fail --location "$APK_ARTIFACT_URL" -o /tmp/nexusnova-apk-artifact.zip
          rm -rf /tmp/nexusnova-apk-artifact
          mkdir -p /tmp/nexusnova-apk-artifact
          unzip -q /tmp/nexusnova-apk-artifact.zip -d /tmp/nexusnova-apk-artifact
          APK="$(find /tmp/nexusnova-apk-artifact -type f -name '*.apk' | head -n 1)"
          test -n "$APK"
          test -s "$APK"
          mkdir -p downloads
          cp "$APK" downloads/NexusNova-PUBLIC-OTA-FIX-TEST.apk
          sha256sum downloads/NexusNova-PUBLIC-OTA-FIX-TEST.apk > downloads/NexusNova-PUBLIC-OTA-FIX-TEST.sha256
      - name: Publish APK on nexusnovatools.com
        run: |
          set -euo pipefail
          git config user.name 'NexusNova Download Bot'
          git config user.email 'actions@users.noreply.github.com'
          git add downloads/NexusNova-PUBLIC-OTA-FIX-TEST.apk downloads/NexusNova-PUBLIC-OTA-FIX-TEST.sha256
          git commit -m 'Publish NexusNova public OTA fix APK'
          git push origin HEAD:main
