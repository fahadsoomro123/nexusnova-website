name: Publish NexusNova APK Download

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/publish-nexusnova-apk-download.yml'

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Download permanent-signed NexusNova APK artifact
        env:
          APK_ARTIFACT_URL: 'https://sdmntprindiasocentral.oaiusercontent.com/files/00000000-2f8c-8211-b90c-58b62a641c00/raw?se=2026-08-26T06%3A42%3A24Z&sp=r&sv=2026-02-06&sr=b&scid=79e2e58b-1dad-500b-a1ef-c20b110eb4fe&skoid=a3d7d4f3-706d-48bc-8860-17488c12cb39&sktid=a48cca56-e6da-484e-a814-9c849652bcb3&skt=2026-08-26T01%3A46%3A19Z&ske=2026-08-27T01%3A46%3A19Z&sks=b&skv=2026-02-06&sig=BBnoyQLICi0lMUZTxvq8Ke8p%2BYprif6tEUBG12cVctU%3D'
        run: |
          set -euo pipefail
          curl --fail --location "$APK_ARTIFACT_URL" -o /tmp/nexusnova-apk-artifact.zip
          rm -rf /tmp/nexusnova-apk-artifact
          mkdir -p /tmp/nexusnova-apk-artifact
          unzip -q /tmp/nexusnova-apk-artifact.zip -d /tmp/nexusnova-apk-artifact
          APK="$(find /tmp/nexusnova-apk-artifact -type f -name '*.apk' | head -n 1)"
          test -n "$APK"
          test -s "$APK"
          mkdir -p downloads
          cp "$APK" downloads/NexusNova-PERMANENT-SIGNED-OTA-v1.0.4.apk
          sha256sum downloads/NexusNova-PERMANENT-SIGNED-OTA-v1.0.4.apk > downloads/NexusNova-PERMANENT-SIGNED-OTA-v1.0.4.sha256
      - name: Publish APK on nexusnovatools.com
        run: |
          set -euo pipefail
          git config user.name 'NexusNova Download Bot'
          git config user.email 'actions@users.noreply.github.com'
          git add downloads/NexusNova-PERMANENT-SIGNED-OTA-v1.0.4.apk downloads/NexusNova-PERMANENT-SIGNED-OTA-v1.0.4.sha256
          git commit -m 'Publish NexusNova permanent signed OTA v1.0.4 APK'
          git push origin HEAD:main
