name: NexusNova Final Compact Site Remediation

on:
  push:
    branches: [main]
    paths:
      - '.github/scripts/final_compact_site.py'
      - '.github/workflows/final-compact-site.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  compact-and-verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Sync latest main
        run: git pull --rebase origin main
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Compile remediation
        run: python -m py_compile .github/scripts/final_compact_site.py
      - name: Apply compact site remediation
        run: python .github/scripts/final_compact_site.py
      - name: Run static quality gates
        run: |
          python .github/scripts/site_quality_audit.py
          python .github/scripts/adsense_readiness_audit.py
      - name: Enforce no known pre-payment success wording
        shell: bash
        run: |
          set -euo pipefail
          ! grep -q 'HUMAN CONFIRMED' assets/js/humanproof-live.js
          ! grep -q 'Human verification complete' assets/js/humanproof-live.js
          grep -q 'PENDING PAYMENT' assets/js/humanproof-live.js
          grep -q 'compact-2026.css' index.html
      - name: Commit verified remediation
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'nexusnova-site-finalizer[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- '*.html' 'articles/*.html' 'guides/*.html' 'tech/*.html' 'assets/css/compact-2026.css' 'assets/js/humanproof-live.js'
          if git diff --cached --quiet; then
            echo 'No compact remediation changes needed.'
            exit 0
          fi
          git commit -m 'site: compact production pages and harden HumanProof pre-payment state'
          for attempt in 1 2 3; do
            if git pull --rebase origin main && git push origin HEAD:main; then
              echo 'Final compact remediation pushed.'
              exit 0
            fi
            echo "Push attempt $attempt failed; retrying..."
            git rebase --abort 2>/dev/null || true
            git fetch origin main
            sleep $((attempt * 3))
          done
          exit 1
