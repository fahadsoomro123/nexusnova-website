name: Checklist Quality Gap Fix

on:
  push:
    branches: [main]
    paths:
      - '.github/scripts/checklist_quality_gap_fix.py'
      - '.github/workflows/checklist-quality-gap-fix.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  apply-nine-page-fix:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Apply explicit method example limitation evidence
        run: python .github/scripts/checklist_quality_gap_fix.py
      - name: Report proposed quality-gap changes without publishing
        shell: bash
        run: |
          set -euo pipefail
          echo 'Checklist Quality Gap Fix is audit-only; no repository write is permitted.'
          git status --short
          git diff --stat || true
