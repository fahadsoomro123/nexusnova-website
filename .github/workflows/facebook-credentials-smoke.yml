name: NexusNova Facebook Credentials Smoke Test

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/facebook-credentials-smoke.yml'

permissions:
  contents: read

jobs:
  facebook-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      FACEBOOK_PAGE_ID: ${{ vars.FACEBOOK_PAGE_ID }}
      FACEBOOK_PAGE_ACCESS_TOKEN: ${{ secrets.FACEBOOK_PAGE_ACCESS_TOKEN }}
    steps:
      - name: Verify Facebook Page token without posting
        run: |
          python - <<'PY'
          import json, os, urllib.parse, urllib.request, urllib.error

          page_id = os.environ.get('FACEBOOK_PAGE_ID','').strip()
          token = os.environ.get('FACEBOOK_PAGE_ACCESS_TOKEN','').strip()
          if not page_id:
              raise SystemExit('FACEBOOK_PAGE_ID is missing')
          if not token:
              raise SystemExit('FACEBOOK_PAGE_ACCESS_TOKEN is missing')

          params = urllib.parse.urlencode({'fields':'id,name','access_token':token})
          url = f'https://graph.facebook.com/v26.0/{urllib.parse.quote(page_id)}?{params}'
          req = urllib.request.Request(url, headers={'User-Agent':'NexusNovaTrafficAutopilot/1.0'})
          try:
              with urllib.request.urlopen(req, timeout=20) as r:
                  data = json.loads(r.read().decode('utf-8'))
                  result = {
                      'http_status': r.status,
                      'authenticated': True,
                      'page_id_matches': str(data.get('id','')) == page_id,
                      'page_name': data.get('name'),
                  }
                  print(json.dumps(result, indent=2))
                  if not result['page_id_matches']:
                      raise SystemExit('Facebook token did not resolve to configured Page ID')
          except urllib.error.HTTPError as e:
              body = e.read().decode('utf-8','replace')
              print(json.dumps({'http_status':e.code,'authenticated':False,'response':body[:1000]}, indent=2))
              raise
          PY
