name: Support Payment Contract Validation

on:
  workflow_dispatch:
  push:
    branches:
      - nexusnova-support-production
    paths:
      - "cloudflare/support-payments/**"
      - "assets/js/nexusnova-support.js"
      - "tools.html"
      - "guides.html"
      - "categories.html"
      - "articles.html"
      - "assets/js/nn-inner-shell.js"
      - "assets/js/main.js"
      - "support-payment-success.html"
      - "support-payment-cancelled.html"
      - "tests/support-payments.test.mjs"
      - "tests/support-sitewide-coverage.test.mjs"
      - ".github/workflows/support-payment-validation.yml"
      - ".github/workflows/deploy-support-payments-preview.yml"
  pull_request:
    branches:
      - main
      - nexusnova-support-production
    paths:
      - "cloudflare/support-payments/**"
      - "assets/js/nexusnova-support.js"
      - "support-payment-success.html"
      - "support-payment-cancelled.html"
      - "tests/support-payments.test.mjs"
      - "tests/support-sitewide-coverage.test.mjs"
      - ".github/workflows/support-payment-validation.yml"
      - ".github/workflows/deploy-support-payments-preview.yml"

      - "tools.html"
      - "guides.html"
      - "categories.html"
      - "articles.html"
      - "assets/js/nn-inner-shell.js"
      - "assets/js/main.js"
permissions:
  contents: read

jobs:
  validate-support-payments:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Check isolated Cloudflare Worker syntax and config
        shell: bash
        run: |
          set -euo pipefail
          node --input-type=module --check < cloudflare/support-payments/worker.js
          node --check assets/js/nexusnova-support.js
          node --check assets/js/main.js
          node --check assets/js/nn-inner-shell.js
          node -e "for (const p of ['cloudflare/support-payments/wrangler.jsonc','cloudflare/support-payments/wrangler.preview.jsonc','cloudflare/support-payments/wrangler.production-check.jsonc','cloudflare/support-payments/wrangler.production.jsonc','cloudflare/support-payments/wrangler.production-offline.jsonc']) JSON.parse(require('node:fs').readFileSync(p,'utf8')); console.log('All five support Wrangler configs valid JSON')"

      - name: Run mocked checkout and verification tests
        run: node --experimental-default-type=module --test tests/support-payments.test.mjs

      - name: Verify sitewide support coverage
        run: node --experimental-default-type=module --test tests/support-sitewide-coverage.test.mjs

      - name: Install isolated Playwright browser runtime
        shell: bash
        run: |
          set -euo pipefail
          npm install --prefix /tmp/nexusnova-playwright --no-save --no-package-lock playwright
          /tmp/nexusnova-playwright/node_modules/.bin/playwright install --with-deps chromium

      - name: Test rendered Support preview and sandbox checkout
        env:
          PLAYWRIGHT_PACKAGE_DIR: /tmp/nexusnova-playwright/node_modules/playwright
          SUPPORT_PREVIEW_URL: https://raw.githack.com/fahadsoomro123/nexusnova-website/nexusnova-support-production/index.html?supportApiBase=https%3A%2F%2Fnexusnova-support-payments-preview.fahadsoomro123.workers.dev
        run: node tests/support-preview-browser.mjs

      - name: Upload browser screenshots and QA report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: support-preview-browser-qa
          path: artifacts/support-preview-browser-qa/
          if-no-files-found: warn
