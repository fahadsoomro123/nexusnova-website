name: Support Payment Contract Validation

on:
  workflow_dispatch:
  push:
    branches:
      - nexusnova-support-production
    paths:
      - "cloudflare/support-payments/**"
      - "assets/js/nexusnova-support.js"
      - "support-payment-success.html"
      - "support-payment-cancelled.html"
      - "tests/support-payments.test.mjs"
      - ".github/workflows/support-payment-validation.yml"
  pull_request:
    branches:
      - main
    paths:
      - "cloudflare/support-payments/**"
      - "assets/js/nexusnova-support.js"
      - "support-payment-success.html"
      - "support-payment-cancelled.html"
      - "tests/support-payments.test.mjs"
      - ".github/workflows/support-payment-validation.yml"

permissions:
  contents: read

jobs:
  validate-support-payments:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Check isolated Cloudflare Worker syntax and config
        shell: bash
        run: |
          set -euo pipefail
          node --input-type=module --check < cloudflare/support-payments/worker.js
          node --check assets/js/nexusnova-support.js
          node -e "JSON.parse(require('node:fs').readFileSync('cloudflare/support-payments/wrangler.jsonc','utf8')); console.log('wrangler.jsonc valid JSON')"

      - name: Run mocked checkout and verification tests
        run: node --experimental-default-type=module --test tests/support-payments.test.mjs
