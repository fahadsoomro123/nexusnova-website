name: NexusNova Autopilot Quality + Traffic Push

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/one-shot-autopilot-traffic-push.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  harden-and-push:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TELEGRAM_CHANNEL_ID: ${{ vars.TELEGRAM_CHANNEL_ID }}
      BUFFER_API_KEY: ${{ secrets.BUFFER_API_KEY }}
      BUFFER_X_CHANNEL_ID: '6a987ad2065799be4676b541'
      FACEBOOK_PAGE_ID: ${{ vars.FACEBOOK_PAGE_ID }}
      FACEBOOK_PAGE_ACCESS_TOKEN: ${{ secrets.FACEBOOK_PAGE_ACCESS_TOKEN }}
      SOCIAL_WEBHOOK_URL: ${{ secrets.SOCIAL_WEBHOOK_URL }}
    steps:
      - name: Checkout full history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install campaign dependency
        run: python -m pip install --disable-pip-version-check pillow

      - name: Harden autopilot candidate quality
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          path = Path('.github/scripts/social_growth_engine.py')
          text = path.read_text(encoding='utf-8')

          if 'GENERIC_SOCIAL_HUBS = {' not in text:
              anchor = 'STOPWORDS = {\n'
              block = '''GENERIC_SOCIAL_HUBS = {
              "/", "/index.html", "/articles.html", "/tools.html", "/popular-tools.html",
              "/categories.html", "/guides.html", "/calculator-tools.html", "/pdf-tools.html",
              "/image-tools.html", "/productivity-tools.html", "/network-tools.html",
              "/pakistan-tools.html", "/trending-tools.html", "/live.html", "/labs.html",
          }
          '''
              if anchor not in text:
                  raise SystemExit('STOPWORDS anchor missing')
              text = text.replace(anchor, block + anchor, 1)

          if 'def is_generic_social_hub(' not in text:
              anchor = 'def local_html_metadata(url: str) -> tuple[str, str] | None:\n'
              helpers = '''def is_generic_social_hub(url: str) -> bool:
              path = urlsplit(url).path or "/"
              return path.lower() in GENERIC_SOCIAL_HUBS
          
          
          def is_dedicated_tool(url: str) -> bool:
              path = urlsplit(url).path or "/"
              rel = "index.html" if path == "/" else path.lstrip("/")
              if not rel.endswith(".html"):
                  return False
              target = ROOT / rel
              if not target.exists() or not target.is_file():
                  return False
              try:
                  raw = target.read_text(encoding="utf-8", errors="ignore")
              except Exception:
                  return False
              compact = re.sub(r"\\s+", "", raw)
              return '"@type":"WebApplication"' in compact
          
          
          '''
              if anchor not in text:
                  raise SystemExit('metadata function anchor missing')
              text = text.replace(anchor, helpers + anchor, 1)

          old = '''    if not url:
              return
              metadata = local_html_metadata(url)
          '''
          # Use exact indentation-independent replacement for the real function body.
          old = '    if not url:\n        return\n    metadata = local_html_metadata(url)\n'
          new = '    if not url:\n        return\n    if is_generic_social_hub(url):\n        return\n    metadata = local_html_metadata(url)\n'
          if new not in text:
              if old not in text:
                  raise SystemExit('add_candidate generic-hub anchor missing')
              text = text.replace(old, new, 1)

          old = '''    row = pool.get(url)
              if not row:
                  pool[url] = {
                      "url": url,
                      "title": title,
                      "summary": summary or "A focused NexusNova browser utility for an everyday digital task.",
                      "source": source,
                      "score": float(score),
                      "reasons": [reason],
                  }
                  return
          '''
          old = '''    row = pool.get(url)
              if not row:
                  pool[url] = {
                      "url": url,
                      "title": title,
                      "summary": summary or "A focused NexusNova browser utility for an everyday digital task.",
                      "source": source,
                      "score": float(score),
                      "reasons": [reason],
                  }
                  return
          '''.replace('              ', '    ')
          new = '''    row = pool.get(url)
              if not row:
                  dedicated_bonus = 24.0 if is_dedicated_tool(url) else 0.0
                  reasons = [reason]
                  if dedicated_bonus:
                      reasons.append("dedicated interactive utility priority bonus")
                  pool[url] = {
                      "url": url,
                      "title": title,
                      "summary": summary or "A focused NexusNova browser utility for an everyday digital task.",
                      "source": source,
                      "score": float(score) + dedicated_bonus,
                      "reasons": reasons,
                  }
                  return
          '''.replace('              ', '    ')
          if 'dedicated interactive utility priority bonus' not in text:
              if old not in text:
                  raise SystemExit('add_candidate score block anchor missing')
              text = text.replace(old, new, 1)

          old = '''        engagement = engaged / sessions if sessions else 0
                  score = 18 + min(26, sessions * 1.2) + min(14, engagement * 14)
                  add_candidate(
                      pool,
                      path,
                      "",
                      "",
                      "ga4_engagement",
                      score,
                      f"GA4 landing-page signal: {round(sessions, 1)} sessions / {round(engaged, 1)} engaged",
                  )
          '''.replace('                  ', '        ')
          new = '''        engagement = engaged / sessions if sessions else 0
                  if engaged <= 0:
                      score = -8 - min(32, sessions * 4)
                      reason = f"GA4 quality warning: {round(sessions, 1)} sessions / 0 engaged; zero-engagement penalty applied"
                  elif engagement < 0.25:
                      score = 8 + min(12, sessions * 0.8) + min(8, engagement * 8)
                      reason = f"GA4 weak engagement: {round(sessions, 1)} sessions / {round(engaged, 1)} engaged"
                  else:
                      score = 22 + min(24, sessions * 1.5) + min(18, engagement * 18)
                      reason = f"GA4 engaged landing-page signal: {round(sessions, 1)} sessions / {round(engaged, 1)} engaged"
                  add_candidate(
                      pool,
                      path,
                      "",
                      "",
                      "ga4_engagement",
                      score,
                      reason,
                  )
          '''.replace('                  ', '        ')
          if 'zero-engagement penalty applied' not in text:
              if old not in text:
                  raise SystemExit('GA4 scoring anchor missing')
              text = text.replace(old, new, 1)

          path.write_text(text, encoding='utf-8')
          print('Autopilot selector hardened.')
          PY

      - name: Verify selector behavior
        shell: bash
        run: |
          set -euo pipefail
          python -m py_compile .github/scripts/social_growth_engine.py
          python - <<'PY'
          import importlib.util
          import json
          import tempfile
          from pathlib import Path

          module_path = Path('.github/scripts/social_growth_engine.py').resolve()
          spec = importlib.util.spec_from_file_location('social_growth_engine_test', module_path)
          mod = importlib.util.module_from_spec(spec)
          spec.loader.exec_module(mod)

          assert mod.is_generic_social_hub('https://nexusnovatools.com/articles.html')
          assert mod.is_generic_social_hub('https://nexusnovatools.com/tools.html')
          assert not mod.is_generic_social_hub('https://nexusnovatools.com/paper-size-converter.html')
          assert mod.is_dedicated_tool('https://nexusnovatools.com/paper-size-converter.html')

          pool = {}
          mod.add_candidate(pool, '/articles.html', 'Articles', '', 'test', 100, 'generic')
          assert not pool, 'generic hub must not enter candidate pool'
          mod.add_candidate(pool, '/paper-size-converter.html', '', '', 'test', 10, 'specific tool')
          tool = next(iter(pool.values()))
          assert tool['score'] >= 34, 'dedicated tool priority bonus missing'

          with tempfile.TemporaryDirectory() as tmp:
              root = Path(tmp)
              traffic = root / 'traffic.json'
              traffic.write_text(json.dumps({
                  'ga4': {'landing_pages': [
                      {'dimension': '/paper-size-converter.html', 'sessions': 10, 'engagedSessions': 0},
                      {'dimension': '/steam-playtime-calculator.html', 'sessions': 2, 'engagedSessions': 2},
                      {'dimension': '/articles.html', 'sessions': 20, 'engagedSessions': 20},
                  ]}
              }), encoding='utf-8')
              empty = root / 'empty.json'
              empty.write_text('{}', encoding='utf-8')
              mod.TRAFFIC = traffic
              mod.ARTICLE = empty
              mod.PULSE = empty
              ranked = mod.build_candidates()
              assert 'https://nexusnovatools.com/articles.html' not in ranked
              weak = ranked['https://nexusnovatools.com/paper-size-converter.html']['score']
              strong = ranked['https://nexusnovatools.com/steam-playtime-calculator.html']['score']
              assert strong > weak, (strong, weak)
          print('Selector tests PASS: generic hubs blocked, zero-engagement penalized, dedicated utilities prioritized.')
          PY

      - name: Build targeted Paper Size campaign
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import importlib.util
          import json
          from datetime import datetime, timezone
          from pathlib import Path

          module_path = Path('.github/scripts/social_growth_engine.py').resolve()
          spec = importlib.util.spec_from_file_location('social_growth_engine_campaign', module_path)
          mod = importlib.util.module_from_spec(spec)
          spec.loader.exec_module(mod)

          url = 'https://nexusnovatools.com/paper-size-converter.html'
          metadata = mod.local_html_metadata(url)
          if not metadata:
              raise SystemExit('Paper Size Converter metadata unavailable')
          title, summary = metadata
          selected = {
              'url': url,
              'title': title,
              'summary': summary,
              'source': 'targeted_quality_push',
              'score': 100.0,
              'reasons': ['high-intent utility selected for targeted traffic push'],
          }
          fmt = 'problem_solution'
          copy = mod.build_copy(selected, fmt)
          feed_rel = 'assets/generated/traffic-push-paper-size-20260904-feed.jpg'
          vertical_rel = 'assets/generated/traffic-push-paper-size-20260904-vertical.jpg'
          mod.render_card(Path(feed_rel), 1080, 1350, selected, copy)
          mod.render_card(Path(vertical_rel), 1080, 1920, selected, copy)
          payload = {
              'kind': 'social_growth',
              'title': title,
              'summary': summary,
              'url': url,
              'hook': copy['hook'],
              'cta': copy['cta'],
              'format': fmt,
              'campaign': 'social_growth_20260904_paper_size_targeted_push',
              'utm_content': 'targeted_push',
              'hashtags': copy['hashtags'],
              'platform_copy': copy['platform_copy'],
              'instagram_image': 'https://nexusnovatools.com/' + feed_rel,
              'vertical_image': 'https://nexusnovatools.com/' + vertical_rel,
              'selection_score': 100.0,
              'selection_reasons': selected['reasons'],
              'generated_at': datetime.now(timezone.utc).isoformat().replace('+00:00', 'Z'),
          }
          Path('social-growth-publish.json').write_text(json.dumps(payload, indent=2, ensure_ascii=False) + '\n', encoding='utf-8')
          print(json.dumps({'campaign': payload['campaign'], 'url': url, 'image': payload['instagram_image']}, indent=2))
          PY

      - name: Commit autopilot fix and campaign creatives
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'nexusnova-growth[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add .github/scripts/social_growth_engine.py assets/generated/traffic-push-paper-size-20260904-feed.jpg assets/generated/traffic-push-paper-size-20260904-vertical.jpg
          git commit -m 'fix: prioritize engaged utility pages in social autopilot'
          git pull --rebase origin main
          git push origin HEAD:main

      - name: Wait for campaign assets on production
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          import time
          import urllib.request
          from pathlib import Path
          payload = json.loads(Path('social-growth-publish.json').read_text(encoding='utf-8'))
          targets = [payload['url'], payload['instagram_image']]
          for target in targets:
              ok = False
              for attempt in range(24):
                  try:
                      req = urllib.request.Request(target, headers={'User-Agent': 'NexusNovaTargetedPush/1.0', 'Cache-Control': 'no-cache'})
                      with urllib.request.urlopen(req, timeout=20) as response:
                          if 200 <= response.status < 300:
                              ok = True
                              print('Public:', target)
                              break
                  except Exception as exc:
                      print('Waiting:', target, attempt + 1, exc)
                  time.sleep(10)
              if not ok:
                  raise SystemExit('Campaign asset did not become public: ' + target)
          PY

      - name: Publish Facebook Instagram Telegram now
        shell: bash
        run: |
          set -euo pipefail
          BUFFER_API_KEY='' python .github/scripts/distribute_social_growth.py

      - name: Publish X immediately through Buffer and verify all four
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          import sys
          from pathlib import Path

          sys.path.insert(0, str(Path('.github/scripts').resolve()))
          from buffer_publish import post_buffer_x_now
          from distribute_social_growth import tracked_url

          item = json.loads(Path('social-growth-publish.json').read_text(encoding='utf-8'))
          report = json.loads(Path('social-distribution-report.json').read_text(encoding='utf-8'))
          x_copy = str((item.get('platform_copy') or {}).get('x') or item.get('hook') or item.get('title')).strip()
          result = post_buffer_x_now(
              x_copy,
              tracked_url(item, 'x'),
              list(item.get('hashtags') or []),
              image_url=str(item.get('instagram_image') or ''),
              ai_assisted=False,
          )
          if not result.get('posted'):
              raise SystemExit('Buffer did not confirm immediate X post')
          post = result.get('response') or {}
          outcomes = [row for row in report.get('outcomes', []) if row.get('platform') != 'x']
          outcomes.append({
              'platform': 'x',
              'ok': True,
              'detail': f"Buffer shareNow · status={post.get('status')} · post_id={post.get('id')} · image_attached={bool(result.get('image_attached'))}",
          })
          report['outcomes'] = outcomes
          report['successful_destinations'] = sum(1 for row in outcomes if row.get('ok') and row.get('platform') != 'meta_assets')
          Path('social-distribution-report.json').write_text(json.dumps(report, indent=2, ensure_ascii=False) + '\n', encoding='utf-8')
          required = {'telegram', 'facebook', 'instagram', 'x'}
          passed = {row.get('platform') for row in outcomes if row.get('ok')}
          missing = sorted(required - passed)
          print(json.dumps({'required': sorted(required), 'passed': sorted(required & passed), 'missing': missing, 'x_post': post}, indent=2, ensure_ascii=False))
          if missing:
              raise SystemExit('Targeted social push incomplete: ' + ', '.join(missing))
          PY

      - name: Record successful targeted campaign
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          from pathlib import Path
          payload = json.loads(Path('social-growth-publish.json').read_text(encoding='utf-8'))
          report = json.loads(Path('social-distribution-report.json').read_text(encoding='utf-8'))
          history_path = Path('assets/data/social-growth-history.json')
          doc = json.loads(history_path.read_text(encoding='utf-8')) if history_path.exists() else {'version': 2, 'posts': []}
          posts = doc.get('posts') if isinstance(doc, dict) else []
          if not isinstance(posts, list):
              posts = []
          posts = [row for row in posts if row.get('campaign') != payload['campaign']]
          posts.append({
              'generated_at': payload['generated_at'],
              'campaign': payload['campaign'],
              'url': payload['url'],
              'title': payload['title'],
              'format': payload['format'],
              'source': 'targeted_quality_push',
              'selection_score': payload['selection_score'],
              'successful_destinations': report.get('successful_destinations', 0),
          })
          history_path.write_text(json.dumps({'version': 2, 'posts': posts[-120:]}, indent=2, ensure_ascii=False) + '\n', encoding='utf-8')
          PY
          git add assets/data/social-growth-history.json
          git commit -m "automation: record targeted Paper Size traffic push ${GITHUB_RUN_ID}"
          git pull --rebase origin main
          git push origin HEAD:main

      - name: Publish result summary
        if: always()
        shell: bash
        run: |
          echo '## NexusNova targeted traffic push' >> "$GITHUB_STEP_SUMMARY"
          if [ -f social-distribution-report.json ]; then
            echo '```json' >> "$GITHUB_STEP_SUMMARY"
            cat social-distribution-report.json >> "$GITHUB_STEP_SUMMARY"
            echo '```' >> "$GITHUB_STEP_SUMMARY"
          fi
