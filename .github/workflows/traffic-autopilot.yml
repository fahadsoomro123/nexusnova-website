name: NexusNova Daily Traffic Autopilot

on:
  schedule:
    - cron: '15 2 * * *'
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/scripts/traffic_autopilot.py'
      - '.github/scripts/traffic_autopilot_runner.py'
      - '.github/scripts/traffic_diagnosis.py'
      - '.github/scripts/search_growth_autopilot.py'
      - '.github/scripts/social_growth_metrics.py'
      - '.github/scripts/social_growth_engine.py'
      - '.github/scripts/distribute_social_growth.py'
      - '.github/scripts/adsense_readiness_audit.py'
      - '.github/scripts/prepare_daily_social.py'
      - '.github/scripts/ai_provider.py'
      - '.github/scripts/submit_indexnow.py'
      - '.github/scripts/distribute_update.py'
      - '.github/scripts/prepare_instagram_media.py'
      - '.github/workflows/traffic-autopilot.yml'
      - 'assets/js/main.js'
      - 'assets/css/scifi.css'
      - 'assets/js/live-tech-pulse.js'
      - 'assets/css/live-tech-pulse.css'

permissions:
  contents: write

concurrency:
  group: nexusnova-traffic-autopilot
  cancel-in-progress: false

jobs:
  daily-growth:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      GEMINI_MODEL: ${{ vars.GEMINI_MODEL }}
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      OPENAI_MODEL: ${{ vars.OPENAI_MODEL }}
      GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
      GSC_SITE_URL: ${{ vars.GSC_SITE_URL }}
      GA4_PROPERTY_ID: ${{ vars.GA4_PROPERTY_ID }}
      SEARCH_GROWTH_MIN_IMPRESSIONS: ${{ vars.SEARCH_GROWTH_MIN_IMPRESSIONS }}
      SEARCH_GROWTH_COOLDOWN_DAYS: ${{ vars.SEARCH_GROWTH_COOLDOWN_DAYS }}
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TELEGRAM_CHANNEL_ID: ${{ vars.TELEGRAM_CHANNEL_ID }}
      X_API_KEY: ${{ secrets.X_API_KEY }}
      X_API_KEY_SECRET: ${{ secrets.X_API_KEY_SECRET }}
      X_ACCESS_TOKEN: ${{ secrets.X_ACCESS_TOKEN }}
      X_ACCESS_TOKEN_SECRET: ${{ secrets.X_ACCESS_TOKEN_SECRET }}
      FACEBOOK_PAGE_ID: ${{ vars.FACEBOOK_PAGE_ID }}
      FACEBOOK_PAGE_ACCESS_TOKEN: ${{ secrets.FACEBOOK_PAGE_ACCESS_TOKEN }}
      SOCIAL_WEBHOOK_URL: ${{ secrets.SOCIAL_WEBHOOK_URL }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install automation dependencies
        run: python -m pip install --disable-pip-version-check pillow google-auth requests feedparser

      - name: Compile automation scripts
        run: |
          python -m py_compile .github/scripts/ai_provider.py
          python -m py_compile .github/scripts/traffic_autopilot.py
          python -m py_compile .github/scripts/traffic_autopilot_runner.py
          python -m py_compile .github/scripts/traffic_diagnosis.py
          python -m py_compile .github/scripts/search_growth_autopilot.py
          python -m py_compile .github/scripts/social_growth_metrics.py
          python -m py_compile .github/scripts/social_growth_engine.py
          python -m py_compile .github/scripts/distribute_social_growth.py
          python -m py_compile .github/scripts/adsense_readiness_audit.py
          python -m py_compile .github/scripts/prepare_daily_social.py
          python -m py_compile .github/scripts/site_quality_audit.py
          python -m py_compile .github/scripts/submit_indexnow.py
          python -m py_compile .github/scripts/prepare_instagram_media.py
          python -m py_compile .github/scripts/distribute_update.py

      - name: Collect official tech trends and update growth surfaces
        run: python .github/scripts/traffic_autopilot_runner.py

      - name: Generate traffic diagnosis
        continue-on-error: true
        run: python .github/scripts/traffic_diagnosis.py

      - name: Collect GA4 social campaign feedback
        continue-on-error: true
        run: python .github/scripts/social_growth_metrics.py

      - name: Analyze GSC search opportunities and safely optimize one page
        continue-on-error: true
        env:
          NEXUSNOVA_AUTO_OPTIMIZE: ${{ (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch') && '1' || '0' }}
        run: python .github/scripts/search_growth_autopilot.py

      - name: Prepare Instagram-safe article image
        run: python .github/scripts/prepare_instagram_media.py

      - name: Build adaptive Social Growth v2 package
        if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
        run: python .github/scripts/social_growth_engine.py

      - name: Prepare legacy daily social fallback only if v2 has no candidate
        if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
        env:
          NEXUSNOVA_DAILY_SOCIAL: '1'
        run: |
          if [ ! -f social-growth-publish.json ]; then
            python .github/scripts/prepare_daily_social.py
          else
            echo 'Social Growth v2 payload exists; legacy fallback not needed.'
          fi

      - name: Rebuild machine-readable article feed
        run: python .github/scripts/build_articles_feed.py

      - name: Full public-site SEO and link audit
        run: python .github/scripts/site_quality_audit.py

      - name: AdSense structural readiness audit
        continue-on-error: true
        run: python .github/scripts/adsense_readiness_audit.py

      - name: Strict safety gate
        run: |
          python - <<'PY'
          import json
          import re
          from pathlib import Path
          from urllib.parse import urlsplit

          report=Path('site-quality-report.txt').read_text(encoding='utf-8')
          m=re.search(r'Severe findings:\s*(\d+)',report)
          severe=int(m.group(1)) if m else 999
          print(f'Severe findings: {severe}')
          if severe:
              raise SystemExit('Autopilot blocked: public-site audit has severe findings.')

          if Path('search-growth-changed-files.txt').exists():
              files=[x.strip() for x in Path('search-growth-changed-files.txt').read_text().splitlines() if x.strip()]
              if len(files) > 1 or any(not x.endswith('.html') for x in files):
                  raise SystemExit('Autopilot blocked: search optimizer exceeded one-HTML-file safety boundary.')
              print('Search growth changed files:', files)

          payload=Path('social-growth-publish.json')
          if payload.exists():
              item=json.loads(payload.read_text(encoding='utf-8'))
              url=str(item.get('url',''))
              host=urlsplit(url).netloc
              if host != 'nexusnovatools.com':
                  raise SystemExit(f'Autopilot blocked: social growth selected non-NexusNova URL: {url}')
              campaign=str(item.get('campaign',''))
              if not campaign.startswith('social_growth_'):
                  raise SystemExit('Autopilot blocked: social growth campaign ID is invalid.')
              images=[str(item.get('instagram_image','')),str(item.get('vertical_image',''))]
              if any(x and not x.startswith('https://nexusnovatools.com/assets/generated/') for x in images):
                  raise SystemExit('Autopilot blocked: social creative URL escaped the generated-assets boundary.')
              print('Social Growth v2 safety boundary passed:', item.get('title'))
          PY

      - name: Commit safe daily changes
        id: commit
        run: |
          git config user.name 'nexusnova-autopilot[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add assets/data/live-tech-pulse.json assets/data/autopilot-history.json articles.html articles.json feed.xml sitemap-autopilot.xml sitemap-index.xml llms.txt
          if [ -f assets/data/search-growth-history.json ]; then git add assets/data/search-growth-history.json; fi
          if [ -f assets/data/social-growth-history.json ]; then git add assets/data/social-growth-history.json; fi
          if [ -d assets/generated ]; then git add assets/generated; fi
          git add articles/
          if [ -f search-growth-changed-files.txt ]; then
            while IFS= read -r file; do
              [ -n "$file" ] && git add -- "$file"
            done < search-growth-changed-files.txt
          fi
          if [ -z "$(git status --porcelain)" ]; then
            echo 'changed=false' >> "$GITHUB_OUTPUT"
            echo 'No useful public change today.'
            exit 0
          fi
          git commit -m "automation: daily traffic autopilot ${GITHUB_RUN_ID}"
          git pull --rebase origin main
          git push origin HEAD:main
          echo 'changed=true' >> "$GITHUB_OUTPUT"

      - name: Submit changed pages to IndexNow
        if: steps.commit.outputs.changed == 'true'
        continue-on-error: true
        run: python .github/scripts/submit_indexnow.py

      - name: Distribute adaptive useful update to configured social channels
        if: steps.commit.outputs.changed == 'true'
        continue-on-error: true
        run: python .github/scripts/distribute_social_growth.py

      - name: Publish run summary
        if: always()
        run: |
          echo '## NexusNova Daily Traffic Autopilot' >> "$GITHUB_STEP_SUMMARY"
          echo '```json' >> "$GITHUB_STEP_SUMMARY"
          if [ -f traffic-autopilot-report.json ]; then cat traffic-autopilot-report.json >> "$GITHUB_STEP_SUMMARY"; else echo '{"status":"report unavailable"}'; fi
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          echo '```text' >> "$GITHUB_STEP_SUMMARY"
          if [ -f traffic-diagnosis.txt ]; then cat traffic-diagnosis.txt >> "$GITHUB_STEP_SUMMARY"; fi
          if [ -f search-growth-opportunities.txt ]; then cat search-growth-opportunities.txt >> "$GITHUB_STEP_SUMMARY"; fi
          if [ -f social-growth-report.txt ]; then cat social-growth-report.txt >> "$GITHUB_STEP_SUMMARY"; fi
          if [ -f adsense-readiness.txt ]; then cat adsense-readiness.txt >> "$GITHUB_STEP_SUMMARY"; fi
          if [ -f site-quality-report.txt ]; then cat site-quality-report.txt >> "$GITHUB_STEP_SUMMARY"; fi
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          if [ -f social-distribution-report.json ]; then
            echo '### Social distribution' >> "$GITHUB_STEP_SUMMARY"
            echo '```json' >> "$GITHUB_STEP_SUMMARY"
            cat social-distribution-report.json >> "$GITHUB_STEP_SUMMARY"
            echo '```' >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Upload private run diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nexusnova-traffic-autopilot-${{ github.run_id }}
          path: |
            traffic-autopilot-report.json
            traffic-diagnosis.json
            traffic-diagnosis.txt
            search-growth-opportunities.json
            search-growth-opportunities.txt
            search-growth-changes.json
            search-growth-changed-files.txt
            social-growth-metrics.json
            social-growth-publish.json
            social-growth-report.txt
            social-distribution-report.json
            adsense-readiness.json
            adsense-readiness.txt
            site-quality-report.txt
            autopilot-publish.json
            social-publish.json
            autopilot-changed-urls.txt
          if-no-files-found: ignore
          retention-days: 14
