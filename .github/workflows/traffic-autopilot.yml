name: NexusNova Daily Traffic Autopilot

on:
  schedule:
    - cron: '15 2 * * *'
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/scripts/traffic_autopilot.py'
      - '.github/scripts/traffic_autopilot_runner.py'
      - '.github/scripts/traffic_diagnosis.py'
      - '.github/scripts/search_growth_autopilot.py'
      - '.github/scripts/social_growth_metrics.py'
      - '.github/scripts/social_growth_engine.py'
      - '.github/scripts/distribute_social_growth.py'
      - '.github/scripts/adsense_readiness_audit.py'
      - '.github/scripts/prepare_daily_social.py'
      - '.github/scripts/ai_provider.py'
      - '.github/scripts/submit_indexnow.py'
      - '.github/scripts/distribute_update.py'
      - '.github/scripts/prepare_instagram_media.py'
      - '.github/workflows/traffic-autopilot.yml'
      - 'assets/data/autopilot-history.json'
      - 'assets/js/main.js'
      - 'assets/css/scifi.css'
      - 'assets/js/live-tech-pulse.js'
      - 'assets/css/live-tech-pulse.css'

permissions:
  contents: read

concurrency:
  group: nexusnova-traffic-autopilot
  cancel-in-progress: false

jobs:
  daily-growth:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      GEMINI_MODEL: ${{ vars.GEMINI_MODEL }}
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      OPENAI_MODEL: ${{ vars.OPENAI_MODEL }}
      GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
      GSC_SITE_URL: ${{ vars.GSC_SITE_URL }}
      GA4_PROPERTY_ID: ${{ vars.GA4_PROPERTY_ID }}
      SEARCH_GROWTH_MIN_IMPRESSIONS: ${{ vars.SEARCH_GROWTH_MIN_IMPRESSIONS }}
      SEARCH_GROWTH_COOLDOWN_DAYS: ${{ vars.SEARCH_GROWTH_COOLDOWN_DAYS }}
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TELEGRAM_CHANNEL_ID: ${{ vars.TELEGRAM_CHANNEL_ID }}
      BUFFER_API_KEY: ${{ secrets.BUFFER_API_KEY }}
      BUFFER_X_CHANNEL_ID: '6a987ad2065799be4676b541'
      FACEBOOK_PAGE_ID: ${{ vars.FACEBOOK_PAGE_ID }}
      FACEBOOK_PAGE_ACCESS_TOKEN: ${{ secrets.FACEBOOK_PAGE_ACCESS_TOKEN }}
      SOCIAL_WEBHOOK_URL: ${{ secrets.SOCIAL_WEBHOOK_URL }}
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'

      - name: Install automation dependencies
        run: python -m pip install --disable-pip-version-check pillow google-auth requests feedparser

      - name: Compile automation scripts
        run: |
          python -m py_compile .github/scripts/ai_provider.py
          python -m py_compile .github/scripts/traffic_autopilot.py
          python -m py_compile .github/scripts/traffic_autopilot_runner.py
          python -m py_compile .github/scripts/traffic_diagnosis.py
          python -m py_compile .github/scripts/search_growth_autopilot.py
          python -m py_compile .github/scripts/social_growth_metrics.py
          python -m py_compile .github/scripts/social_growth_engine.py
          python -m py_compile .github/scripts/distribute_social_growth.py
          python -m py_compile .github/scripts/adsense_readiness_audit.py
          python -m py_compile .github/scripts/prepare_daily_social.py
          python -m py_compile .github/scripts/site_quality_audit.py
          python -m py_compile .github/scripts/submit_indexnow.py
          python -m py_compile .github/scripts/prepare_instagram_media.py
          python -m py_compile .github/scripts/distribute_update.py

      - name: Collect official tech trends and update growth surfaces
        run: python .github/scripts/traffic_autopilot_runner.py

      - name: Generate traffic diagnosis
        continue-on-error: true
        run: python .github/scripts/traffic_diagnosis.py

      - name: Collect GA4 social campaign feedback
        continue-on-error: true
        run: python .github/scripts/social_growth_metrics.py

      - name: Analyze GSC search opportunities and safely optimize one page
        continue-on-error: true
        env:
          NEXUSNOVA_AUTO_OPTIMIZE: '0'
        run: python .github/scripts/search_growth_autopilot.py

      - name: Prepare Instagram-safe article image
        run: python .github/scripts/prepare_instagram_media.py

      - name: Build adaptive Social Growth v2 package
        if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
        run: python .github/scripts/social_growth_engine.py

      - name: Prepare legacy daily social fallback only if v2 has no candidate
        if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
        env:
          NEXUSNOVA_DAILY_SOCIAL: '1'
        run: |
          if [ ! -f social-growth-publish.json ]; then
            python .github/scripts/prepare_daily_social.py
          else
            echo 'Social Growth v2 payload exists; legacy fallback not needed.'
          fi

      - name: Rebuild machine-readable article feed
        run: python .github/scripts/build_articles_feed.py

      - name: Normalize generated article SEO titles
        shell: bash
        run: |
          python - <<'PY'
          import html
          import re
          import subprocess
          from pathlib import Path

          suffix = ' — NexusNova Tools'
          status = subprocess.check_output(
              ['git', 'status', '--porcelain', '--', 'articles'], text=True
          )
          paths = []
          for line in status.splitlines():
              raw = line[3:].strip()
              if ' -> ' in raw:
                  raw = raw.split(' -> ', 1)[1].strip()
              path = Path(raw)
              if path.suffix.lower() == '.html' and path.exists():
                  paths.append(path)

          changed = 0
          for path in sorted(set(paths)):
              text = path.read_text(encoding='utf-8', errors='replace')
              match = re.search(r'<title>(.*?)</title>', text, re.I | re.S)
              if not match:
                  continue
              title = html.unescape(re.sub(r'\s+', ' ', match.group(1))).strip()
              if len(title) <= 70:
                  continue
              base = title
              for known in (suffix, ' | NexusNova Tools', ' | NexusNova'):
                  if base.endswith(known):
                      base = base[:-len(known)].strip()
                      break
              budget = 70 - len(suffix)
              words = base.split()
              compact = ''
              for word in words:
                  candidate = f'{compact} {word}'.strip()
                  if len(candidate) > budget:
                      break
                  compact = candidate
              if not compact:
                  compact = base[:budget].rstrip(' -—|:')
              new_title = compact.rstrip(' -—|:') + suffix
              encoded = html.escape(new_title, quote=False)
              text = text[:match.start(1)] + encoded + text[match.end(1):]
              path.write_text(text, encoding='utf-8')
              changed += 1
              print(f'Normalized {path}: {len(title)} -> {len(new_title)} chars')
          print(f'Generated article title normalizations: {changed}')
          PY

      - name: Full public-site SEO and link audit
        run: python .github/scripts/site_quality_audit.py

      - name: AdSense structural readiness audit
        continue-on-error: true
        run: python .github/scripts/adsense_readiness_audit.py

      - name: Strict safety gate
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          from urllib.parse import urlsplit

          site_quality=json.loads(Path('site-quality-report.json').read_text(encoding='utf-8'))
          severe=site_quality.get('severe',[])
          warnings=site_quality.get('warnings',[])
          print(f'Severe findings: {len(severe)}')
          print(f'Warnings: {len(warnings)}')
          if severe:
              raise SystemExit('Autopilot blocked: public-site audit has severe findings.')
          if warnings:
              print('\n'.join(f'- {item}' for item in warnings))
              raise SystemExit('Autopilot blocked: public-site audit has warnings.')

          if Path('search-growth-changed-files.txt').exists():
              files=[x.strip() for x in Path('search-growth-changed-files.txt').read_text().splitlines() if x.strip()]
              if len(files) > 1 or any(not x.endswith('.html') for x in files):
                  raise SystemExit('Autopilot blocked: search optimizer exceeded one-HTML-file safety boundary.')
              print('Search growth changed files:', files)

          payload=Path('social-growth-publish.json')
          if payload.exists():
              item=json.loads(payload.read_text(encoding='utf-8'))
              url=str(item.get('url',''))
              host=urlsplit(url).netloc
              if host != 'nexusnovatools.com':
                  raise SystemExit(f'Autopilot blocked: social growth selected non-NexusNova URL: {url}')
              campaign=str(item.get('campaign',''))
              if not campaign.startswith('social_growth_'):
                  raise SystemExit('Autopilot blocked: social growth campaign ID is invalid.')
              images=[str(item.get('instagram_image','')),str(item.get('vertical_image',''))]
              if any(x and not x.startswith('https://nexusnovatools.com/assets/generated/') for x in images):
                  raise SystemExit('Autopilot blocked: social creative URL escaped the generated-assets boundary.')
              print('Social Growth v2 safety boundary passed:', item.get('title'))
          PY

      - name: Enforce review-only publishing boundary
        shell: bash
        run: |
          set -euo pipefail
          echo 'Automatic public publishing is disabled. The workflow only prepares private analysis and review artifacts.'
          echo 'Article HTML, sitemap/discovery, design, scripts, application code and all unlisted tracked files remain forbidden.'
          allowed='assets/data/live-tech-pulse.json'
          changes="$(git status --porcelain --untracked-files=no)"
          disallowed=''
          while IFS= read -r line; do
            [ -z "$line" ] && continue
            path="${line:3}"
            case "$path" in
              "$allowed"|assets/data/social-growth-history.json|assets/generated/social-growth-feed.jpg|assets/generated/social-growth-vertical.jpg)
                echo "Allowlisted private-review output changed: $path" ;;
              *) disallowed="${disallowed}${line}\n" ;;
            esac
          done <<< "$changes"
          if [ -n "$disallowed" ]; then
            echo 'ERROR: analysis changed non-allowlisted tracked repository files:' >&2
            printf '%b' "$disallowed" >&2
            exit 1
          fi
          if [ -f "$allowed" ]; then
            python - <<'PY'
          import json
          from pathlib import Path
          payload=json.loads(Path('assets/data/live-tech-pulse.json').read_text(encoding='utf-8'))
          assert payload.get('version') == 1
          assert isinstance(payload.get('items'), list)
          assert isinstance(payload.get('top_stories'), list)
          print('Live Tech Pulse schema: PASS')
          PY
          fi
          echo 'Review-only boundary: PASS'
          echo 'No article HTML, sitemap/discovery, application, design or automation source files were changed.'
          echo 'Social creative images and campaign history remain private-run outputs; they are not committed, deployed, indexed or posted.'
          echo 'No commit, push, IndexNow submission or social distribution is performed by this workflow.'

      - name: Detect fresh Social Growth v2 review output
        id: fresh-social-growth
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          if [ ! -f social-growth-publish.json ]; then
            echo "fresh=false" >> "$GITHUB_OUTPUT"
            echo 'No new Social Growth v2 package was produced; old tracked creatives will be omitted from this run artifact.'
            echo 'No fresh Social Growth v2 package was produced; tracked legacy images were not packaged.' >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          for path in assets/data/social-growth-history.json assets/generated/social-growth-feed.jpg assets/generated/social-growth-vertical.jpg; do
            if [ ! -s "$path" ]; then
              echo "ERROR: fresh Social Growth v2 package is missing $path" >&2
              exit 1
            fi
          done
          python - <<'PY'
          import json
          from pathlib import Path
          payload=json.loads(Path('social-growth-publish.json').read_text(encoding='utf-8'))
          history=json.loads(Path('assets/data/social-growth-history.json').read_text(encoding='utf-8'))
          campaign=str(payload.get('campaign',''))
          assert campaign.startswith('social_growth_'), 'package campaign is invalid'
          assert payload.get('url','').startswith('https://nexusnovatools.com/'), 'package URL must target NexusNova'
          assert payload.get('instagram_image','').endswith('/assets/generated/social-growth-feed.jpg')
          assert payload.get('vertical_image','').endswith('/assets/generated/social-growth-vertical.jpg')
          assert any(row.get('campaign') == campaign for row in history.get('posts', []) if isinstance(row, dict)), 'campaign missing from generated history'
          print(f'Fresh Social Growth v2 review package verified: {campaign}')
          PY
          echo "fresh=true" >> "$GITHUB_OUTPUT"
          echo 'Fresh Social Growth v2 package verified and will be uploaded separately.'

      - name: Publish run summary
        if: always()
        run: |
          echo '## NexusNova Daily Traffic Autopilot' >> "$GITHUB_STEP_SUMMARY"
          echo '```json' >> "$GITHUB_STEP_SUMMARY"
          if [ -f traffic-autopilot-report.json ]; then cat traffic-autopilot-report.json >> "$GITHUB_STEP_SUMMARY"; else echo '{"status":"report unavailable"}'; fi
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          echo '```text' >> "$GITHUB_STEP_SUMMARY"
          if [ -f traffic-diagnosis.txt ]; then cat traffic-diagnosis.txt >> "$GITHUB_STEP_SUMMARY"; fi
          if [ -f search-growth-opportunities.txt ]; then cat search-growth-opportunities.txt >> "$GITHUB_STEP_SUMMARY"; fi
          if [ -f social-growth-report.txt ]; then cat social-growth-report.txt >> "$GITHUB_STEP_SUMMARY"; fi
          if [ -f adsense-readiness.txt ]; then cat adsense-readiness.txt >> "$GITHUB_STEP_SUMMARY"; fi
          if [ -f site-quality-report.txt ]; then cat site-quality-report.txt >> "$GITHUB_STEP_SUMMARY"; fi
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          if [ -f social-distribution-report.json ]; then
            echo '### Social distribution' >> "$GITHUB_STEP_SUMMARY"
            echo '```json' >> "$GITHUB_STEP_SUMMARY"
            cat social-distribution-report.json >> "$GITHUB_STEP_SUMMARY"
            echo '```' >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Upload private run diagnostics
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: nexusnova-traffic-autopilot-${{ github.run_id }}
          path: |
            traffic-autopilot-report.json
            traffic-diagnosis.json
            traffic-diagnosis.txt
            search-growth-opportunities.json
            search-growth-opportunities.txt
            search-growth-changes.json
            search-growth-changed-files.txt
            social-growth-metrics.json
            social-growth-report.txt
            social-distribution-report.json
            adsense-readiness.json
            adsense-readiness.txt
            site-quality-report.txt
            autopilot-publish.json
            social-publish.json
            autopilot-changed-urls.txt
          if-no-files-found: ignore
          retention-days: 14

      - name: Upload fresh Social Growth review artifacts
        if: always() && steps.fresh-social-growth.outputs.fresh == 'true'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: nexusnova-social-growth-review-${{ github.run_id }}
          path: |
            social-growth-publish.json
            assets/data/social-growth-history.json
            assets/generated/social-growth-feed.jpg
            assets/generated/social-growth-vertical.jpg
          if-no-files-found: error
          retention-days: 14
