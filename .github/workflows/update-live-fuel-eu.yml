name: NexusNova LIVE EU Fuel Refresh

on:
  schedule:
    - cron: '30 15 * * 4,5'
  push:
    branches: [main]
    paths:
      - '.github/scripts/live_fuel_eu_core.py'
      - '.github/scripts/update_live_fuel_eu.py'
      - '.github/workflows/update-live-fuel-eu.yml'
  pull_request:
    branches: [main]
    paths:
      - '.github/scripts/live_fuel_eu_core.py'
      - '.github/scripts/update_live_fuel_eu.py'
      - '.github/workflows/update-live-fuel-eu.yml'
      - 'assets/data/live-fuel-eu.json'
      - 'assets/js/live-fuel.js'
      - 'fuel-rates.html'
      - 'tests/live-fuel.test.cjs'
      - 'tests/test_live_fuel_eu.py'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: nexusnova-live-eu-fuel-refresh-${{ github.ref }}
  cancel-in-progress: true

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Refresh European Commission weekly fuel prices
        run: python3 .github/scripts/update_live_fuel_eu.py

      - name: Validate EU fuel Python parser
        run: |
          python3 -m py_compile .github/scripts/live_fuel_eu_core.py .github/scripts/update_live_fuel_eu.py
          python3 -m unittest tests/test_live_fuel_eu.py

      - name: Validate repository syntax
        run: npm run check

      - name: Run repository tests
        run: npm test

      - name: Run full static SEO and internal-link audit
        run: python3 .github/scripts/site_quality_audit.py

      - name: Require zero severe static findings
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path
          report=json.loads(Path('site-quality-report.json').read_text(encoding='utf-8'))
          severe=report.get('severe',[])
          if severe:
              print('\n'.join(f'- {item}' for item in severe))
              raise SystemExit(f'{len(severe)} severe static finding(s) remain')
          print('Static site map + SEO audit has zero severe findings.')
          PY

      - name: Commit refreshed EU fuel data when changed
        if: github.event_name != 'pull_request'
        shell: bash
        run: |
          if git diff --quiet -- assets/data/live-fuel-eu.json; then
            echo "EU fuel dataset already matches the latest Commission source response."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/data/live-fuel-eu.json
          git commit -m "data: refresh NexusNova LIVE EU fuel [skip ci]"

          git reset --hard HEAD
          for attempt in 1 2 3 4 5; do
            if git push origin HEAD:main; then
              echo "Published refreshed EU fuel data on attempt ${attempt}."
              exit 0
            fi
            echo "main moved during publish; rebasing before retry ${attempt}/5."
            git fetch origin main
            git rebase origin/main
            sleep $((attempt * 2))
          done

          echo "Unable to publish refreshed EU fuel data after 5 safe retries."
          exit 1
