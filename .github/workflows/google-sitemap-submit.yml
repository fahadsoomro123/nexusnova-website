name: Submit Sitemap to Google Search Console

on:
  push:
    branches: [main]
    paths:
      - "sitemap.xml"
      - "articles/**"
      - "guides/**"
      - "tools/**"
      - "assets/js/search-core.js"
      - "index.html"
      - "articles.html"
      - ".github/workflows/google-sitemap-submit.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  submit-sitemap:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Submit sitemap through Search Console API
        env:
          GSC_SERVICE_ACCOUNT_JSON: ${{ secrets.GSC_SERVICE_ACCOUNT_JSON }}
          GSC_SITE_URL: ${{ secrets.GSC_SITE_URL }}
        run: |
          python -m pip install --quiet google-auth requests
          python - <<'PY'
          import json, os, sys
          from google.oauth2 import service_account
          from google.auth.transport.requests import AuthorizedSession

          raw = os.environ.get('GSC_SERVICE_ACCOUNT_JSON', '').strip()
          site = os.environ.get('GSC_SITE_URL', '').strip()
          if not raw or not site:
              missing = [
                  name for name, value in (
                      ('GSC_SERVICE_ACCOUNT_JSON', raw),
                      ('GSC_SITE_URL', site),
                  )
                  if not value
              ]
              setup = "\n".join([
                  "## Google Search Console sitemap submission blocked",
                  "",
                  "Missing repository Actions secret(s): " + ", ".join(missing) + ".",
                  "",
                  "Complete this one-minute setup:",
                  "1. Open https://github.com/fahadsoomro123/nexusnova-website/settings/secrets/actions",
                  "2. Select New repository secret.",
                  "3. Set GSC_SERVICE_ACCOUNT_JSON to the full Google Cloud service-account JSON key contents. Never commit the key to the repository.",
                  "4. Set GSC_SITE_URL to https://nexusnovatools.com/ for the verified URL-prefix property.",
                  "5. In Google Search Console, grant the service-account email permission on that verified property.",
                  "6. Re-run Submit Sitemap to Google Search Console from the Actions tab.",
                  "",
                  "The Google sitemap ping endpoint is deprecated and returns HTTP 404; this workflow does not use it or report a fake submission success.",
              ])
              print('GSC_SUBMISSION_BLOCKED: missing ' + ', '.join(missing))
              print('Setup guide: https://github.com/fahadsoomro123/nexusnova-website/settings/secrets/actions')
              summary_path = os.environ.get('GITHUB_STEP_SUMMARY')
              if summary_path:
                  with open(summary_path, 'a', encoding='utf-8') as summary:
                      summary.write(setup + "\n")
              raise SystemExit(1)

          info = json.loads(raw)
          credentials = service_account.Credentials.from_service_account_info(
              info,
              scopes=['https://www.googleapis.com/auth/webmasters']
          )
          session = AuthorizedSession(credentials)
          sitemap = 'https://nexusnovatools.com/sitemap.xml'
          endpoint = 'https://www.googleapis.com/webmasters/v3/sites/' + __import__('urllib.parse').parse.quote(site, safe='') + '/sitemaps/' + __import__('urllib.parse').parse.quote(sitemap, safe='')
          response = session.put(endpoint, timeout=30)
          if response.status_code == 403:
              email = str(info.get('client_email', '')).strip() or '(client_email unavailable in credential JSON)'
              message = "\n".join([
                  "## Google Search Console denied sitemap submission (HTTP 403)",
                  "",
                  "Google authenticated the request but refused access to the configured Search Console property.",
                  "",
                  "Service account to grant access: " + email,
                  "Configured property: " + site,
                  "Sitemap: " + sitemap,
                  "",
                  "One-time fix:",
                  "1. Open Google Search Console for the configured property.",
                  "2. Open Settings → Users and permissions.",
                  "3. Add the service-account email above as a Full user or Owner.",
                  "4. Re-run the Submit Sitemap to Google Search Console workflow.",
                  "",
                  "The sitemap file and submission automation are already configured. This permission grant is required by Google; the workflow will not claim a successful submission until the API accepts it."
              ])
              print('GSC_PERMISSION_BLOCKED: service account lacks access to configured property.')
              print(message)
              summary_path = os.environ.get('GITHUB_STEP_SUMMARY')
              if summary_path:
                  with open(summary_path, 'a', encoding='utf-8') as summary:
                      summary.write(message + "\n")
              raise SystemExit(1)
          if response.status_code not in (200, 204):
              print(response.text)
              response.raise_for_status()
          print('Search Console sitemap submission accepted:', sitemap)
          PY
