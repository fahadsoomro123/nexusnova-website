name: Universe Atlas V3 QA
on:
  push:
    paths:
      - "universe-atlas.html"
      - ".github/workflows/universe-atlas-v3-qa.yml"
      - ".github/scripts/universe-atlas-v3-qa.cjs"
  pull_request:
    paths:
      - "universe-atlas.html"
      - ".github/workflows/universe-atlas-v3-qa.yml"
      - ".github/scripts/universe-atlas-v3-qa.cjs"
jobs:
  qa:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install browser
        run: |
          npm init -y >/dev/null 2>&1
          npm install --no-save playwright@1.56.1
          npx playwright install --with-deps chromium
      - name: Serve
        run: |
          python3 -m http.server 4173 >/tmp/atlas.log 2>&1 &
      - name: One genuine runtime QA pass
        run: node .github/scripts/universe-atlas-v3-qa.cjs

# QA policy: one genuine end-to-end browser pass is the hard gate.
