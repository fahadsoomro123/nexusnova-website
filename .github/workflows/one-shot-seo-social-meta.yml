name: NexusNova One-Time SEO Length Normalization

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/one-shot-seo-social-meta.yml'

permissions:
  contents: write

jobs:
  normalize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Shorten only over-budget SEO titles and descriptions
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import html
          import re

          SKIP_DIRS={'.git','node_modules','vendor','ota','downloads','nexusnova-dev-ai'}
          SKIP_HTML={'404.html'}

          def get_title(text):
              m=re.search(r'<title\b[^>]*>(.*?)</title\s*>',text,re.I|re.S)
              return html.unescape(re.sub(r'\s+',' ',m.group(1)).strip()) if m else ''

          def get_meta(text,key,prop=False):
              attr='property' if prop else 'name'
              m=re.search(rf'<meta\b(?=[^>]*\b{attr}\s*=\s*(["\']){re.escape(key)}\1)[^>]*>',text,re.I|re.S)
              if not m:return ''
              c=re.search(r'\bcontent\s*=\s*(["\'])(.*?)\1',m.group(0),re.I|re.S)
              return html.unescape(c.group(2).strip()) if c else ''

          def set_meta(text,key,value,prop=False):
              attr='property' if prop else 'name'
              pat=rf'<meta\b(?=[^>]*\b{attr}\s*=\s*(["\']){re.escape(key)}\1)[^>]*>'
              m=re.search(pat,text,re.I|re.S)
              if not m:return text
              tag=m.group(0)
              escaped=html.escape(value,quote=True)
              if re.search(r'\bcontent\s*=\s*(["\']).*?\1',tag,re.I|re.S):
                  new_tag=re.sub(r'\bcontent\s*=\s*(["\']).*?\1',f'content="{escaped}"',tag,count=1,flags=re.I|re.S)
              else:
                  new_tag=tag[:-1]+f' content="{escaped}">'
              return text[:m.start()]+new_tag+text[m.end():]

          def shorten(value,limit):
              value=re.sub(r'\s+',' ',value).strip()
              if len(value)<=limit:return value
              cut=value[:limit+1]
              if ' ' in cut:
                  cut=cut.rsplit(' ',1)[0]
              return cut.rstrip(' ,;:—|-')

          def title_candidate(text,old):
              for candidate in (get_meta(text,'og:title',True),get_meta(text,'twitter:title')):
                  if candidate and len(candidate)<=70:
                      return candidate
              stripped=re.sub(r'\s*[|—-]\s*NexusNova(?: Tools)?\s*$','',old,flags=re.I).strip()
              if stripped and len(stripped)<=70:
                  return stripped
              return shorten(old,70)

          def desc_candidate(text,old):
              for candidate in (get_meta(text,'og:description',True),get_meta(text,'twitter:description')):
                  if candidate and len(candidate)<=175:
                      return candidate
              sentences=re.split(r'(?<=[.!?])\s+',old.strip())
              assembled=''
              for sentence in sentences:
                  proposed=(assembled+' '+sentence).strip()
                  if len(proposed)>175:break
                  assembled=proposed
              if assembled and len(assembled)>=90:
                  return assembled
              return shorten(old,170)

          changed=[]
          for path in sorted(Path('.').rglob('*.html')):
              if path.name in SKIP_HTML or any(part in SKIP_DIRS for part in path.parts):continue
              text=path.read_text(encoding='utf-8',errors='replace')
              if 'noindex' in get_meta(text,'robots').lower():continue
              original=text
              old_title=get_title(text)
              old_desc=get_meta(text,'description')

              if len(old_title)>70:
                  new_title=title_candidate(text,old_title)
                  text=re.sub(r'(<title\b[^>]*>).*?(</title\s*>)',lambda m:m.group(1)+html.escape(new_title)+m.group(2),text,count=1,flags=re.I|re.S)
                  if get_meta(text,'og:title',True)==old_title:
                      text=set_meta(text,'og:title',new_title,True)
                  if get_meta(text,'twitter:title')==old_title:
                      text=set_meta(text,'twitter:title',new_title)

              if len(old_desc)>175:
                  new_desc=desc_candidate(text,old_desc)
                  text=set_meta(text,'description',new_desc)
                  if get_meta(text,'og:description',True)==old_desc:
                      text=set_meta(text,'og:description',new_desc,True)
                  if get_meta(text,'twitter:description')==old_desc:
                      text=set_meta(text,'twitter:description',new_desc)

              if text!=original:
                  path.write_text(text,encoding='utf-8')
                  changed.append(path.as_posix())

          print(f'Normalized over-budget SEO copy on {len(changed)} pages.')
          for item in changed:print(item)
          PY

      - name: Require zero static SEO warnings and severe findings
        shell: bash
        run: |
          set -euo pipefail
          python3 .github/scripts/site_quality_audit.py
          python3 - <<'PY'
          import json
          from pathlib import Path
          report=json.loads(Path('site-quality-report.json').read_text(encoding='utf-8'))
          severe=report.get('severe',[])
          warnings=report.get('warnings',[])
          print('Severe:',len(severe),'Warnings:',len(warnings))
          if severe or warnings:
              raise SystemExit('\n'.join([*severe,*warnings]))
          PY
          git diff --check

      - name: Commit SEO length cleanup
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'NexusNova CI'
          git config user.email 'actions@users.noreply.github.com'
          git add '*.html' articles/*.html guides/*.html tech/*.html
          if git diff --cached --quiet; then
            echo 'No SEO copy changes required.'
            exit 0
          fi
          git commit -m 'seo: normalize title and description lengths'
          git push origin HEAD:main
