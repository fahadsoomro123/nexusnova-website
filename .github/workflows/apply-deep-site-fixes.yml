name: NexusNova Apply Deep Site Fixes

on:
  push:
    branches:
      - deep-site-audit-fix-20260903
    paths:
      - '.github/scripts/apply_deep_site_fixes.py'
      - '.github/workflows/apply-deep-site-fixes.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply-and-verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout audit branch
        uses: actions/checkout@v4
        with:
          ref: deep-site-audit-fix-20260903
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Apply verified public-site fixes
        run: python .github/scripts/apply_deep_site_fixes.py

      - name: Run existing full-site audit
        run: python .github/scripts/site_quality_audit.py

      - name: Run deep public-site audit
        run: python .github/scripts/deep_site_audit.py

      - name: Show protected-area diff guard
        shell: bash
        run: |
          set -euo pipefail
          protected='^(cloudflare/|functions/|firebase/|nexusnova-dev-ai/|ota/|downloads/)'
          bad="$(git diff --name-only | grep -E "$protected" || true)"
          if [ -n "$bad" ]; then
            echo 'Protected files changed unexpectedly:' >&2
            echo "$bad" >&2
            exit 1
          fi
          echo 'No protected auth/Telegram/mining/Firebase/Worker payloads changed.'

      - name: Commit verified fixes
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet && [ -z "$(git ls-files --others --exclude-standard)" ]; then
            echo 'No new fixes to commit.'
            exit 0
          fi
          git config user.name 'Fahad Hussain'
          git config user.email '166254374+fahadsoomro123@users.noreply.github.com'
          git add --all
          git commit -m 'fix: deep clean NexusNova public UX SEO and consent'
          git push origin HEAD:deep-site-audit-fix-20260903
