name: NexusNova Apply Deep Site Fixes

on:
  push:
    branches:
      - deep-site-audit-fix-20260903
    paths:
      - '.github/scripts/apply_deep_site_fixes.py'
      - '.github/scripts/apply_deep_site_fixes_round2.py'
      - '.github/scripts/apply_deep_site_fixes_round3.py'
      - '.github/scripts/apply_deep_site_fixes_round4.py'
      - '.github/scripts/production_readiness_audit.py'
      - '.github/workflows/apply-deep-site-fixes.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply-and-verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout audit branch
        uses: actions/checkout@v4
        with:
          ref: deep-site-audit-fix-20260903
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Apply verified public-site fixes
        run: |
          python .github/scripts/apply_deep_site_fixes.py
          python .github/scripts/apply_deep_site_fixes_round2.py
          python .github/scripts/apply_deep_site_fixes_round3.py
          python .github/scripts/apply_deep_site_fixes_round4.py

      - name: Run existing full-site audit
        run: python .github/scripts/site_quality_audit.py

      - name: Run deep public-site audit
        run: python .github/scripts/deep_site_audit.py

      - name: Require zero deep-audit warnings
        shell: bash
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          data=json.loads(Path('deep-site-audit.json').read_text(encoding='utf-8'))
          warnings=data.get('warnings',[])
          if warnings:
              print('\n'.join(f'- {item}' for item in warnings))
              raise SystemExit(f'{len(warnings)} deep-audit warning(s) remain')
          print('Deep audit has zero warnings.')
          PY

      - name: Run production-readiness audit
        run: python .github/scripts/production_readiness_audit.py

      - name: Show protected-area diff guard
        shell: bash
        run: |
          set -euo pipefail
          protected='^(cloudflare/|functions/|firebase/|nexusnova-dev-ai/|ota/|downloads/)'
          bad="$(git diff --name-only | grep -E "$protected" || true)"
          if [ -n "$bad" ]; then
            echo 'Protected files changed unexpectedly:' >&2
            echo "$bad" >&2
            exit 1
          fi
          echo 'No protected auth/Telegram/mining/Firebase/Worker payloads changed.'

      - name: Commit verified fixes
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet && [ -z "$(git ls-files --others --exclude-standard)" ]; then
            echo 'No new fixes to commit.'
            exit 0
          fi
          git config user.name 'Fahad Hussain'
          git config user.email '166254374+fahadsoomro123@users.noreply.github.com'
          git add --all
          git commit -m 'fix: close public crawl and production-readiness gaps'
          git push origin HEAD:deep-site-audit-fix-20260903
