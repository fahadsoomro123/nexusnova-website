name: NexusNova Daily Website Caretaker

on:
  schedule:
    - cron: '20 3 * * *'
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/daily-website-caretaker.yml'
      - '.github/scripts/site_quality_audit.py'
      - '.github/scripts/adsense_readiness_audit.py'
      - 'index.html'
      - 'tools.html'
      - 'articles.html'
      - 'app.html'
      - 'about.html'
      - 'contact.html'
      - 'privacy.html'
      - 'terms.html'
      - 'robots.txt'
      - 'ads.txt'
      - 'app-ads.txt'
      - 'sitemap*.xml'
      - 'assets/css/**'
      - 'assets/js/**'

permissions:
  contents: read
  issues: write

concurrency:
  group: nexusnova-daily-website-caretaker
  cancel-in-progress: true

jobs:
  caretaker:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'

      - name: Run static site quality audit
        run: python .github/scripts/site_quality_audit.py

      - name: Run AdSense structural readiness audit
        continue-on-error: true
        run: python .github/scripts/adsense_readiness_audit.py

      - name: Check live production website
        id: live
        shell: bash
        run: |
          python - <<'PY'
          import json, os, re, ssl, time
          import urllib.request
          import xml.etree.ElementTree as ET
          from pathlib import Path

          base = 'https://nexusnovatools.com'
          paths = [
              '/', '/tools.html', '/articles.html', '/app.html',
              '/about.html', '/contact.html', '/privacy.html', '/terms.html',
              '/robots.txt', '/ads.txt', '/app-ads.txt',
              '/sitemap.xml', '/sitemap-index.xml'
          ]

          results = []
          failures = []
          bodies = {}
          ctx = ssl.create_default_context()

          for path in paths:
              url = base + path
              started = time.time()
              status = None
              final_url = None
              body = ''
              error = None
              try:
                  req = urllib.request.Request(
                      url,
                      headers={'User-Agent': 'NexusNova-GitHub-Caretaker/1.0'}
                  )
                  with urllib.request.urlopen(req, timeout=20, context=ctx) as r:
                      status = r.status
                      final_url = r.geturl()
                      raw = r.read(2_000_000)
                      body = raw.decode('utf-8', errors='replace')
              except Exception as exc:
                  error = f'{type(exc).__name__}: {exc}'

              elapsed = round(time.time() - started, 3)
              ok = status == 200 and final_url and final_url.startswith('https://')
              if not ok:
                  failures.append(f'{path}: status={status}, final={final_url}, error={error}')
              results.append({
                  'path': path,
                  'status': status,
                  'final_url': final_url,
                  'seconds': elapsed,
                  'ok': bool(ok),
                  'error': error,
              })
              bodies[path] = body

          home = bodies.get('/', '')
          lower_home = home.lower()
          if 'nexusnova' not in lower_home:
              failures.append('Homepage does not contain the NexusNova brand name.')
          if '<title' not in lower_home:
              failures.append('Homepage is missing a title element.')
          if 'rel="canonical"' not in lower_home and "rel='canonical'" not in lower_home:
              failures.append('Homepage canonical link was not detected.')
          if re.search(r'<meta[^>]+name=["\']robots["\'][^>]+content=["\'][^"\']*noindex', lower_home):
              failures.append('Homepage appears to contain a noindex robots directive.')

          robots = bodies.get('/robots.txt', '')
          if 'sitemap:' not in robots.lower():
              failures.append('robots.txt does not advertise a sitemap.')
          for line in robots.splitlines():
              if line.strip().lower() == 'disallow: /':
                  failures.append('robots.txt contains a global Disallow: /.')

          ads = bodies.get('/ads.txt', '')
          if 'google.com' not in ads.lower():
              failures.append('ads.txt does not contain a Google publisher entry.')

          app_ads = bodies.get('/app-ads.txt', '')
          if 'google.com' not in app_ads.lower():
              failures.append('app-ads.txt does not contain a Google publisher entry.')

          for sitemap_path in ('/sitemap.xml', '/sitemap-index.xml'):
              text = bodies.get(sitemap_path, '')
              try:
                  root = ET.fromstring(text)
                  urls = [el.text for el in root.iter() if el.tag.endswith('loc') and el.text]
                  if not urls:
                      failures.append(f'{sitemap_path} contains no <loc> entries.')
                  elif any('nexusnovatools.com' not in u for u in urls[:100]):
                      failures.append(f'{sitemap_path} contains an unexpected domain in its URL entries.')
              except Exception as exc:
                  failures.append(f'{sitemap_path} is not valid XML: {exc}')

          severe = 999
          report_path = Path('site-quality-report.txt')
          if report_path.exists():
              report = report_path.read_text(encoding='utf-8', errors='replace')
              m = re.search(r'Severe findings:\s*(\d+)', report)
              if m:
                  severe = int(m.group(1))
              if severe:
                  failures.append(f'Static site audit has {severe} severe finding(s).')
          else:
              failures.append('Static site-quality report was not generated.')

          payload = {
              'base_url': base,
              'checked_at_utc': time.strftime('%Y-%m-%dT%H:%M:%SZ', time.gmtime()),
              'healthy': not failures,
              'severe_static_findings': severe,
              'failures': failures,
              'requests': results,
          }
          Path('caretaker-health.json').write_text(json.dumps(payload, indent=2) + '\n', encoding='utf-8')

          lines = [
              'NexusNova Daily Website Caretaker',
              f"Checked: {payload['checked_at_utc']}",
              f"Status: {'HEALTHY' if payload['healthy'] else 'ATTENTION REQUIRED'}",
              f'Static severe findings: {severe}',
              '',
              'Live endpoints:'
          ]
          for row in results:
              lines.append(f"- {row['path']}: {row['status']} ({row['seconds']}s) -> {row['final_url'] or 'ERROR'}")
          if failures:
              lines += ['', 'Problems:'] + [f'- {x}' for x in failures]
          else:
              lines += ['', 'No production problems detected.']
          Path('caretaker-health.txt').write_text('\n'.join(lines) + '\n', encoding='utf-8')

          output = os.environ.get('GITHUB_OUTPUT')
          if output:
              with open(output, 'a', encoding='utf-8') as f:
                  f.write(f"unhealthy={'true' if failures else 'false'}\n")
          print('\n'.join(lines))
          PY

      - name: Open or update caretaker incident
        if: steps.live.outputs.unhealthy == 'true'
        uses: actions/github-script@f28e40c7f34bde8b3046d885e986cb6290c5673b # v7
        with:
          script: |
            const fs = require('fs');
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const title = '[Caretaker] NexusNova website health problem';
            const report = fs.readFileSync('caretaker-health.txt', 'utf8');
            const body = [
              'The automated daily production caretaker detected a problem.',
              '',
              '```text',
              report.slice(0, 50000),
              '```',
              '',
              `Workflow run: ${context.serverUrl}/${owner}/${repo}/actions/runs/${context.runId}`
            ].join('\n');

            const q = `repo:${owner}/${repo} is:issue is:open in:title "${title}"`;
            const found = await github.rest.search.issuesAndPullRequests({ q, per_page: 10 });
            const issue = found.data.items.find(x => x.title === title && !x.pull_request);
            if (issue) {
              await github.rest.issues.update({ owner, repo, issue_number: issue.number, body });
              core.notice(`Updated caretaker incident #${issue.number}`);
            } else {
              const created = await github.rest.issues.create({ owner, repo, title, body });
              core.notice(`Created caretaker incident #${created.data.number}`);
            }

      - name: Auto-close resolved caretaker incident
        if: steps.live.outputs.unhealthy == 'false'
        uses: actions/github-script@f28e40c7f34bde8b3046d885e986cb6290c5673b # v7
        with:
          script: |
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const title = '[Caretaker] NexusNova website health problem';
            const q = `repo:${owner}/${repo} is:issue is:open in:title "${title}"`;
            const found = await github.rest.search.issuesAndPullRequests({ q, per_page: 10 });
            for (const item of found.data.items) {
              if (item.title === title && !item.pull_request) {
                await github.rest.issues.createComment({
                  owner, repo, issue_number: item.number,
                  body: `✅ Daily caretaker reports the production website healthy again. Auto-closing from workflow run ${context.runId}.`
                });
                await github.rest.issues.update({ owner, repo, issue_number: item.number, state: 'closed' });
              }
            }

      - name: Publish caretaker summary
        if: always()
        run: |
          echo '## NexusNova Daily Website Caretaker' >> "$GITHUB_STEP_SUMMARY"
          echo '```text' >> "$GITHUB_STEP_SUMMARY"
          cat caretaker-health.txt >> "$GITHUB_STEP_SUMMARY" 2>/dev/null || true
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          if [ -f adsense-readiness.txt ]; then
            echo '### AdSense structural readiness' >> "$GITHUB_STEP_SUMMARY"
            echo '```text' >> "$GITHUB_STEP_SUMMARY"
            cat adsense-readiness.txt >> "$GITHUB_STEP_SUMMARY"
            echo '```' >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Upload caretaker diagnostics
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: nexusnova-daily-caretaker-${{ github.run_id }}
          path: |
            caretaker-health.json
            caretaker-health.txt
            site-quality-report.txt
            adsense-readiness.json
            adsense-readiness.txt
          if-no-files-found: ignore
          retention-days: 7
