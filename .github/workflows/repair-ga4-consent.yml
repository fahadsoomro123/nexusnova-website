name: Repair GA4 consent controls

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  repair:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Repair consent control
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          p=Path('assets/js/main.js')
          s=p.read_text(encoding='utf-8')
          pat=r"\s*const footerLinks=document\.querySelector\('\.site-footer \.footer-links'\);\s*if\(footerLinks\) footerLinks\.appendChild\(reopen\);\s*else \{reopen\.classList\.add\('nn-privacy-choice-fallback'\);document\.body\.appendChild\(reopen\)\}\s*const hide=\(\)=>\{banner\.hidden=true\};"
          repl="\n    reopen.classList.add('nn-privacy-choice-fallback');\n    reopen.hidden=true;\n    document.body.appendChild(reopen);\n\n    const hide=()=>{banner.hidden=true;reopen.hidden=false};"
          s,n=re.subn(pat,repl,s,count=1)
          if n!=1:
              raise SystemExit('consent placement block not found')
          old="reopen.addEventListener('click',()=>{banner.hidden=false;banner.querySelector('button')?.focus()});"
          new="reopen.addEventListener('click',()=>{banner.hidden=false;reopen.hidden=true;banner.querySelector('button')?.focus()});"
          if old not in s:
              raise SystemExit('reopen handler not found')
          s=s.replace(old,new,1)
          p.write_text(s,encoding='utf-8')
          PY
      - name: Commit repair and remove temporary workflow
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          rm -f .github/workflows/repair-ga4-consent.yml
          git add assets/js/main.js .github/workflows/repair-ga4-consent.yml
          git commit -m 'fix: restore GA4 privacy controls'
          git push