name: Telegram Worker Health

on:
  push:
    branches: [main]
    paths:
      - 'cloudflare/telegram-bot/**'
      - '.github/workflows/telegram-worker-health.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  repair-and-check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Wait for Cloudflare deployment
        run: sleep 25

      - name: Re-register Telegram webhook
        shell: bash
        run: |
          set -euo pipefail
          base='https://nexusnova-telegram-bot.fahadsoomro123.workers.dev'
          for attempt in 1 2 3 4 5 6; do
            if body=$(curl --fail --silent --show-error --max-time 20 "$base/setup"); then
              echo "$body" | python -c 'import json,sys; d=json.load(sys.stdin); assert d.get("ok") is True; assert d.get("webhookInfo",{}).get("result",{}).get("url","").endswith("/webhook")'
              echo 'Webhook configured.'
              break
            fi
            if [ "$attempt" -eq 6 ]; then
              echo 'Webhook setup failed after retries.' >&2
              exit 1
            fi
            sleep 10
          done

      - name: Verify Telegram Worker status
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --silent --show-error --max-time 20 \
            'https://nexusnova-telegram-bot.fahadsoomro123.workers.dev/status' \
            | python -c 'import json,sys; d=json.load(sys.stdin); assert d.get("ok") is True; w=d.get("webhookInfo",{}).get("result",{}); assert w.get("url","").endswith("/webhook"); print("Telegram Worker healthy; pending_update_count=", w.get("pending_update_count",0), "last_error=", w.get("last_error_message","none"))'
