name: OTA Travel 19 Recovery Verify

on:
  push:
    branches: [nexusnova-ota-public]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify staged recovery files
        shell: bash
        run: |
          set -euo pipefail
          for f in \
            ota/files/index.html \
            ota/files/src/features/apps/travel-ota-revision-v13.js
          do
            printf '%s ' "$f"
            sha256sum "$f" | awk '{printf "sha256=%s ",$1}'
            stat -c 'size=%s' "$f"
          done
          grep -q 'travel-phone-layout-v17.js?ota=travel-v19-recovery' ota/files/index.html
          grep -q 'travel-flagship-runtime-v8.js?ota=travel-v19-recovery' ota/files/index.html
          grep -q 'travel-ota-revision-v13.js?ota=travel-v19-recovery' ota/files/index.html
          if grep -q 'travel-result-details-v1.js' ota/files/index.html; then
            echo 'Recovery index must not load result-details addon' >&2
            exit 1
          fi
          grep -q "const REVISION = '19'" ota/files/src/features/apps/travel-ota-revision-v13.js
