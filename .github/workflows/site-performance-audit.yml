name: NexusNova Site Performance Audit

on:
  push:
    branches: [main, feature/production-audit-vouchers-owner-console]
    paths:
      - '.github/workflows/site-performance-audit.yml'
      - '**/*.html'
      - 'assets/**/*.css'
      - 'assets/**/*.js'
      - 'assets/**/*.png'
      - 'assets/**/*.webp'
      - 'ota/files/assets/icons/nova-hub/**'
  workflow_dispatch:
  schedule:
    - cron: '35 3 * * 1'

permissions:
  contents: read

concurrency:
  group: nexusnova-site-performance
  cancel-in-progress: true

jobs:
  lighthouse-lab:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24'

      - name: Install Lighthouse
        run: npm install --no-save --ignore-scripts lighthouse@13.4.1

      - name: Disable GA4 network only in local audit copy
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          
          path = Path('assets/js/main.js')
          text = path.read_text(encoding='utf-8')
          lines = text.splitlines()
          matches = [i for i, line in enumerate(lines) if (('analyticsScript.src=' in line or 'script.src=' in line) and 'googletagmanager.com/gtag/js' in line)]
          if len(matches) != 1:
              raise SystemExit(f'Expected exactly one GA4 loader source line, found {len(matches)}')
          lines[matches[0]] = "    script.src='data:text/javascript,window.__nexusnovaLocalGa4Stub=true';"
          path.write_text('\n'.join(lines)+'\n', encoding='utf-8')
          print('Local audit blocks only the external GA4 download; production GA4 source is untouched.')
          PY
      - name: Start local website server
        run: |
          python3 -m http.server 8000 --bind 127.0.0.1 >/tmp/nexusnova-http.log 2>&1 &
          echo $! > /tmp/nexusnova-http.pid
          for i in {1..20}; do
            curl -fsS http://127.0.0.1:8000/ >/dev/null && exit 0
            sleep 1
          done
          cat /tmp/nexusnova-http.log
          exit 1

      - name: Run representative Lighthouse audits
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p performance-artifacts
          for page in home tools.html app.html; do
            if [ "$page" = "home" ]; then
              url="http://127.0.0.1:8000/"
              name="index"
            else
              url="http://127.0.0.1:8000/$page"
              name="${page%.html}"
            fi
            npx lighthouse "$url" \
              --quiet \
              --chrome-flags='--headless --no-sandbox --disable-gpu' \
              --only-categories=performance \
              --output=json \
              --output-path="performance-artifacts/${name}.json"
          done

      - name: Diagnose homepage AdSense contribution (temporary local copy only)
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p performance-artifacts/diagnostics
          if python3 - <<'PY'
          from pathlib import Path
          
          path = Path('index.html')
          html = path.read_text(encoding='utf-8')
          tag = '<script async src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-5070673529890078" crossorigin="anonymous"></script>'
          count = html.count(tag)
          if count == 0:
              print('No static AdSense tag found; AdSense differential diagnostic is not applicable.')
              raise SystemExit(42)
          if count != 1:
              raise SystemExit(f'Expected exactly one static AdSense tag when present, found {count}; no local mutation made.')
          path.write_text(html.replace(tag, '<!-- LOCAL LIGHTHOUSE DIAGNOSTIC ONLY: AdSense network disabled for this run. -->'), encoding='utf-8')
          print('Removed one static AdSense script from the disposable local audit checkout only. The production file and live website are untouched.')
          print('The shared runtime independently skips dynamic AdSense injection on localhost; this diagnostic is therefore a no-ads local variant.')
          PY
          then
            :
          else
            diagnostic_status=$?
            if [ "$diagnostic_status" -eq 42 ]; then
              echo 'AdSense differential diagnostic: NOT APPLICABLE (no static tag in index.html).' >> "$GITHUB_STEP_SUMMARY"
              exit 0
            fi
            exit "$diagnostic_status"
          fi
          for run in 1 2 3; do
            npx lighthouse "http://127.0.0.1:8000/" \
              --quiet \
              --chrome-flags='--headless --no-sandbox --disable-gpu' \
              --only-categories=performance \
              --output=json \
              --output-path="performance-artifacts/diagnostics/home-no-ads-${run}.json"
          done
          python3 - <<'PY'
          import json
          from pathlib import Path
          from statistics import median
          
          root = Path('performance-artifacts')
          diagnostic = root / 'diagnostics'
          baseline_path = root / 'index.json'
          candidates = sorted(diagnostic.glob('home-no-ads-*.json'))
          if not baseline_path.exists() or len(candidates) != 3:
              raise SystemExit(f'Expected baseline plus 3 no-ads Lighthouse reports; baseline={baseline_path.exists()}, no_ads={len(candidates)}')
          
          def metrics(path):
              data = json.loads(path.read_text(encoding='utf-8'))
              audits = data.get('audits', {})
              categories = data.get('categories', {})
              long_tasks = (audits.get('long-tasks') or {}).get('details', {}).get('items', [])
              third_party = (audits.get('third-party-summary') or {}).get('details', {}).get('items', [])
              main_thread = (audits.get('mainthread-work-breakdown') or {}).get('details', {}).get('items', [])
              return {
                  'file': path.name,
                  'performance_score': round(float((categories.get('performance') or {}).get('score') or 0) * 100, 1),
                  'lcp_ms': round(float((audits.get('largest-contentful-paint') or {}).get('numericValue') or 0)),
                  'tbt_ms': round(float((audits.get('total-blocking-time') or {}).get('numericValue') or 0)),
                  'cls': round(float((audits.get('cumulative-layout-shift') or {}).get('numericValue') or 0), 4),
                  'top_long_tasks': [
                      {'duration_ms': round(float(item.get('duration') or 0)), 'url': item.get('url', '')}
                      for item in sorted(long_tasks, key=lambda item: float(item.get('duration') or 0), reverse=True)[:5]
                  ],
                  'top_main_thread_groups': [
                      {'group': item.get('groupLabel') or item.get('group', ''), 'duration_ms': round(float(item.get('duration') or 0))}
                      for item in sorted(main_thread, key=lambda item: float(item.get('duration') or 0), reverse=True)[:5]
                  ],
                  'top_third_parties': [
                      {'entity': item.get('entity', ''), 'blocking_ms': round(float(item.get('blockingTime') or 0)), 'transfer_bytes': int(item.get('transferSize') or 0)}
                      for item in sorted(third_party, key=lambda item: float(item.get('blockingTime') or 0), reverse=True)[:5]
                  ]
              }
          
          baseline = metrics(baseline_path)
          no_ads = [metrics(path) for path in candidates]
          medians = {
              key: round(median(float(report[key]) for report in no_ads), 1)
              for key in ('performance_score', 'lcp_ms', 'tbt_ms', 'cls')
          }
          report = {
              'diagnostic': 'AdSense-blocked local comparison; not a production change',
              'baseline_ads_enabled_local_audit': baseline,
              'no_ads_repeat_runs': no_ads,
              'no_ads_median': medians,
              'delta_baseline_minus_no_ads': {
                  'performance_score_points': round(baseline['performance_score'] - medians['performance_score'], 1),
                  'lcp_ms': round(baseline['lcp_ms'] - medians['lcp_ms']),
                  'tbt_ms': round(baseline['tbt_ms'] - medians['tbt_ms']),
                  'cls': round(baseline['cls'] - medians['cls'], 4)
              },
              'interpretation': 'A repeatable TBT reduction supports a causal Ads contribution in this lab setup; the difference does not by itself establish the full production impact.'
          }
          output = diagnostic / 'adsense-differential-summary.json'
          output.write_text(json.dumps(report, indent=2) + '\n', encoding='utf-8')
          print(json.dumps(report, indent=2))
          PY
      - name: Enforce lab performance budgets
        shell: bash
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path

          limits = {
              'performance_score_min': 0.60,
              'lcp_ms_max': 4000,
              'cls_max': 0.25,
              'tbt_ms_max': 600,
          }
          failures = []
          summary = []
          for path in sorted(Path('performance-artifacts').glob('*.json')):
              data = json.loads(path.read_text(encoding='utf-8'))
              audits = data['audits']
              score = float(data['categories']['performance']['score'] or 0)
              lcp = float(audits['largest-contentful-paint']['numericValue'])
              cls = float(audits['cumulative-layout-shift']['numericValue'])
              tbt = float(audits['total-blocking-time']['numericValue'])
              row = {
                  'page': path.stem,
                  'performance': round(score, 3),
                  'lcp_ms': round(lcp),
                  'cls': round(cls, 4),
                  'tbt_ms': round(tbt),
              }
              summary.append(row)
              if score < limits['performance_score_min']:
                  failures.append(f"{path.stem}: performance score {score:.2f} < {limits['performance_score_min']:.2f}")
              if lcp > limits['lcp_ms_max']:
                  failures.append(f"{path.stem}: LCP {lcp:.0f}ms > {limits['lcp_ms_max']}ms")
              if cls > limits['cls_max']:
                  failures.append(f"{path.stem}: CLS {cls:.3f} > {limits['cls_max']}")
              if tbt > limits['tbt_ms_max']:
                  failures.append(f"{path.stem}: TBT {tbt:.0f}ms > {limits['tbt_ms_max']}ms")

          print(json.dumps({'limits': limits, 'results': summary, 'failures': failures}, indent=2))
          Path('performance-artifacts/summary.json').write_text(
              json.dumps({'limits': limits, 'results': summary, 'failures': failures}, indent=2) + '\n',
              encoding='utf-8'
          )
          if failures:
              raise SystemExit(1)
          PY

      - name: Upload performance reports
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: nexusnova-lighthouse-performance
          path: performance-artifacts/
          if-no-files-found: warn
          retention-days: 14

      - name: Performance summary
        if: always()
        shell: bash
        run: |
          echo '## NexusNova Lighthouse Lab Audit' >> "$GITHUB_STEP_SUMMARY"
          echo 'Representative public pages: Home (/), Tools, App.' >> "$GITHUB_STEP_SUMMARY"
          echo 'Budgets: Performance >= 0.60, LCP <= 4.0s, CLS <= 0.25, TBT <= 600ms.' >> "$GITHUB_STEP_SUMMARY"
          echo 'This is a lab regression gate; field Core Web Vitals still depend on real-user traffic and device/network conditions.' >> "$GITHUB_STEP_SUMMARY"
          if [ -f performance-artifacts/summary.json ]; then
            echo '```json' >> "$GITHUB_STEP_SUMMARY"
            cat performance-artifacts/summary.json >> "$GITHUB_STEP_SUMMARY"
            echo '```' >> "$GITHUB_STEP_SUMMARY"
          fi
