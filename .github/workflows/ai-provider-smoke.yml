name: NexusNova AI Provider Smoke Test

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/ai-provider-smoke.yml'

permissions:
  contents: read

jobs:
  gemini-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    env:
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      GEMINI_MODEL: ${{ vars.GEMINI_MODEL }}
      OPENAI_API_KEY: ''
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify Gemini primary provider
        run: |
          python - <<'PY'
          import json, sys
          sys.path.insert(0, '.github/scripts')
          import ai_provider
          result = ai_provider.ai_json('Return JSON only: {"publish": false, "status": "ok"}. Do not add markdown.')
          state = ai_provider.status()
          print(json.dumps({"provider": state.get("provider"), "model": state.get("model"), "attempts": state.get("attempts")}, indent=2))
          if state.get('provider') != 'gemini' or not isinstance(result, dict):
              raise SystemExit('Gemini provider smoke test failed')
          PY
