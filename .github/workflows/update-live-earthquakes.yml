name: NexusNova LIVE Earthquake Refresh
on:
  schedule:
    - cron: '*/15 * * * *'
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/scripts/live_earthquakes_core.mjs'
      - '.github/scripts/update_live_earthquakes.mjs'
      - '.github/workflows/update-live-earthquakes.yml'
      - 'assets/data/live-earthquakes.json'
      - 'assets/js/live-earthquakes.js'
      - 'earthquakes-live.html'
      - 'live.html'
      - 'sitemap-live.xml'
      - 'package.json'
      - 'tests/live-earthquakes.test.cjs'
  pull_request:
    paths:
      - '.github/scripts/live_earthquakes_core.mjs'
      - '.github/scripts/update_live_earthquakes.mjs'
      - '.github/workflows/update-live-earthquakes.yml'
      - 'assets/data/live-earthquakes.json'
      - 'assets/js/live-earthquakes.js'
      - 'earthquakes-live.html'
      - 'live.html'
      - 'sitemap-live.xml'
      - 'package.json'
      - 'tests/live-earthquakes.test.cjs'
permissions:
  contents: write
concurrency:
  group: nexusnova-live-earthquakes-${{ github.ref }}
  cancel-in-progress: true
jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Refresh USGS recent earthquakes
        run: node .github/scripts/update_live_earthquakes.mjs
      - name: Validate repository syntax
        run: npm run check
      - name: Run repository tests
        run: npm test
      - name: Run full static SEO and internal-link audit
        run: python3 .github/scripts/site_quality_audit.py
      - name: Require zero severe static findings
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path
          report=json.loads(Path('site-quality-report.json').read_text(encoding='utf-8'))
          severe=report.get('severe',[])
          if severe:
              raise SystemExit(f'{len(severe)} severe static finding(s) remain')
          print('Static site map + SEO audit has zero severe findings.')
          PY
      - name: Commit refreshed data when changed
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        shell: bash
        run: |
          if git diff --quiet -- assets/data/live-earthquakes.json; then
            echo "Earthquake dataset already matches the latest source response."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/data/live-earthquakes.json
          git commit -m "data: refresh NexusNova LIVE earthquakes [skip ci]"
          git reset --hard HEAD
          for attempt in 1 2 3 4 5; do
            if git push origin HEAD:main; then
              echo "Published refreshed earthquake data on attempt ${attempt}."
              exit 0
            fi
            echo "main moved during publish; rebasing before retry ${attempt}/5."
            git fetch origin main
            git rebase origin/main
            sleep $((attempt * 2))
          done
          echo "Unable to publish refreshed earthquake data after 5 safe retries."
          exit 1
