name: OTA Integrity Guard

on:
  push:
    branches: [nexusnova-ota-public]
    paths:
      - 'ota/**'
      - '.github/workflows/ota-integrity-guard.yml'

permissions:
  contents: write

jobs:
  verify-and-repair:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout OTA branch
        uses: actions/checkout@v4
        with:
          ref: nexusnova-ota-public
          fetch-depth: 0

      - name: Rebuild manifest hashes from actual OTA files
        env:
          EXPECTED_BASE: 28ad58de566e42621dad6198aa01be885ccc9769
          TRIGGER_SHA: ${{ github.sha }}
        shell: bash
        run: |
          set -euo pipefail

          test -f ota/manifest.json
          test -f ota/files/index.html

          node <<'NODE'
          const fs = require('fs');
          const path = require('path');
          const crypto = require('crypto');

          const manifestPath = path.join('ota', 'manifest.json');
          const manifest = JSON.parse(fs.readFileSync(manifestPath, 'utf8'));
          const expectedBase = process.env.EXPECTED_BASE;

          if (manifest.schema !== 2) throw new Error('Unsupported OTA schema');
          if (manifest.base !== expectedBase) {
            throw new Error(`OTA base mismatch: ${manifest.base}`);
          }
          if (!Array.isArray(manifest.files) || manifest.files.length < 1) {
            throw new Error('OTA file list missing');
          }

          const indexPath = path.join('ota', 'files', 'index.html');
          let index = fs.readFileSync(indexPath, 'utf8');
          index = index.replace(/OTA11 • ACTIVE/g, 'OTA12 • ACTIVE');
          index = index.replace(/OTA11 update active/g, 'OTA12 update active');
          fs.writeFileSync(indexPath, index);

          const entries = manifest.files.map(entry => {
            if (!entry || typeof entry.path !== 'string' || entry.path.trim() === '') {
              throw new Error('Invalid manifest file path');
            }
            const rel = entry.path.trim();
            if (rel.startsWith('/') || rel.split('/').some(p => !p || p === '.' || p === '..' || p.includes('\\'))) {
              throw new Error(`Unsafe OTA path: ${rel}`);
            }
            const filePath = path.join('ota', 'files', rel);
            if (!fs.existsSync(filePath)) {
              throw new Error(`Missing OTA file: ${rel}`);
            }
            const data = fs.readFileSync(filePath);
            return {
              path: rel,
              sha256: crypto.createHash('sha256').update(data).digest('hex'),
              size: data.length
            };
          }).sort((a, b) => a.path.localeCompare(b.path));

          manifest.version = process.env.TRIGGER_SHA;
          manifest.ota_badge = 'OTA12';
          manifest.ota_badge_status = 'ACTIVE';
          manifest.diagnostic = '1.0.43-android-picker-extension-fallback-v12';
          manifest.files = entries;
          fs.writeFileSync(manifestPath, JSON.stringify(manifest, null, 2) + '\n');

          for (const entry of entries) {
            const data = fs.readFileSync(path.join('ota', 'files', entry.path));
            const hash = crypto.createHash('sha256').update(data).digest('hex');
            if (hash !== entry.sha256 || data.length !== entry.size) {
              throw new Error(`Post-write integrity mismatch: ${entry.path}`);
            }
          }

          console.log(JSON.stringify({
            version: manifest.version,
            base: manifest.base,
            badge: manifest.ota_badge,
            files: entries
          }, null, 2));
          NODE

      - name: Commit repaired OTA manifest
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'NexusNova OTA Integrity Bot'
          git config user.email 'actions@users.noreply.github.com'
          git add ota/manifest.json ota/files/index.html
          git diff --check
          if git diff --cached --quiet; then
            echo "OTA already internally consistent; no commit required."
            exit 0
          fi
          git commit -m "fix(ota12): repair manifest integrity hashes and proof badge"
          git push origin HEAD:nexusnova-ota-public

      - name: Verify published raw OTA endpoints
        shell: bash
        run: |
          set -euo pipefail
          sleep 4
          BASE_URL='https://raw.githubusercontent.com/fahadsoomro123/nexusnova-website/nexusnova-ota-public/ota'
          mkdir -p /tmp/nexusnova-live-ota
          curl -fsSL --retry 5 --retry-delay 1 "$BASE_URL/manifest.json?verify=$GITHUB_RUN_ID" -o /tmp/nexusnova-live-ota/manifest.json

          node <<'NODE'
          const fs = require('fs');
          const path = require('path');
          const crypto = require('crypto');
          const https = require('https');

          const root = '/tmp/nexusnova-live-ota';
          const manifest = JSON.parse(fs.readFileSync(path.join(root, 'manifest.json'), 'utf8'));
          if (manifest.base !== '28ad58de566e42621dad6198aa01be885ccc9769') {
            throw new Error(`Live OTA base mismatch: ${manifest.base}`);
          }
          if (manifest.ota_badge !== 'OTA12' || manifest.ota_badge_status !== 'ACTIVE') {
            throw new Error('Live OTA12 status mismatch');
          }
          if (!/^[0-9a-f]{40}$/.test(manifest.version)) {
            throw new Error('Live OTA version is not SHA-shaped');
          }

          function get(url) {
            return new Promise((resolve, reject) => {
              https.get(url, { headers: { 'Cache-Control': 'no-cache' } }, res => {
                if (res.statusCode < 200 || res.statusCode >= 300) {
                  res.resume();
                  reject(new Error(`HTTP ${res.statusCode} for ${url}`));
                  return;
                }
                const chunks = [];
                res.on('data', chunk => chunks.push(chunk));
                res.on('end', () => resolve(Buffer.concat(chunks)));
              }).on('error', reject);
            });
          }

          (async () => {
            for (const entry of manifest.files) {
              const url = `https://raw.githubusercontent.com/fahadsoomro123/nexusnova-website/nexusnova-ota-public/ota/files/${entry.path}?verify=${manifest.version}`;
              const data = await get(url);
              const hash = crypto.createHash('sha256').update(data).digest('hex');
              if (hash !== entry.sha256) throw new Error(`Live SHA mismatch: ${entry.path}`);
              if (data.length !== entry.size) throw new Error(`Live size mismatch: ${entry.path}`);
              console.log(`LIVE PASS ${entry.path} bytes=${data.length} sha256=${hash}`);
            }
            console.log(`PASS — public raw OTA endpoints are reachable and all ${manifest.files.length} files match manifest hashes/sizes. version=${manifest.version}`);
          })().catch(error => { console.error(error); process.exit(1); });
          NODE

      - name: Final local integrity verification
        shell: bash
        env:
          EXPECTED_BASE: 28ad58de566e42621dad6198aa01be885ccc9769
        run: |
          set -euo pipefail
          node <<'NODE'
          const fs = require('fs');
          const path = require('path');
          const crypto = require('crypto');
          const m = JSON.parse(fs.readFileSync('ota/manifest.json', 'utf8'));
          if (m.base !== process.env.EXPECTED_BASE) throw new Error('Final base mismatch');
          if (m.ota_badge !== 'OTA12' || m.ota_badge_status !== 'ACTIVE') throw new Error('OTA12 badge state mismatch');
          if (!/^[0-9a-f]{40}$/.test(m.version)) throw new Error('Invalid OTA version');
          for (const e of m.files) {
            const d = fs.readFileSync(path.join('ota', 'files', e.path));
            const h = crypto.createHash('sha256').update(d).digest('hex');
            if (h !== e.sha256) throw new Error(`SHA mismatch: ${e.path}`);
            if (d.length !== e.size) throw new Error(`Size mismatch: ${e.path}`);
          }
          console.log(`PASS — OTA12 manifest, version, hashes, sizes and proof badge are internally consistent. version=${m.version}`);
          NODE
