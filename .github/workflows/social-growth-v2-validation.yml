name: Social Growth v2 Validation

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/scripts/social_growth_metrics.py'
      - '.github/scripts/social_growth_engine.py'
      - '.github/scripts/distribute_social_growth.py'
      - '.github/workflows/traffic-autopilot.yml'
      - '.github/workflows/social-growth-v2-validation.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: python -m pip install --disable-pip-version-check pillow google-auth requests feedparser

      - name: Compile social growth scripts
        run: |
          python -m py_compile .github/scripts/social_growth_metrics.py
          python -m py_compile .github/scripts/social_growth_engine.py
          python -m py_compile .github/scripts/distribute_social_growth.py
          python -m py_compile .github/scripts/distribute_update.py

      - name: Credential-free metrics smoke test
        env:
          GOOGLE_SERVICE_ACCOUNT_JSON: ''
          GA4_PROPERTY_ID: ''
        run: python .github/scripts/social_growth_metrics.py

      - name: Generate adaptive social package
        run: python .github/scripts/social_growth_engine.py

      - name: Validate generated package and creatives
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          from urllib.parse import urlsplit
          from PIL import Image

          payload=Path('social-growth-publish.json')
          if not payload.exists():
              raise SystemExit('social-growth-publish.json was not generated')
          item=json.loads(payload.read_text(encoding='utf-8'))
          if urlsplit(str(item.get('url',''))).netloc != 'nexusnovatools.com':
              raise SystemExit('Selected URL is not a NexusNova URL')
          if not str(item.get('campaign','')).startswith('social_growth_'):
              raise SystemExit('Campaign does not use social_growth_ namespace')
          if item.get('format') not in {'quick_tip','problem_solution','tool_demo','bookmark_worthy'}:
              raise SystemExit('Unexpected social content format')
          if not item.get('platform_copy') or not all(k in item['platform_copy'] for k in ('telegram','facebook','instagram','x')):
              raise SystemExit('Platform-specific copy is incomplete')

          expected={
              'assets/generated/social-growth-feed.jpg': (1080,1350),
              'assets/generated/social-growth-vertical.jpg': (1080,1920),
          }
          for name,size in expected.items():
              p=Path(name)
              if not p.exists():
                  raise SystemExit(f'Missing creative: {name}')
              with Image.open(p) as image:
                  if image.size != size or image.mode != 'RGB':
                      raise SystemExit(f'Invalid creative {name}: {image.size} {image.mode}')
                  image.verify()
          history=json.loads(Path('assets/data/social-growth-history.json').read_text(encoding='utf-8'))
          if len(history.get('posts',[])) != 1:
              raise SystemExit('Smoke test should create exactly one history row from an empty history')
          print(json.dumps({
              'selected': item.get('title'),
              'format': item.get('format'),
              'campaign': item.get('campaign'),
              'score': item.get('selection_score'),
          }, indent=2))
          PY

      - name: Full public-site quality audit
        run: python .github/scripts/site_quality_audit.py

      - name: Require zero severe site findings
        run: |
          python - <<'PY'
          import re
          from pathlib import Path
          report=Path('site-quality-report.txt').read_text(encoding='utf-8')
          match=re.search(r'Severe findings:\s*(\d+)',report)
          severe=int(match.group(1)) if match else 999
          print(f'Severe findings: {severe}')
          if severe:
              raise SystemExit('Site quality gate failed')
          PY
