name: Social Growth v2 Validation

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/scripts/social_growth_metrics.py'
      - '.github/scripts/social_growth_engine.py'
      - '.github/scripts/distribute_social_growth.py'
      - '.github/scripts/distribute_update.py'
      - '.github/scripts/social_audience_metrics.py'
      - '.github/workflows/traffic-autopilot.yml'
      - '.github/workflows/social-audience-watch.yml'
      - '.github/workflows/social-growth-v2-validation.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: python -m pip install --disable-pip-version-check pillow google-auth requests feedparser

      - name: Compile social growth scripts
        run: |
          python -m py_compile .github/scripts/social_growth_metrics.py
          python -m py_compile .github/scripts/social_growth_engine.py
          python -m py_compile .github/scripts/distribute_social_growth.py
          python -m py_compile .github/scripts/social_audience_metrics.py
          python -m py_compile .github/scripts/distribute_update.py

      - name: Credential-free metrics smoke test
        env:
          GOOGLE_SERVICE_ACCOUNT_JSON: ''
          GA4_PROPERTY_ID: ''
        run: python .github/scripts/social_growth_metrics.py

      - name: Credential-free audience watchdog smoke test
        env:
          FACEBOOK_PAGE_ACCESS_TOKEN: ''
          FACEBOOK_PAGE_ID: ''
          TELEGRAM_BOT_TOKEN: ''
          TELEGRAM_CHANNEL_ID: ''
          NEXUSNOVA_RECORD_AUDIENCE: '0'
        run: |
          python - <<'PY'
          from pathlib import Path
          history=Path('assets/data/social-audience-history.json')
          backup=Path('/tmp/nexusnova-social-audience-history.bin')
          if history.exists():
              backup.write_bytes(history.read_bytes())
          elif backup.exists():
              backup.unlink()
          PY
          python .github/scripts/social_audience_metrics.py
          python - <<'PY'
          import json
          from pathlib import Path
          data=json.loads(Path('social-audience-metrics.json').read_text(encoding='utf-8'))
          for platform in ('facebook','instagram','telegram'):
              if (data.get(platform) or {}).get('configured') is not False:
                  raise SystemExit(f'{platform} should be safely unconfigured in credential-free smoke test')
          history=Path('assets/data/social-audience-history.json')
          backup=Path('/tmp/nexusnova-social-audience-history.bin')
          if backup.exists():
              if not history.exists() or history.read_bytes() != backup.read_bytes():
                  raise SystemExit('Credential-free non-recording smoke test modified existing audience history')
          elif history.exists():
              raise SystemExit('Credential-free non-recording smoke test created audience history')
          print('Audience watchdog credential-free smoke test passed.')
          PY

      - name: Prepare clean social history fixture
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          history=Path('assets/data/social-growth-history.json')
          history.parent.mkdir(parents=True,exist_ok=True)
          history.write_text(json.dumps({'version':2,'posts':[]},indent=2)+'\n',encoding='utf-8')
          PY

      - name: Generate adaptive social package
        run: python .github/scripts/social_growth_engine.py

      - name: Validate generated package and creatives
        run: |
          python - <<'PY'
          import importlib.util
          import json
          from pathlib import Path
          from urllib.parse import urlsplit
          from PIL import Image

          payload=Path('social-growth-publish.json')
          if not payload.exists():
              raise SystemExit('social-growth-publish.json was not generated')
          item=json.loads(payload.read_text(encoding='utf-8'))
          if urlsplit(str(item.get('url',''))).netloc != 'nexusnovatools.com':
              raise SystemExit('Selected URL is not a NexusNova URL')
          if not str(item.get('campaign','')).startswith('social_growth_'):
              raise SystemExit('Campaign does not use social_growth_ namespace')
          if item.get('format') not in {'quick_tip','problem_solution','tool_demo','bookmark_worthy'}:
              raise SystemExit('Unexpected social content format')
          if not item.get('platform_copy') or not all(k in item['platform_copy'] for k in ('telegram','facebook','instagram','x')):
              raise SystemExit('Platform-specific copy is incomplete')

          expected={
              'assets/generated/social-growth-feed.jpg': (1080,1350),
              'assets/generated/social-growth-vertical.jpg': (1080,1920),
          }
          for name,size in expected.items():
              p=Path(name)
              if not p.exists():
                  raise SystemExit(f'Missing creative: {name}')
              with Image.open(p) as image:
                  if image.size != size or image.mode != 'RGB':
                      raise SystemExit(f'Invalid creative {name}: {image.size} {image.mode}')
                  image.verify()

          spec=importlib.util.spec_from_file_location('distribute_update',Path('.github/scripts/distribute_update.py'))
          module=importlib.util.module_from_spec(spec)
          spec.loader.exec_module(module)
          chosen=module.social_image_url(item)
          if chosen != item.get('instagram_image'):
              raise SystemExit('Social distributor did not select the HD feed creative')
          if not all(callable(getattr(module,name,None)) for name in ('post_telegram','post_x','post_facebook','post_instagram')):
              raise SystemExit('One or more social media posting helpers are missing')

          history=json.loads(Path('assets/data/social-growth-history.json').read_text(encoding='utf-8'))
          if len(history.get('posts',[])) != 1:
              raise SystemExit('Clean-history smoke test should create exactly one history row')
          print(json.dumps({
              'selected': item.get('title'),
              'format': item.get('format'),
              'campaign': item.get('campaign'),
              'score': item.get('selection_score'),
              'hd_image': chosen,
          }, indent=2))
          PY

      - name: Full public-site quality audit
        run: python .github/scripts/site_quality_audit.py

      - name: Require zero severe site findings
        run: |
          python - <<'PY'
          import re
          from pathlib import Path
          report=Path('site-quality-report.txt').read_text(encoding='utf-8')
          match=re.search(r'Severe findings:\s*(\d+)',report)
          severe=int(match.group(1)) if match else 999
          print(f'Severe findings: {severe}')
          if severe:
              raise SystemExit('Site quality gate failed')
          PY
