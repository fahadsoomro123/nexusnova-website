name: Prepare lossless WebP logo asset

on:
  push:
    branches:
      - perf/logo-webp-prep-20261013
    paths:
      - '.github/workflows/prepare-logo-webp.yml'

permissions:
  contents: write

jobs:
  prepare:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - name: Generate and verify pixel-exact lossless WebP
        run: |
          python -m pip install --disable-pip-version-check Pillow
          python - <<'PY'
          from pathlib import Path
          from PIL import Image, ImageChops
          source = Path('assets/logo.png')
          target = Path('assets/logo.webp')
          with Image.open(source) as original:
              original.load()
              profile = original.info.get('icc_profile')
              exif = original.info.get('exif')
              rgba = original.convert('RGBA')
              rgba.save(target, 'WEBP', lossless=True, method=6, exact=True,
                        icc_profile=profile, exif=exif)
          with Image.open(target) as optimized:
              optimized.load()
              candidate = optimized.convert('RGBA')
          if rgba.size != candidate.size or ImageChops.difference(rgba, candidate).getbbox():
              raise SystemExit('Pixel-exact verification failed')
          before, after = source.stat().st_size, target.stat().st_size
          print(f'logo.png: {before} bytes; logo.webp: {after} bytes; saved: {before-after} bytes ({(before-after)/before:.1%}); pixel_exact=true; dimensions={rgba.size}')
          if after >= before:
              raise SystemExit('WebP did not reduce the original file size; do not publish it')
          PY
      - name: Commit generated asset to this temporary branch
        run: |
          git config user.name 'nexusnova-automation'
          git config user.email 'actions@users.noreply.github.com'
          git add assets/logo.webp
          git commit -m 'perf(images): add pixel-exact lossless WebP logo'
          git push origin "HEAD:$(git branch --show-current)"
