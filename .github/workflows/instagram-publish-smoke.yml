name: NexusNova Instagram Publish Smoke Test

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/instagram-publish-smoke.yml'

permissions:
  contents: write

concurrency:
  group: nexusnova-instagram-publish-smoke
  cancel-in-progress: false

jobs:
  instagram-publish-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      FACEBOOK_PAGE_ACCESS_TOKEN: ${{ secrets.FACEBOOK_PAGE_ACCESS_TOKEN }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install image dependency
        run: python -m pip install --disable-pip-version-check pillow

      - name: Create temporary Instagram test JPEG
        run: |
          python - <<'PY'
          from pathlib import Path
          from PIL import Image, ImageDraw, ImageFont

          path = Path('assets/instagram-automation-test.jpg')
          img = Image.new('RGB', (1080, 1080), (14, 18, 32))
          draw = ImageDraw.Draw(img)
          font_path = '/usr/share/fonts/truetype/dejavu/DejaVuSans-Bold.ttf'
          body_path = '/usr/share/fonts/truetype/dejavu/DejaVuSans.ttf'
          title = ImageFont.truetype(font_path, 78)
          body = ImageFont.truetype(body_path, 40)
          small = ImageFont.truetype(body_path, 30)
          draw.rounded_rectangle((80, 80, 1000, 1000), radius=70, fill=(25, 31, 55), outline=(125, 110, 255), width=4)
          draw.text((140, 220), 'NEXUSNOVA', font=title, fill=(255, 255, 255))
          draw.text((140, 340), 'Instagram Automation', font=body, fill=(220, 225, 255))
          draw.text((140, 410), 'Connection Test', font=body, fill=(220, 225, 255))
          draw.text((140, 570), 'AUTO-POST VERIFIED', font=body, fill=(185, 255, 215))
          draw.text((140, 760), 'nexusnovatools.com', font=small, fill=(200, 205, 230))
          img.save(path, 'JPEG', quality=92, optimize=True, progressive=True)
          print('Temporary JPEG prepared.')
          PY

      - name: Publish temporary JPEG to public repository
        run: |
          git config user.name 'nexusnova-autopilot[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add assets/instagram-automation-test.jpg
          git commit -m 'test: expose temporary Instagram smoke image'
          git pull --rebase origin main
          git push origin HEAD:main

      - name: Verify public image is reachable
        run: |
          python - <<'PY'
          import time
          import urllib.request

          url = 'https://raw.githubusercontent.com/fahadsoomro123/nexusnova-website/main/assets/instagram-automation-test.jpg'
          for attempt in range(20):
              try:
                  req = urllib.request.Request(url, headers={'User-Agent':'NexusNovaTrafficAutopilot/1.0'})
                  with urllib.request.urlopen(req, timeout=15) as r:
                      ctype = (r.headers.get('Content-Type') or '').lower()
                      first = r.read(16)
                      if r.status == 200 and 'image' in ctype and first.startswith(b'\xff\xd8'):
                          print('Public JPEG reachable: HTTP 200')
                          break
              except Exception:
                  pass
              if attempt == 19:
                  raise SystemExit('Temporary public JPEG did not become reachable')
              time.sleep(3)
          PY

      - name: Publish real Instagram smoke post
        run: |
          python - <<'PY'
          import json
          import os
          import time
          import urllib.error
          import urllib.parse
          import urllib.request

          token = os.environ.get('FACEBOOK_PAGE_ACCESS_TOKEN','').strip()
          if not token:
              raise SystemExit('FACEBOOK_PAGE_ACCESS_TOKEN is missing')

          API = 'https://graph.facebook.com/v26.0'
          headers = {
              'Authorization': f'Bearer {token}',
              'User-Agent': 'NexusNovaTrafficAutopilot/1.0',
          }

          def call(path, *, method='GET', params=None):
              url = API + path
              data = None
              local_headers = dict(headers)
              if method == 'GET' and params:
                  url += '?' + urllib.parse.urlencode(params)
              elif params is not None:
                  data = urllib.parse.urlencode(params).encode()
                  local_headers['Content-Type'] = 'application/x-www-form-urlencoded'
              req = urllib.request.Request(url, data=data, headers=local_headers, method=method)
              try:
                  with urllib.request.urlopen(req, timeout=30) as r:
                      return json.loads(r.read().decode('utf-8'))
              except urllib.error.HTTPError as exc:
                  raw = exc.read().decode('utf-8', errors='replace')
                  raw = raw.replace(token, '***')
                  raise RuntimeError(f'Meta API HTTP {exc.code}: {raw}') from None

          accounts = call('/me/accounts', params={
              'fields': 'id,name,instagram_business_account{id,username}'
          }).get('data') or []
          target = next((row for row in accounts if (row.get('instagram_business_account') or {}).get('id')), None)
          if not target:
              raise SystemExit('No connected Instagram professional account found')

          ig = target['instagram_business_account']
          ig_id = str(ig['id'])
          username = str(ig.get('username') or '')
          image_url = 'https://raw.githubusercontent.com/fahadsoomro123/nexusnova-website/main/assets/instagram-automation-test.jpg'
          caption = 'NexusNova automation connection test ✅\n\nInstagram auto-post verification from NexusNova Tools.\nhttps://nexusnovatools.com/'

          created = call(f'/{ig_id}/media', method='POST', params={
              'image_url': image_url,
              'caption': caption,
          })
          creation_id = str(created.get('id') or '')
          if not creation_id:
              raise SystemExit('Instagram media container was not created')
          print(f'Instagram container created for @{username or "connected-account"}.')

          for attempt in range(30):
              status = call(f'/{creation_id}', params={'fields':'status_code,status'})
              code = str(status.get('status_code') or '').upper()
              if code == 'FINISHED':
                  break
              if code in {'ERROR','EXPIRED'}:
                  raise RuntimeError(f'Instagram container failed: {status}')
              if attempt == 29:
                  raise SystemExit(f'Instagram container not ready: {status}')
              time.sleep(2)

          published = call(f'/{ig_id}/media_publish', method='POST', params={'creation_id': creation_id})
          media_id = str(published.get('id') or '')
          if not media_id:
              raise SystemExit('Instagram publish did not return a media ID')

          verified = call(f'/{media_id}', params={'fields':'id,permalink,timestamp'})
          safe = {
              'ok': True,
              'instagram_username': username,
              'media_id': verified.get('id'),
              'permalink': verified.get('permalink'),
              'timestamp': verified.get('timestamp'),
          }
          print(json.dumps(safe, indent=2))
          PY

      - name: Remove temporary repository image
        if: always()
        run: |
          git pull --rebase origin main || true
          if [ -f assets/instagram-automation-test.jpg ]; then
            git rm -f assets/instagram-automation-test.jpg
            git config user.name 'nexusnova-autopilot[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git commit -m 'test: remove temporary Instagram smoke image' || true
            git pull --rebase origin main || true
            git push origin HEAD:main || true
          fi
