name: NexusNova Total Site Overhaul

on:
  push:
    branches: [main]
    paths:
      - '.github/scripts/total_site_overhaul.py'
      - '.github/scripts/final_system_cleanup.py'
      - '.github/scripts/deep_site_audit_strict.py'
      - '.github/scripts/site_quality_audit.py'
      - '.github/workflows/total-site-overhaul.yml'
      - 'tests/**'
  workflow_dispatch:

permissions:
  contents: write
  workflows: write

concurrency:
  group: nexusnova-total-site-overhaul
  cancel-in-progress: true

jobs:
  overhaul:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout complete main history
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Set up Node 22
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'

      - name: Set up Python 3.12
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'

      - name: Prepare deterministic production fixes
        run: python .github/scripts/total_site_overhaul.py

      - name: Apply final metadata, discovery and action cleanup
        run: python .github/scripts/final_system_cleanup.py

      - name: Syntax and repository tests
        run: |
          npm run check
          npm test

      - name: Strict public-site audits
        run: |
          python .github/scripts/deep_site_audit_strict.py
          python .github/scripts/site_quality_audit.py

      - name: Start local production server
        shell: bash
        run: |
          python -m http.server 8000 --bind 127.0.0.1 >/tmp/nexusnova-overhaul-server.log 2>&1 &
          echo $! >/tmp/nexusnova-server.pid
          sleep 1
          curl --fail --silent http://127.0.0.1:8000/ >/dev/null

      - name: Fast indexed-tool HTTP and DOM contract audit
        shell: bash
        run: |
          node <<'NODE'
          const fs = require('node:fs');
          const http = require('node:http');
          const BASE = 'http://127.0.0.1:8000';
          const VERSION = '20261015-v4';
          const source = fs.readFileSync('assets/js/search-core.js', 'utf8');
          const tools = [...source.matchAll(/\{\s*title:"(?:[^"\\]|\\.)*",\s*url:"([^"]+)",\s*type:"tool"/g)]
            .map(m => m[1]).filter((v,i,a)=>a.indexOf(v)===i).sort();
          if (tools.length !== 108) throw new Error(`Expected 108 unique tool records, found ${tools.length}`);
          function get(path) { return new Promise((resolve,reject)=>{ const req=http.get(BASE+'/'+path.replace(/^\//,''),{headers:{'user-agent':'NexusNova-fast-ci-audit/1.0'}},res=>{let b='';res.setEncoding('utf8');res.on('data',c=>b+=c);res.on('end',()=>resolve({status:res.statusCode||0,body:b}));}); req.setTimeout(5000,()=>req.destroy(new Error('timeout'))); req.on('error',reject); }); }
          function assertDom(path,html){
            if(!/^<!doctype html/i.test(html.trim())) throw new Error(`${path}: missing doctype`);
            if(!/<html[^>]+lang=["']en["']/i.test(html)) throw new Error(`${path}: missing lang=en`);
            if(!/<meta[^>]+name=["']viewport["']/i.test(html)) throw new Error(`${path}: missing viewport`);
            const rendered=html.replace(/<script\b[^>]*>[\s\S]*?<\/script>/gi,'').replace(/<style\b[^>]*>[\s\S]*?<\/style>/gi,'');
            if(!/(<main\b|<article\b|<section\b|class=["'][^"']*(?:tool|calculator|converter|widget|app)[^"']*["'])/i.test(rendered)) throw new Error(`${path}: no primary tool surface`);
            const assets=[...html.matchAll(/(?:src|href)=["']([^"']*assets\/[^"']+\.(?:js|css)(?:\?[^"']*)?)["']/gi)].map(m=>m[1]);
            const stale=assets.filter(v=>!v.includes(`v=${VERSION}`) && !/nn-inner-shell(?:\.js|\.css)/i.test(v));
            if(stale.length) throw new Error(`${path}: stale asset key ${stale[0]}`);
          }
          (async()=>{
            const failures=[];
            for(const rel of tools){try{const clean=rel.split('#')[0].split('?')[0];const r=await get(clean);if(r.status!==200)throw new Error(`HTTP ${r.status}`);assertDom(clean,r.body);}catch(e){failures.push(`${rel}: ${e.message}`);}}
            if(failures.length){console.error(`FAST_TOOL_AUDIT_FAIL failures=${failures.length}`);failures.forEach(x=>console.error(x));process.exit(1);}
            const sm=await get('sitemap.xml');if(sm.status!==200||!/<urlset[\s>]/i.test(sm.body))throw new Error('sitemap.xml invalid');
            const locs=[...sm.body.matchAll(/<loc>([^<]+)<\/loc>/g)].map(m=>m[1]);if(locs.length<97)throw new Error(`sitemap URLs=${locs.length}`);
            console.log(`FAST_TOOL_AUDIT_PASS tools=${tools.length} http=200 dom=valid stale_assets=0`);
            console.log(`FAST_SITEMAP_AUDIT_PASS urls=${locs.length}`);
          })().catch(e=>{console.error(e.stack||e);process.exit(1);});
          NODE

      - name: Protected-area and diff guard
        shell: bash
        run: |
          set -euo pipefail
          bad="$(git diff --name-only | grep -E '^(cloudflare/|functions/|firebase/|nexusnova-dev-ai/|ota/|downloads/)' || true)"
          if [ -n "$bad" ]; then
            echo 'Protected files changed unexpectedly:' >&2
            echo "$bad" >&2
            exit 1
          fi
          echo 'Protected auth/Telegram/mining/Firebase/Worker payloads unchanged.'

      - name: Commit verified overhaul
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'Fahad Hussain'
          git config user.email '166254374+fahadsoomro123@users.noreply.github.com'
          git add --all
          if git diff --cached --quiet; then
            echo 'No production changes were required after verification.'
            exit 0
          fi
          git commit -m 'fix: complete 108-tool production and search overhaul'
          git push origin HEAD:main

      - name: Verify deployed edge assets
        shell: bash
        run: |
          set -euo pipefail
          for i in {1..12}; do
            if curl --fail --silent --show-error https://nexusnovatools.com/ | grep -q '20261015-v4'; then
              echo "EDGE_DEPLOYMENT_PASS cache version 20261015-v4 visible on production homepage"
              break
            fi
            echo "Waiting for GitHub Pages edge deployment ($i/12)..."
            sleep 10
            if [ "$i" = "12" ]; then
              echo 'EDGE_DEPLOYMENT_FAIL: v4 asset marker not visible after 120 seconds' >&2
              exit 1
            fi
          done
          curl --fail --silent --show-error https://nexusnovatools.com/sitemap.xml -o /tmp/live-sitemap.xml
          python - <<'PY'
          import xml.etree.ElementTree as ET
          root=ET.parse('/tmp/live-sitemap.xml').getroot()
          ns={'s':'http://www.sitemaps.org/schemas/sitemap/0.9'}
          urls=root.findall('s:url',ns)
          assert urls, 'live sitemap has no URLs'
          assert all(u.find('s:loc',ns) is not None for u in urls), 'sitemap loc missing'
          assert all(u.find('s:lastmod',ns) is not None for u in urls), 'sitemap lastmod missing'
          assert all(u.find('s:loc',ns).text.startswith('https://nexusnovatools.com/') for u in urls), 'non-canonical sitemap URL found'
          print(f'LIVE_SITEMAP_PASS urls={len(urls)} lastmod=present canonical=https://nexusnovatools.com/')
          PY
