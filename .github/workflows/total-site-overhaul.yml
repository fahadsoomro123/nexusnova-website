name: NexusNova Total Site Overhaul

on:
  push:
    branches: [main]
    paths:
      - '.github/scripts/total_site_overhaul.py'
      - '.github/scripts/final_system_cleanup.py'
      - '.github/scripts/sync_phase2_content.py'
      - '.github/scripts/deep_site_audit_strict.py'
      - '.github/scripts/site_quality_audit.py'
      - '.github/workflows/total-site-overhaul.yml'
      - 'tests/**'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: nexusnova-total-site-overhaul
  cancel-in-progress: true

jobs:
  overhaul:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout complete main history
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Set up Node 22
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'

      - name: Set up Python 3.12
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'

      - name: Prepare deterministic production fixes
        run: python .github/scripts/total_site_overhaul.py

      - name: Apply final metadata, discovery and action cleanup
        run: python .github/scripts/final_system_cleanup.py

      - name: Syntax and repository tests
        run: |
          npm run check
          npm test

      - name: Strict public-site audits
        run: |
          python .github/scripts/deep_site_audit_strict.py
          python .github/scripts/site_quality_audit.py

      - name: Start local production server
        shell: bash
        run: |
          python -m http.server 8000 --bind 127.0.0.1 >/tmp/nexusnova-overhaul-server.log 2>&1 &
          echo $! >/tmp/nexusnova-server.pid
          sleep 1
          curl --fail --silent http://127.0.0.1:8000/ >/dev/null

      - name: Fast indexed-tool HTTP and DOM contract audit
        shell: bash
        run: |
          node <<'NODE'
          const fs = require('node:fs');
          const http = require('node:http');
          const BASE = 'http://127.0.0.1:8000';
          const VERSION = '20261015-v4';
          const source = fs.readFileSync('assets/js/search-core.js', 'utf8');
          const tools = [...source.matchAll(/\{\s*title:"(?:[^"\\]|\\.)*",\s*url:"([^"]+)",\s*type:"tool"/g)]
            .map(m => m[1]).filter((v,i,a)=>a.indexOf(v)===i).sort();
          if (tools.length !== 109) throw new Error(`Expected 109 unique tool records, found ${tools.length}`);
          function get(path) { return new Promise((resolve,reject)=>{ const req=http.get(BASE+'/'+path.replace(/^\//,''),{headers:{'user-agent':'NexusNova-fast-ci-audit/1.0'}},res=>{let b='';res.setEncoding('utf8');res.on('data',c=>b+=c);res.on('end',()=>resolve({status:res.statusCode||0,body:b}));}); req.setTimeout(5000,()=>req.destroy(new Error('timeout'))); req.on('error',reject); }); }
          function assertDom(path,html){
            if(!/^<!doctype html/i.test(html.trim())) throw new Error(`${path}: missing doctype`);
            if(!/<html[^>]+lang=["']en["']/i.test(html)) throw new Error(`${path}: missing lang=en`);
            if(!/<meta[^>]+name=["']viewport["']/i.test(html)) throw new Error(`${path}: missing viewport`);
            const rendered=html.replace(/<script\b[^>]*>[\s\S]*?<\/script>/gi,'').replace(/<style\b[^>]*>[\s\S]*?<\/style>/gi,'');
            if(!/(<main\b|<article\b|<section\b|class=["'][^"']*(?:tool|calculator|converter|widget|app)[^"']*["'])/i.test(rendered)) throw new Error(`${path}: no primary tool surface`);
            const assets=[...html.matchAll(/(?:src|href)=["']([^"']*assets\/[^"']+\.(?:js|css)(?:\?[^"']*)?)["']/gi)].map(m=>m[1]);
            const isSharedShellAsset = value =>
              /(?:^|\/)static-site-shell\.css\?v=20261017-static-shell-v1(?:$|#)/.test(value);
            // analytics.js intentionally uses its own related-content fingerprint;
            // tests pin this asset key independently of the global shell version.
            const isIndependentlyVersionedBootstrap = value =>
              /(?:^|\/)analytics\.js\?v=20261016-related-content-v1(?:$|#)/.test(value);
            const stale = assets.filter(value =>
              !value.includes(\`v=\${VERSION}\`) &&
              !isSharedShellAsset(value) &&
              !isIndependentlyVersionedBootstrap(value) &&
              !/nn-inner-shell(?:\.js|\.css)/i.test(value)
            );
            if(stale.length) throw new Error(`${path}: stale asset key ${stale[0]}`);
          }
          (async()=>{
            const failures=[];
            for(const rel of tools){try{const clean=rel.split('#')[0].split('?')[0];const r=await get(clean);if(r.status!==200)throw new Error(`HTTP ${r.status}`);assertDom(clean,r.body);}catch(e){failures.push(`${rel}: ${e.message}`);}}
            if(failures.length){console.error(`FAST_TOOL_AUDIT_FAIL failures=${failures.length}`);failures.forEach(x=>console.error(x));process.exit(1);}
            const sm=await get('sitemap.xml');if(sm.status!==200||!/<urlset[\s>]/i.test(sm.body))throw new Error('sitemap.xml invalid');
            const locs=[...sm.body.matchAll(/<loc>([^<]+)<\/loc>/g)].map(m=>m[1]);if(locs.length<97)throw new Error(`sitemap URLs=${locs.length}`);
            console.log(`FAST_TOOL_AUDIT_PASS tools=${tools.length} http=200 dom=valid stale_assets=0`);
            console.log(`FAST_SITEMAP_AUDIT_PASS urls=${locs.length}`);
          })().catch(e=>{console.error(e.stack||e);process.exit(1);});
          NODE

      - name: Protected-area and diff guard
        shell: bash
        run: |
          set -euo pipefail
          bad="$(git diff --name-only | grep -E '^(cloudflare/|functions/|firebase/|nexusnova-dev-ai/|ota/|downloads/)' || true)"
          if [ -n "$bad" ]; then
            echo 'Protected files changed unexpectedly:' >&2
            echo "$bad" >&2
            exit 1
          fi
          echo 'Protected auth/Telegram/mining/Firebase/Worker payloads unchanged.'

      - name: Commit verified overhaul
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'Fahad Hussain'
          git config user.email '166254374+fahadsoomro123@users.noreply.github.com'
          git add --all
          if git diff --cached --quiet; then
            echo 'No production changes were required after verification.'
            exit 0
          fi
          git commit -m 'fix: complete 109-tool production and search overhaul'
          # Scheduled content feeds can update disjoint files while this job is
          # verifying the site. Rebase the verified changes on the latest main
          # head before pushing instead of losing the release to a stale ref.
          git fetch origin main
          git rebase origin/main
          git push origin HEAD:main

      - name: Verify live article hub and sitemap after deployment
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import html
          import os
          import re
          import time
          import urllib.error
          import urllib.request
          import xml.etree.ElementTree as ET
          from html.parser import HTMLParser

          BASE = "https://nexusnovatools.com"
          COMMIT = os.environ.get("GITHUB_SHA", "unknown")
          USER_AGENT = "NexusNova-Production-Verification/2.1"

          class HubParser(HTMLParser):
              def __init__(self):
                  super().__init__(convert_charrefs=True)
                  self.cards = 0
                  self.capture_count = False
                  self.count_parts = []

              def handle_starttag(self, tag, attrs):
                  attrs = dict(attrs)
                  if tag.lower() == "a":
                      classes = attrs.get("class", "").split()
                      href = attrs.get("href", "")
                      if (
                          "nn-article-card" in classes
                          and re.fullmatch(r"articles/[^?#]+\.html", href)
                      ):
                          self.cards += 1
                  if attrs.get("id") == "article-search-count":
                      self.capture_count = True

              def handle_data(self, data):
                  if self.capture_count:
                      self.count_parts.append(data)

              def handle_endtag(self, tag):
                  if tag.lower() == "span" and self.capture_count:
                      self.capture_count = False

              @property
              def display_count(self):
                  return " ".join(" ".join(self.count_parts).split())

          def fetch(path, attempt):
              url = f"{BASE}/{path}?nn_live_deploy={COMMIT}-{attempt}"
              request = urllib.request.Request(
                  url,
                  headers={
                      "Cache-Control": "no-cache, no-store, max-age=0",
                      "Pragma": "no-cache",
                      "Accept-Encoding": "identity",
                      "User-Agent": USER_AGENT,
                  },
              )
              with urllib.request.urlopen(request, timeout=15) as response:
                  body = response.read().decode("utf-8-sig", "replace")
                  status = response.status
                  final_url = response.geturl()
              if status != 200:
                  raise RuntimeError(f"{path}: HTTP {status} at {final_url}")
              return body

          hub_ok = False
          last_hub_result = "not checked"
          for attempt in range(1, 41):
              try:
                  live_hub = fetch("articles.html", attempt)
                  parser = HubParser()
                  parser.feed(live_hub)
                  last_hub_result = f"cards={parser.cards} label={parser.display_count!r}"
                  if parser.cards == 100 and parser.display_count == "100 articles":
                      print(
                          f"LIVE_ARTICLES_HUB_PASS http=200 article_cards={parser.cards} "
                          f"display_count={parser.display_count!r} attempt={attempt} commit={COMMIT}"
                      )
                      hub_ok = True
                      break
                  print(
                      f"Waiting for live article hub attempt={attempt}/40 "
                      f"http=200 {last_hub_result}"
                  )
              except (urllib.error.URLError, TimeoutError, OSError, RuntimeError) as error:
                  last_hub_result = str(error)
                  print(f"Waiting for live article hub attempt={attempt}/40 error={error}")
              if attempt < 40:
                  time.sleep(3)
          if not hub_ok:
              raise SystemExit(
                  "LIVE_ARTICLES_HUB_FAIL: expected HTTP 200, exactly 100 article cards, "
                  f"and the 100-article display label; last result: {last_hub_result}"
              )

          sitemap_ok = False
          last_sitemap_result = "not checked"
          for attempt in range(1, 41):
              try:
                  sitemap_text = fetch("sitemap.xml", attempt)
                  root = ET.fromstring(sitemap_text)
                  ns = {"s": "http://www.sitemaps.org/schemas/sitemap/0.9"}
                  urls = root.findall("s:url", ns)
                  locs = [
                      node.find("s:loc", ns).text
                      for node in urls
                      if node.find("s:loc", ns) is not None and node.find("s:loc", ns).text
                  ]
                  lastmods = [node.find("s:lastmod", ns) for node in urls]
                  article_urls = {
                      loc for loc in locs
                      if loc.startswith(BASE + "/articles/")
                  }
                  lastmod_ok = all(
                      node is not None and (node.text or "").strip()
                      for node in lastmods
                  )
                  valid = (
                      len(urls) >= 97
                      and len(locs) == len(urls)
                      and len(article_urls) == 100
                      and lastmod_ok
                      and all(loc.startswith(BASE + "/") for loc in locs)
                  )
                  last_sitemap_result = (
                      f"urls={len(urls)} locs={len(locs)} article_urls={len(article_urls)} "
                      f"all_lastmod={lastmod_ok}"
                  )
                  if valid:
                      print(
                          f"LIVE_SITEMAP_PASS http=200 {last_sitemap_result} "
                          f"canonical={BASE}/ attempt={attempt} commit={COMMIT}"
                      )
                      sitemap_ok = True
                      break
                  print(f"Waiting for live sitemap attempt={attempt}/40 {last_sitemap_result}")
              except (urllib.error.URLError, TimeoutError, OSError, RuntimeError, ET.ParseError) as error:
                  last_sitemap_result = str(error)
                  print(f"Waiting for live sitemap attempt={attempt}/40 error={error}")
              if attempt < 40:
                  time.sleep(3)
          if not sitemap_ok:
              raise SystemExit(
                  "LIVE_SITEMAP_FAIL: expected HTTP 200 with 100 article URLs, valid loc/lastmod "
                  f"and canonical host; last result: {last_sitemap_result}"
              )
          PY
