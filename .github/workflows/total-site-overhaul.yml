name: NexusNova Total Site Overhaul

on:
  push:
    branches: [main]
    paths:
      - '.github/scripts/total_site_overhaul.py'
      - '.github/scripts/total_site_browser_audit.py'
      - '.github/workflows/total-site-overhaul.yml'
      - 'tests/**'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: nexusnova-total-site-overhaul
  cancel-in-progress: true

jobs:
  overhaul:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Checkout complete main history
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0

      - name: Set up Node 22
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'

      - name: Set up Python 3.12
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'

      - name: Install Playwright Chromium
        run: |
          python -m pip install --disable-pip-version-check playwright
          python -m playwright install chromium

      - name: Prepare deterministic production fixes
        run: python .github/scripts/total_site_overhaul.py

      - name: Syntax and repository tests
        run: |
          npm run check
          npm test

      - name: Strict public-site audits
        run: |
          python .github/scripts/deep_site_audit_strict.py
          python .github/scripts/site_quality_audit.py

      - name: Start local production server
        shell: bash
        run: |
          python -m http.server 8000 --bind 127.0.0.1 >/tmp/nexusnova-overhaul-server.log 2>&1 &
          echo $! >/tmp/nexusnova-server.pid
          sleep 2
          curl --fail --silent http://127.0.0.1:8000/ >/dev/null

      - name: Audit all 97 tools across mobile widths
        run: python .github/scripts/total_site_browser_audit.py

      - name: Protected-area and diff guard
        shell: bash
        run: |
          set -euo pipefail
          bad="$(git diff --name-only | grep -E '^(cloudflare/|functions/|firebase/|nexusnova-dev-ai/|ota/|downloads/)' || true)"
          if [ -n "$bad" ]; then
            echo 'Protected files changed unexpectedly:' >&2
            echo "$bad" >&2
            exit 1
          fi
          echo 'Protected auth/Telegram/mining/Firebase/Worker payloads unchanged.'

      - name: Commit verified overhaul
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'Fahad Hussain'
          git config user.email '166254374+fahadsoomro123@users.noreply.github.com'
          git add --all
          if git diff --cached --quiet; then
            echo 'No production changes were required after verification.'
            exit 0
          fi
          git commit -m 'fix: complete 97-tool production and search overhaul'
          git push origin HEAD:main

      - name: Verify deployed edge assets
        shell: bash
        run: |
          set -euo pipefail
          for i in {1..12}; do
            if curl --fail --silent --show-error https://nexusnovatools.com/ | grep -q '20261015-v4'; then
              echo "EDGE_DEPLOYMENT_PASS cache version 20261015-v4 visible on production homepage"
              break
            fi
            echo "Waiting for GitHub Pages edge deployment ($i/12)..."
            sleep 10
            if [ "$i" = "12" ]; then
              echo 'EDGE_DEPLOYMENT_FAIL: v4 asset marker not visible after 120 seconds' >&2
              exit 1
            fi
          done
          curl --fail --silent --show-error https://nexusnovatools.com/sitemap.xml -o /tmp/live-sitemap.xml
          python - <<'PY'
          import xml.etree.ElementTree as ET
          from pathlib import Path
          p=Path('/tmp/live-sitemap.xml')
          root=ET.parse(p).getroot()
          ns={'s':'http://www.sitemaps.org/schemas/sitemap/0.9'}
          urls=root.findall('s:url',ns)
          assert urls, 'live sitemap has no URLs'
          assert all(u.find('s:loc',ns) is not None for u in urls), 'sitemap loc missing'
          assert all(u.find('s:lastmod',ns) is not None for u in urls), 'sitemap lastmod missing'
          print(f'LIVE_SITEMAP_PASS urls={len(urls)} lastmod=present')
          PY
