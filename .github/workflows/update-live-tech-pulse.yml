name: NexusNova LIVE Tech Pulse Refresh

on:
  schedule:
    - cron: '17 */6 * * *'
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/scripts/update_live_tech_pulse.py'
      - '.github/scripts/traffic_autopilot_runner.py'
      - '.github/scripts/traffic_autopilot.py'
      - '.github/scripts/ai_provider.py'
      - '.github/workflows/update-live-tech-pulse.yml'
      - 'tests/test_live_tech_pulse_refresh.py'
  pull_request:
    branches: [main]
    paths:
      - '.github/scripts/update_live_tech_pulse.py'
      - '.github/scripts/traffic_autopilot_runner.py'
      - '.github/scripts/traffic_autopilot.py'
      - '.github/scripts/ai_provider.py'
      - '.github/workflows/update-live-tech-pulse.yml'
      - 'tests/test_live_tech_pulse_refresh.py'

permissions:
  contents: read

concurrency:
  group: nexusnova-live-tech-pulse-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'

      - name: Install RSS parser
        run: python -m pip install --disable-pip-version-check feedparser

      - name: Compile refresh code and existing dependencies
        run: |
          python -m py_compile .github/scripts/update_live_tech_pulse.py
          python -m py_compile .github/scripts/traffic_autopilot.py
          python -m py_compile .github/scripts/traffic_autopilot_runner.py
          python -m py_compile .github/scripts/ai_provider.py
          python -m py_compile tests/test_live_tech_pulse_refresh.py

      - name: Test freshness, source allowlist, duplicates and no-overwrite guard
        run: python tests/test_live_tech_pulse_refresh.py

      - name: Run the official-feed refresh in an isolated checkout
        run: python .github/scripts/update_live_tech_pulse.py

      - name: Enforce data-only output and current schema
        shell: bash
        run: |
          set -euo pipefail
          allowed='assets/data/live-tech-pulse.json'
          changes="$(git status --porcelain --untracked-files=no)"
          disallowed=''
          while IFS= read -r line; do
            [ -z "$line" ] && continue
            path="${line:3}"
            if [ "$path" = "$allowed" ]; then
              echo "Allowlisted generated data changed: $path"
            else
              disallowed="${disallowed}${line}\\n"
            fi
          done <<< "$changes"
          if [ -n "$disallowed" ]; then
            echo 'ERROR: refresh changed a tracked file outside the one-file data allowlist:' >&2
            printf '%b' "$disallowed" >&2
            exit 1
          fi
          python - <<'PY'
          import json
          from datetime import datetime, timezone
          from pathlib import Path
          data=json.loads(Path('assets/data/live-tech-pulse.json').read_text(encoding='utf-8'))
          generated=datetime.fromisoformat(data['generated_at'].replace('Z','+00:00'))
          age=abs((datetime.now(timezone.utc)-generated).total_seconds())
          assert data.get('version') == 1
          assert isinstance(data.get('items'), list) and 3 <= len(data['items']) <= 8
          assert data.get('top_stories') == data['items'][:3]
          assert age <= 300, f'generated_at is not current: age={age:.1f}s'
          print(f"Live Tech Pulse schema/freshness: PASS; {len(data['items'])} items; age={age:.1f}s")
          PY
          echo 'PR validation does not publish or commit any data.'

  publish:
    if: ${{ github.event_name != 'pull_request' && github.ref == 'refs/heads/main' }}
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - name: Checkout main
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: main
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'

      - name: Install RSS parser
        run: python -m pip install --disable-pip-version-check feedparser

      - name: Build fresh allowlisted data payload
        run: python .github/scripts/update_live_tech_pulse.py

      - name: Validate single-file publish boundary
        shell: bash
        run: |
          set -euo pipefail
          allowed='assets/data/live-tech-pulse.json'
          changes="$(git status --porcelain --untracked-files=no)"
          while IFS= read -r line; do
            [ -z "$line" ] && continue
            path="${line:3}"
            if [ "$path" != "$allowed" ]; then
              echo "Refusing to publish unexpected tracked change: $line" >&2
              exit 1
            fi
          done <<< "$changes"
          python - <<'PY'
          import json
          from datetime import datetime, timezone
          from pathlib import Path
          data=json.loads(Path('assets/data/live-tech-pulse.json').read_text(encoding='utf-8'))
          generated=datetime.fromisoformat(data['generated_at'].replace('Z','+00:00'))
          assert abs((datetime.now(timezone.utc)-generated).total_seconds()) <= 300
          assert data.get('version') == 1
          assert isinstance(data.get('items'), list) and len(data['items']) >= 3
          assert data.get('top_stories') == data['items'][:3]
          print('One-file publish boundary and generated-data schema: PASS')
          PY

      - name: Commit and safely publish only Live Tech Pulse data
        shell: bash
        run: |
          set -euo pipefail
          allowed='assets/data/live-tech-pulse.json'
          git add -- "$allowed"
          if git diff --cached --quiet; then
            echo 'Live Tech Pulse output is already current; no commit is needed.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'data: refresh NexusNova LIVE Tech Pulse [skip ci]'
          for attempt in 1 2 3 4 5; do
            if git push origin HEAD:main; then
              echo "Published only $allowed on attempt $attempt."
              exit 0
            fi
            echo "main moved during publish; rebasing before safe retry $attempt/5."
            git fetch origin main
            git rebase origin/main
            sleep $((attempt * 2))
          done
          echo 'Unable to publish Live Tech Pulse after 5 safe retries.' >&2
          exit 1
