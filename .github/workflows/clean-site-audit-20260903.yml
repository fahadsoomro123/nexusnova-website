name: NexusNova One-Time Clean Site Audit Fix

on:
  push:
    branches: [clean-site-audit-20260903]
    paths:
      - '.github/workflows/clean-site-audit-20260903.yml'

permissions:
  contents: write

jobs:
  clean-site:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout cleanup branch
        uses: actions/checkout@v4
        with:
          ref: clean-site-audit-20260903
          fetch-depth: 0

      - name: Apply focused cleanup and UX fixes
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          def read(path):
              return Path(path).read_text(encoding='utf-8')

          def write(path, text):
              Path(path).write_text(text, encoding='utf-8')

          def replace_once(text, old, new, label):
              if old not in text:
                  raise SystemExit(f'Missing expected anchor for {label}')
              return text.replace(old, new, 1)

          # 1) Make the homepage hierarchy simpler and surface NexusNova Labs as the flagship.
          index = read('index.html')
          if 'assets/css/home-cleanup.css' not in index:
              index = replace_once(index, '</head>', '<link rel="stylesheet" href="assets/css/home-cleanup.css" data-nexusnova-home-cleanup></head>', 'homepage cleanup stylesheet')

          old_actions = '<div class="hero-actions" style="margin-top:14px"><a class="btn btn-primary" href="live.html">NexusNova LIVE</a><a class="btn" href="new-tools.html">New tools</a><a class="btn" href="smart-tools.html">Smart tools</a><a class="btn" href="gaming.html">Gaming tools</a><a class="btn" href="trending-tools.html">Browse all tools</a><a class="btn" href="tech.html">Tech & Security</a></div>'
          new_actions = '<div class="hero-actions" style="margin-top:14px"><a class="btn btn-primary" href="labs.html">Explore NexusNova Labs</a><a class="btn" href="live.html">NexusNova LIVE</a><a class="btn" href="tools.html">Browse Tools</a></div>'
          if old_actions in index:
              index = index.replace(old_actions, new_actions, 1)

          labs_section = '''<section class="section nn-labs-launch" data-nexusnova-labs-launch><div class="container"><div class="nn-labs-shell"><div class="nn-labs-intro"><span class="nn-labs-badge">NEW • NEXUSNOVA LABS</span><span class="kicker">FLAGSHIP EXPERIENCES</span><h2>Don’t hunt for another ordinary tool. Try a smarter starting point.</h2><p>Pulse, Magic Drop and X-Ray turn multiple utilities into simple experiences you can understand in seconds. Each beta states its real limits and never pretends to verify more than it can.</p><div class="hero-actions"><a class="btn btn-primary" href="labs.html">Explore all Labs →</a><a class="btn" href="reaction-time-test.html">Try Reaction Challenge</a></div></div><div class="nn-labs-cards"><a class="nn-lab-mini" href="pulse.html"><span>🌐</span><b>NexusNova Pulse</b><small>Currency, gold, fuel, weather and earthquake signals in one snapshot.</small><strong>See what changed →</strong></a><a class="nn-lab-mini" href="magic-drop.html"><span>✨</span><b>Magic Drop</b><small>Drop a file, detect what it is and jump straight to useful actions.</small><strong>Drop anything →</strong></a><a class="nn-lab-mini" href="xray.html"><span>🔎</span><b>NexusNova X-Ray</b><small>Inspect a link or QR for understandable risk signals before opening it.</small><strong>Scan before you trust →</strong></a></div></div></div></section>'''
          anchor = '</section><section class="section" data-nexusnova-live-launch>'
          if 'data-nexusnova-labs-launch' not in index:
              index = replace_once(index, anchor, '</section>' + labs_section + '<section class="section" data-nexusnova-live-launch>', 'Labs flagship section')

          index = index.replace('<b>Free Invoice Maker</b>', '<b>Simple Invoice Generator</b>', 1)
          write('index.html', index)

          css = '''/* NexusNova homepage hierarchy cleanup — generated 2026-09-03 */
          .nn-labs-launch{padding-top:34px;padding-bottom:34px}
          .nn-labs-shell{display:grid;grid-template-columns:minmax(0,.9fr) minmax(0,1.1fr);gap:24px;padding:28px;border:1px solid #dbe6f2;border-radius:30px;background:linear-gradient(135deg,#f8fbff 0%,#f4f0ff 50%,#effcf8 100%);box-shadow:0 22px 60px rgba(15,23,42,.08)}
          .nn-labs-intro h2{max-width:760px;margin:10px 0 10px;font-size:clamp(1.65rem,3vw,2.55rem);line-height:1.08}
          .nn-labs-intro p{max-width:720px;color:#536176}
          .nn-labs-badge{display:inline-flex;margin-bottom:10px;padding:7px 11px;border-radius:999px;background:#111827;color:#fff;font-size:.75rem;font-weight:900;letter-spacing:.08em}
          .nn-labs-cards{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}
          .nn-lab-mini{display:flex;min-height:205px;flex-direction:column;gap:8px;padding:18px;border:1px solid rgba(148,163,184,.34);border-radius:22px;background:rgba(255,255,255,.92);color:inherit;text-decoration:none;box-shadow:0 12px 30px rgba(15,23,42,.06);transition:transform .18s ease,box-shadow .18s ease}
          .nn-lab-mini:hover{transform:translateY(-3px);box-shadow:0 18px 38px rgba(15,23,42,.1)}
          .nn-lab-mini>span{font-size:1.9rem}.nn-lab-mini>b{font-size:1.08rem}.nn-lab-mini>small{flex:1;color:#5b6678;line-height:1.45}.nn-lab-mini>strong{font-size:.86rem}
          @media(max-width:980px){.nn-labs-shell{grid-template-columns:1fr}.nn-labs-cards{grid-template-columns:repeat(3,minmax(0,1fr))}}
          @media(max-width:720px){.nn-labs-launch{padding-top:20px}.nn-labs-shell{padding:20px;border-radius:24px}.nn-labs-cards{grid-template-columns:1fr}.nn-lab-mini{min-height:auto}.nn-home .hero-actions .btn{flex:1 1 100%}}
          '''
          write('assets/css/home-cleanup.css', css.strip() + '\n')

          # 2) Simplify the global primary nav and mark decorative brand glyphs for assistive tech.
          main_js = read('assets/js/main.js')
          old_items = """    const items=[
              ['index.html','Home'],['live.html','LIVE'],['tools.html','Tools'],['trending-tools.html','Trending'],['smart-tools.html','Smart'],['gaming.html','Gaming'],['articles.html','Articles'],['tech.html','Tech'],['guides.html','Guides'],['developer-tools.html','Developer'],['app.html','App']
            ];"""
          new_items = """    const items=[
              ['index.html','Home'],['labs.html','Labs'],['live.html','LIVE'],['tools.html','Tools'],['articles.html','Articles'],['guides.html','Guides'],['app.html','App']
            ];"""
          main_js = replace_once(main_js, old_items, new_items, 'simplified primary navigation')
          year_anchor = "  const year=document.querySelector('[data-year]');if(year)year.textContent=String(new Date().getFullYear());"
          a11y = year_anchor + "\n  document.querySelectorAll('.brand-mark').forEach(mark=>mark.setAttribute('aria-hidden','true'));\n  const coreEmblem=document.querySelector('.core-emblem');if(coreEmblem){coreEmblem.setAttribute('aria-label','NexusNova Tools');coreEmblem.querySelectorAll('small,strong').forEach(part=>part.setAttribute('aria-hidden','true'));}"
          if "coreEmblem=document.querySelector('.core-emblem')" not in main_js:
              main_js = replace_once(main_js, year_anchor, a11y, 'brand accessibility cleanup')
          write('assets/js/main.js', main_js)

          # 3) Privacy: clearly separate local file processing from traffic analytics.
          privacy = read('privacy.html')
          privacy = privacy.replace('<strong>Last updated:</strong> 2 September 2026', '<strong>Last updated:</strong> 3 September 2026', 1)
          overview = "<h2>Overview</h2><p>Most NexusNova browser tools can be used without creating an account. Many calculations, conversions and file operations run directly in the visitor's browser. NexusNova also provides an optional Firebase-backed account experience and uses limited third-party infrastructure for security, analytics, supported account linking and, when enabled, advertising.</p>"
          plain = overview + "\n    <div class=\"notice\"><strong>Plain-language privacy:</strong> When a tool says its core file processing is local or browser-based, the selected file stays on the device for that core operation. NexusNova still uses Google Analytics 4 for traffic measurement, and a tool may load a third-party client-side library or language model that receives ordinary web-request information when fetched.</div>"
          if 'Plain-language privacy:' not in privacy:
              privacy = replace_once(privacy, overview, plain, 'plain-language privacy clarification')
          write('privacy.html', privacy)

          # 4) Contact: publish the existing official mailbox instead of claiming no mailbox exists.
          contact = read('contact.html')
          contact = contact.replace('"dateModified":"2026-08-24"', '"dateModified":"2026-09-03"', 1)
          if '"email":"nexusnovatools@gmail.com"' not in contact:
              contact = contact.replace('"logo":"https://nexusnovatools.com/assets/nexusnova-logo-512.svg",', '"logo":"https://nexusnovatools.com/assets/nexusnova-logo-512.svg","email":"nexusnovatools@gmail.com",', 1)
          contact = contact.replace('NexusNovaTools.com is the official website. Until a dedicated support mailbox is published, the public GitHub profile below remains the verified project contact route.', 'NexusNovaTools.com is the official website. For website, tool and support questions, use the official NexusNova mailbox below. The public GitHub profile remains the technical project route.', 1)
          old_card = '<div class="card" style="margin-top:18px"><h3>Verified project contact route</h3><p>Use the public GitHub profile for project-related contact or repository questions while the dedicated support mailbox is being prepared.</p><a class="btn btn-primary" href="https://github.com/fahadsoomro123" rel="noopener noreferrer" target="_blank">Open verified GitHub profile →</a></div>'
          new_card = '<div class="card" style="margin-top:18px"><h3>Official support email</h3><p>For website, tool, correction and general NexusNova questions, email <strong>nexusnovatools@gmail.com</strong>. Do not send passwords, verification codes, API keys or payment-card details.</p><a class="btn btn-primary" href="mailto:nexusnovatools@gmail.com">Email NexusNova Support →</a></div><div class="card" style="margin-top:18px"><h3>Technical project route</h3><p>For repository-specific or public development questions, the verified GitHub profile remains available.</p><a class="btn" href="https://github.com/fahadsoomro123" rel="noopener noreferrer" target="_blank">Open verified GitHub profile →</a></div>'
          contact = replace_once(contact, old_card, new_card, 'contact support card')
          contact = contact.replace('<strong>Last reviewed:</strong> 24 August 2026', '<strong>Last reviewed:</strong> 3 September 2026', 1)
          write('contact.html', contact)

          # 5) Resume Builder: make its working browser behavior explicit in crawlable copy.
          resume = read('resume-builder.html')
          resume_anchor = '</section>\n<section class="section"><div class="container resume-layout">'
          resume_notice = '</section>\n<section class="section no-print" style="padding-bottom:0"><div class="container"><div class="notice"><strong>Working browser tool:</strong> Fill the form below and the preview updates as you type. The draft is saved only in this browser with localStorage, Clear draft removes it, and Print / Save as PDF opens the browser print dialog.</div></div></section>\n<section class="section"><div class="container resume-layout">'
          if 'Working browser tool:' not in resume:
              resume = replace_once(resume, resume_anchor, resume_notice, 'resume crawler-visible functionality note')
          resume = resume.replace('aria-label="Resume preview"', 'aria-label="Resume preview" aria-live="polite"', 1)
          write('resume-builder.html', resume)

          # 6) OCR: label the currently supported language honestly instead of a generic OCR promise.
          ocr = read('image-to-text-ocr.html')
          ocr = ocr.replace('<title>Image to Text OCR Online — Extract Text from Photos | NexusNova</title>', '<title>English Image to Text OCR Online — Extract Text from Photos | NexusNova</title>', 1)
          ocr = ocr.replace('<span class="kicker">OCR // IMAGE TO TEXT</span><h1>Extract text from an image without retyping.</h1>', '<span class="kicker">ENGLISH OCR // IMAGE TO TEXT</span><h1>Extract English text from an image without retyping.</h1>', 1)
          write('image-to-text-ocr.html', ocr)

          # 7) Invoice: make the lightweight scope obvious in the product name while keeping the same working tool.
          invoice = read('invoice-maker.html')
          invoice = invoice.replace('<title>Free Invoice Maker — Create & Print an Invoice Online | NexusNova</title>', '<title>Simple Invoice Generator — Create & Print an Invoice Online | NexusNova</title>', 1)
          invoice = invoice.replace('<meta property="og:title" content="Free Invoice Maker — NexusNova Tools">', '<meta property="og:title" content="Simple Invoice Generator — NexusNova Tools">', 1)
          invoice = invoice.replace('"name":"Free Invoice Maker"', '"name":"Simple Invoice Generator"', 1)
          invoice = invoice.replace('<h1>Free Invoice Maker</h1><p>Create a clean invoice, calculate totals, then print it or use your browser\'s Save as PDF option.</p>', '<h1>Simple Invoice Generator</h1><p>Create a lightweight invoice document, calculate totals, then print it or use your browser\'s Save as PDF option. This is not accounting, tax-filing or payment-processing software.</p>', 1)
          write('invoice-maker.html', invoice)

          # 8) Upgrade the legacy JPG-to-PDF URL to accept JPG, PNG and WebP without adding a paid/server conversion dependency.
          jpg = read('jpg-to-pdf.html')
          replacements = [
              ('<title>JPG to PDF Converter Online Free | NexusNova Tools</title>', '<title>Image to PDF Converter — JPG, PNG & WebP | NexusNova Tools</title>'),
              ('Convert multiple JPG or JPEG images into one A4 PDF directly in your browser. No account and no image upload to NexusNova servers.', 'Convert JPG, PNG or WebP images into one A4 PDF directly in your browser. No account and no image upload to NexusNova servers.'),
              ('<meta property="og:title" content="JPG to PDF Converter — NexusNova Tools">', '<meta property="og:title" content="Image to PDF Converter — NexusNova Tools">'),
              ('<meta property="og:description" content="Combine JPG images into one PDF locally in your browser.">', '<meta property="og:description" content="Combine JPG, PNG or WebP images into one PDF locally in your browser.">'),
              ('"name":"JPG to PDF Converter"', '"name":"Image to PDF Converter"'),
              ('"description":"Convert multiple JPG or JPEG images into a single PDF directly in the browser."', '"description":"Convert JPG, PNG or WebP images into a single PDF directly in the browser."'),
              ('<span class="kicker">PDF UTILITY</span><h1>JPG to <span class="gradient-text">PDF Converter.</span></h1><p>Combine JPEG images into a single A4 PDF. The PDF is assembled locally in your browser.</p>', '<span class="kicker">PDF UTILITY</span><h1>Image to <span class="gradient-text">PDF Converter.</span></h1><p>Combine JPG, PNG or WebP images into a single A4 PDF. The PDF is assembled locally in your browser.</p>'),
              ('<label for="pdf-images">Choose JPG/JPEG images (up to 30)</label><input id="pdf-images" type="file" accept="image/jpeg,.jpg,.jpeg" multiple>', '<label for="pdf-images">Choose JPG, PNG or WebP images (up to 30)</label><input id="pdf-images" type="file" accept="image/jpeg,image/png,image/webp,.jpg,.jpeg,.png,.webp" multiple>'),
              ('Choose one or more JPG/JPEG images.', 'Choose one or more JPG, PNG or WebP images.'),
              ('<h2>What this converter does</h2><p>Each selected JPEG becomes one page in a standard PDF document. Images are scaled proportionally to fit inside an A4 page with a small margin, then combined into one downloadable file.</p>', '<h2>What this converter does</h2><p>Each selected JPG, PNG or WebP image becomes one page in a standard PDF document. Images are scaled proportionally to fit inside an A4 page with a small margin, then combined into one downloadable file.</p>'),
              ('<h2>Why this version supports JPG/JPEG</h2><p>This lightweight implementation supports JPEG so it can create the PDF locally without loading a large third-party conversion library. If your source is PNG or another format, convert it first with one of the image tools.</p>', '<h2>Supported image formats</h2><p>JPG/JPEG files can be embedded directly. PNG and WebP files are decoded by your browser and converted to an in-memory JPEG page image locally before the PDF is assembled. Transparent pixels are placed on a white background. No paid or server-side conversion service is required.</p>'),
              ('<p class="mini-note">Page reviewed and updated 24 August 2026.</p>', '<p class="mini-note">Page reviewed and updated 3 September 2026.</p>')
          ]
          for old, new in replacements:
              if old in jpg:
                  jpg = jpg.replace(old, new, 1)
          write('jpg-to-pdf.html', jpg)

          tools_js = read('assets/js/popular-tools.js')
          start = tools_js.find("  const pdfInput = $('pdf-images');")
          end = tools_js.rfind('\n})();')
          if start < 0 or end <= start:
              raise SystemExit('Could not locate JPG/PDF implementation block')
          pdf_block = r'''  const pdfInput = $('pdf-images');
          if (pdfInput) {
            let imageFiles = [];
            const readAsArrayBuffer = (file) => new Promise((resolve, reject) => {
              const r = new FileReader(); r.onload = () => resolve(r.result); r.onerror = () => reject(r.error); r.readAsArrayBuffer(file);
            });
            const jpegSize = (bytes) => {
              let i = 2;
              while (i < bytes.length) {
                if (bytes[i] !== 0xFF) { i += 1; continue; }
                const marker = bytes[i + 1];
                if ([0xC0,0xC1,0xC2,0xC3,0xC5,0xC6,0xC7,0xC9,0xCA,0xCB,0xCD,0xCE,0xCF].includes(marker)) {
                  return { height: (bytes[i+5] << 8) + bytes[i+6], width: (bytes[i+7] << 8) + bytes[i+8] };
                }
                if (marker === 0xD8 || marker === 0xD9) { i += 2; continue; }
                const len = (bytes[i+2] << 8) + bytes[i+3];
                if (!len) break;
                i += 2 + len;
              }
              throw new Error('Could not read JPEG dimensions');
            };
            const ascii = (text) => new TextEncoder().encode(text);
            const concat = (arrays) => {
              const len = arrays.reduce((n,a) => n + a.length, 0);
              const out = new Uint8Array(len); let p = 0;
              arrays.forEach(a => { out.set(a,p); p += a.length; }); return out;
            };
            const decodeImage = (file) => new Promise((resolve, reject) => {
              const url = URL.createObjectURL(file);
              const img = new Image();
              img.onload = () => { URL.revokeObjectURL(url); resolve(img); };
              img.onerror = () => { URL.revokeObjectURL(url); reject(new Error(`${file.name} could not be decoded by this browser.`)); };
              img.src = url;
            });
            const normalizeImage = async (file) => {
              const isJpeg = /image\/jpeg/i.test(file.type) || /\.jpe?g$/i.test(file.name);
              if (isJpeg) {
                const bytes = new Uint8Array(await readAsArrayBuffer(file));
                if (bytes[0] !== 0xFF || bytes[1] !== 0xD8) throw new Error(`${file.name} is not a valid JPEG.`);
                return { bytes, ...jpegSize(bytes) };
              }
              const img = await decodeImage(file);
              if (!img.naturalWidth || !img.naturalHeight) throw new Error(`${file.name} has invalid dimensions.`);
              if (Math.max(img.naturalWidth, img.naturalHeight) > 12000) throw new Error(`${file.name} is too large in pixel dimensions for safe browser conversion.`);
              const canvas = document.createElement('canvas');
              canvas.width = img.naturalWidth; canvas.height = img.naturalHeight;
              const ctx = canvas.getContext('2d', { alpha: false });
              ctx.fillStyle = '#ffffff'; ctx.fillRect(0, 0, canvas.width, canvas.height); ctx.drawImage(img, 0, 0);
              const blob = await new Promise(resolve => canvas.toBlob(resolve, 'image/jpeg', 0.92));
              if (!blob) throw new Error(`${file.name} could not be prepared for PDF output.`);
              return { bytes: new Uint8Array(await blob.arrayBuffer()), width: canvas.width, height: canvas.height };
            };
            pdfInput.addEventListener('change', () => {
              imageFiles = [...(pdfInput.files || [])].filter(f => /image\/(jpeg|png|webp)/i.test(f.type) || /\.(jpe?g|png|webp)$/i.test(f.name));
              show('pdf-status', imageFiles.length ? `${imageFiles.length} image${imageFiles.length === 1 ? '' : 's'} selected.` : 'Choose JPG, PNG or WebP images.');
            });
            $('pdf-run')?.addEventListener('click', async () => {
              if (!imageFiles.length) return show('pdf-status', 'Choose JPG, PNG or WebP images first.');
              if (imageFiles.length > 30) return show('pdf-status', 'Please use up to 30 images per PDF.');
              if (imageFiles.some(f => f.size > 15 * 1024 * 1024)) return show('pdf-status', 'Each image must be 15 MB or smaller.');
              try {
                show('pdf-status', 'Preparing images and building PDF locally…');
                const images = [];
                for (const file of imageFiles) images.push(await normalizeImage(file));
                const objects = [];
                const pageIds = [];
                const imageIds = [];
                let nextId = 3;
                images.forEach(() => { pageIds.push(nextId++); imageIds.push(nextId++); });
                objects[1] = `<< /Type /Catalog /Pages 2 0 R >>`;
                objects[2] = `<< /Type /Pages /Kids [${pageIds.map(id => `${id} 0 R`).join(' ')}] /Count ${images.length} >>`;
                images.forEach((img, idx) => {
                  const pageId = pageIds[idx], imgId = imageIds[idx];
                  const maxW = 595.28, maxH = 841.89, margin = 24;
                  const scale = Math.min((maxW - 2*margin)/img.width, (maxH - 2*margin)/img.height);
                  const w = img.width * scale, h = img.height * scale;
                  const x = (maxW - w)/2, y = (maxH - h)/2;
                  const content = `q\n${w.toFixed(2)} 0 0 ${h.toFixed(2)} ${x.toFixed(2)} ${y.toFixed(2)} cm\n/Im${idx+1} Do\nQ\n`;
                  const contentId = nextId++;
                  objects[pageId] = `<< /Type /Page /Parent 2 0 R /MediaBox [0 0 ${maxW} ${maxH}] /Resources << /XObject << /Im${idx+1} ${imgId} 0 R >> >> /Contents ${contentId} 0 R >>`;
                  objects[imgId] = { binary: img.bytes, dict: `<< /Type /XObject /Subtype /Image /Width ${img.width} /Height ${img.height} /ColorSpace /DeviceRGB /BitsPerComponent 8 /Filter /DCTDecode /Length ${img.bytes.length} >>` };
                  const contentBytes = ascii(content);
                  objects[contentId] = { binary: contentBytes, dict: `<< /Length ${contentBytes.length} >>` };
                });
                const parts = [ascii('%PDF-1.4\n%\xE2\xE3\xCF\xD3\n')];
                const offsets = [0];
                let pos = parts[0].length;
                const maxId = objects.length - 1;
                for (let id = 1; id <= maxId; id++) {
                  offsets[id] = pos;
                  const obj = objects[id];
                  let chunk;
                  if (typeof obj === 'string') chunk = ascii(`${id} 0 obj\n${obj}\nendobj\n`);
                  else chunk = concat([ascii(`${id} 0 obj\n${obj.dict}\nstream\n`), obj.binary, ascii('\nendstream\nendobj\n')]);
                  parts.push(chunk); pos += chunk.length;
                }
                const xrefPos = pos;
                let xref = `xref\n0 ${maxId + 1}\n0000000000 65535 f \n`;
                for (let id = 1; id <= maxId; id++) xref += `${String(offsets[id]).padStart(10,'0')} 00000 n \n`;
                xref += `trailer\n<< /Size ${maxId + 1} /Root 1 0 R >>\nstartxref\n${xrefPos}\n%%EOF\n`;
                parts.push(ascii(xref));
                downloadBlob(new Blob([concat(parts)], { type: 'application/pdf' }), 'nexusnova-images.pdf');
                show('pdf-status', `PDF created locally with ${images.length} page${images.length === 1 ? '' : 's'}.`);
              } catch (err) {
                show('pdf-status', err?.message || 'Could not build the PDF.');
              }
            });
          }
          '''
          tools_js = tools_js[:start] + pdf_block + tools_js[end:]
          write('assets/js/popular-tools.js', tools_js)

          # One-time workflow should not remain in the product branch.
          Path('.github/workflows/clean-site-audit-20260903.yml').unlink(missing_ok=True)
          PY

      - name: Static QA gates
        shell: bash
        run: |
          node --check assets/js/main.js
          node --check assets/js/popular-tools.js
          python3 - <<'PY'
          from pathlib import Path
          required = ['labs.html','pulse.html','magic-drop.html','xray.html','widgets.html','reaction-time-test.html']
          missing = [p for p in required if not Path(p).exists()]
          if missing: raise SystemExit(f'Missing Labs idea pages: {missing}')
          index = Path('index.html').read_text(encoding='utf-8')
          for p in ['labs.html','pulse.html','magic-drop.html','xray.html']:
              if p not in index: raise SystemExit(f'Homepage missing flagship link: {p}')
          if 'NEXUSNTOOLS' in index or 'NNEXUSNOVA' in index: raise SystemExit('Literal branding typo found in homepage source')
          contact = Path('contact.html').read_text(encoding='utf-8')
          if 'mailto:nexusnovatools@gmail.com' not in contact: raise SystemExit('Official support email was not published')
          privacy = Path('privacy.html').read_text(encoding='utf-8')
          if 'Plain-language privacy:' not in privacy or 'Google Analytics 4' not in privacy: raise SystemExit('Privacy clarification missing')
          resume = Path('resume-builder.html').read_text(encoding='utf-8')
          js = Path('assets/js/popular-tools.js').read_text(encoding='utf-8')
          for token in ['resume-name','resume-title','resume-email','resume-print','resume-clear']:
              if token not in resume or token not in js: raise SystemExit(f'Resume hook missing: {token}')
          ocr = Path('image-to-text-ocr.html').read_text(encoding='utf-8')
