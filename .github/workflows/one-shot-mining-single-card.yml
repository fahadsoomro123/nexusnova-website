name: NexusNova One-Time Mining Single Card Wiring

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/one-shot-mining-single-card.yml'

permissions:
  contents: write

jobs:
  wire:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Wire account, Worker and regression gates
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          def replace_once(path, old, new):
              p=Path(path)
              text=p.read_text(encoding='utf-8')
              if old not in text:
                  raise SystemExit(f'Expected block not found in {path}')
              p.write_text(text.replace(old,new,1),encoding='utf-8')

          # account.html: one mining card, dedicated CSS/JS, server eligibility guard.
          account=Path('account.html')
          text=account.read_text(encoding='utf-8')
          text=text.replace(
              '<link rel="stylesheet" href="assets/css/webapp-dashboard-v1.css?v=20260830-2">',
              '<link rel="stylesheet" href="assets/css/webapp-dashboard-v1.css?v=20260830-2">\n  <link rel="stylesheet" href="assets/css/mining-dashboard.css?v=20260830-1">',
              1
          )
          old_overview='''      <div class="nn-webapp-overview">\n        <article class="nn-nvx-console"><span class="nn-console-label">NVX ACCOUNT BALANCE</span><div class="nn-nvx-value" data-web-nvx-balance>— <small>NVX</small></div><div class="nn-console-note" data-web-nvx-note>Loading your real account balance…</div></article>\n        <article class="nn-halving-console"><span class="nn-console-label">NVX HALVING WATCH</span><div class="nn-halving-state" data-web-halving-state>CHECKING TRUSTED SOURCE</div><div class="nn-halving-sub" data-web-halving-copy>The website will show only a real stage/rate source.</div></article>\n      </div>'''
          new_overview='''      <article class="nn-mining-card" data-mining-card data-state="syncing" aria-labelledby="nn-mining-title">\n        <div class="nn-mining-head"><div><span class="nn-mining-kicker">NVX MINING // REAL FIRESTORE SESSION</span><h3 id="nn-mining-title" data-mining-title>Syncing secure mining session…</h3></div><span class="nn-mining-state" data-mining-badge>SYNCING</span></div>\n        <div class="nn-mining-body">\n          <div class="nn-mining-reactor-stage" aria-hidden="true"><i class="nn-mining-glow"></i><i class="nn-mining-orbit a"></i><i class="nn-mining-orbit b"></i><i class="nn-mining-orbit c"></i><div class="nn-mining-core"><strong>NVX</strong></div></div>\n          <div class="nn-mining-data">\n            <div class="nn-mining-balance-label">FIREBASE-LINKED ACCOUNT BALANCE</div><div class="nn-mining-balance" data-web-nvx-balance>— <small>NVX</small></div><p class="nn-mining-note" data-web-nvx-note>Loading your real account balance and mining session…</p>\n            <div class="nn-mining-metrics"><div class="nn-mining-metric"><span>SESSION</span><strong data-mining-timer>CHECKING</strong></div><div class="nn-mining-metric"><span>TOTAL MINED</span><strong data-mining-total>— NVX</strong></div><div class="nn-mining-metric"><span>24H SESSION</span><strong>+24 NVX ON VERIFIED COMPLETION</strong></div></div>\n            <div class="nn-mining-progress-wrap"><div class="nn-mining-progress-head"><span>UNCLAIMED SESSION PROGRESS</span><strong data-mining-progress-copy>Reading real Firestore state…</strong></div><div class="nn-mining-progress-track" data-mining-progress-track role="progressbar" aria-label="Mining session progress" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0"><i data-mining-progress></i></div></div>\n            <div class="nn-mining-halving"><span>HALVING</span><strong data-web-halving-state>CHECKING TRUSTED SOURCE</strong><small data-web-halving-copy>The website will show only real stage/rate data from a trusted source.</small></div>\n            <div class="nn-mining-actions"><button class="nn-mining-action" type="button" data-mining-action data-value-action disabled>CHECKING…</button><p class="nn-mining-message" data-mining-message role="status" aria-live="polite">Mining is manual and never starts automatically after signup.</p></div>\n          </div>\n        </div>\n      </article>'''
          if old_overview not in text:
              raise SystemExit('Old mining overview block not found in account.html')
          text=text.replace(old_overview,new_overview,1)
          text=text.replace(
              'Reward-bearing actions stay locked until official verification and a genuine server-side reward path are available.',
              'Mining below follows your real Firebase/Firestore session. Other reward-bearing actions stay locked until their official verification and server-side path are genuinely available.',
              1
          )
          text=text.replace(
              '<script type="module" src="assets/js/webapp-dashboard-v1.js?v=20260830-1"></script>',
              '<script type="module" src="assets/js/webapp-dashboard-v1.js?v=20260830-1"></script>\n<script type="module" src="assets/js/account-eligibility-ui.js?v=20260830-1"></script>\n<script type="module" src="assets/js/mining-dashboard.js?v=20260830-1"></script>',
              1
          )
          account.write_text(text,encoding='utf-8')

          # Worker route.
          worker=Path('cloudflare/telegram-bot/worker-entry.js')
          text=worker.read_text(encoding='utf-8')
          text=text.replace(
              "import { attachReferralRequest } from './referral-api.js';",
              "import { attachReferralRequest } from './referral-api.js';\nimport { miningSessionRequest } from './mining-api.js';",
              1
          )
          text=text.replace(
              "const REFERRAL_ATTACH_PATH = '/api/referral/attach';",
              "const REFERRAL_ATTACH_PATH = '/api/referral/attach';\nconst MINING_SESSION_PATH = '/api/mining/session';",
              1
          )
          text=text.replace(
              "url.pathname.startsWith('/api/account/') || url.pathname.startsWith('/api/referral/')",
              "url.pathname.startsWith('/api/account/') || url.pathname.startsWith('/api/referral/') || url.pathname.startsWith('/api/mining/')",
              1
          )
          text=text.replace(
              'return authCors(request, await accountEligibilityRequest(request));',
              'return authCors(request, await accountEligibilityRequest(request, env));',
              1
          )
          marker="""    if (request.method === 'POST' && url.pathname === REFERRAL_ATTACH_PATH) {"""
          mining_route="""    if (request.method === 'POST' && url.pathname === MINING_SESSION_PATH) {\n      try {\n        assertAuthOrigin(request);\n      } catch (_) {\n        return authJson(request, { ok: false, code: 'permission-denied', error: 'Request origin is not allowed.' }, 403);\n      }\n      return authCors(request, await miningSessionRequest(request, env));\n    }\n\n"""
          if marker not in text:
              raise SystemExit('Referral route marker missing in worker-entry.js')
          text=text.replace(marker,mining_route+marker,1)
          worker.write_text(text,encoding='utf-8')

          # package syntax gate.
          package=Path('package.json')
          text=package.read_text(encoding='utf-8')
          old='node --check assets/js/auth-turnstile-v1.js && node --check cloudflare/telegram-bot/worker.js'
          new='node --check assets/js/auth-turnstile-v1.js && node --check assets/js/account-eligibility-ui.js && node --check assets/js/mining-dashboard.js && node --check cloudflare/telegram-bot/worker.js'
          if old not in text: raise SystemExit('package check insertion point missing')
          text=text.replace(old,new,1)
          old='node --check cloudflare/telegram-bot/referral-api.js'
          new='node --check cloudflare/telegram-bot/referral-api.js && node --check cloudflare/telegram-bot/mining-api.js'
          if old not in text: raise SystemExit('package mining API insertion point missing')
          package.write_text(text.replace(old,new,1),encoding='utf-8')

          # Beta regression + live unauthenticated route smoke test.
          beta=Path('.github/workflows/nexusnova-beta-start.yml')
          text=beta.read_text(encoding='utf-8')
          referral_step="""      - name: Referral security regression\n        run: node --test tests/referral-security.test.cjs\n"""
          mining_step="""\n      - name: Website mining security regression\n        run: node --test tests/mining-web-security.test.cjs\n"""
          if referral_step not in text: raise SystemExit('Beta referral step missing')
          text=text.replace(referral_step,referral_step+mining_step,1)
          live_marker="""      - name: Verify beta truthfulness rules in repository\n"""
          live_step="""      - name: Verify mining route is live on Worker\n        shell: bash\n        run: |\n          set -euo pipefail\n          body_file=\"$(mktemp)\"\n          for attempt in 1 2 3 4 5 6; do\n            code=\"$(curl --max-time 25 -sS -H 'Origin: https://nexusnovatools.com' -H 'Content-Type: application/json' -o \"$body_file\" -w '%{http_code}' -X POST --data '{\"action\":\"start\"}' 'https://nexusnova-telegram-bot.fahadsoomro123.workers.dev/api/mining/session' || true)\"\n            if [ \"$code\" = '401' ]; then\n              python - \"$body_file\" <<'PY'\n          import json,sys\n          with open(sys.argv[1], encoding='utf-8') as fh: d=json.load(fh)\n          assert d.get('ok') is False\n          assert d.get('code') == 'unauthenticated'\n          PY\n              exit 0\n            fi\n            sleep 10\n          done\n          echo 'Live mining Worker route did not become available in time.' >&2\n          cat \"$body_file\" >&2 || true\n          exit 1\n\n"""
          if live_marker not in text: raise SystemExit('Beta truthfulness marker missing')
          text=text.replace(live_marker,live_step+live_marker,1)
          beta.write_text(text,encoding='utf-8')
          PY

      - name: Validate mining wiring before commit
        run: |
          npm test
          npm run check
          git diff --check

      - name: Commit real mining dashboard wiring
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'NexusNova CI'
          git config user.email 'actions@users.noreply.github.com'
          git add account.html assets/js/mining-dashboard.js assets/css/mining-dashboard.css cloudflare/telegram-bot/mining-api.js cloudflare/telegram-bot/worker-entry.js tests/mining-web-security.test.cjs package.json .github/workflows/nexusnova-beta-start.yml
          if git diff --cached --quiet; then
            echo 'No mining wiring changes required.'
            exit 0
          fi
          git commit -m 'feat: ship real single-card 24H mining dashboard'
          git push origin HEAD:main
