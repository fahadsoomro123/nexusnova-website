name: Drive History Forced Refresh OTA 19

on:
  push:
    branches: [nexusnova-ota-public]
    paths: ['.github/workflows/drive-history-forced-refresh-19.yml']

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout live OTA branch
        uses: actions/checkout@v4
        with:
          ref: nexusnova-ota-public
          fetch-depth: 0

      - name: Build fresh owner-safe Drive History package
        shell: bash
        env:
          SOURCE_SHA: 0d22636482b0bb0955f93a8c46018ef2da2a6d5b
        run: |
          set -euo pipefail
          python - <<'PY'
          import datetime, hashlib, json, os, pathlib, urllib.request

          source = os.environ['SOURCE_SHA']
          root = pathlib.Path('ota')
          files_root = root / 'files'
          manifest_path = root / 'manifest.json'
          manifest = json.loads(manifest_path.read_text())
          if manifest.get('base') != '8d1aaaee6f28b974a8c8b3ff213beb1318ec7405':
              raise SystemExit('Unexpected OTA base; refusing to publish')

          targets = [
              'src/nova-vehicle-premium-ui.js',
              'src/nova-drive-history-v2.js',
              'src/nova-drive-history-v2-hotfix.js',
          ]
          base = f'https://raw.githubusercontent.com/fahadsoomro123/nexusnova-app-public-build/{source}/fresh-rebuild/'
          for rel in targets:
              out = files_root / rel
              out.parent.mkdir(parents=True, exist_ok=True)
              with urllib.request.urlopen(base + rel, timeout=30) as r:
                  data = r.read()
              out.write_bytes(data)

          # Never shadow the signed APK's real owner authentication with public QA shims.
          remove = {
              'src/core/auth-service.js',
              'src/features/auth/auth-screen.js',
              'src/nova-drive-approved-ui-v2.js',
              *targets,
          }
          entries = [e for e in manifest.get('files', []) if e.get('path') not in remove]

          for rel in targets:
              data = (files_root / rel).read_bytes()
              entries.append({
                  'path': rel,
                  'sha256': hashlib.sha256(data).hexdigest(),
                  'size': len(data),
              })

          if not any(e.get('path') == 'index.html' for e in entries):
              raise SystemExit('OTA entry point missing')

          # Validate every cumulative entry before activation.
          total = 0
          for entry in entries:
              p = files_root / entry['path']
              if not p.is_file():
                  raise SystemExit(f'Missing OTA file: {entry["path"]}')
              data = p.read_bytes()
              total += len(data)
              if len(data) != int(entry['size']):
                  raise SystemExit(f'Size mismatch: {entry["path"]}')
              if hashlib.sha256(data).hexdigest() != entry['sha256']:
                  raise SystemExit(f'Hash mismatch: {entry["path"]}')
          if total > 60 * 1024 * 1024:
              raise SystemExit('OTA package too large')

          manifest['files'] = entries
          manifest['version'] = source
          manifest['drive_source'] = source
          try:
              manifest['proof_number'] = str(int(manifest.get('proof_number', '0')) + 1)
          except Exception:
              manifest['proof_number'] = '19'
          manifest['generatedAt'] = datetime.datetime.now(datetime.timezone.utc).isoformat().replace('+00:00','Z')
          manifest_path.write_text(json.dumps(manifest, separators=(',', ':')) + '\n')
          print('version', source)
          print('proof', manifest['proof_number'])
          print('files', len(entries), 'bytes', total)
          PY

      - name: Activate fresh OTA atomically
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'NexusNova OTA Bot'
          git config user.email 'nexusnova-ota@users.noreply.github.com'
          rm -f .github/workflows/drive-history-forced-refresh-19.yml
          git add ota/manifest.json ota/files/src/nova-vehicle-premium-ui.js ota/files/src/nova-drive-history-v2.js ota/files/src/nova-drive-history-v2-hotfix.js .github/workflows/drive-history-forced-refresh-19.yml
          git commit -m 'ota: force fresh Drive History owner hotfix 19'
          git push origin HEAD:nexusnova-ota-public
