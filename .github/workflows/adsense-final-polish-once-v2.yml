name: NexusNova AdSense Final Polish Once V2

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/adsense-final-polish-once-v2.yml'

permissions:
  contents: write

jobs:
  polish:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Checkout latest main
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply and verify locked UI plus AdSense fixes
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          import html as html_lib
          import json
          import re
          import xml.etree.ElementTree as ET

          R=Path('.')
          TODAY='2026-09-11'
          changed=[]

          def save(rel,text):
              p=R/rel
              old=p.read_text(encoding='utf-8')
              if old!=text:
                  p.write_text(text,encoding='utf-8')
                  changed.append(rel)

          # Global runtime nav: strong reviewer path, Gaming before auth, Sign up last.
          rel='assets/js/main.js'
          s=(R/rel).read_text(encoding='utf-8')
          target="['index.html','Home'],['tools.html','Tools'],['categories.html','Categories'],['articles.html','Articles'],['guides.html','Guides'],['gaming.html','Gaming']"
          if target not in s:
              pat=r"\['index\.html','Home'\],\['tools\.html','Tools'\],\['categories\.html','Categories'\],\['labs\.html','Labs'\],\['live\.html','LIVE'\],\['articles\.html','Articles'\],\['guides\.html','Guides'\]"
              s,n=re.subn(pat,target,s,count=1)
              if n!=1:
                  raise SystemExit('Could not locate the expected primary nav list in assets/js/main.js')
          save(rel,s)

          # Internal page heroes: preserve font family, reduce oversized headings/empty vertical space.
          rel='assets/css/compact-2026.css'
          s=(R/rel).read_text(encoding='utf-8')
          old='.page-hero{padding:36px 0 18px!important}.page-hero h1{font-size:clamp(34px,5vw,58px)!important;margin-top:10px!important}.page-hero p{font-size:15px!important;line-height:1.6!important;margin:10px 0!important;color:var(--muted)!important}'
          new='.page-hero{padding:28px 0 14px!important}.page-hero h1{font-size:clamp(36px,4.2vw,52px)!important;line-height:1.08!important;margin-top:8px!important}.page-hero p{font-size:15px!important;line-height:1.55!important;margin:8px 0!important;color:var(--muted)!important}'
          if new not in s:
              if old not in s: raise SystemExit('Desktop page-hero rule changed unexpectedly')
              s=s.replace(old,new,1)
          oldm='@media(max-width:720px){.nav{background:rgba(250,252,255,.98)!important}.page-hero{padding:26px 0 12px!important}.section{padding:26px 0!important}'
          newm='@media(max-width:720px){.nav{background:rgba(250,252,255,.98)!important}.page-hero{padding:22px 0 10px!important}.page-hero h1{font-size:clamp(34px,9vw,40px)!important;line-height:1.1!important}.section{padding:26px 0!important}'
          if newm not in s:
              if oldm not in s: raise SystemExit('Mobile page-hero rule changed unexpectedly')
              s=s.replace(oldm,newm,1)
          save(rel,s)

          # Homepage: stop promoting noindex Labs/LIVE/New Tools from the reviewer entry path.
          rel='index.html'
          s=(R/rel).read_text(encoding='utf-8')
          s=s.replace('NexusNova Tools — Useful Browser Tools, HumanProof, LIVE & Labs','NexusNova Tools — Useful Browser Tools & HumanProof')
          s=s.replace('Free browser utilities, transparent live-data references and NexusNova HumanProof for sensitive digital actions.','Free browser utilities, practical guides and NexusNova HumanProof for sensitive digital actions.')
          s=s.replace('NexusNova Tools — Tools, HumanProof, LIVE & Labs','NexusNova Tools — Tools & HumanProof')
          s=s.replace('Useful browser tools, live-data references, HumanProof and experimental NexusNova Labs.','Useful browser tools, practical guides and NexusNova HumanProof for sensitive digital actions.')
          s=s.replace('Free browser tools, NexusNova HumanProof, transparent LIVE data references and experimental Labs.','Free browser tools, practical guides and NexusNova HumanProof for sensitive digital actions.')
          s=s.replace('<small>TOOLS • HUMANPROOF • LIVE</small>','<small>TOOLS • HUMANPROOF • GUIDES</small>')
          s=s.replace('<nav class="nav" data-nav aria-label="Primary navigation"><a href="/" aria-current="page">Home</a><a href="tools.html">Tools</a><a href="categories.html">Categories</a><a href="labs.html">Labs</a><a href="live.html">LIVE</a></nav>','<nav class="nav" data-nav aria-label="Primary navigation"><a href="/" aria-current="page">Home</a><a href="tools.html">Tools</a><a href="categories.html">Categories</a><a href="articles.html">Articles</a><a href="guides.html">Guides</a><a href="gaming.html">Gaming</a><a class="nn-nav-auth nn-nav-signin" href="register.html?mode=signin">Sign in</a><a class="nn-nav-auth nn-nav-signup" href="register.html?mode=register">Sign up</a></nav>')
          s=s.replace('<a class="btn" href="new-tools.html">Newest tools</a>','<a class="btn" href="guides.html">How-to guides</a>')
          save(rel,s)

          # FAQ: remove beta/unfinished signal and route visitors to strong indexed surfaces.
          rel='faq.html'
          s=(R/rel).read_text(encoding='utf-8')
          s=s.replace('current beta behavior','current site behavior')
          s=s.replace('what the current website beta actually supports.','what the current website experience supports.')
          s=s.replace('<h2>Is NexusNova currently a beta?</h2><p>The website is undergoing a controlled beta validation phase while security, account, SEO and release-gate checks continue. Beta does not mean unfinished claims are treated as live; unsupported states remain locked or unavailable.</p>','<h2>Are all optional NexusNova features available?</h2><p>Core public browser tools and help pages are available without an account. Optional connected-account or provider-dependent features are shown only when they are supported; unavailable states are not presented as working results.</p>')
          s=s.replace('<div class="hero-actions"><a class="btn btn-primary" href="daily-tools-directory.html">Daily Tools →</a><a class="btn" href="image-to-text-ocr.html">Image to Text OCR</a><a class="btn" href="gaming.html">Gaming Tools</a><a class="btn" href="smart-tools.html">Smart Tools</a></div>','<div class="hero-actions"><a class="btn btn-primary" href="tools.html">All Tools →</a><a class="btn" href="image-to-text-ocr.html">Image to Text OCR</a><a class="btn" href="categories.html">Categories</a><a class="btn" href="guides.html">Practical Guides</a></div>')
          s=s.replace('"dateModified":"2026-08-30"',f'"dateModified":"{TODAY}"')
          s=s.replace('<strong>Last reviewed:</strong> 30 August 2026','<strong>Last reviewed:</strong> 11 September 2026')
          save(rel,s)

          # Categories JSON-LD syntax and freshness.
          rel='categories.html'
          s=(R/rel).read_text(encoding='utf-8')
          s=s.replace('"url":"https://nexusnovatools.com/network-tools.html"},]}','"url":"https://nexusnovatools.com/network-tools.html"}]}')
          s=s.replace('"dateModified":"2026-09-05"',f'"dateModified":"{TODAY}"')
          save(rel,s)

          # Strong indexed breadcrumbs instead of noindex/merge hubs.
          rel='decision-matrix-calculator.html'
          s=(R/rel).read_text(encoding='utf-8')
          s=s.replace('"position":2,"name":"New Tools","item":"https://nexusnovatools.com/new-tools.html"','"position":2,"name":"Tools","item":"https://nexusnovatools.com/tools.html"')
          s=s.replace('<a href="new-tools.html">New Tools</a>','<a href="tools.html">Tools</a>')
          save(rel,s)

          rel='electricity-bill-calculator-pakistan.html'
          s=(R/rel).read_text(encoding='utf-8')
          s=s.replace('"position":2,"name":"New Tools","item":"https://nexusnovatools.com/new-tools.html"','"position":2,"name":"Pakistan Tools","item":"https://nexusnovatools.com/pakistan-tools.html"')
          s=s.replace('<a href="new-tools.html">New Tools</a>','<a href="pakistan-tools.html">Pakistan Tools</a>')
          s=s.replace('<a class="btn btn-primary" href="new-tools.html">More New Tools →</a>','<a class="btn btn-primary" href="pakistan-tools.html">More Pakistan Tools →</a>')
          save(rel,s)

          rel='private-quick-note.html'
          s=(R/rel).read_text(encoding='utf-8')
          s=s.replace('<a href="daily-tools-directory.html">Daily Tools</a>','<a href="productivity-tools.html">Productivity Tools</a>')
          s=s.replace('<a href="daily-tools-directory.html">Daily Tools directory</a>','<a href="productivity-tools.html">Productivity Tools</a>')
          save(rel,s)

          # Keep indexable article hub focused on practical tool workflows.
          rel='articles.html'
          s=(R/rel).read_text(encoding='utf-8')
          s=s.replace('<title>Practical Tool & Search Articles 2026 — NexusNova Tools</title>','<title>Practical Tool Guides & Articles 2026 — NexusNova Tools</title>')
          s=s.replace('Practical NexusNova guides about Google Search, Search Console, AI, gaming, privacy, PDFs, images, QR codes, calculators, productivity and digital workflows.','Practical NexusNova articles for browser tools, PDFs, images, calculators, gaming settings, privacy, productivity and repeatable digital workflows.')
          s=s.replace('Current Search, AI, gaming and practical digital-workflow guides connected to useful NexusNova tools.','Practical browser-tool and digital-workflow articles connected to useful NexusNova utilities.')
          save(rel,s)

          # Merge the 17 standalone new-tool entries into the canonical main sitemap.
          rel='sitemap.xml'
          sm=(R/rel).read_text(encoding='utf-8')
          extra=(R/'sitemap-new-tools.xml').read_text(encoding='utf-8')
          entries=re.findall(r'<url>\s*<loc>(https://nexusnovatools\.com/[^<]+)</loc>\s*<lastmod>([^<]+)</lastmod>\s*</url>',extra,re.S)
          if len(entries)!=17: raise SystemExit(f'Expected 17 new-tool URLs, found {len(entries)}')
          for loc,lastmod in entries:
              page=loc.replace('https://nexusnovatools.com/','',1)
              hp=R/page
              if not hp.exists(): raise SystemExit(f'Missing sitemap target: {page}')
              source=hp.read_text(encoding='utf-8')
              m=re.search(r'<meta\s+name=["\']robots["\']\s+content=["\']([^"\']+)',source,re.I)
              if m and 'noindex' in m.group(1).lower(): raise SystemExit(f'Noindex URL cannot enter main sitemap: {page}')
              if f'<loc>{loc}</loc>' not in sm:
                  sm=sm.replace('</urlset>',f'  <url>\n    <loc>{loc}</loc>\n    <lastmod>{lastmod}</lastmod>\n  </url>\n</urlset>',1)
          for loc in [
              'https://nexusnovatools.com/',
              'https://nexusnovatools.com/faq.html',
              'https://nexusnovatools.com/categories.html',
              'https://nexusnovatools.com/articles.html',
              'https://nexusnovatools.com/decision-matrix-calculator.html',
              'https://nexusnovatools.com/electricity-bill-calculator-pakistan.html',
              'https://nexusnovatools.com/private-quick-note.html']:
              sm=re.sub(rf'(<loc>{re.escape(loc)}</loc>\s*<lastmod>)[^<]+',rf'\g<1>{TODAY}',sm,count=1)
          save(rel,sm)

          # Targeted verification gates, including Claude's earlier discrepancies.
          main=(R/'assets/js/main.js').read_text(encoding='utf-8')
          a=main.index('const items=['); b=main.index('const authMode=',a); nav=main[a:b]
          assert 'labs.html' not in nav and 'live.html' not in nav
          assert "['gaming.html','Gaming']" in nav
          assert main.index("['gaming.html','Gaming']") < main.index("signIn.textContent='Sign in'") < main.index("signUp.textContent='Sign up'")

          faq=(R/'faq.html').read_text(encoding='utf-8').lower()
          if 'website beta' in faq or 'beta validation' in faq or 'seo and release-gate' in faq: raise SystemExit('FAQ beta wording remains')

          for page in ['gaming.html','trending-tools.html','tech/gpt-6-astra-2026.html']:
              src=(R/page).read_text(encoding='utf-8')
              if not re.search(r'<meta\s+name=["\']robots["\']\s+content=["\'][^"\']*noindex',src,re.I):
                  raise SystemExit(f'Claude noindex target failed: {page}')

          weak=[
              'tech/gpt-6-astra-2026.html','articles/google-search-console-platform-properties-2026.html',
              'articles/google-august-2026-spam-update-traffic-drop.html','articles/google-preferred-sources-2026.html',
              'articles/gpt-5-6-sol-context-window-guide.html','articles/amd-adrenalin-26-8-1-modern-warfare-4.html',
              'articles/windows-11-august-2026-rgb-gaming-crashes.html','articles/modern-warfare-4-beta-pc-checklist.html']
          ah=(R/'articles.html').read_text(encoding='utf-8')
          bad=[x for x in weak if x in ah]
          if bad: raise SystemExit('Weak/noindex article teasers still on articles.html: '+', '.join(bad))

          for removed in ['OWNER-CONTROL-CENTER.md','adsense_content_remediation_20260911.py']:
              if (R/removed).exists(): raise SystemExit(f'Previously removed internal file returned: {removed}')

          for page in ['categories.html','faq.html','decision-matrix-calculator.html','electricity-bill-calculator-pakistan.html']:
              src=(R/page).read_text(encoding='utf-8')
              for raw in re.findall(r'<script\s+type=["\']application/ld\+json["\'][^>]*>(.*?)</script>',src,re.I|re.S):
                  json.loads(html_lib.unescape(raw).strip())
          ET.parse(R/'sitemap.xml')
          finalsm=(R/'sitemap.xml').read_text(encoding='utf-8')
          for loc,_ in entries:
              if f'<loc>{loc}</loc>' not in finalsm: raise SystemExit(f'Missing merged sitemap URL: {loc}')

          print(f'PASS: {len(changed)} files changed')
          for x in changed: print(' -',x)
          PY

      - name: Commit verified fixes and remove temporary workflows
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'nexusnova-adsense[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm -f .github/workflows/adsense-final-polish-once.yml .github/workflows/adsense-final-polish-once-v2.yml
          git add -A
          git commit -m 'seo: finalize AdSense reviewer navigation and discovery polish'
          git pull --rebase origin main
          git push origin main
