name: NexusNova Responsive Matrix Quality

on:
  pull_request:
    branches: [main]
    paths:
      - '**/*.html'
      - '**/*.css'
      - 'assets/**/*.js'
      - '.github/workflows/responsive-matrix-quality.yml'
  push:
    branches: [main]
    paths:
      - '**/*.html'
      - '**/*.css'
      - 'assets/**/*.js'
      - '.github/workflows/responsive-matrix-quality.yml'
  workflow_dispatch:

concurrency:
  group: responsive-matrix-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  responsive-matrix:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'

      - name: Cache Playwright headless Chromium
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-python-3.12-1.64.0-chromium-headless-v1

      - name: Install pinned Playwright Python package
        timeout-minutes: 3
        run: python -m pip install --disable-pip-version-check --retries 4 --timeout 30 "playwright==1.64.0"

      - name: Install and smoke-test headless Chromium
        timeout-minutes: 8
        env:
          PLAYWRIGHT_DOWNLOAD_CONNECTION_TIMEOUT: '30000'
        run: |
          set -euo pipefail
          installed=false
          for attempt in 1 2; do
            if python -m playwright install --only-shell chromium; then
              installed=true
              break
            fi
            if [[ "$attempt" -eq 1 ]]; then
              echo "Chromium download failed once; retrying after 5 seconds."
              sleep 5
            fi
          done
          if [[ "$installed" != true ]]; then
            echo "Chromium installation failed after two attempts."
            exit 1
          fi

          smoke_test() {
            python - <<'PY'
          from playwright.sync_api import sync_playwright

          with sync_playwright() as playwright:
              browser = playwright.chromium.launch(headless=True)
              print(f"PASS: Chromium headless shell launched; version={browser.version}")
              browser.close()
          PY
          }

          if smoke_test; then
            exit 0
          fi

          echo "Cached Chromium could not launch with the runner's current libraries; installing OS dependencies and retrying."
          python -m playwright install-deps chromium
          smoke_test
      - name: Start local site
        run: |
          python -m http.server 8000 --bind 127.0.0.1 >/tmp/nexusnova-responsive-http.log 2>&1 &
          sleep 2
          curl --fail --silent http://127.0.0.1:8000/ >/dev/null

      - name: Check all required viewports on core surfaces
        run: |
          python - <<'PY'
          import json
          import re
          from urllib.parse import urlparse
          from playwright.sync_api import sync_playwright

          pages = [
              ('home', 'index.html'),
              ('tools', 'tools.html'),
              ('image', 'image-compressor.html'),
              ('calculator', 'calculator.html'),
              ('article', 'articles.html'),
              ('guide', 'guides.html'),
              ('register', 'register.html'),
              ('privacy', 'privacy.html'),
              ('audit-studio', 'seo-audit-studio.html'),
          ]
          widths = [360, 375, 390, 412, 430, 768, 1024, 1280, 1440]
          failures = []

          with sync_playwright() as p:
              browser = p.chromium.launch(headless=True)
              for name, rel in pages:
                  for width in widths:
                      page = browser.new_page(viewport={'width': width, 'height': 844 if width < 800 else 1000})
                      errors = []
                      page.on('console', lambda msg: errors.append(msg.text) if msg.type == 'error' and 'violates the following report-only Content Security Policy directive' not in msg.text else None)
                      if rel == 'register.html':
                          page.route('**/api/auth/security-config', lambda route: route.fulfill(
                              status=200,
                              content_type='application/json',
                              body='{"enabled":false}'
                          ))
                      if rel == 'seo-audit-studio.html':
                          api_requests = []
                          fixture_audit_id = '11111111-1111-4111-8111-111111111111'
                          fixture_verification_id = '22222222-2222-4222-8222-222222222222'
                          fixture_url = 'https://responsive-fixture.example/'
                          def mock_audit_api(route):
                              request = route.request
                              parsed = urlparse(request.url)
                              path = parsed.path
                              method = request.method.upper()
                              api_requests.append((method, path))
                              origin = request.headers.get('origin') or 'http://127.0.0.1:8000'
                              cors_headers = {
                                  'access-control-allow-origin': origin,
                                  'access-control-allow-methods': 'GET, POST, OPTIONS',
                                  'access-control-allow-headers': 'authorization, content-type, accept',
                                  'access-control-max-age': '86400',
                                  'vary': 'Origin',
                                  'cache-control': 'no-store',
                              }
                              if method == 'OPTIONS':
                                  route.fulfill(status=204, headers=cors_headers)
                                  return
                              if path == '/api/session' and method == 'POST':
                                  payload = {'ok': True, 'token': 'a' * 64, 'expiresAt': 4102444800}
                              elif path == '/api/config':
                                  payload = {
                                      'ok': True, 'environment': 'sandbox', 'price': 2.99,
                                      'cryptoPrice': 2.99, 'livePaymentsEnabled': False,
                                      'devSimulatorEnabled': False, 'safepayConfigured': False,
                                      'nowPaymentsConfigured': False, 'cryptoComplianceConfirmed': False,
                                  }
                              elif path == '/api/audits/latest':
                                  payload = {'ok': True, 'audit': None, 'unlocked': False}
                              elif path == '/api/fix-issues/config':
                                  payload = {
                                      'ok': True, 'available': False, 'guidanceAvailable': True,
                                      'reason': 'Responsive test fixture: live publishing is intentionally disabled.'
                                  }
                              elif path.endswith('/preview') and '/api/audits/' in path:
                                  payload = {
                                      'ok': True, 'auditId': fixture_verification_id, 'id': fixture_verification_id,
                                      'url': fixture_url, 'mode': 'live', 'overallStatus': 'measured',
                                      'overall': 82, 'grade': 'B', 'checks': [], 'recommendations': [],
                                      'categories': [], 'categoryMeta': {},
                                      'sources': {'content': True, 'pagespeedMobile': 'google-pagespeed',
                                                  'pagespeedDesktop': 'google-pagespeed', 'errors': {}},
                                      'metrics': {'mobile': {'score': 82}, 'desktop': {'score': 91}},
                                      'meta': {'contentMode': 'html'}, 'sourceCoverage': 100,
                                      'categoryCoverage': 100,
                                  }
                              elif path.endswith('/full') and '/api/audits/' in path:
                                  payload = {
                                      'ok': True, 'auditId': fixture_verification_id, 'id': fixture_verification_id,
                                      'url': fixture_url, 'mode': 'live', 'overallStatus': 'measured',
                                      'overall': 82, 'grade': 'B', 'checks': [], 'recommendations': [],
                                      'categories': [], 'categoryMeta': {}, 'issueGroups': [],
                                      'sources': {'content': True, 'pagespeedMobile': 'google-pagespeed',
                                                  'pagespeedDesktop': 'google-pagespeed',
                                                  'performanceProviderMobile': 'google-pagespeed',
                                                  'performanceProviderDesktop': 'google-pagespeed', 'errors': {}},
                                      'metrics': {'mobile': {'score': 82}, 'desktop': {'score': 91}},
                                      'meta': {'contentMode': 'html'}, 'sourceCoverage': 100,
                                      'categoryCoverage': 100, 'overallCoverage': 100,
                                  }
                              else:
                                  payload = {'ok': True, 'available': False, 'guidanceAvailable': True}
                              route.fulfill(status=200, content_type='application/json',
                                            headers=cors_headers, body=json.dumps(payload))
                          page.route('**/api/**', mock_audit_api)
                      try:
                          response = page.goto(f'http://127.0.0.1:8000/{rel}', wait_until='networkidle', timeout=30000)
                          if not response or response.status >= 400:
                              failures.append(f'{name}@{width}: HTTP {response.status if response else 0}')
                              continue
                          page.wait_for_timeout(200)
                          metrics = page.evaluate('''() => ({
                              sw: document.documentElement.scrollWidth,
                              cw: document.documentElement.clientWidth,
                              h1: document.querySelectorAll('h1').length,
                              header: !!document.querySelector('[data-header]') || !!document.querySelector('.nn-header') || !!document.querySelector('.topbar'),
                              footer: !!document.querySelector('footer'),
                              prompt: !!document.querySelector('#niPrompt'),
                          })''')
                          if metrics['sw'] > metrics['cw'] + 6:
                              failures.append(f'{name}@{width}: horizontal overflow ({metrics["sw"]}/{metrics["cw"]})')
                          if metrics['h1'] != 1 and rel not in {'register.html'}:
                              failures.append(f'{name}@{width}: H1 count {metrics["h1"]}')
                          if errors:
                              failures.append(f'{name}@{width}: console errors: {" | ".join(dict.fromkeys(errors))}')
                          if not metrics['header']:
                              failures.append(f'{name}@{width}: shared header missing')
                          if not metrics['footer']:
                              failures.append(f'{name}@{width}: footer missing')
                          if rel == 'seo-audit-studio.html':
                              page.evaluate("""(auditId) => document.dispatchEvent(new CustomEvent(
                                  'nexusnova:audit-report-ready',
                                  { detail: {
                                      auditId,
                                      url: 'https://responsive-fixture.example/',
                                      completeEvidence: true,
                                      mode: 'live'
                                  }}
                              ))""", '11111111-1111-4111-8111-111111111111')
                              page.wait_for_function("""() => {
                                  const panel = document.querySelector('#fixIssuesPanel');
                                  return panel && panel.hidden === false;
                              }""", timeout=5000)
                              if not page.locator('#fixIssuesStartBtn').is_disabled():
                                  failures.append(f'{name}@{width}: live publishing must stay disabled with mocked unavailable backend')
                              if not page.locator('#fixIssuesVerificationPanel').evaluate('(el) => el.hidden'):
                                  failures.append(f'{name}@{width}: complimentary verification panel must stay hidden before verified job completion')
                              # Simulate the already-authorized report-open button click after a completed result.
                              # All API requests stay inside the fixture route; no payment/provider request is made.
                              page.evaluate("""(auditId) => {
                                  const panel = document.querySelector('#fixIssuesVerificationPanel');
                                  const button = document.querySelector('#fixIssuesVerificationOpenReportBtn');
                                  panel.dataset.auditId = auditId;
                                  button.hidden = false;
                                  button.disabled = false;
                                  button.click();
                              }""", '22222222-2222-4222-8222-222222222222')
                              page.wait_for_function("""() => document.body.classList.contains('report-is-paid')""", timeout=8000)
                              paths = [path for method, path in api_requests]
                              if not any(path.endswith('/preview') for path in paths):
                                  failures.append(f'{name}@{width}: opening verification report did not load preview')
                              if not any(path.endswith('/full') for path in paths):
                                  failures.append(f'{name}@{width}: opening verification report did not unlock full report')
                              after = page.evaluate("""() => ({
                                  sw: document.documentElement.scrollWidth,
                                  cw: document.documentElement.clientWidth
                              })""")
                              if after['sw'] > after['cw'] + 6:
                                  failures.append(f'{name}@{width}: horizontal overflow after verification report open ({after["sw"]}/{after["cw"]})')
                      except Exception as exc:
                          failures.append(f'{name}@{width}: browser failure: {exc}')
                      finally:
                          page.close()
              browser.close()

          if failures:
              print('\n'.join(f'FAIL: {item}' for item in failures))
              raise SystemExit(1)
          print(f'PASS: {len(pages) * len(widths)} responsive viewport checks completed with zero findings.')
          PY

