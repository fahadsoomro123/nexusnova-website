name: NexusNova Responsive Matrix Quality

on:
  pull_request:
    branches: [main]
    paths:
      - '**/*.html'
      - '**/*.css'
      - 'assets/**/*.js'
      - '.github/workflows/responsive-matrix-quality.yml'
  push:
    branches: [main]
    paths:
      - '**/*.html'
      - '**/*.css'
      - 'assets/**/*.js'
      - '.github/workflows/responsive-matrix-quality.yml'
  workflow_dispatch:

concurrency:
  group: responsive-matrix-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  responsive-matrix:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'

      - name: Cache Playwright headless Chromium
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-python-3.12-1.64.0-chromium-headless-v1

      - name: Install pinned Playwright Python package
        timeout-minutes: 3
        run: python -m pip install --disable-pip-version-check --retries 4 --timeout 30 "playwright==1.64.0"

      - name: Install and smoke-test headless Chromium
        timeout-minutes: 8
        env:
          PLAYWRIGHT_DOWNLOAD_CONNECTION_TIMEOUT: '30000'
        run: |
          set -euo pipefail
          installed=false
          for attempt in 1 2; do
            if python -m playwright install --with-deps --only-shell chromium; then
              installed=true
              break
            fi
            if [[ "$attempt" -eq 1 ]]; then
              echo "Chromium setup failed once; retrying after 5 seconds."
              sleep 5
            fi
          done
          if [[ "$installed" != true ]]; then
            echo "Chromium installation failed after two attempts."
            exit 1
          fi
          python - <<'PY'
          from playwright.sync_api import sync_playwright

          with sync_playwright() as playwright:
              browser = playwright.chromium.launch(headless=True)
              print(f"PASS: Chromium headless shell launched; version={browser.version}")
              browser.close()
          PY

      - name: Start local site
        run: |
          python -m http.server 8000 --bind 127.0.0.1 >/tmp/nexusnova-responsive-http.log 2>&1 &
          sleep 2
          curl --fail --silent http://127.0.0.1:8000/ >/dev/null

      - name: Check all required viewports on core surfaces
        run: |
          python - <<'PY'
          from playwright.sync_api import sync_playwright

          pages = [
              ('home', 'index.html'),
              ('tools', 'tools.html'),
              ('image', 'image-compressor.html'),
              ('calculator', 'calculator.html'),
              ('article', 'articles.html'),
              ('guide', 'guides.html'),
              ('register', 'register.html'),
              ('privacy', 'privacy.html'),
          ]
          widths = [360, 375, 390, 412, 430, 768, 1024, 1280, 1440]
          failures = []

          with sync_playwright() as p:
              browser = p.chromium.launch(headless=True)
              for name, rel in pages:
                  for width in widths:
                      page = browser.new_page(viewport={'width': width, 'height': 844 if width < 800 else 1000})
                      errors = []
                      page.on('console', lambda msg: errors.append(msg.text) if msg.type == 'error' and 'violates the following report-only Content Security Policy directive' not in msg.text else None)
                      if rel == 'register.html':
                          page.route('**/api/auth/security-config', lambda route: route.fulfill(
                              status=200,
                              content_type='application/json',
                              body='{"enabled":false}'
                          ))
                      try:
                          response = page.goto(f'http://127.0.0.1:8000/{rel}', wait_until='networkidle', timeout=30000)
                          if not response or response.status >= 400:
                              failures.append(f'{name}@{width}: HTTP {response.status if response else 0}')
                              continue
                          page.wait_for_timeout(200)
                          metrics = page.evaluate('''() => ({
                              sw: document.documentElement.scrollWidth,
                              cw: document.documentElement.clientWidth,
                              h1: document.querySelectorAll('h1').length,
                              header: !!document.querySelector('[data-header]') || !!document.querySelector('.nn-header'),
                              footer: !!document.querySelector('footer'),
                              prompt: !!document.querySelector('#niPrompt'),
                          })''')
                          if metrics['sw'] > metrics['cw'] + 6:
                              failures.append(f'{name}@{width}: horizontal overflow ({metrics["sw"]}/{metrics["cw"]})')
                          if metrics['h1'] != 1 and rel not in {'register.html'}:
                              failures.append(f'{name}@{width}: H1 count {metrics["h1"]}')
                          if errors:
                              failures.append(f'{name}@{width}: console errors: {" | ".join(dict.fromkeys(errors))}')
                          if not metrics['header']:
                              failures.append(f'{name}@{width}: shared header missing')
                          if not metrics['footer']:
                              failures.append(f'{name}@{width}: footer missing')
                      except Exception as exc:
                          failures.append(f'{name}@{width}: browser failure: {exc}')
                      finally:
                          page.close()
              browser.close()

          if failures:
              print('\n'.join(f'FAIL: {item}' for item in failures))
              raise SystemExit(1)
          print(f'PASS: {len(pages) * len(widths)} responsive viewport checks completed with zero findings.')
          PY

