name: NexusNova Responsive Matrix Quality

on:
  pull_request:
    branches: [main]
    paths:
      - '**/*.html'
      - '**/*.css'
      - 'assets/**/*.js'
      - '.github/workflows/responsive-matrix-quality.yml'
  push:
    branches: [main]
    paths:
      - '**/*.html'
      - '**/*.css'
      - 'assets/**/*.js'
      - '.github/workflows/responsive-matrix-quality.yml'
  workflow_dispatch:

concurrency:
  group: responsive-matrix-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  responsive-matrix:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'

      - name: Cache Playwright headless Chromium
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-python-3.12-1.64.0-chromium-headless-v1

      - name: Install pinned Playwright Python package
        timeout-minutes: 3
        run: python -m pip install --disable-pip-version-check --retries 4 --timeout 30 "playwright==1.64.0"

      - name: Install and smoke-test headless Chromium
        timeout-minutes: 8
        env:
          PLAYWRIGHT_DOWNLOAD_CONNECTION_TIMEOUT: '30000'
        run: |
          set -euo pipefail
          installed=false
          for attempt in 1 2; do
            if python -m playwright install --only-shell chromium; then
              installed=true
              break
            fi
            if [[ "$attempt" -eq 1 ]]; then
              echo "Chromium download failed once; retrying after 5 seconds."
              sleep 5
            fi
          done
          if [[ "$installed" != true ]]; then
            echo "Chromium installation failed after two attempts."
            exit 1
          fi

          smoke_test() {
            python - <<'PY'
          from playwright.sync_api import sync_playwright

          with sync_playwright() as playwright:
              browser = playwright.chromium.launch(headless=True)
              print(f"PASS: Chromium headless shell launched; version={browser.version}")
              browser.close()
          PY
          }

          if smoke_test; then
            exit 0
          fi

          echo "Cached Chromium could not launch with the runner's current libraries; installing OS dependencies and retrying."
          python -m playwright install-deps chromium
          smoke_test
      - name: Start local site
        run: |
          python -m http.server 8000 --bind 127.0.0.1 >/tmp/nexusnova-responsive-http.log 2>&1 &
          sleep 2
          curl --fail --silent http://127.0.0.1:8000/ >/dev/null

      - name: Check all required viewports on core surfaces
        run: |
          python - <<'PY'
          import json
          from urllib.parse import urlparse
          from playwright.sync_api import sync_playwright

          pages = [
              ('home', 'index.html'),
              ('tools', 'tools.html'),
              ('image', 'image-compressor.html'),
              ('calculator', 'calculator.html'),
              ('article', 'articles.html'),
              ('guide', 'guides.html'),
              ('register', 'register.html'),
              ('privacy', 'privacy.html'),
              ('owner-console', 'seo-audit-studio-admin.html'),
          ]
          widths = [360, 375, 390, 412, 430, 768, 1024, 1280, 1440]
          failures = []

          with sync_playwright() as p:
              browser = p.chromium.launch(headless=True)
              for name, rel in pages:
                  for width in widths:
                      page = browser.new_page(viewport={'width': width, 'height': 844 if width < 800 else 1000})
                      errors = []
                      page.on('console', lambda msg: errors.append(msg.text) if msg.type == 'error' and 'violates the following report-only Content Security Policy directive' not in msg.text else None)
                      if rel == 'register.html':
                          page.route('**/api/auth/security-config', lambda route: route.fulfill(
                              status=200,
                              content_type='application/json',
                              body='{"enabled":false}'
                          ))
                      if rel == 'seo-audit-studio-admin.html':
                          owner_state = {'created': 0}
                          def mock_owner_api(route):
                              request = route.request
                              path = urlparse(request.url).path
                              method = request.method.upper()
                              origin = request.headers.get('origin') or 'http://127.0.0.1:8000'
                              cors_headers = {
                                  'access-control-allow-origin': origin,
                                  'access-control-allow-methods': 'GET, POST, OPTIONS',
                                  'access-control-allow-headers': 'x-owner-admin-token, content-type, accept',
                                  'access-control-max-age': '86400',
                                  'vary': 'Origin',
                                  'cache-control': 'no-store',
                              }
                              if method == 'OPTIONS':
                                  route.fulfill(status=204, headers=cors_headers)
                                  return
                              if path == '/api/admin/promotions':
                                  payload = {'campaigns': [], 'codes': [], 'redemptions': [], 'claimRequests': []}
                              elif path == '/api/admin/audits' and method == 'GET':
                                  payload = {'audits': []}
                              elif path == '/api/admin/audits' and method == 'POST':
                                  owner_state['created'] += 1
                                  audit_id = 'fixture-audit-' + str(owner_state['created'])
                                  try:
                                      submitted = json.loads(request.post_data or '{}')
                                  except Exception:
                                      submitted = {}
                                  payload = {'auditId': audit_id, 'preview': {'url': submitted.get('url', 'https://fixture.example/')}}
                              elif path.endswith('/full') and '/api/admin/audits/' in path:
                                  audit_id = path.split('/')[-2]
                                  if audit_id == 'fixture-audit-1':
                                      payload = {
                                          'url': 'https://measured-fixture.example/', 'overallStatus': 'measured',
                                          'overall': 82, 'grade': 'B', 'overallCoverage': 100,
                                          'sourceCoverage': 100, 'categoryCoverage': 100,
                                          'overallCategoriesUsed': 3, 'passCount': 1, 'scoredCount': 4,
                                          'meta': {'title': 'Measured fixture report', 'description': 'Measured report for viewport testing.',
                                                   'canonical': 'https://measured-fixture.example/', 'lang': 'en',
                                                   'viewport': 'width=device-width, initial-scale=1'},
                                          'http': {'status': 200, 'contentType': 'text/html', 'bytes': 2048},
                                          'categories': {'technical': 74, 'onPage': 88, 'performance': 81},
                                          'categoryMeta': {
                                              'technical': {'status': 'measured', 'measuredChecks': 4, 'requiredChecks': 4, 'source': 'measured checks'},
                                              'onPage': {'status': 'measured'}, 'performance': {'status': 'measured'}
                                          },
                                          'metrics': {
                                              'mobile': {'score': 78, 'lcp': 1200, 'cls': 0.02, 'tbt': 200, 'fcp': 700,
                                                         'speedIndex': 1100, 'tti': 1500, 'opportunities': [], 'diagnostics': []},
                                              'desktop': {'score': 92, 'lcp': 900, 'cls': 0.01, 'tbt': 100, 'fcp': 400,
                                                          'speedIndex': 700, 'tti': 900, 'opportunities': [], 'diagnostics': []}
                                          },
                                          'checks': [
                                              {'category': 'Technical SEO', 'title': 'Robots directive', 'status': 'pass', 'evidence': 'Present'},
                                              {'category': 'Technical SEO', 'title': 'Canonical URL', 'status': 'warn', 'evidence': 'Review'},
                                              {'category': 'Content', 'title': 'Heading hierarchy', 'status': 'fail', 'evidence': 'Missing section'},
                                              {'category': 'Social', 'title': 'Open Graph metadata', 'status': 'info', 'evidence': 'Informational'}
                                          ],
                                          'recommendations': [],
                                          'sources': {'content': True, 'pagespeedMobile': 'google-pagespeed',
                                                      'pagespeedDesktop': 'google-pagespeed', 'errors': {}}
                                      }
                                  else:
                                      payload = {
                                          'url': 'https://partial-fixture.example/', 'overallStatus': 'limited',
                                          'overall': None, 'grade': None, 'overallScoreReason': 'Required measurements were incomplete.',
                                          'overallCoverage': 35, 'sourceCoverage': 35, 'categoryCoverage': 25,
                                          'meta': {'title': 'Partial fixture report', 'description': 'Partial data for viewport testing.'},
                                          'categories': {'technical': None}, 'categoryMeta': {'technical': {'status': 'limited'}},
                                          'metrics': {'mobile': {'score': 63, 'opportunities': [], 'diagnostics': []},
                                                      'desktop': {'opportunities': [], 'diagnostics': []}},
                                          'recommendations': [],
                                          'sources': {'content': False, 'pagespeedMobile': False, 'pagespeedDesktop': False,
                                                      'errors': {'content': 'fixture unavailable', 'psiMobile': 'fixture unavailable',
                                                                 'psiDesktop': 'fixture unavailable'}}
                                      }
                              else:
                                  payload = {}
                              route.fulfill(status=200, content_type='application/json',
                                            headers=cors_headers, body=json.dumps(payload))
                          page.route('**/api/**', mock_owner_api)
                      try:
                          response = page.goto(f'http://127.0.0.1:8000/{rel}', wait_until='networkidle', timeout=30000)
                          if not response or response.status >= 400:
                              failures.append(f'{name}@{width}: HTTP {response.status if response else 0}')
                              continue
                          page.wait_for_timeout(200)
                          metrics = page.evaluate('''() => ({
                              sw: document.documentElement.scrollWidth,
                              cw: document.documentElement.clientWidth,
                              h1: document.querySelectorAll('h1').length,
                              header: !!document.querySelector('[data-header]') || !!document.querySelector('.nn-header') || !!document.querySelector('main > header'),
                              footer: !!document.querySelector('footer'),
                              prompt: !!document.querySelector('#niPrompt'),
                          })''')
                          if metrics['sw'] > metrics['cw'] + 6:
                              failures.append(f'{name}@{width}: horizontal overflow ({metrics["sw"]}/{metrics["cw"]})')
                          if metrics['h1'] != 1 and rel not in {'register.html'}:
                              failures.append(f'{name}@{width}: H1 count {metrics["h1"]}')
                          if errors:
                              failures.append(f'{name}@{width}: console errors: {" | ".join(dict.fromkeys(errors))}')
                          if not metrics['header']:
                              failures.append(f'{name}@{width}: shared header missing')
                          if not metrics['footer']:
                              failures.append(f'{name}@{width}: footer missing')
                          if rel == 'seo-audit-studio-admin.html':
                              page.locator('#ownerTokenInput').fill('o' * 40)
                              page.locator('#connectBtn').click()
                              page.wait_for_function("""() => {
                                  const consolePanel = document.querySelector('#console');
                                  return consolePanel && consolePanel.hidden === false;
                              }""", timeout=5000)
                              page.locator('#ownerAuditUrl').fill('https://measured-fixture.example/')
                              page.locator('#ownerAuditBtn').click()
                              page.locator('#auditOutput').get_by_role('button', name='View full report').wait_for(timeout=5000)
                              page.locator('#auditOutput').get_by_role('button', name='View full report').click()
                              page.wait_for_selector('#auditOutput .report-visual-gauges', timeout=5000)
                              measured = page.locator('#auditOutput .report-gauge-svg').evaluate_all("(nodes) => nodes.map(node => node.getAttribute('aria-label'))")
                              expected = ['Overall SEO health: 82 out of 100', 'Technical health: 74 out of 100',
                                          'Mobile performance: 78 out of 100', 'Desktop performance: 92 out of 100']
                              if measured != expected:
                                  failures.append(f'{name}@{width}: measured gauge labels/values mismatch ({measured})')
                              counts = page.locator('#auditOutput .report-finding-count strong').all_text_contents()
                              if counts[:4] != ['1', '1', '1', '1']:
                                  failures.append(f'{name}@{width}: finding counters do not reflect measured checks ({counts})')
                              first_report = page.evaluate("""() => ({
                                  sw: document.documentElement.scrollWidth,
                                  cw: document.documentElement.clientWidth
                              })""")
                              if first_report['sw'] > first_report['cw'] + 6:
                                  failures.append(f'{name}@{width}: overflow in measured owner scorecard ({first_report["sw"]}/{first_report["cw"]})')
                              page.locator('#ownerAuditUrl').fill('https://partial-fixture.example/')
                              page.locator('#ownerAuditBtn').click()
                              page.locator('#auditOutput').get_by_role('button', name='View full report').wait_for(timeout=5000)
                              page.locator('#auditOutput').get_by_role('button', name='View full report').click()
                              page.wait_for_selector('#auditOutput .report-visual-gauges', timeout=5000)
                              empty_gauges = page.locator('#auditOutput .report-gauge-empty').count()
                              partial_labels = page.locator('#auditOutput .report-gauge-svg').evaluate_all("(nodes) => nodes.map(node => node.getAttribute('aria-label'))")
                              if empty_gauges != 3 or partial_labels != ['Mobile performance: 63 out of 100']:
                                  failures.append(f'{name}@{width}: missing measurements were not shown as empty gauges ({empty_gauges}, {partial_labels})')
                              partial_counts = page.locator('#auditOutput .report-finding-count strong').all_text_contents()
                              if partial_counts and any(value != 'N/A' for value in partial_counts):
                                  failures.append(f'{name}@{width}: unavailable findings were shown as fabricated counts ({partial_counts})')
                              final_report = page.evaluate("""() => ({
                                  sw: document.documentElement.scrollWidth,
                                  cw: document.documentElement.clientWidth
                              })""")
                              if final_report['sw'] > final_report['cw'] + 6:
                                  failures.append(f'{name}@{width}: overflow in partial owner scorecard ({final_report["sw"]}/{final_report["cw"]})')
                      except Exception as exc:
                          failures.append(f'{name}@{width}: browser failure: {exc}')
                      finally:
                          page.close()
              browser.close()

          if failures:
              print('\n'.join(f'FAIL: {item}' for item in failures))
              raise SystemExit(1)
          print(f'PASS: {len(pages) * len(widths)} responsive viewport checks completed with zero findings.')
          PY

