name: Analytics Smart Consent One-Time Patch

on:
  push:
    branches:
      - analytics-smart-consent-fix
    paths:
      - .github/workflows/analytics-smart-consent-once.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Patch analytics consent logic
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('assets/js/main.js')
          text = path.read_text(encoding='utf-8')

          old_mount = """  const mountChoices=()=>{\n"""
          helper = """  const shouldAutoEnableAnalytics=()=>{\n    try{return Intl.DateTimeFormat().resolvedOptions().timeZone==='Asia/Karachi'}catch(_){return false}\n  };\n\n  const mountChoices=()=>{\n"""
          if old_mount not in text:
              raise SystemExit('mountChoices marker not found')
          text = text.replace(old_mount, helper, 1)

          old_choice = """    const choice=readChoice();\n    if(choice==='granted'){loadAnalytics();hide()}\n    else if(choice==='denied'){denyAnalytics();hide()}\n"""
          new_choice = """    const choice=readChoice();\n    if(choice==='granted'||(!choice&&shouldAutoEnableAnalytics())){loadAnalytics();hide()}\n    else if(choice==='denied'){denyAnalytics();hide()}\n"""
          if old_choice not in text:
              raise SystemExit('stored-choice block not found')
          text = text.replace(old_choice, new_choice, 1)

          old_initial = """  const initialChoice=readChoice();\n  if(initialChoice==='granted')loadAnalytics();\n  else denyAnalytics();\n"""
          new_initial = """  const initialChoice=readChoice();\n  if(initialChoice==='granted'||(!initialChoice&&shouldAutoEnableAnalytics()))loadAnalytics();\n  else denyAnalytics();\n"""
          if old_initial not in text:
              raise SystemExit('initial-choice block not found')
          text = text.replace(old_initial, new_initial, 1)

          old_copy = 'Analytics stays off unless you allow it.'
          new_copy = 'You can allow or decline optional analytics at any time.'
          if old_copy not in text:
              raise SystemExit('consent copy not found')
          text = text.replace(old_copy, new_copy, 1)

          path.write_text(text, encoding='utf-8')
          PY

          node --check assets/js/main.js
          git diff --check

      - name: Commit verified patch
        shell: bash
        run: |
          if git diff --quiet -- assets/js/main.js; then
            echo 'No changes produced.'
            exit 1
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add assets/js/main.js
          git commit -m 'privacy: smart analytics consent for Pakistan [skip ci]'
          git push origin HEAD:analytics-smart-consent-fix
