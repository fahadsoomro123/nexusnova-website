name: SEO Audit Studio Isolated Review Preview

on:
  push:
    branches:
      - preview/seo-audit-studio-approval
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: seo-audit-studio-review-preview
  cancel-in-progress: false

jobs:
  deploy-isolated-review:
    name: Deploy isolated, mock-only review environment
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out the review website branch
        uses: actions/checkout@v4
      - name: Require read-only access to the private backend repository
        shell: bash
        env:
          BACKEND_REPO_READ_TOKEN: ${{ secrets.BACKEND_REPO_READ_TOKEN }}
        run: |
          if [[ -z "$BACKEND_REPO_READ_TOKEN" ]]; then
            echo "::error::Add BACKEND_REPO_READ_TOKEN as a GitHub Actions secret in nexusnova-website. It must have read-only Contents access to the private backend repository."
            exit 1
          fi
      - name: Check out the exact backend PR commit
        uses: actions/checkout@v4
        with:
          repository: fahadsoomro123/nexusnova-seo-audit-studio-backend
          ref: 175e9a83b995563d0afc328c31c2ff5f3a34e017
          token: ${{ secrets.BACKEND_REPO_READ_TOKEN }}
          path: .review-backend
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Deploy preview Worker, isolated database, and static Pages preview
        shell: bash
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          AUDIT_PREVIEW_OWNER_TOKEN: ${{ secrets.AUDIT_PREVIEW_OWNER_TOKEN }}
        run: bash .github/scripts/deploy-seo-audit-studio-review-preview.sh
