name: SEO Audit Studio Isolated Review Preview

on:
  push:
    branches:
      - preview/seo-audit-studio-approval
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: seo-audit-studio-review-preview
  cancel-in-progress: false

jobs:
  deploy-isolated-review:
    name: Deploy isolated, mock-only review environment
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out the review website branch
        uses: actions/checkout@v4
      - name: Require read-only access to the private backend repository
        shell: bash
        env:
          BACKEND_REPO_READ_TOKEN: ${{ secrets.BACKEND_REPO_READ_TOKEN }}
        run: |
          if [[ -z "$BACKEND_REPO_READ_TOKEN" ]]; then
            echo "::error::Add BACKEND_REPO_READ_TOKEN as a GitHub Actions secret in nexusnova-website. It must have read-only Contents access to the private backend repository."
            exit 1
          fi
      - name: Check out the exact backend PR commit
        uses: actions/checkout@v4
        with:
          repository: fahadsoomro123/nexusnova-seo-audit-studio-backend
          ref: c1781fefcff6c9bf4fd3a65f4db6bb980983dad7
          token: ${{ secrets.BACKEND_REPO_READ_TOKEN }}
          path: .review-backend
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install and test the exact isolated audit Worker
        shell: bash
        run: |
          set -Eeuo pipefail
          cd .review-backend
          npm ci
          npm test
      - name: Diagnose PageSpeed OAuth using the existing Google service account
        if: github.event_name == 'workflow_dispatch'
        shell: bash
        continue-on-error: true
        env:
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
        run: |
          set -Eeuo pipefail
          node --input-type=module <<'NODE'
          import {createSign} from 'node:crypto';
          const raw = process.env.GOOGLE_SERVICE_ACCOUNT_JSON;
          if (!raw) {
            console.log('credential_present=false');
            process.exit(2);
          }
          let sa;
          try { sa = JSON.parse(raw); } catch {
            console.log('credential_json_valid=false');
            process.exit(2);
          }
          if (!sa.client_email || !sa.private_key) {
            console.log('credential_fields_valid=false');
            process.exit(2);
          }
          const b64url = (v) => Buffer.from(typeof v === 'string' ? v : JSON.stringify(v)).toString('base64url');
          const now = Math.floor(Date.now() / 1000);
          const aud = sa.token_uri || 'https://oauth2.googleapis.com/token';
          const head = b64url({alg:'RS256',typ:'JWT'});
          const body = b64url({iss:sa.client_email,scope:'openid',aud,iat:now,exp:now+3600});
          const data = head + '.' + body;
          const signer = createSign('RSA-SHA256');
          signer.update(data);
          signer.end();
          const assertion = data + '.' + signer.sign(sa.private_key).toString('base64url');
          const form = new URLSearchParams({grant_type:'urn:ietf:params:oauth:grant-type:jwt-bearer',assertion});
          const auth = await fetch(aud,{method:'POST',headers:{'content-type':'application/x-www-form-urlencoded'},body:form,signal:AbortSignal.timeout(20000)});
          const authBody = await auth.json().catch(()=>({}));
          console.log('credential_present=true');
          console.log('oauth_http=' + auth.status);
          if (!auth.ok || !authBody.access_token) {
            console.log('oauth_error=' + String(authBody.error || 'token_exchange_failed'));
            console.log('oauth_error_description=' + String(authBody.error_description || '').slice(0,240));
            process.exit(3);
          }
          let failures=0;
          for (const strategy of ['mobile','desktop']) {
            const url=new URL('https://www.googleapis.com/pagespeedonline/v5/runPagespeed');
            url.searchParams.set('url','https://nexusnovatools.com/');
            url.searchParams.set('strategy',strategy);
            url.searchParams.set('category','performance');
            try {
              const r=await fetch(url,{headers:{authorization:'Bearer '+authBody.access_token,accept:'application/json'},signal:AbortSignal.timeout(90000)});
              const b=await r.json().catch(()=>({}));
              if(!r.ok||!b.lighthouseResult?.categories?.performance) {
                failures++;
                console.log(strategy+'_http='+r.status);
                console.log(strategy+'_api_error='+String(b.error?.message||b.error?.status||'no_lighthouse_result').slice(0,240));
                continue;
              }
              const lh=b.lighthouseResult;
              console.log(strategy+'_http='+r.status);
              console.log(strategy+'_performance_score='+Math.round(lh.categories.performance.score*100));
              console.log(strategy+'_lcp='+String(lh.audits?.['largest-contentful-paint']?.displayValue||'N/A'));
              console.log(strategy+'_cls='+String(lh.audits?.['cumulative-layout-shift']?.displayValue||'N/A'));
              console.log(strategy+'_tbt='+String(lh.audits?.['total-blocking-time']?.displayValue||'N/A'));
            } catch(e) {
              failures++;
              console.log(strategy+'_network_error='+String(e.name||'request_failed'));
            }
          }
          if(failures) process.exit(4);
          console.log('pagespeed_oauth_live_test=passed');
          NODE
      - name: Deploy preview Worker, isolated database, and static Pages preview
        shell: bash
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          AUDIT_PREVIEW_OWNER_TOKEN: ${{ secrets.AUDIT_PREVIEW_OWNER_TOKEN }}
          PAGESPEED_API_KEY: ${{ secrets.PAGESPEED_API_KEY }}
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
        run: bash .github/scripts/deploy-seo-audit-studio-review-preview-v2.sh
      - name: Smoke-test deployed preview health, PageSpeed and owner authentication
        shell: bash
        env:
          AUDIT_PREVIEW_OWNER_TOKEN: ${{ secrets.AUDIT_PREVIEW_OWNER_TOKEN }}
          REVIEW_WORKER_ORIGIN: https://nexusnova-audit-studio-review.fahadsoomro123.workers.dev
          REVIEW_PAGE_ORIGIN: https://review.nexusnova-seo-audit-studio-review.pages.dev
        run: |
          set -Eeuo pipefail
          health_status="$(curl -sS -o "$RUNNER_TEMP/audit-health.json" -w '%{http_code}' "$REVIEW_WORKER_ORIGIN/api/health")"
          [[ "$health_status" == "200" ]] || { echo "::error::Review Worker health HTTP $health_status"; exit 1; }
          jq -e '.ok == true and .database == true and .environment == "sandbox"' "$RUNNER_TEMP/audit-health.json" >/dev/null
          config_status="$(curl -sS -o "$RUNNER_TEMP/audit-config.json" -w '%{http_code}' "$REVIEW_WORKER_ORIGIN/api/config")"
          [[ "$config_status" == "200" ]] || { echo "::error::Review Worker config HTTP $config_status"; exit 1; }
          jq -e '.ok == true and .environment == "sandbox" and .productionMode == false and .livePaymentsEnabled == false and .provider == "mock" and .pageSpeedConfigured == true and .pageSpeedMode == "service-account-oauth"' "$RUNNER_TEMP/audit-config.json" >/dev/null
          [[ -n "$AUDIT_PREVIEW_OWNER_TOKEN" ]] || { echo "::error::Owner preview token is missing"; exit 1; }
          owner_status="$(curl -sS -o "$RUNNER_TEMP/audit-owner.json" -w '%{http_code}' -H "X-Owner-Admin-Token: $AUDIT_PREVIEW_OWNER_TOKEN" "$REVIEW_WORKER_ORIGIN/api/admin/promotions")"
          [[ "$owner_status" == "200" ]] || { echo "::error::Authenticated owner route HTTP $owner_status"; exit 1; }
          jq -e '.ok == true' "$RUNNER_TEMP/audit-owner.json" >/dev/null
          homepage_status="$(curl -sS -L -o /dev/null -w '%{http_code}' "$REVIEW_PAGE_ORIGIN/")"
          audit_status="$(curl -sS -L -o /dev/null -w '%{http_code}' "$REVIEW_PAGE_ORIGIN/seo-audit-studio.html")"
          [[ "$homepage_status" == "200" && "$audit_status" == "200" ]] || { echo "::error::Review Pages smoke test failed: homepage=$homepage_status audit=$audit_status"; exit 1; }
          echo "Review smoke tests passed: health=$health_status config=$config_status owner=$owner_status homepage=$homepage_status audit=$audit_status"
          echo "Verified mode: sandbox/mock; service-account PageSpeed configured; production payments disabled."
