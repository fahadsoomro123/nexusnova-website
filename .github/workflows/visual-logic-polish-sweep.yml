name: NexusNova Visual and Logic Polish Sweep

on:
  push:
    branches: [main]
    paths:
      - ".github/scripts/sitewide_visual_logic_audit.py"
      - ".github/workflows/visual-logic-polish-sweep.yml"
      - "**/*.html"
      - "**/*.css"
      - "assets/**/*.js"
      - "sitemap.xml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: nexusnova-visual-logic-polish
  cancel-in-progress: true

jobs:
  sitewide-visual-logic-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - name: Checkout exact commit
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 1

      - name: Set up Node 22
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22"

      - name: JavaScript and repository syntax check
        run: npm run check

      - name: Full repository test suite
        run: npm test

      - name: Set up Python 3.12
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"

      - name: Install Chromium for visual and interaction audit
        run: |
          python -m pip install --disable-pip-version-check playwright
          python -m playwright install --with-deps chromium

      - name: Start static site
        shell: bash
        run: |
          set -euo pipefail
          python -m http.server 8000 --bind 127.0.0.1 >/tmp/nexusnova-polish-site.log 2>&1 &
          for attempt in {1..20}; do
            if curl --fail --silent http://127.0.0.1:8000/ >/dev/null; then exit 0; fi
            sleep 1
          done
          cat /tmp/nexusnova-polish-site.log
          exit 1

      - name: Audit all 108 tools and 100 articles
        env:
          GITHUB_SHA: ${{ github.sha }}
        run: python .github/scripts/sitewide_visual_logic_audit.py

      - name: Upload screenshots and machine-readable audit report
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: nexusnova-sitewide-visual-logic-${{ github.sha }}
          path: |
            quality-artifacts/sitewide-visual-logic-audit.json
            quality-artifacts/sitewide-screenshots/
          if-no-files-found: warn
          retention-days: 30
