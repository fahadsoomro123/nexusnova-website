name: Lock Support Preview Sitewide

on:
  push:
    branches:
      - nexusnova-support-preview
  workflow_dispatch:

permissions:
  contents: write

jobs:
  inject-support-runtime:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout preview branch
        uses: actions/checkout@v4
        with:
          ref: nexusnova-support-preview

      - name: Inject and cache-bust support runtime across site pages
        shell: python
        run: |
          from pathlib import Path
          import re

          root = Path(".")
          marker = 'id="nexusnova-support-direct-loader"'
          runtime = "assets/js/nexusnova-support-preview.js?v=20261009-sitewide-c8"

          skipped_names = {
              "support-benchmark-home-preview.html",
              "support-collage-full-page-preview.html",
              "support-collage-home-preview.html",
              "support-concept-02-preview.html",
              "support-concept-03-preview.html",
              "support-concept-04-preview.html",
              "support-concept-04-preview-v2.html",
              "support-concept-04-preview-v3.html",
              "support-direct-one-click-preview.html",
              "support-flagship-research-preview.html",
              "support-footer-click-state-preview.html",
              "support-footer-popover-preview.html",
              "support-footer-premium-preview.html",
              "support-full-page-preview.html",
              "support-full-page-preview-v2.html",
              "support-full-page-preview-v3.html",
              "support-preview-simple.html",
              "support-tile-preview.html",
          }

          changed = []
          for path in sorted(root.rglob("*.html")):
              rel = path.relative_to(root).as_posix()

              if rel.startswith(("ota/", ".git/", ".github/")):
                  continue
              if path.name in skipped_names:
                  continue

              depth = len(path.parts) - 1
              prefix = "../" * depth
              desired_src = f"{prefix}{runtime}"

              raw = path.read_bytes()
              bom = raw.startswith(b"\xef\xbb\xbf")
              text = raw.decode("utf-8-sig" if bom else "utf-8")
              original_text = text

              if marker in text:
                  pattern = r'(<script\s+id="nexusnova-support-direct-loader"\s+src=")[^"]+(" defer></script>)'
                  text, replacements = re.subn(
                      pattern,
                      lambda match: match.group(1) + desired_src + match.group(2),
                      text
                  )
                  if replacements and text != original_text:
                      path.write_bytes((b"\xef\xbb\xbf" if bom else b"") + text.encode("utf-8"))
                      changed.append(rel + " [cache-busted]")
                  continue

              if "</body>" not in text.lower():
                  continue

              tag = f'\n<script {marker} src="{desired_src}" defer></script>\n'
              body_index = text.lower().rfind("</body>")
              text = text[:body_index] + tag + text[body_index:]
              path.write_bytes((b"\xef\xbb\xbf" if bom else b"") + text.encode("utf-8"))
              changed.append(rel)

          print(f"Support runtime injected/cache-busted on {len(changed)} site pages.")
          for item in changed:
              print(item)

      - name: Commit sitewide support lock
        shell: bash
        run: |
          git config user.name "NexusNova Support Bot"
          git config user.email "noreply@nexusnovatools.com"
          if git diff --quiet; then
            echo "No HTML changes required."
            exit 0
          fi
          git add -- '*.html'
          git commit -m "Lock support control sitewide [skip ci]"
          git push origin nexusnova-support-preview
