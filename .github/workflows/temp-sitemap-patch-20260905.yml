name: Temporary Sitemap Patch 20260905
on:
  push:
    branches:
      - audit/top25-actual-findings-20260905
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: audit/top25-actual-findings-20260905
      - name: Patch sitemap safely
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('sitemap.xml')
          s = p.read_text(encoding='utf-8')
          target = 'https://nexusnovatools.com/articles/github-copilot-global-model-policy-enforces-default-states.html'
          if target not in s:
              row = f'  <url><loc>{target}</loc><lastmod>2026-09-05</lastmod></url>\n'
              if '</urlset>' not in s:
                  raise SystemExit('sitemap closing tag missing')
              s = s.replace('</urlset>', row + '</urlset>', 1)
          replacements = {
              '<url><loc>https://nexusnovatools.com/gaming-sensitivity-converter.html</loc><lastmod>2026-08-23</lastmod></url>': '<url><loc>https://nexusnovatools.com/gaming-sensitivity-converter.html</loc><lastmod>2026-09-05</lastmod></url>',
              '<url><loc>https://nexusnovatools.com/avif-to-jpg.html</loc><lastmod>2026-08-24</lastmod></url>': '<url><loc>https://nexusnovatools.com/avif-to-jpg.html</loc><lastmod>2026-09-05</lastmod></url>',
          }
          for old, new in replacements.items():
              if old in s:
                  s = s.replace(old, new, 1)
          p.write_text(s, encoding='utf-8')
          print('Sitemap patched and reviewed article included.')
          PY
      - name: Commit sitemap only
        shell: bash
        run: |
          if git diff --quiet -- sitemap.xml; then
            echo 'No sitemap change required.'
            exit 0
          fi
          git config user.name 'nexusnova-audit[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add sitemap.xml
          git commit -m 'seo: add reviewed Copilot article to sitemap'
          git push origin HEAD:audit/top25-actual-findings-20260905
