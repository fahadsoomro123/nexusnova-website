name: Repair footer preview asset paths

on:
  push:
    branches:
      - nexusnova-flagship-optimization

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact optimization branch
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 1

      - name: Normalize footer assets across every HTML surface
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          root = Path(".")
          changed = []
          css_before = 0
          logo_before = 0

          for path in sorted(root.rglob("*.html")):
              if any(part in {".git", "node_modules"} for part in path.parts):
                  continue

              text = path.read_text(encoding="utf-8")
              depth = len(path.parent.parts)
              prefix = "../" * depth
              css_target = prefix + "assets/css/footer-social.css"
              logo_target = prefix + "assets/logo.png"

              old_text = text
              css_hits = text.count('href="/assets/css/footer-social.css"')
              logo_hits = text.count('src="/assets/logo.png"')
              css_before += css_hits
              logo_before += logo_hits

              text = text.replace('href="/assets/css/footer-social.css"', f'href="{css_target}"')
              text = text.replace('src="/assets/logo.png"', f'src="{logo_target}"')

              if text != old_text:
                  path.write_text(text, encoding="utf-8")
                  changed.append(str(path))

          if not changed:
              raise SystemExit("No HTML surfaces required normalization.")

          remaining_css = []
          remaining_logo = []
          for path in root.rglob("*.html"):
              if any(part in {".git", "node_modules"} for part in path.parts):
                  continue
              text = path.read_text(encoding="utf-8")
              if 'href="/assets/css/footer-social.css"' in text:
                  remaining_css.append(str(path))
              if 'src="/assets/logo.png"' in text:
                  remaining_logo.append(str(path))

          if remaining_css or remaining_logo:
              print("Remaining absolute footer CSS:", remaining_css)
              print("Remaining absolute logo:", remaining_logo)
              raise SystemExit(1)

          print(f"Changed HTML files: {len(changed)}")
          print(f"Normalized footer stylesheet references: {css_before}")
          print(f"Normalized logo references: {logo_before}")
          PY

      - name: Preserve protected trees
        shell: bash
        run: |
          test ! -e cloudflare/safepay-webhook-worker.js.changed || exit 1
          test -z "$(git diff --name-only | grep -E '^(cloudflare/safepay-webhook-worker\.js|cloudflare/telegram-bot/|assets/js/fbr-atl-status-checker\.js|assets/logo\.png|robots\.txt|sitemap[^/]*$)' || true)"

      - name: Remove temporary repair workflow
        run: rm -f .github/workflows/repair-footer-preview-paths.yml

      - name: Commit and push repair
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --quiet && { echo "No repair diff"; exit 1; }
          git commit -m "fix: normalize footer preview asset paths [skip ci]"
          git push origin HEAD:nexusnova-flagship-optimization
