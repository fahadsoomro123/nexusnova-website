name: Premium Social Fallback Validation

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/scripts/premium_social_resilient.py'
      - '.github/scripts/premium_social_campaign.py'
      - '.github/workflows/premium-social-daily.yml'
      - '.github/workflows/premium-social-validation.yml'
      - 'tests/test_premium_social_resilient.py'

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - name: Install image dependency
        run: python -m pip install --disable-pip-version-check pillow
      - name: Compile social creative code
        run: |
          python -m py_compile .github/scripts/premium_social_campaign.py
          python -m py_compile .github/scripts/premium_social_resilient.py
          python -m py_compile tests/test_premium_social_resilient.py
      - name: Test topic-matched outage fallback
        run: python tests/test_premium_social_resilient.py
