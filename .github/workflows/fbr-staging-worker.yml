name: NexusNova FBR Staging Worker

on:
  push:
    branches: [nexusnova-clean-redesign]
    paths:
      - 'cloudflare/fbr-staging/**'
      - 'assets/js/fbr-atl-status-checker.js'
      - '.github/workflows/fbr-staging-worker.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: cloudflare/wrangler-action@953926a2e2182532811c01a25e53647d93bf07c0
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: cloudflare/fbr-staging
          command: deploy
      - name: Smoke-test staging CORS proxy
        shell: bash
        run: |
          set -euo pipefail
          base='https://nexusnova-fbr-staging.fahadsoomro123.workers.dev/api/fbr/atl-status'
          sleep 10
          curl --fail --silent --show-error --max-time 20 -X OPTIONS \
            -H 'Origin: https://rawcdn.githack.com' \
            -H 'Access-Control-Request-Method: POST' \
            -H 'Access-Control-Request-Headers: content-type' \
            "$base" >/dev/null
          body_file="$(mktemp)"
          code="$(curl --silent --show-error --max-time 20 -X POST \
            -H 'Origin: https://rawcdn.githack.com' \
            -H 'Content-Type: application/json' \
            -o "$body_file" -w '%{http_code}' \
            -d '{"identifierType":"CNIC","identifier":"123"}' \
            "$base")"
          echo "POST_HTTP_CODE=$code"
          cat "$body_file"
          echo
          python -c "import json,sys; json.load(open(sys.argv[1],encoding='utf-8')); print('FBR staging proxy returned valid JSON.')" "$body_file"
