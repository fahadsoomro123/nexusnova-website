name: NexusNova FBR Staging Worker

on:
  push:
    branches: [nexusnova-clean-redesign]
    paths:
      - 'cloudflare/fbr-staging/**'
      - 'assets/js/fbr-atl-status-checker.js'
      - '.github/workflows/fbr-staging-worker.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: cloudflare/wrangler-action@953926a2e2182532811c01a25e53647d93bf07c0
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: cloudflare/fbr-staging
          command: deploy
      - name: Smoke-test live FBR token discovery and staging CORS
        shell: bash
        run: |
          set -euo pipefail
          base='https://nexusnova-fbr-staging.fahadsoomro123.workers.dev'
          sleep 10
          curl --fail --silent --show-error --max-time 30 -H 'Origin: https://rawcdn.githack.com' "$base/health"
          echo
          body_file="$(mktemp)"
          code="$(curl --silent --show-error --max-time 20 -X POST -H 'Origin: https://rawcdn.githack.com' -H 'Content-Type: application/json' -o "$body_file" -w '%{http_code}' -d '{"identifierType":"CNIC","identifier":"123"}' "$base/api/fbr/atl-status")"
          echo "POST_HTTP_CODE=$code"
          cat "$body_file"
          echo
          test "$code" = '400'

      - name: End-to-end browser test for FBR checker
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check playwright
          python -m playwright install chromium
          export FBR_PREVIEW_URL="https://rawcdn.githack.com/fahadsoomro123/nexusnova-website/${GITHUB_SHA}/fbr-atl-status-checker.html"
          python - <<'PY'
          import os
          from playwright.sync_api import sync_playwright
          url=os.environ['FBR_PREVIEW_URL']
          with sync_playwright() as p:
              b=p.chromium.launch(headless=True)
              page=b.new_page()
              page.goto(url, wait_until='networkidle', timeout=30000)
              page.fill('#atl-identifier','1234512345671')
              page.click('button[type="submit"]')
              page.wait_for_function("document.querySelector('[data-atl-result]')?.innerText && !document.querySelector('[data-atl-result]').innerText.includes('Checking FBR')", timeout=30000)
              result=page.locator('[data-atl-result]').inner_text()
              print('FBR E2E RESULT:', result)
              if any(x in result for x in ['Verification unavailable','Verification timed out','Failed to fetch']):
                  raise SystemExit('FBR browser E2E failed')
              if not any(x in result for x in ['ACTIVE TAXPAYER','LATE FILER','NOT ACTIVE / NON-ATL','NO ATL RECORD','FBR RESULT']):
                  raise SystemExit('FBR browser E2E returned an unexpected result')
              b.close()
          PY
