name: NexusNova Master Sprint Discovery Hotfix
on:
  push:
    branches: [master-completion-sprint-20260902]
    paths: ['.github/workflows/master-sprint-discovery-hotfix.yml']
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: master-completion-sprint-20260902
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Patch discovery pages
        run: |
          node <<'NODE'
          const fs=require('fs');
          const rw=(file,fn)=>{const before=fs.readFileSync(file,'utf8');const after=fn(before);if(after===before)throw new Error(`No change applied to ${file}`);fs.writeFileSync(file,after)};
          rw('index.html',s=>s.replace(/(<a class="home-tool" data-home-tool href="zakat-calculator-pakistan\.html">[\s\S]*?<\/a>)(<\/div><div class="hero-actions" style="margin-top:18px"><a class="btn btn-primary" href="live\.html">)/,`$1<a class="home-tool" data-home-tool href="prayer-times-qibla-pakistan.html"><b>Prayer Times & Qibla</b><span>Pakistan city prayer calculations with Karachi 18° method, Hanafi/Shafi Asr and Qibla direction.</span></a><a class="home-tool" data-home-tool href="pakistan-public-holidays-2026.html"><b>Pakistan Public Holidays 2026</b><span>Federal holiday dates with later moon-dependent Cabinet Division updates clearly separated.</span></a>$2`));
          rw('new-tools.html',s=>s.replace(/(<a class="article-card" href="zakat-calculator-pakistan\.html">[\s\S]*?<\/a>)(<a class="article-card" href="decision-matrix-calculator\.html">)/,`$1<a class="article-card" href="prayer-times-qibla-pakistan.html"><span class="tag">PAKISTAN · PRAYER</span><h3>Prayer Times & Qibla</h3><p>Calculate major Pakistan-city prayer times with a labelled Karachi method and Qibla direction.</p><span class="card-link">Calculate prayer times →</span></a><a class="article-card" href="pakistan-public-holidays-2026.html"><span class="tag">PAKISTAN · 2026</span><h3>Pakistan Public Holidays</h3><p>Check federal 2026 holiday dates and later Cabinet Division moon-dependent updates.</p><span class="card-link">View holidays →</span></a><a class="article-card" href="dns-lookup.html"><span class="tag">NETWORK</span><h3>DNS Lookup</h3><p>Query common public DNS records through Cloudflare 1.1.1.1 DNS-over-HTTPS.</p><span class="card-link">Check DNS →</span></a><a class="article-card" href="ip-cidr-calculator.html"><span class="tag">NETWORK · LOCAL</span><h3>IPv4 CIDR Calculator</h3><p>Calculate network, broadcast, masks and host ranges locally in your browser.</p><span class="card-link">Calculate subnet →</span></a><a class="article-card" href="website-reachability-checker.html"><span class="tag">NETWORK</span><h3>Website Reachability Checker</h3><p>Run a browser-level reachability check without pretending to expose hidden HTTP or TLS details.</p><span class="card-link">Check reachability →</span></a>$2`).replace(/numberOfItems":9/g,'numberOfItems":14').replace(/Nine focused tools/g,'Fourteen focused tools'));
          rw('developer-tools.html',s=>s.replace('<section class="section"><div class="container article"><h2>Why keep these tools local?</h2>',`<section class="section"><div class="container"><div class="section-head"><div><span class="kicker">NETWORK DIAGNOSTICS</span><h2>DNS, subnet and reachability tools</h2></div><p>Transparent network utilities that clearly state what a static browser can and cannot inspect.</p></div><div class="article-grid"><a class="article-card" href="dns-lookup.html"><span class="tag">DNS</span><h3>DNS Lookup</h3><p>Query A, AAAA, MX, TXT, CNAME, NS and CAA records using Cloudflare 1.1.1.1 DoH.</p><span class="card-link">Open DNS Lookup →</span></a><a class="article-card" href="ip-cidr-calculator.html"><span class="tag">IP / CIDR</span><h3>IPv4 CIDR Calculator</h3><p>Calculate subnet boundaries and masks without sending the address to an API.</p><span class="card-link">Open CIDR Calculator →</span></a><a class="article-card" href="website-reachability-checker.html"><span class="tag">WEB</span><h3>Website Reachability</h3><p>Check browser-level reachability with explicit CORS, HTTP-status and TLS limitations.</p><span class="card-link">Open Reachability Check →</span></a></div></div></section><section class="section"><div class="container article"><h2>Why keep these tools local?</h2>`));
          NODE
          rm .github/workflows/master-sprint-discovery-hotfix.yml
      - name: Validate
        run: npm run check && npm test
      - name: Commit discovery changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html new-tools.html developer-tools.html .github/workflows/master-sprint-discovery-hotfix.yml
          git commit -m "feat: surface prayer and network tools across discovery pages"
          git push origin HEAD:master-completion-sprint-20260902
