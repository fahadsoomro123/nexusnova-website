name: AdSense Tool Content Quality

on:
  pull_request:
    branches: [main]
    paths:
      - '*.html'
      - 'scripts/*.mjs'
      - '.github/workflows/adsense-tier1-remediation.yml'
      - 'sitemap.xml'
      - 'robots.txt'
      - 'scripts/validate-tier1-remediation.mjs'
      - 'tests/adsense-content-quality.test.cjs'

permissions:
  contents: read

jobs:
  validate-tool-content:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      # This workflow validates reviewed pages only. It must never generate
      # boilerplate copy, rewrite the homepage, regenerate sitemaps or push commits.
      - name: Validate AdSense content remediation
        run: node scripts/validate-tier1-remediation.mjs
