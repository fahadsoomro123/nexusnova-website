name: NexusNova One-Time Clean Site Audit Fix V3

on:
  push:
    branches:
      - clean-site-audit-20260903
    paths:
      - .github/workflows/clean-site-audit-20260903-v3.yml

permissions:
  contents: write

jobs:
  clean:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout cleanup branch
        uses: actions/checkout@v4
        with:
          ref: clean-site-audit-20260903
          fetch-depth: 0
      - name: Apply transformation
        run: python3 scripts/clean_site_audit_20260903.py
      - name: Syntax and diff checks
        run: |
          node --check assets/js/main.js
          node --check assets/js/popular-tools.js
          git diff --check
      - name: Commit cleaned branch
        run: |
          git config user.name 'nexusnova-cleanup[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git status --short
          git commit -m 'fix: clean homepage trust copy and core tool UX [skip ci]'
          git push origin HEAD:clean-site-audit-20260903
