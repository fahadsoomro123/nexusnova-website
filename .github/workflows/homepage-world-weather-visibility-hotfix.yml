name: Homepage World Weather Visibility Hotfix

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/homepage-world-weather-visibility-hotfix.yml
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: homepage-world-weather-visibility-hotfix
  cancel-in-progress: false

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Patch homepage weather card
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path=Path('index.html')
          text=path.read_text(encoding='utf-8')
          old='<a class="home-tool" data-home-tool href="weather-live.html"><b>Pakistan Weather</b><span>Forecasts for Karachi, Lahore, Islamabad, Peshawar, Quetta and Multan.</span></a>'
          new='<a class="home-tool" data-home-tool href="weather-live.html"><b>Worldwide Weather + Satellite</b><span>Search any city worldwide, view global satellite imagery and official-source radar where coverage exists.</span></a>'
          if old not in text:
              raise SystemExit('Expected Pakistan Weather homepage card was not found; refusing blind patch')
          if text.count(old) != 1:
              raise SystemExit(f'Expected exactly one weather card, found {text.count(old)}')
          path.write_text(text.replace(old,new),encoding='utf-8')
          print('Homepage worldwide weather card patched.')
          PY
      - name: Validate syntax and tests
        run: |
          npm run check
          npm test
      - name: Require zero severe static SEO findings
        run: |
          python3 .github/scripts/site_quality_audit.py
          python3 - <<'PY'
          import json
          from pathlib import Path
          report=json.loads(Path('site-quality-report.json').read_text(encoding='utf-8'))
          severe=report.get('severe',[])
          if severe:
              raise SystemExit('\n'.join(severe))
          print('Static audit severe findings: 0')
          PY
      - name: Commit homepage and self-clean workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/homepage-world-weather-visibility-hotfix.yml
          git add index.html
          git commit -m "home: surface worldwide weather satellite and radar"
          for attempt in 1 2 3 4 5; do
            if git push origin HEAD:main; then
              echo "Published on attempt $attempt"
              exit 0
            fi
            git fetch origin main
            git rebase origin/main
          done
          echo "Could not publish safely after 5 normal push attempts" >&2
          exit 1
