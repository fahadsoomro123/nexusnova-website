name: one-time AdSense index-surface reduction

on:
  push:
    branches:
      - adsense-low-value-remediation-20260920

permissions:
  contents: write

jobs:
  reduce-index-surface:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: adsense-low-value-remediation-20260920

      - name: Reduce low-value index surface
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          import xml.etree.ElementTree as ET

          ROOT = Path('.')
          SITEMAP = ROOT / 'sitemap.xml'

          KEEP = {
              'index.html',
              'tools.html','categories.html','calculator-tools.html','image-tools.html',
              'pdf-tools.html','productivity-tools.html','developer-tools.html',
              'network-tools.html','pakistan-tools.html','articles.html','guides.html',
              'about.html','editorial-policy.html','editorial-team.html','tool-methodology.html',
              'privacy.html','terms.html','contact.html','disclaimer.html','faq.html',
              'percentage-calculator.html','age-calculator.html','date-difference-calculator.html',
              'unit-converter.html','word-counter.html','password-generator.html',
              'image-compressor.html','image-to-text-ocr.html','merge-pdf.html',
              'ai-prompt-builder.html','dns-lookup.html','decision-matrix-calculator.html',
              'paper-size-in-pixels.html',
          }

          def keep(path):
              return path in KEEP or path.startswith('articles/') or path.startswith('guides/')

          root = ET.parse(SITEMAP)
          ns = {'sm':'http://www.sitemaps.org/schemas/sitemap/0.9'}
          urls = []
          for node in root.getroot().findall('sm:url', ns):
              loc = node.find('sm:loc', ns)
              if loc is not None and loc.text:
                  urls.append(loc.text.replace('https://nexusnovatools.com/','',1) or 'index.html')

          changed = []
          for rel in urls:
              if keep(rel):
                  continue
              path = ROOT / rel
              if not path.is_file() or path.suffix.lower() != '.html':
                  continue
              raw = path.read_text(encoding='utf-8', errors='ignore')
              pattern = re.compile(r'<meta\\s+([^>]*?)>', re.I)
              found = False
              def meta_repl(match):
                  nonlocal found
                  attrs = match.group(1)
                  if not re.search(r'\\bname=["\\']robots["\\']', attrs, re.I):
                      return match.group(0)
                  found = True
                  if re.search(r'\\bcontent=["\\'][^"\\']*["\\']', attrs, re.I):
                      attrs = re.sub(
                          r'(\\bcontent=["\\'])[^"\\']*(["\\'])',
                          r'\\1noindex,follow,max-image-preview:large\\2',
                          attrs, count=1, flags=re.I
                      )
                  else:
                      attrs += ' content="noindex,follow,max-image-preview:large"'
                  return '<meta ' + attrs + '>'
              updated = pattern.sub(meta_repl, raw, count=50)
              if not found:
                  updated = re.sub(
                      r'(<head\\b[^>]*>)',
                      r'\\1<meta name="robots" content="noindex,follow,max-image-preview:large">',
                      raw, count=1, flags=re.I
                  )
              if updated != raw:
                  path.write_text(updated, encoding='utf-8')
                  changed.append(rel)

          for node in list(root.getroot().findall('sm:url', ns)):
              loc = node.find('sm:loc', ns)
              rel = (loc.text or '').replace('https://nexusnovatools.com/','',1) if loc is not None else ''
              if not keep(rel):
                  root.getroot().remove(node)

          ET.register_namespace('', 'http://www.sitemaps.org/schemas/sitemap/0.9')
          root.write(SITEMAP, encoding='utf-8', xml_declaration=True)

          (ROOT / 'robots.txt').write_text(
              'User-agent: *\\nAllow: /\\n\\n'
              'Sitemap: https://nexusnovatools.com/sitemap.xml\\n',
              encoding='utf-8'
          )

          kept = [x for x in urls if keep(x)]
          (ROOT / 'ADSENSE-LOW-VALUE-REMEDIATION-STARTED-2026-09-20.md').write_text(
              '# NexusNova Tools - AdSense Low-Value Content Remediation\\n\\n'
              'Started 20 September 2026.\\n\\n'
              f'- Sitemap URLs before this pass: {len(urls)}\\n'
              f'- HTML pages changed to noindex,follow: {len(changed)}\\n'
              f'- Sitemap URLs retained: {len(kept)}\\n'
              '- Article and guide folders retained for deeper editorial review.\\n'
              '- Duplicate sitemap discovery was removed from robots.txt.\\n\\n'
              'This is an evidence-driven reduction of index surface after the current AdSense rejection identified Low value content. It is not an approval guarantee and review should not be requested until live deployment, manual content review, and recrawl are complete.\\n',
              encoding='utf-8'
          )

          print(f'changed={len(changed)} retained={len(kept)}')

          PY

      - name: Commit remediation
        run: |
          git config user.name "nexusnova-remediation"
          git config user.email "nexusnova-remediation@users.noreply.github.com"
          git add -- '*.html' sitemap.xml robots.txt ADSENSE-LOW-VALUE-REMEDIATION-STARTED-2026-09-20.md
          git diff --cached --quiet || git commit -m "adsense: reduce low-value index surface"
          git push origin HEAD:adsense-low-value-remediation-20260920
