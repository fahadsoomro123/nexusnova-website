name: NexusNova AdSense Final Polish Once

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/adsense-final-polish-once.yml'

permissions:
  contents: write

jobs:
  polish:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Checkout latest main
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply locked UI and AdSense SEO fixes
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          import html as html_lib
          import json
          import re
          import xml.etree.ElementTree as ET

          ROOT = Path('.')
          TODAY = '2026-09-11'
          changed = []

          def write(path, text):
              p = ROOT / path
              old = p.read_text(encoding='utf-8')
              if old != text:
                  p.write_text(text, encoding='utf-8')
                  changed.append(path)

          def replace(path, old, new, label):
              p = ROOT / path
              text = p.read_text(encoding='utf-8')
              if new in text:
                  return
              if old not in text:
                  raise SystemExit(f'Missing expected text for {label} in {path}')
              write(path, text.replace(old, new, 1))

          # 1) Locked primary navigation: Gaming before auth; Labs/LIVE removed from reviewer path.
          main_path = ROOT / 'assets/js/main.js'
          main = main_path.read_text(encoding='utf-8')
          old_items = """    const items=[
              ['index.html','Home'],['tools.html','Tools'],['categories.html','Categories'],['labs.html','Labs'],['live.html','LIVE'],['articles.html','Articles'],['guides.html','Guides']
            ];"""
          new_items = """    const items=[
              ['index.html','Home'],['tools.html','Tools'],['categories.html','Categories'],['articles.html','Articles'],['guides.html','Guides'],['gaming.html','Gaming']
            ];"""
          if new_items not in main:
              if old_items not in main:
                  raise SystemExit('Primary-nav item block was not found in assets/js/main.js')
              main = main.replace(old_items, new_items, 1)
          main = re.sub(r"auth-header-state\.js(?:\?v=[^'\"`]+)?", 'auth-header-state.js?v=20260911-2', main)
          write('assets/js/main.js', main)

          # 2) Compact internal page heroes without changing the font family/design language.
          css_path = ROOT / 'assets/css/compact-2026.css'
          css = css_path.read_text(encoding='utf-8')
          old_css = '.page-hero{padding:36px 0 18px!important}.page-hero h1{font-size:clamp(34px,5vw,58px)!important;margin-top:10px!important}.page-hero p{font-size:15px!important;line-height:1.6!important;margin:10px 0!important;color:var(--muted)!important}'
          new_css = '.page-hero{padding:28px 0 14px!important}.page-hero h1{font-size:clamp(36px,4.2vw,52px)!important;line-height:1.08!important;margin-top:8px!important}.page-hero p{font-size:15px!important;line-height:1.55!important;margin:8px 0!important;color:var(--muted)!important}'
          if new_css not in css:
              if old_css not in css:
                  raise SystemExit('Desktop page-hero compact rule not found')
              css = css.replace(old_css, new_css, 1)
          old_mobile = '@media(max-width:720px){.nav{background:rgba(250,252,255,.98)!important}.page-hero{padding:26px 0 12px!important}.section{padding:26px 0!important}'
          new_mobile = '@media(max-width:720px){.nav{background:rgba(250,252,255,.98)!important}.page-hero{padding:22px 0 10px!important}.page-hero h1{font-size:clamp(34px,9vw,40px)!important;line-height:1.1!important}.section{padding:26px 0!important}'
          if new_mobile not in css:
              if old_mobile not in css:
                  raise SystemExit('Mobile page-hero compact rule not found')
              css = css.replace(old_mobile, new_mobile, 1)
          write('assets/css/compact-2026.css', css)

          # 3) Homepage reviewer path and positioning cleanup.
          index = (ROOT / 'index.html').read_text(encoding='utf-8')
          index = index.replace('<meta property="og:type" content="website"><meta property="og:site_name" content="NexusNova Tools"><meta property="og:title" content="NexusNova Tools — Useful Browser Tools, HumanProof, LIVE & Labs"><meta property="og:description" content="Free browser utilities, transparent live-data references and NexusNova HumanProof for sensitive digital actions.">', '<meta property="og:type" content="website"><meta property="og:site_name" content="NexusNova Tools"><meta property="og:title" content="NexusNova Tools — Useful Browser Tools & HumanProof"><meta property="og:description" content="Free browser utilities, practical guides and NexusNova HumanProof for sensitive digital actions.">')
          index = index.replace('<meta name="twitter:card" content="summary"><meta name="twitter:title" content="NexusNova Tools — Tools, HumanProof, LIVE & Labs"><meta name="twitter:description" content="Useful browser tools, live-data references, HumanProof and experimental NexusNova Labs.">', '<meta name="twitter:card" content="summary"><meta name="twitter:title" content="NexusNova Tools — Tools & HumanProof"><meta name="twitter:description" content="Useful browser tools, practical guides and NexusNova HumanProof for sensitive digital actions.">')
          index = index.replace('"description":"Free browser tools, NexusNova HumanProof, transparent LIVE data references and experimental Labs."', '"description":"Free browser tools, practical guides and NexusNova HumanProof for sensitive digital actions."')
          index = index.replace('<small>TOOLS • HUMANPROOF • LIVE</small>', '<small>TOOLS • HUMANPROOF • GUIDES</small>')
          index = index.replace('<nav class="nav" data-nav aria-label="Primary navigation"><a href="/" aria-current="page">Home</a><a href="tools.html">Tools</a><a href="categories.html">Categories</a><a href="labs.html">Labs</a><a href="live.html">LIVE</a></nav>', '<nav class="nav" data-nav aria-label="Primary navigation"><a href="/" aria-current="page">Home</a><a href="tools.html">Tools</a><a href="categories.html">Categories</a><a href="articles.html">Articles</a><a href="guides.html">Guides</a><a href="gaming.html">Gaming</a><a class="nn-nav-auth nn-nav-signin" href="register.html?mode=signin">Sign in</a><a class="nn-nav-auth nn-nav-signup" href="register.html?mode=register">Sign up</a></nav>')
          index = index.replace('<a class="btn" href="new-tools.html">Newest tools</a>', '<a class="btn" href="guides.html">How-to guides</a>')
          write('index.html', index)

          # 4) FAQ: remove unfinished/beta signal and route CTAs only to strong indexable surfaces.
          faq = (ROOT / 'faq.html').read_text(encoding='utf-8')
          faq = faq.replace('current beta behavior', 'current site behavior')
          faq = faq.replace('what the current website beta actually supports.', 'what the current website experience supports.')
          faq = faq.replace('<h2>Is NexusNova currently a beta?</h2><p>The website is undergoing a controlled beta validation phase while security, account, SEO and release-gate checks continue. Beta does not mean unfinished claims are treated as live; unsupported states remain locked or unavailable.</p>', '<h2>Are all optional NexusNova features available?</h2><p>Core public browser tools and help pages are available without an account. Optional connected-account or provider-dependent features are shown only when they are supported; unavailable states are not presented as working results.</p>')
          faq = faq.replace('<div class="hero-actions"><a class="btn btn-primary" href="daily-tools-directory.html">Daily Tools →</a><a class="btn" href="image-to-text-ocr.html">Image to Text OCR</a><a class="btn" href="gaming.html">Gaming Tools</a><a class="btn" href="smart-tools.html">Smart Tools</a></div>', '<div class="hero-actions"><a class="btn btn-primary" href="tools.html">All Tools →</a><a class="btn" href="image-to-text-ocr.html">Image to Text OCR</a><a class="btn" href="categories.html">Categories</a><a class="btn" href="guides.html">Practical Guides</a></div>')
          faq = faq.replace('"dateModified":"2026-08-30"', f'"dateModified":"{TODAY}"')
          faq = faq.replace('<strong>Last reviewed:</strong> 30 August 2026', '<strong>Last reviewed:</strong> 11 September 2026')
          write('faq.html', faq)

          # 5) Structured data and breadcrumb cleanup.
          categories = (ROOT / 'categories.html').read_text(encoding='utf-8')
          categories = categories.replace('"url":"https://nexusnovatools.com/network-tools.html"},]}', '"url":"https://nexusnovatools.com/network-tools.html"}]}')
          categories = categories.replace('"dateModified":"2026-09-05"', f'"dateModified":"{TODAY}"')
          write('categories.html', categories)

          decision = (ROOT / 'decision-matrix-calculator.html').read_text(encoding='utf-8')
          decision = decision.replace('"position":2,"name":"New Tools","item":"https://nexusnovatools.com/new-tools.html"', '"position":2,"name":"Tools","item":"https://nexusnovatools.com/tools.html"')
          decision = decision.replace('<a href="new-tools.html">New Tools</a>', '<a href="tools.html">Tools</a>')
          write('decision-matrix-calculator.html', decision)

          electricity = (ROOT / 'electricity-bill-calculator-pakistan.html').read_text(encoding='utf-8')
          electricity = electricity.replace('"position":2,"name":"New Tools","item":"https://nexusnovatools.com/new-tools.html"', '"position":2,"name":"Pakistan Tools","item":"https://nexusnovatools.com/pakistan-tools.html"')
          electricity = electricity.replace('<a href="new-tools.html">New Tools</a>', '<a href="pakistan-tools.html">Pakistan Tools</a>')
          electricity = electricity.replace('<a class="btn btn-primary" href="new-tools.html">More New Tools →</a>', '<a class="btn btn-primary" href="pakistan-tools.html">More Pakistan Tools →</a>')
          write('electricity-bill-calculator-pakistan.html', electricity)

          note = (ROOT / 'private-quick-note.html').read_text(encoding='utf-8')
          note = note.replace('<a href="daily-tools-directory.html">Daily Tools</a>', '<a href="productivity-tools.html">Productivity Tools</a>')
          note = note.replace('<a href="daily-tools-directory.html">Daily Tools directory</a>', '<a href="productivity-tools.html">Productivity Tools</a>')
          write('private-quick-note.html', note)

          # 6) Tighten the indexable article hub's topical framing (Claude's old Current Signals issue is already gone).
          articles = (ROOT / 'articles.html').read_text(encoding='utf-8')
          articles = articles.replace('<title>Practical Tool & Search Articles 2026 — NexusNova Tools</title>', '<title>Practical Tool Guides & Articles 2026 — NexusNova Tools</title>')
          articles = articles.replace('Practical NexusNova guides about Google Search, Search Console, AI, gaming, privacy, PDFs, images, QR codes, calculators, productivity and digital workflows.', 'Practical NexusNova articles for browser tools, PDFs, images, calculators, gaming settings, privacy, productivity and repeatable digital workflows.')
          articles = articles.replace('Current Search, AI, gaming and practical digital-workflow guides connected to useful NexusNova tools.', 'Practical browser-tool and digital-workflow articles connected to useful NexusNova utilities.')
          write('articles.html', articles)

          # 7) Cache-bust shared UI assets so the compact hero and new nav show immediately after deploy.
          for p in ROOT.rglob('*.html'):
              if any(part.startswith('.') for part in p.relative_to(ROOT).parts):
                  continue
              text = p.read_text(encoding='utf-8')
              new = re.sub(r'assets/css/compact-2026\.css(?:\?v=[^"\']+)?', 'assets/css/compact-2026.css?v=20260911-2', text)
              new = re.sub(r'assets/js/main\.js(?:\?v=[^"\']+)?', 'assets/js/main.js?v=20260911-2', new)
              if new != text:
                  p.write_text(new, encoding='utf-8')
                  rel = str(p.relative_to(ROOT))
                  if rel not in changed:
                      changed.append(rel)

          # 8) Merge the separate 17-tool discovery set into the canonical main sitemap.
          sm_path = ROOT / 'sitemap.xml'
          sm = sm_path.read_text(encoding='utf-8')
          new_sm = (ROOT / 'sitemap-new-tools.xml').read_text(encoding='utf-8')
          blocks = re.findall(r'\s*<url>\s*<loc>https://nexusnovatools\.com/[^<]+</loc>\s*<lastmod>[^<]+</lastmod>\s*</url>', new_sm, flags=re.S)
          if len(blocks) != 17:
              raise SystemExit(f'Expected 17 new-tool sitemap entries, found {len(blocks)}')
          for block in blocks:
              loc = re.search(r'<loc>([^<]+)</loc>', block).group(1)
              rel = loc.removeprefix('https://nexusnovatools.com/')
              hp = ROOT / rel
              if hp.exists():
                  source = hp.read_text(encoding='utf-8')
                  robots = re.search(r'<meta\s+name=["\']robots["\']\s+content=["\']([^"\']+)', source, flags=re.I)
                  if robots and 'noindex' in robots.group(1).lower():
                      raise SystemExit(f'Refusing to sitemap noindex page: {rel}')
              if f'<loc>{loc}</loc>' not in sm:
                  sm = sm.replace('</urlset>', block.rstrip() + '\n</urlset>', 1)

          def set_lastmod(url, date):
              nonlocal_holder = None
              return re.sub(rf'(<loc>{re.escape(url)}</loc>\s*<lastmod>)[^<]+', rf'\g<1>{date}', sm, count=1)

          for url in [
              'https://nexusnovatools.com/',
              'https://nexusnovatools.com/faq.html',
              'https://nexusnovatools.com/categories.html',
              'https://nexusnovatools.com/articles.html',
              'https://nexusnovatools.com/decision-matrix-calculator.html',
              'https://nexusnovatools.com/electricity-bill-calculator-pakistan.html',
              'https://nexusnovatools.com/private-quick-note.html',
          ]:
              sm = re.sub(rf'(<loc>{re.escape(url)}</loc>\s*<lastmod>)[^<]+', rf'\g<1>{TODAY}', sm, count=1)
          write('sitemap.xml', sm)

          # Verification gates.
          final_main = (ROOT / 'assets/js/main.js').read_text(encoding='utf-8')
          nav_slice = final_main[final_main.index('const items=['):final_main.index('const authMode=', final_main.index('const items=['))]
          if 'labs.html' in nav_slice or 'live.html' in nav_slice:
              raise SystemExit('Labs/LIVE still present in primary JS nav')
          if nav_slice.find("['gaming.html','Gaming']") < 0:
              raise SystemExit('Gaming missing from primary JS nav')

          if 'website beta' in (ROOT / 'faq.html').read_text(encoding='utf-8').lower() or 'beta validation' in (ROOT / 'faq.html').read_text(encoding='utf-8').lower():
              raise SystemExit('FAQ still contains unfinished beta wording')

          # Validate JSON-LD on the pages touched for structured data.
          for rel in ['categories.html','faq.html','decision-matrix-calculator.html','electricity-bill-calculator-pakistan.html']:
              source = (ROOT / rel).read_text(encoding='utf-8')
              for raw in re.findall(r'<script\s+type=["\']application/ld\+json["\'][^>]*>(.*?)</script>', source, flags=re.I|re.S):
                  json.loads(html_lib.unescape(raw).strip())

          ET.parse(ROOT / 'sitemap.xml')
          sitemap_text = (ROOT / 'sitemap.xml').read_text(encoding='utf-8')
          for block in blocks:
              loc = re.search(r'<loc>([^<]+)</loc>', block).group(1)
              if f'<loc>{loc}</loc>' not in sitemap_text:
                  raise SystemExit(f'Missing merged sitemap URL: {loc}')

          # Claude live-site discrepancy targets must remain noindex in source.
          for rel in ['gaming.html','trending-tools.html','tech/gpt-6-astra-2026.html']:
              source = (ROOT / rel).read_text(encoding='utf-8')
              if not re.search(r'<meta\s+name=["\']robots["\']\s+content=["\'][^"\']*noindex', source, flags=re.I):
                  raise SystemExit(f'Claude NOINDEX target is not noindex: {rel}')

          weak_article_links = [
              'tech/gpt-6-astra-2026.html',
              'articles/google-search-console-platform-properties-2026.html',
              'articles/google-august-2026-spam-update-traffic-drop.html',
              'articles/google-preferred-sources-2026.html',
              'articles/gpt-5-6-sol-context-window-guide.html',
              'articles/amd-adrenalin-26-8-1-modern-warfare-4.html',
              'articles/windows-11-august-2026-rgb-gaming-crashes.html',
              'articles/modern-warfare-4-beta-pc-checklist.html',
          ]
          article_source = (ROOT / 'articles.html').read_text(encoding='utf-8')
          still = [x for x in weak_article_links if x in article_source]
          if still:
              raise SystemExit('Claude weak-news links still on articles.html: ' + ', '.join(still))

          for removed in ['OWNER-CONTROL-CENTER.md','adsense_content_remediation_20260911.py']:
              if (ROOT / removed).exists():
                  raise SystemExit(f'Previously removed internal file has returned: {removed}')

          print('Changed files:', len(changed))
          for item in sorted(changed):
              print(' -', item)
          print('All targeted AdSense/Claude/UI gates passed.')
          PY

      - name: Commit verified final polish and remove one-off workflow
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'nexusnova-adsense[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm .github/workflows/adsense-final-polish-once.yml
          git add -A
          if git diff --cached --quiet; then
            echo 'No changes to commit.'
            exit 0
          fi
          git commit -m 'seo: finalize AdSense reviewer navigation and discovery polish'
          git pull --rebase origin main
          git push origin main
