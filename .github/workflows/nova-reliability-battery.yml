name: Nova Production Reliability Battery

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: nova-production-reliability
  cancel-in-progress: true

concurrency:
  group: nexusnova-nova-production-checks
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy-worker:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Deploy production Worker
        id: deploy
        continue-on-error: true
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: cloudflare/telegram-bot
          command: deploy
      - name: Retry transient Worker deployment
        if: steps.deploy.outcome == 'failure'
        working-directory: cloudflare/telegram-bot
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          for attempt in 1 2 3; do
            echo "Cloudflare deploy retry ${attempt}/3"
            npx wrangler@4 deploy && exit 0
            sleep $((attempt * 10))
          done
          exit 1

  reliability:
    needs: deploy-worker
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - name: Real production API + browser reliability battery
        env:
          PYTHONUNBUFFERED: '1'
          GITHUB_SHA_VALUE: ${{ github.sha }}
        run: |
          python -m pip install --disable-pip-version-check playwright
          python -m playwright install --with-deps chromium
          python .github/scripts/nova_production_battery.py
      - name: Upload reliability evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nova-production-reliability-evidence
          path: |
            nova-reliability-results.json
            nova-reliability-summary.json
          retention-days: 14
