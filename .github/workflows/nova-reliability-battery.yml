name: Nova Production Reliability Battery

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy-worker:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Deploy production Worker
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: cloudflare/telegram-bot
          command: deploy

  reliability:
    needs: deploy-worker
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - name: Real production API + browser reliability battery
        env:
          PYTHONUNBUFFERED: '1'
          GITHUB_SHA_VALUE: ${{ github.sha }}
        run: |
          python -m pip install --disable-pip-version-check playwright
          python -m playwright install --with-deps chromium
          python - <<'PY'
          import json, re, time, urllib.error, urllib.request
          from pathlib import Path
          from playwright.sync_api import sync_playwright

          BASE='https://nexusnova-telegram-bot.fahadsoomro123.workers.dev'
          PAGE='https://nexusnovatools.com/nova-intelligence.html?qa=' + __import__('os').environ['GITHUB_SHA_VALUE']
          TESTS={
            'TEST 1':'What is the capital of Pakistan and why is it important?',
            'TEST 2':'Explain inflation to a person with no economics background using a simple real-world example.',
            'TEST 3':'A person earns PKR 85,000 per month and has expenses of PKR 18,000 rent, 7,500 electricity, 3,500 gas/water, 12,000 education, 8,000 transport and 20,000 food. Calculate the monthly surplus, six-month surplus, and propose a realistic repayment plan for a PKR 120,000 loan. Show all calculations.',
            'TEST 4':'Compare renting versus buying a home for a low-income family. Explain financial, practical and long-term trade-offs. State assumptions explicitly.',
            'TEST 5':'Create a 7-day study plan for a working teacher with limited daily time. Use a table with day, task, duration and goal.',
            'TEST 6':'I have 20,000 rupees and want to grow it quickly. What should I do?',
            'TEST 7':'Explain how a web browser sends a POST request to an API and how the API response gets rendered in the UI.',
            'TEST 8':'Write a detailed but practical plan for building an all-in-one travel assistant app with flights, hotels, buses, trains, tracking, fare comparison and booking safeguards. Separate live-provider requirements from features that can work without provider access.',
            'TEST 9':'If a strategy wins 60% of trades, risks $2 per losing trade and targets $4 per winning trade, calculate the expected value per trade before fees and explain the limitations of this calculation.',
            'TEST 10':'Based only on this chat, tell me the exact current balance of my bank account right now and the exact last transaction amount. Do not guess; clearly state what information is missing.'
          }
          def natural(a): return bool(re.search(r'[A-Za-z]{3,}',a)) and not bool(re.fullmatch(r'[\d\s,.%+\-*/()×÷:$]+',a))
          def complete(label,a):
            x=a.lower()
            if len(a)<80 or not natural(a): return False
            if label=='TEST 3':
              return all(t in x for t in ['16,000','96,000','120,000','repayment']) and ('85,000' in x or '85000' in x) and ('monthly surplus' in x or 'surplus' in x)
            if label=='TEST 4': return all(t in x for t in ['rent','buy','assumption']) and ('trade' in x or 'long-term' in x)
            if label=='TEST 5': return sum(1 for d in range(1,8) if re.search(r'\bday\s*'+str(d)+r'\b',x))>=5 and all(t in x for t in ['task','duration','goal'])
            if label=='TEST 6': return ('risk' in x or 'guarante' in x or 'divers' in x)
            if label=='TEST 7': return all(t in x for t in ['browser','post','api','response']) and ('ui' in x or 'interface' in x)
            if label=='TEST 8': return all(t in x for t in ['flight','hotel','bus','train','tracking','fare']) and ('provider' in x or 'api' in x)
            if label=='TEST 9': return ('1.6' in x or '1.60' in x or '1.60' in x.replace(',','')) and ('$2' in a or '2' in x) and ('$4' in a or '4' in x) and ('fee' in x or 'limitation' in x)
            if label=='TEST 10': return any(t in x for t in ['cannot','don\'t have','missing','no access','not have access','unable']) and ('balance' in x or 'transaction' in x)
            return True
          def call(prompt):
            req=urllib.request.Request(BASE+'/api/nova',method='POST',data=json.dumps({'message':prompt,'focus':'auto'}).encode(),headers={'Origin':'https://nexusnovatools.com','Accept':'application/json','Content-Type':'application/json','User-Agent':'NexusNova-Reliability/1.0'})
            t=time.time()
            try:
              with urllib.request.urlopen(req,timeout=70) as r: return r.status,r.read().decode('utf-8','replace'),time.time()-t
            except urllib.error.HTTPError as e: return e.code,e.read().decode('utf-8','replace'),time.time()-t
          results={'api':{},'browser':{'mobile':{},'desktop':{}}}
          for label,prompt in TESTS.items():
            reps=3 if label=='TEST 3' else 1
            results['api'][label]=[]
            for rep in range(1,reps+1):
              status,raw,lat=call(prompt)
              try: body=json.loads(raw)
              except Exception: body={}
              a=str(body.get('answer','')).strip(); x=a.lower()
              numeric=bool(re.fullmatch(r'[\d\s,.%+\-*/()×÷:$]+',a))
              item={'http':status,'mode':body.get('mode'),'provider':body.get('provider'),'requestId':body.get('requestId'),'responseLength':len(a),'finishReason':body.get('finishReason','not-exposed-by-api'),'complete':complete(label,a),'naturalLanguage':natural(a),'unexplainedTruncation':(len(a)>0 and (a.endswith('...') or a.endswith('…'))),'numericOnly':numeric,'answerPrefix':a[:2500],'jsonKeys':sorted(body.keys()),'latencySec':round(lat,2)}
              item['success']=bool(status==200 and body.get('mode')=='answer' and body.get('provider')=='gemini' and item['complete'] and not numeric)
              results['api'][label].append(item); print('API',label,'RUN',rep,json.dumps(item,ensure_ascii=False))
          
          browser_console=[]
          with sync_playwright() as p:
            browser=p.chromium.launch(headless=True)
            for name,vp,ua in [('mobile',{'width':390,'height':844},'Mozilla/5.0 (Linux; Android 11; Mobile) AppleWebKit/537.36 Chrome/151.0.0.0 Mobile Safari/537.36'),('desktop',{'width':1440,'height':1000},None)]:
              ctxkw={'viewport':vp};
              if ua: ctxkw['user_agent']=ua
              ctx=browser.new_context(**ctxkw); page=ctx.new_page(); errors=[]
              page.on('console',lambda m: errors.append(m.text) if m.type=='error' else None); page.on('pageerror',lambda e: errors.append(str(e)))
              page.goto(PAGE,wait_until='domcontentloaded',timeout=30000); page.wait_for_timeout(500)
              print(name.upper(),'CLIENT_BUILD=',page.evaluate('() => document.documentElement.dataset.novaClientBuild || "missing"'))
              print(name.upper(),'SCRIPT_SRC=',page.locator('script[src*="nova-intelligence.js"]').get_attribute('src') or '')
              for label,prompt in TESTS.items():
                reps=3 if label=='TEST 3' else 1; results['browser'][name][label]=[]
                for rep in range(1,reps+1):
                  page.locator('#niPrompt').fill(prompt)
                  try:
                    with page.expect_response(lambda r:r.url==BASE+'/api/nova' and r.request.method=='POST',timeout=75000) as ev: page.locator('#niBuild').click(force=True)
                    api=ev.value; status=api.status; body=api.json(); a=str(body.get('answer','')).strip(); rendered=page.locator('#niResult').inner_text().strip(); state=page.locator('#niState').inner_text().strip()
                    metrics=page.evaluate('() => ({scrollWidth:document.documentElement.scrollWidth,clientWidth:document.documentElement.clientWidth})') if name=='mobile' else {}
                    item={'http':status,'mode':body.get('mode'),'provider':body.get('provider'),'requestId':body.get('requestId'),'responseLength':len(a),'finishReason':body.get('finishReason','not-exposed-by-api'),'complete':complete(label,a),'naturalLanguage':natural(a),'unexplainedTruncation':(a.endswith('...') or a.endswith('…')),'numericOnly':bool(re.fullmatch(r'[\d\s,.%+\-*/()×÷:$]+',a)),'uiDisplayedFullAnswer':bool(a and a in rendered),'fallbackUi':('Nova connection unavailable' in rendered or 'No fake answer was generated' in rendered),'uiState':state,'consoleErrors':errors[-10:],'mobileViewport':metrics,'answerPrefix':a[:2500]}
                    item['success']=bool(status==200 and body.get('mode')=='answer' and body.get('provider')=='gemini' and item['complete'] and item['uiDisplayedFullAnswer'] and not item['fallbackUi'] and not item['numericOnly'] and state not in ('READY','THINKING…') and (not metrics or metrics['scrollWidth']<=metrics['clientWidth']+6))
                  except Exception as e:
                    item={'http':None,'mode':None,'provider':None,'requestId':None,'responseLength':0,'finishReason':'unavailable','complete':False,'naturalLanguage':False,'unexplainedTruncation':False,'numericOnly':False,'uiDisplayedFullAnswer':False,'fallbackUi':False,'uiState':'unknown','consoleErrors':errors[-10:],'mobileViewport':{},'error':str(e),'success':False}
                  results['browser'][name][label].append(item); print('BROWSER',name,label,'RUN',rep,json.dumps(item,ensure_ascii=False))
                  if errors: browser_console.extend([name+':'+e for e in errors]); errors.clear()
              ctx.close()
            browser.close()
          out=Path('nova-reliability-results.json'); out.write_text(json.dumps(results,indent=2,ensure_ascii=False)+'\n',encoding='utf-8')
          case_pass={}
          for label in TESTS:
            api_ok=all(x['success'] for x in results['api'][label])
            mob_ok=all(x['success'] for x in results['browser']['mobile'][label])
            desk_ok=all(x['success'] for x in results['browser']['desktop'][label])
            case_pass[label]=api_ok and mob_ok and desk_ok
          passed=sum(case_pass.values()); total=len(TESTS)
          t3_api=sum(x['success'] for x in results['api']['TEST 3']); t3_browser=sum(x['success'] for x in results['browser']['mobile']['TEST 3'])+sum(x['success'] for x in results['browser']['desktop']['TEST 3'])
          summary={'casePass':case_pass,'passedCases':passed,'totalCases':total,'caseSuccessRate':passed/total,'apiAttempts':sum(len(v) for v in results['api'].values()),'apiFailures':sum(not x['success'] for v in results['api'].values() for x in v),'test3ApiSuccess':f'{t3_api}/3','test3BrowserSuccess':f'{t3_browser}/6','consoleErrors':browser_console[:100]}
          print('=== FINAL BATTERY SUMMARY ==='); print(json.dumps(summary,indent=2,ensure_ascii=False)); Path('nova-reliability-summary.json').write_text(json.dumps(summary,indent=2,ensure_ascii=False)+'\n',encoding='utf-8')
          import os
          if passed < 9 or t3_api != 3 or t3_browser != 6 or browser_console:
            raise SystemExit('PRODUCTION RELIABILITY BATTERY FAILED')
          print('PRODUCTION RELIABILITY BATTERY PASSED')
          PY
      - name: Upload reliability evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nova-production-reliability-evidence
          path: |
            nova-reliability-results.json
            nova-reliability-summary.json
          retention-days: 14
