name: NexusNova Canonical Article Registry Live Check

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/article-consolidation-live-smoke.yml'
      - 'articles.html'
      - 'assets/js/search-core.js'
      - 'sitemap.xml'
      - 'articles.json'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: nexusnova-canonical-article-registry-live-check
  cancel-in-progress: true

jobs:
  live-article-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - name: Verify deployed canonical 100-article registry
        env:
          GITHUB_SHA: ${{ github.sha }}
          GITHUB_RUN_ID: ${{ github.run_id }}
        run: |
          python - <<'PY'
          import concurrent.futures
          import hashlib
          import json
          import os
          import re
          import time
          import urllib.error
          import urllib.parse
          import urllib.request
          import xml.etree.ElementTree as ET
          from html.parser import HTMLParser

          BASE = "https://nexusnovatools.com"
          PATHS = [
              "/articles.html",
              "/assets/js/search-core.js",
              "/sitemap.xml",
              "/articles.json",
          ]
          ARTICLE_PATH = re.compile(r"^articles/[^/]+\.html$")

          class ArticleHubParser(HTMLParser):
              def __init__(self):
                  super().__init__(convert_charrefs=True)
                  self.cards = []
                  self.in_count = False
                  self.count_parts = []

              def handle_starttag(self, tag, attrs):
                  attrs = dict(attrs)
                  if tag == "a" and "nn-article-card" in (attrs.get("class") or "").split():
                      href = (attrs.get("href") or "").strip()
                      if ARTICLE_PATH.fullmatch(href):
                          self.cards.append(href)
                  if tag == "span" and attrs.get("id") == "article-search-count":
                      self.in_count = True

              def handle_endtag(self, tag):
                  if tag == "span" and self.in_count:
                      self.in_count = False

              def handle_data(self, data):
                  if self.in_count:
                      self.count_parts.append(data)

              @property
              def display_count(self):
                  return " ".join("".join(self.count_parts).split())

          def fetch(path, attempt):
              query = urllib.parse.urlencode({
                  "nn_live_verify": f"{os.environ['GITHUB_RUN_ID']}-{attempt}-{os.environ['GITHUB_SHA'][:12]}"
              })
              url = f"{BASE}{path}?{query}"
              request = urllib.request.Request(
                  url,
                  headers={
                      "Cache-Control": "no-cache, no-store, max-age=0",
                      "Pragma": "no-cache",
                      "User-Agent": "NexusNova-Canonical-Article-Smoke/1.0",
                  },
              )
              try:
                  with urllib.request.urlopen(request, timeout=10) as response:
                      body = response.read().decode("utf-8", errors="replace")
                      return {"path": path, "status": response.status, "body": body, "url": response.geturl()}
              except urllib.error.HTTPError as exc:
                  return {"path": path, "status": exc.code, "body": exc.read().decode("utf-8", errors="replace"), "url": url}
              except Exception as exc:
                  return {"path": path, "status": 0, "body": "", "url": url, "error": f"{type(exc).__name__}: {exc}"}

          latest = {}
          required = {}
          for attempt in range(1, 19):
              with concurrent.futures.ThreadPoolExecutor(max_workers=len(PATHS)) as pool:
                  results = list(pool.map(lambda path: fetch(path, attempt), PATHS))
              latest = {item["path"]: item for item in results}
              for item in results:
                  digest = hashlib.sha256(item["body"].encode("utf-8")).hexdigest()[:16]
                  print(f"attempt={attempt} status={item['status']} bytes={len(item['body'].encode('utf-8'))} sha256={digest} path={item['path']}")

              hub = latest["/articles.html"]["body"]
              search_core = latest["/assets/js/search-core.js"]["body"]
              sitemap = latest["/sitemap.xml"]["body"]
              feed_text = latest["/articles.json"]["body"]

              hub_parser = ArticleHubParser()
              hub_parser.feed(hub)
              hub_urls = hub_parser.cards
              hub_set = set(hub_urls)

              # Read the article records from the actual client-side search dataset.
              registry_urls = re.findall(
                  r'url\s*:\s*"(articles/[^"]+\.html)"\s*,\s*type\s*:\s*"article"',
                  search_core,
              )
              registry_set = set(registry_urls)

              sitemap_urls = []
              try:
                  root = ET.fromstring(sitemap)
                  for element in root.iter():
                      if element.tag.rsplit("}", 1)[-1] != "loc" or not element.text:
                          continue
                      parsed = urllib.parse.urlparse(element.text.strip())
                      article_path = parsed.path.lstrip("/")
                      if parsed.netloc == urllib.parse.urlparse(BASE).netloc and ARTICLE_PATH.fullmatch(article_path):
                          sitemap_urls.append(article_path)
              except ET.ParseError:
                  sitemap_urls = []

              feed_valid = False
              feed_article_urls = []
              try:
                  feed = json.loads(feed_text)
                  if isinstance(feed, dict) and isinstance(feed.get("items"), list):
                      feed_valid = True
                      for item in feed["items"]:
                          if not isinstance(item, dict):
                              continue
                          parsed = urllib.parse.urlparse(str(item.get("url", "")))
                          article_path = parsed.path.lstrip("/")
                          if parsed.netloc == urllib.parse.urlparse(BASE).netloc and ARTICLE_PATH.fullmatch(article_path):
                              feed_article_urls.append(article_path)
              except (json.JSONDecodeError, TypeError, ValueError):
                  feed_valid = False

              sitemap_set = set(sitemap_urls)
              feed_set = set(feed_article_urls)
              required = {
                  "all four canonical routes return HTTP 200": all(x["status"] == 200 for x in results),
                  "hub count label is exactly 100 articles": hub_parser.display_count == "100 articles",
                  "hub contains exactly 100 unique canonical article cards": len(hub_urls) == 100 and len(hub_set) == 100,
                  "search dataset contains exactly 100 unique article records": len(registry_urls) == 100 and len(registry_set) == 100,
                  "hub and search registry match exactly": hub_set == registry_set,
                  "sitemap contains exactly the canonical 100 article URLs": len(sitemap_urls) == 100 and len(sitemap_set) == 100 and sitemap_set == registry_set,
                  "article feed is valid JSON": feed_valid,
                  "article feed contains exactly the canonical 100 article URLs": len(feed_article_urls) == 100 and len(feed_set) == 100 and feed_set == registry_set,
              }

              if all(x["status"] == 200 for x in results) and all(required.values()):
                  print("LIVE CANONICAL ARTICLE REGISTRY PASS")
                  print(json.dumps({
                      "checks": required,
                      "hub_cards": len(hub_urls),
                      "search_registry_articles": len(registry_urls),
                      "sitemap_article_urls": len(sitemap_urls),
                      "feed_article_urls": len(feed_article_urls),
                  }, indent=2))
                  raise SystemExit(0)

              if attempt < 18:
                  time.sleep(5)

          print("LIVE CANONICAL ARTICLE REGISTRY FAIL: deployed content does not match the canonical registry.")
          print(json.dumps(required, indent=2))
          raise SystemExit(1)
          PY
