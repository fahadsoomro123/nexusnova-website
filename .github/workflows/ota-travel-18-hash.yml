name: OTA Travel 18 Hash Verify

on:
  push:
    branches: [nexusnova-ota-public]
    paths:
      - '.github/workflows/ota-travel-18-hash.yml'

permissions:
  contents: read

jobs:
  hash:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Hash staged Travel 18 files
        run: |
          set -euo pipefail
          for f in \
            ota/files/index.html \
            ota/files/src/features/apps/travel-result-details-v1.js \
            ota/files/src/features/apps/travel-ota-revision-v13.js
          do
            printf '%s ' "$f"
            sha256sum "$f" | awk '{printf "sha256=%s ",$1}'
            stat -c 'size=%s' "$f"
          done
