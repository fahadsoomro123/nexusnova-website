name: NexusNova Staging Browser Render QA

on:
  push:
    branches: [nexusnova-clean-redesign]
    paths:
      - '**/*.html'
      - '**/*.css'
      - 'assets/**/*.js'
      - 'assets/**/*.png'
      - 'assets/**/*.svg'
      - '.github/scripts/staging_browser_render_qa.py'
      - '.github/workflows/staging-browser-render-qa.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  browser-render:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout staging branch
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: nexusnova-clean-redesign
          fetch-depth: 1

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'

      - name: Install Playwright Chromium
        run: |
          python -m pip install --disable-pip-version-check playwright
          python -m playwright install --with-deps chromium

      - name: Start local staging server
        run: |
          python -m http.server 8000 --bind 127.0.0.1 >/tmp/nexusnova-browser-render-http.log 2>&1 &
          sleep 2
          curl --fail --silent http://127.0.0.1:8000/index.html >/dev/null

      - name: Run browser-render gate
        run: python .github/scripts/staging_browser_render_qa.py

      - name: Upload browser evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: nexusnova-staging-browser-render
          path: |
            quality-artifacts/staging-browser-render-report.json
            quality-artifacts/staging-browser-render-summary.txt
            quality-artifacts/staging-browser-render/**
            /tmp/nexusnova-browser-render-http.log
          if-no-files-found: warn
          retention-days: 14
