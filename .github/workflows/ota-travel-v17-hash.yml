name: OTA Travel V17 Hash Check

on:
  push:
    branches: [nexusnova-ota-public]
    paths:
      - '.github/workflows/ota-travel-v17-hash.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  hash:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Exact OTA v17 hashes and sizes
        shell: bash
        run: |
          set -euo pipefail
          for f in \
            ota/files/index.html \
            ota/files/src/features/apps/travel-phone-layout-v17.js \
            ota/files/src/features/apps/travel-exit-isolation-v10.js \
            ota/files/src/features/apps/travel-ota-revision-v13.js; do
            printf '%s|' "$f"
            stat -c '%s' "$f" | tr -d '\n'
            printf '|'
            sha256sum "$f" | awk '{print $1}'
          done
