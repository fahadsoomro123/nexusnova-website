name: NexusNova Facebook Page Smoke Test

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/facebook-page-smoke.yml'

permissions:
  contents: read

jobs:
  facebook-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      FACEBOOK_PAGE_ID: ${{ vars.FACEBOOK_PAGE_ID }}
      FACEBOOK_PAGE_ACCESS_TOKEN: ${{ secrets.FACEBOOK_PAGE_ACCESS_TOKEN }}
    steps:
      - name: Verify Facebook Page token and publishing permission
        run: |
          python - <<'PY'
          import json, os, urllib.parse, urllib.request, urllib.error

          page_id = os.environ.get('FACEBOOK_PAGE_ID','').strip()
          token = os.environ.get('FACEBOOK_PAGE_ACCESS_TOKEN','').strip()
          if not page_id:
              raise SystemExit('FACEBOOK_PAGE_ID is missing')
          if not token:
              raise SystemExit('FACEBOOK_PAGE_ACCESS_TOKEN is missing')

          api = 'https://graph.facebook.com/v26.0'

          def request(method, path, data=None):
              body = urllib.parse.urlencode(data or {}).encode() if data is not None else None
              req = urllib.request.Request(
                  api + path,
                  data=body,
                  method=method,
                  headers={'Content-Type':'application/x-www-form-urlencoded','User-Agent':'NexusNovaTrafficAutopilot/1.0'},
              )
              try:
                  with urllib.request.urlopen(req, timeout=25) as r:
                      return r.status, json.loads(r.read().decode('utf-8'))
              except urllib.error.HTTPError as e:
                  body = e.read().decode('utf-8','replace')
                  print(json.dumps({'http_status':e.code,'response':body[:1200]}, indent=2))
                  raise

          qs = urllib.parse.urlencode({'fields':'id,name','access_token':token})
          status, page = request('GET', f'/{urllib.parse.quote(page_id)}?{qs}')
          print(json.dumps({'page_lookup_http':status,'page_id_matches':str(page.get('id')) == page_id,'page_name':page.get('name')}, indent=2))
          if str(page.get('id')) != page_id:
              raise SystemExit('Facebook token did not resolve the configured Page ID')

          status, created = request('POST', f'/{urllib.parse.quote(page_id)}/feed', {
              'message':'NexusNova automation connection test (unpublished)',
              'published':'false',
              'access_token':token,
          })
          post_id = str(created.get('id',''))
          print(json.dumps({'unpublished_post_http':status,'created':bool(post_id)}, indent=2))
          if not post_id:
              raise SystemExit('Facebook did not create the unpublished test post')

          status, deleted = request('DELETE', f'/{urllib.parse.quote(post_id)}', {'access_token':token})
          print(json.dumps({'cleanup_http':status,'deleted':bool(deleted.get('success'))}, indent=2))
          if not deleted.get('success'):
              raise SystemExit('Facebook test post cleanup failed')
          PY
