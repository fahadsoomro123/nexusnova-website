name: NexusNova Facebook Page Smoke Test

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/facebook-page-smoke.yml'

permissions:
  contents: read

jobs:
  facebook-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      FACEBOOK_PAGE_ID: ${{ vars.FACEBOOK_PAGE_ID }}
      FACEBOOK_PAGE_ACCESS_TOKEN: ${{ secrets.FACEBOOK_PAGE_ACCESS_TOKEN }}
    steps:
      - name: Verify Facebook Page publishing permission safely
        run: |
          python - <<'PY'
          import json, os, urllib.parse, urllib.request, urllib.error

          preferred_page_id = os.environ.get('FACEBOOK_PAGE_ID','').strip()
          system_token = os.environ.get('FACEBOOK_PAGE_ACCESS_TOKEN','').strip()
          if not system_token:
              raise SystemExit('Missing FACEBOOK_PAGE_ACCESS_TOKEN')

          api = 'https://graph.facebook.com/v26.0'

          def call(method, path, data=None):
              body = urllib.parse.urlencode(data or {}).encode() if data is not None else None
              req = urllib.request.Request(
                  api + path,
                  data=body,
                  method=method,
                  headers={
                      'Content-Type':'application/x-www-form-urlencoded',
                      'User-Agent':'NexusNovaTrafficAutopilot/1.0',
                  },
              )
              try:
                  with urllib.request.urlopen(req, timeout=25) as r:
                      return r.status, json.loads(r.read().decode('utf-8'))
              except urllib.error.HTTPError as e:
                  raw = e.read().decode('utf-8','replace').replace(system_token, '***')
                  print(json.dumps({'http_status':e.code,'response':raw[:1000]}, indent=2))
                  raise

          qs = urllib.parse.urlencode({
              'fields':'id,name,access_token,instagram_business_account{id,username}',
              'access_token':system_token,
          })
          status, payload = call('GET', f'/me/accounts?{qs}')
          rows = payload.get('data') or []
          if not rows:
              raise SystemExit('Meta token returned no Page assets')

          page = None
          if preferred_page_id:
              page = next((row for row in rows if str(row.get('id','')) == preferred_page_id), None)
              if page is None:
                  raise SystemExit('Configured Facebook Page ID is not available to this token')
          else:
              page = rows[0]

          page_id = str(page.get('id','')).strip()
          page_name = str(page.get('name','')).strip()
          page_token = str(page.get('access_token','')).strip()
          if not page_id or not page_token:
              raise SystemExit('Resolved Page asset is missing id or Page access token')

          verify_qs = urllib.parse.urlencode({'fields':'id,name','access_token':page_token})
          lookup_status, resolved = call('GET', f'/{urllib.parse.quote(page_id)}?{verify_qs}')
          if str(resolved.get('id','')) != page_id:
              raise SystemExit('Resolved Page token does not identify the expected Page')

          create_status, created = call('POST', f'/{urllib.parse.quote(page_id)}/feed', {
              'message':'NexusNova automation connection test (unpublished)',
              'published':'false',
              'access_token':page_token,
          })
          post_id = str(created.get('id','')).strip()
          if not post_id:
              raise SystemExit('Facebook did not create the unpublished verification post')

          delete_status, deleted = call('DELETE', f'/{urllib.parse.quote(post_id)}', {
              'access_token':page_token,
          })
          if not deleted.get('success'):
              raise SystemExit('Facebook verification-post cleanup failed')

          safe = {
              'ok': True,
              'accounts_http': status,
              'lookup_http': lookup_status,
              'unpublished_post_http': create_status,
              'cleanup_http': delete_status,
              'page_name': page_name,
              'page_id_matches_config': (not preferred_page_id or page_id == preferred_page_id),
              'instagram_connected': bool((page.get('instagram_business_account') or {}).get('id')),
          }
          print(json.dumps(safe, indent=2))
          PY
