name: NexusNova Traffic Homepage LIVE Discovery Hotfix

on:
  push:
    branches: [traffic-homepage-live-discovery-20260902]
    paths:
      - '.github/workflows/traffic-homepage-live-discovery-hotfix.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          ref: traffic-homepage-live-discovery-20260902
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Patch homepage discovery
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text(encoding='utf-8')
          old='<a class="home-tool" data-home-tool href="weather-live.html"><b>Pakistan Weather</b><span>Forecasts for Karachi, Lahore, Islamabad, Peshawar, Quetta and Multan.</span></a>'
          new='<a class="home-tool" data-home-tool href="weather-live.html"><b>Pakistan + World Weather</b><span>Six Pakistan cities plus Dubai, London, New York, Toronto, Tokyo and Sydney with transparent forecast timestamps.</span></a>'
          if old not in s: raise SystemExit('weather homepage card signature not found')
          s=s.replace(old,new,1)
          anchor='<a class="home-tool" data-home-tool href="earthquakes-live.html"><b>Recent Earthquakes</b><span>Recent USGS M2.5+ events worldwide with a Pakistan-region view.</span></a>'
          alert=anchor+'<a class="home-tool" data-home-tool href="live-alerts.html"><b>LIVE Threshold Alerts</b><span>Local browser alerts for USD/PKR, 24K gold, petrol and diesel while the alerts page remains open.</span></a>'
          if anchor not in s: raise SystemExit('earthquake card signature not found')
          s=s.replace(anchor,alert,1)
          p.write_text(s,encoding='utf-8')
          PY
          git rm .github/workflows/traffic-homepage-live-discovery-hotfix.yml
      - name: Validate syntax and tests
        run: |
          npm run check
          npm test
          python3 .github/scripts/site_quality_audit.py
          python3 - <<'PY'
          import json
          from pathlib import Path
          r=json.loads(Path('site-quality-report.json').read_text())
          if r.get('severe'): raise SystemExit(str(r['severe']))
          PY
      - name: Commit homepage traffic optimization
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html .github/workflows/traffic-homepage-live-discovery-hotfix.yml
          git commit -m "feat: surface LIVE alerts and worldwide weather on homepage"
          git push origin HEAD:traffic-homepage-live-discovery-20260902
