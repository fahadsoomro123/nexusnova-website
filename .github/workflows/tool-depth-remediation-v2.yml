name: NexusNova Tool Depth Remediation V2

on:
  push:
    branches: [main]
    paths:
      - '.github/scripts/tool_depth_remediation_v2.py'
      - '.github/scripts/remaining_tool_guides.py'
      - '.github/scripts/unique_reference_notes.py'
      - '.github/workflows/tool-depth-remediation-v2.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  deepen-tools:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Sync latest main
        run: git pull --rebase origin main
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Compile remediation
        run: |
          python -m py_compile .github/scripts/tool_depth_remediation_v2.py
          python -m py_compile .github/scripts/remaining_tool_guides.py
          python -m py_compile .github/scripts/unique_reference_notes.py
      - name: Apply compact full-detail tool guides
        run: |
          python .github/scripts/tool_depth_remediation_v2.py
          python .github/scripts/remaining_tool_guides.py
          python .github/scripts/unique_reference_notes.py
      - name: Run strict manual value audit
        run: python .github/scripts/manual_value_audit.py
      - name: Enforce all tool-value gates
        shell: bash
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          report=json.loads(Path('manual-value-audit.json').read_text(encoding='utf-8'))
          bad_types={'thin_tool','missing_howto','missing_example','missing_limits','near_duplicate_main_content'}
          bad=[x for x in report.get('findings',[]) if x.get('type') in bad_types]
          tool_repeat=[]
          for x in report.get('findings',[]):
              if x.get('type')!='repeated_template_sentence':
                  continue
              paths=x.get('paths') or []
              if any(p in {
                  'paper-size-in-pixels.html','salary-tax-calculator-pakistan.html','zakat-calculator-pakistan.html',
                  'pakistan-public-holidays-2026.html','prayer-times-qibla-pakistan.html'
              } for p in paths):
                  tool_repeat.append(x)
          if bad or tool_repeat:
              raise SystemExit('Tool-value findings remain: '+json.dumps((bad+tool_repeat)[:40],ensure_ascii=False))
          print('All tool depth/how-to/example/limits gates: PASS')
          PY
      - name: Run existing structural audits
        run: |
          python .github/scripts/site_quality_audit.py
          python .github/scripts/adsense_readiness_audit.py
      - name: Commit verified content pages
        shell: bash
        run: |
          set -euo pipefail
          files=()
          for list in tool-depth-remediation-changed-files.txt remaining-tool-guide-changed-files.txt unique-reference-note-changed-files.txt; do
            if [ -f "$list" ]; then
              while IFS= read -r file; do
                [ -n "$file" ] && files+=("$file")
              done < "$list"
            fi
          done
          if [ "${#files[@]}" -eq 0 ]; then
            echo 'No content-depth changes required.'
            exit 0
          fi
          git config user.name 'nexusnova-content-guard[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          printf '%s\n' "${files[@]}" | sort -u | while IFS= read -r file; do git add -- "$file"; done
          git commit -m 'content: complete compact tool detail for AdSense review'
          for attempt in 1 2 3; do
            if git pull --rebase origin main && git push origin HEAD:main; then
              echo 'Verified tool-depth remediation pushed to main.'
              exit 0
            fi
            git rebase --abort 2>/dev/null || true
            git fetch origin main
            sleep $((attempt * 3))
          done
          exit 1
