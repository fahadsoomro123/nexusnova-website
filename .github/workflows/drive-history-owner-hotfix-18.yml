name: Drive History Owner Hotfix OTA 18

on:
  push:
    branches: [nexusnova-ota-public]
    paths:
      - .github/workflows/drive-history-owner-hotfix-18.yml

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout live OTA branch
        uses: actions/checkout@v4
        with:
          ref: nexusnova-ota-public
          fetch-depth: 1

      - name: Fetch exact Drive History hotfix source
        shell: bash
        env:
          SOURCE_SHA: a66a6014f62c990d4efa48a9e8589428305c2d32
        run: |
          set -euo pipefail
          test "$(python3 - <<'PY'
          import json
          print(json.load(open('ota/manifest.json'))['base'])
          PY
          )" = "8d1aaaee6f28b974a8c8b3ff213beb1318ec7405"

          base="https://raw.githubusercontent.com/fahadsoomro123/nexusnova-app-public-build/${SOURCE_SHA}/fresh-rebuild"
          mkdir -p ota/files/src
          curl -fsSL "$base/src/nova-vehicle-premium-ui.js" -o ota/files/src/nova-vehicle-premium-ui.js
          curl -fsSL "$base/src/nova-drive-history-v2.js" -o ota/files/src/nova-drive-history-v2.js
          curl -fsSL "$base/src/nova-drive-history-v2-hotfix.js" -o ota/files/src/nova-drive-history-v2-hotfix.js

          grep -q "nova-drive-history-v2-hotfix" ota/files/src/nova-vehicle-premium-ui.js
          grep -q "nxh2-dashboard-tabs" ota/files/src/nova-drive-history-v2-hotfix.js
          node --check ota/files/src/nova-vehicle-premium-ui.js
          node --check ota/files/src/nova-drive-history-v2.js
          node --check ota/files/src/nova-drive-history-v2-hotfix.js

      - name: Restore bundled owner authentication and build atomic manifest
        shell: bash
        env:
          SOURCE_SHA: a66a6014f62c990d4efa48a9e8589428305c2d32
        run: |
          set -euo pipefail
          # These public-QA overlays must not shadow the signed APK's bundled
          # owner authentication. Missing OTA paths correctly fall back to bundle.
          rm -f ota/files/src/core/auth-service.js
          rm -f ota/files/src/features/auth/auth-screen.js
          rm -f ota/files/src/nova-drive-approved-ui-v2.js

          python3 - <<'PY'
          import datetime, hashlib, json, os
          from pathlib import Path

          source = os.environ['SOURCE_SHA'].strip().lower()
          manifest_path = Path('ota/manifest.json')
          root = Path('ota/files')
          manifest = json.loads(manifest_path.read_text())
          if manifest.get('schema') != 2:
              raise SystemExit('Unexpected OTA schema')
          if manifest.get('base') != '8d1aaaee6f28b974a8c8b3ff213beb1318ec7405':
              raise SystemExit('Refusing to change live installed baseline')

          remove = {
              'src/core/auth-service.js',
              'src/features/auth/auth-screen.js',
              'src/nova-drive-approved-ui-v2.js',
              'src/nova-drive-history-v2-hotfix.js',
              'src/nova-drive-history-v2.js',
              'src/nova-vehicle-premium-ui.js',
          }
          entries = [e for e in manifest.get('files', []) if e.get('path') not in remove]
          add = [
              'src/nova-vehicle-premium-ui.js',
              'src/nova-drive-history-v2.js',
              'src/nova-drive-history-v2-hotfix.js',
          ]
          for rel in add:
              path = root / rel
              data = path.read_bytes()
              entries.append({
                  'path': rel,
                  'sha256': hashlib.sha256(data).hexdigest(),
                  'size': len(data),
              })

          manifest['files'] = entries
          manifest['version'] = source
          manifest['drive_source'] = source
          manifest.pop('auth_source', None)
          try:
              proof = int(str(manifest.get('proof_number', '0')))
          except ValueError:
              proof = 0
          manifest['proof_number'] = str(proof + 1)
          manifest['generatedAt'] = datetime.datetime.now(datetime.timezone.utc).isoformat().replace('+00:00', 'Z')

          paths = [e['path'] for e in entries]
          if len(paths) != len(set(paths)):
              raise SystemExit('Duplicate OTA paths')
          if 'index.html' not in paths:
              raise SystemExit('OTA index missing')
          for forbidden in ('src/core/auth-service.js','src/features/auth/auth-screen.js','src/nova-drive-approved-ui-v2.js'):
              if forbidden in paths:
                  raise SystemExit(f'Forbidden overlay still active: {forbidden}')

          total = 0
          for entry in entries:
              path = root / entry['path']
              if not path.is_file():
                  raise SystemExit(f'Missing OTA file: {entry["path"]}')
              data = path.read_bytes()
              digest = hashlib.sha256(data).hexdigest()
              if digest != entry['sha256'] or len(data) != int(entry['size']):
                  raise SystemExit(f'OTA integrity mismatch: {entry["path"]}')
              total += len(data)
          if total > 60 * 1024 * 1024:
              raise SystemExit('OTA package exceeds Android limit')

          manifest_path.write_text(json.dumps(manifest, separators=(',', ':')) + '\n')
          print('proof', manifest['proof_number'])
          print('version', manifest['version'])
          print('files', len(entries), 'bytes', total)
          PY

      - name: Activate owner-safe Drive History OTA atomically
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "NexusNova OTA Bot"
          git config user.email "nexusnova-ota@users.noreply.github.com"
          rm -f .github/workflows/drive-history-owner-hotfix-18.yml
          git add ota/manifest.json ota/files .github/workflows/drive-history-owner-hotfix-18.yml
          git diff --cached --check
          git commit -m "ota: Drive History visual fix and restore bundled owner auth"
          git push origin HEAD:nexusnova-ota-public
