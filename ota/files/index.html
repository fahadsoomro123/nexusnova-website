  <div id="nx-app" class="nx-app" aria-live="polite">
    <main id="nx-stage" class="nx-stage" tabindex="-1"></main>
    <button id="nx-mine-brand-portal" type="button" aria-label="Open nexusnovatools.com in Nova Browser"><span class="nx-mine-brand__lamp" aria-hidden="true"></span><span class="nx-mine-brand__mark" aria-hidden="true">N</span><span class="nx-mine-brand__copy"><small>NEXUSNOVA NETWORK / WEB PORTAL</small><strong>NEXUSNOVA <em>TOOLS</em></strong><span>nexusnovatools.com</span></span><span class="nx-mine-brand__cta">OPEN <b aria-hidden="true">›</b></span></button>
    <nav class="nx-dock" aria-label="Primary navigation" hidden><button class="nx-dock__item" type="button" data-route="mine" aria-label="Open Mine"></button><button class="nx-dock__item" type="button" data-route="hub" aria-label="Open Nova Hub"></button></nav>
  </div>
  <noscript>NexusNova requires JavaScript.</noscript>
  <script>
  (()=>{
    const placeholder=()=>{const s=document.getElementById('nx-stage');if(!s)return;s.dataset.route='travel-unavailable';s.innerHTML='<section class="nx-screen" aria-label="Travel unavailable"><div style="min-height:60vh;display:grid;place-items:center;padding:32px;text-align:center"><div><h1 style="margin:0 0 10px;font-size:24px">NEXUSNOVA TRAVEL</h1><p style="margin:0;opacity:.72">Travel is currently unavailable while the new Travel experience is rebuilt.</p></div></div></section>'};
    document.addEventListener('click',e=>{const b=e.target?.closest?.('[data-app-id="travel"]');if(!b)return;e.preventDefault();e.stopImmediatePropagation();placeholder()},true);
    const guard=()=>{const s=document.getElementById('nx-stage');if(!s)return;const legacy=s.querySelector('.nxf-travel,[data-smart-travel-context],[data-search],[data-calendar],[data-rescue],[data-flight]');if(legacy||s.dataset.route==='travel')placeholder()};
    new MutationObserver(guard).observe(document.documentElement,{subtree:true,childList:true});
    setInterval(()=>{const api=window.NexusNovaFresh;if(api&&typeof api.openApp==='function'&&!api.__cleanTravelReset){const original=api.openApp.bind(api);api.openApp=id=>{if(id==='travel'){placeholder();return true}return original(id)};api.__cleanTravelReset=true}guard()},250);
  })();
  </script>
