<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#07111f">
<title>NexusNova Recovery</title>
<style>
html,body{margin:0;width:100%;height:100%;background:#050b12;color:#dffcff;font-family:system-ui,-apple-system,Segoe UI,sans-serif}
body{display:grid;place-items:center}
main{width:min(82vw,420px);text-align:center}
.logo{width:72px;height:72px;margin:0 auto 20px;border:2px solid #22d3ee;border-radius:18px;display:grid;place-items:center;font-weight:800;font-size:34px;box-shadow:0 0 28px rgba(34,211,238,.28)}
h1{font-size:22px;margin:0 0 10px}
p{margin:0;color:#8fb6c6;font-size:14px;line-height:1.5}
.dot{display:inline-block;width:8px;height:8px;border-radius:50%;background:#34d399;box-shadow:0 0 12px #34d399;margin-right:8px}
</style>
</head>
<body>
<main>
<div class="logo">N</div>
<h1><span class="dot"></span>NexusNova recovery active</h1>
<p>Repairing the local app package. Keep NexusNova open for a moment.</p>
</main>
</body>
</html>
